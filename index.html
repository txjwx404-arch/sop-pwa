<style>
:root{
  --bg:#f0f4f8;--card:#ffffff;--text:#1a2332;--muted:#5a6a7a;--primary:#0b6e8a;
  --ok:#1a9c6e;--bad:#e05a3c;--warn:#d4920a;--line:#e2eaf0;--tag:#eef4f8;
  --shadow:0 2px 12px rgba(15,40,60,.08);--radius:14px;
  --safe-b:env(safe-area-inset-bottom,0px);--safe-t:env(safe-area-inset-top,0px);
}
[data-theme=dark]{
  --bg:#0f1419;--card:#1a222c;--text:#e8eef4;--muted:#8a9aaa;--primary:#3db4d4;
  --ok:#2ec98a;--bad:#f07158;--warn:#e0b040;--line:#2a3440;--tag:#24303c;
  --shadow:0 2px 16px rgba(0,0,0,.4);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{height:100%;overscroll-behavior:none}
body{font-family:-apple-system,"PingFang SC","Helvetica Neue","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);font-size:16px;line-height:1.55}
header{position:sticky;top:0;z-index:20;background:var(--primary);color:#fff;padding:11px 12px;padding-top:calc(11px + var(--safe-t));display:flex;align-items:center;gap:8px;box-shadow:0 2px 10px rgba(0,0,0,.18)}
header h1{font-size:16px;font-weight:600;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header button{background:rgba(255,255,255,.22);border:0;color:#fff;border-radius:8px;padding:7px 10px;font-size:14px;min-width:38px;cursor:pointer}
main{max-width:720px;margin:0 auto;padding:12px 12px calc(28px + var(--safe-b))}
.card{background:var(--card);border-radius:var(--radius);padding:15px;margin-bottom:11px;box-shadow:var(--shadow)}
.roles{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.role{border:1.5px solid var(--line);background:var(--card);border-radius:11px;padding:11px 2px;text-align:center;font-size:14.5px;font-weight:600;cursor:pointer;transition:.12s}
.role.on{border-color:var(--primary);background:color-mix(in srgb,var(--primary) 13%,var(--card));color:var(--primary)}
.stat{display:grid;grid-template-columns:repeat(4,1fr);text-align:center;gap:2px}
.stat b{display:block;font-size:21px;color:var(--primary);font-weight:700}
.stat span{font-size:11.5px;color:var(--muted)}
.menu{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.menu button{border:0;border-radius:13px;padding:14px 11px;font-size:15.5px;font-weight:600;color:#fff;text-align:left;cursor:pointer;line-height:1.35}
.menu small{display:block;font-weight:400;font-size:11.5px;opacity:.9;margin-top:3px}
.c1{background:linear-gradient(135deg,#0b6e8a,#1494b8)}.c2{background:linear-gradient(135deg,#1a9c6e,#2ec98a)}
.c3{background:linear-gradient(135deg,#e05a3c,#f07158)}.c4{background:linear-gradient(135deg,#5b4cdb,#7b6cf0)}
.c5{background:linear-gradient(135deg,#d4920a,#e0b040)}.c6{background:linear-gradient(135deg,#3d6b8a,#5a8aaa)}
.bar{height:6px;background:var(--line);border-radius:4px;overflow:hidden;margin-top:5px}
.bar i{display:block;height:100%;background:var(--ok);border-radius:4px}
.ch{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line);cursor:pointer}
.ch:last-child{border:0}.ch>div{flex:1;min-width:0}
.ch .name{font-size:13.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tag{display:inline-block;font-size:11px;padding:2px 7px;border-radius:20px;background:var(--tag);color:var(--muted);margin:0 3px 4px 0}
.tag.l2{background:#fff3dc;color:#a8710b}[data-theme=dark] .tag.l2{background:#3d3218;color:#e0b040}
.tag.l3{background:#fde8e1;color:#c2502f}[data-theme=dark] .tag.l3{background:#3d2218;color:#f07158}
.q{font-size:17.5px;font-weight:600;margin:8px 0 13px;line-height:1.55}
.ans{background:color-mix(in srgb,var(--ok) 11%,var(--card));border-left:4px solid var(--ok);padding:12px 13px;border-radius:8px;white-space:pre-wrap;font-size:15px;line-height:1.6}
.key{background:color-mix(in srgb,var(--warn) 13%,var(--card));border-left:4px solid var(--warn);padding:10px 12px;border-radius:8px;margin-top:9px;font-size:13.5px;line-height:1.55}
.src{font-size:12px;color:var(--muted);margin-top:9px}
.btns{display:flex;gap:9px;margin-top:13px}
.btns button{flex:1;border:0;border-radius:11px;padding:13px 6px;font-size:15.5px;font-weight:600;cursor:pointer;color:#fff}
.show{background:var(--primary)}.yes{background:var(--ok)}.no{background:var(--bad)}.gray{background:var(--line);color:var(--text)!important}
.nav{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--muted);margin-bottom:4px}
.fav{background:none;border:0;font-size:22px;cursor:pointer;padding:2px 6px;line-height:1;color:var(--text)}
input[type=search],select,input[type=number]{width:100%;padding:11px 12px;border:1.5px solid var(--line);border-radius:10px;font-size:15px;background:var(--card);color:var(--text);outline:none}
input:focus,select:focus{border-color:var(--primary)}
.hid{display:none!important}
.foot{text-align:center;font-size:11px;color:var(--muted);margin:16px 0 6px;line-height:1.65}
.streak{display:inline-flex;align-items:center;gap:3px;background:color-mix(in srgb,var(--warn) 16%,var(--card));color:var(--warn);padding:3px 9px;border-radius:20px;font-size:12px;font-weight:600}
.filters{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.filters button{border:1.5px solid var(--line);background:var(--card);color:var(--text);border-radius:20px;padding:5px 11px;font-size:12.5px;cursor:pointer}
.filters button.on{border-color:var(--primary);background:color-mix(in srgb,var(--primary) 14%,var(--card));color:var(--primary);font-weight:600}
.toast{position:fixed;left:50%;bottom:calc(70px + var(--safe-b));transform:translateX(-50%);background:rgba(20,30,40,.93);color:#fff;padding:10px 18px;border-radius:22px;font-size:13.5px;z-index:100;opacity:0;transition:.22s;pointer-events:none;max-width:88%;text-align:center}
.toast.show{opacity:1}
.timer{font-variant-numeric:tabular-nums;font-weight:600;color:#fff;background:rgba(0,0,0,.22);padding:3px 9px;border-radius:7px;font-size:13px}
.sec{font-size:12.5px;color:var(--muted);margin-bottom:7px;font-weight:500}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.big{border:1.5px solid var(--line);background:var(--card);border-radius:11px;padding:13px 8px;text-align:center;font-size:14.5px;font-weight:600;cursor:pointer}
.big:active{opacity:.85}
mark{background:#ffe08a;color:#1a2332;border-radius:2px;padding:0 1px}
.done-box{text-align:center;padding:20px 10px}
.done-box .score{font-size:36px;font-weight:700;color:var(--primary);margin:8px 0}
.tip{font-size:12.5px;color:var(--muted);margin-top:6px;line-height:1.5}
.install-banner{background:linear-gradient(135deg,#0b6e8a,#1494b8);color:#fff;border-radius:var(--radius);padding:14px 16px;margin-bottom:11px;display:flex;align-items:center;gap:12px;box-shadow:var(--shadow)}
.install-banner button{background:#fff;color:#0b6e8a;border:0;border-radius:8px;padding:8px 14px;font-weight:600;font-size:14px;white-space:nowrap;cursor:pointer}
.offline-badge{display:inline-block;background:var(--ok);color:#fff;font-size:11px;padding:2px 8px;border-radius:10px;margin-left:6px;vertical-align:middle}
@media(min-width:560px){.menu{grid-template-columns:1fr 1fr 1fr}}
</style>
</head>

<script>
const QA=[{"id":1,"chapter":"第1章 血液透析的医疗质量管理与持续改进","section":"第1节 一、医疗机构相关感染管理的质控指标","roles":["医生","护士"],"level":"基础","type":"简答","q":"“新入血液透析患者血源性传染病标志物检验完成率”的定义是什么？需要检验哪几项标志物？","a":"定义：完成乙型肝炎、丙型肝炎、梅毒及艾滋病标志物检验的新入血液透析患者比例。需检验4项：①乙型肝炎；②丙型肝炎；③梅毒；④艾滋病。","key":"四项缺一不可，常见漏查梅毒或艾滋病标志物，导致该过程指标不达标。","page":2},{"id":2,"chapter":"第1章 血液透析的医疗质量管理与持续改进","section":"第1节 一、医疗机构相关感染管理的质控指标","roles":["医生","护士"],"level":"基础","type":"填空","q":"维持性血液透析患者血源性传染病标志物定时检验完成率，是指每____个月完成乙型肝炎、丙型肝炎、梅毒及艾滋病标志物检验的维持性血液透析患者比例。","a":"6","key":"维持性患者为每6个月，与新导入患者“即时检测、3个月内复检”要区分。","page":2},{"id":3,"chapter":"第1章 血液透析的医疗质量管理与持续改进","section":"第1节 一、医疗机构相关感染管理的质控指标","roles":["护士","技师"],"level":"进阶","type":"简答","q":"“血液透析治疗室消毒合格率”如何定义？其合格标准是什么？","a":"定义：血液透析室（中心）治疗室消毒合格的月份数量在当年所占的比例。合格标准：①空气平均细菌菌落数≤4CFU/（5min·9cm直径平皿）；②物体表面平均细菌菌落总数≤10CFU/cm²。","key":"分母是当年的月份数，按“月份”计算而非按检测次数；空气与物表两个标准需同时满足。","page":2},{"id":4,"chapter":"第1章 血液透析的医疗质量管理与持续改进","section":"第1节 一、医疗机构相关感染管理的质控指标","roles":["护士","技师"],"level":"基础","type":"填空","q":"治疗室消毒合格标准：空气平均细菌菌落数≤____CFU/（5min·9cm直径平皿），物体表面平均细菌菌落总数应≤____CFU/cm²。","a":"4；10","key":"空气4、物表10，两个数字常被记反。","page":2},{"id":5,"chapter":"第1章 血液透析的医疗质量管理与持续改进","section":"第1节 一、医疗机构相关感染管理的质控指标","roles":["技师"],"level":"进阶","type":"简答","q":"“透析用水微生物污染检验合格率”的合格标准是什么？应符合哪项行业标准？","a":"①透析用水每月检验菌落数≤100CFU/ml；②每3个月检验内毒素≤0.25EU/ml；③并符合《血液透析及相关治疗用水》（YY 0572-2015）的标准。指标为检验合格的月份/季度在当年所占的比例。","key":"细菌每月测、内毒素每3个月测，频次和限值（100CFU/ml、0.25EU/ml）是技师考核高频点。","page":2},{"id":6,"chapter":"第1章 血液透析的医疗质量管理与持续改进","section":"第1节 一、医疗机构相关感染管理的质控指标","roles":["技师"],"level":"进阶","type":"判断","q":"按质控指标要求，透析用水内毒素应每月检验1次，合格标准为≤0.25EU/ml。（对/错？）","a":"错。内毒素为每3个月检验1次，合格标准≤0.25EU/ml；每月检验的是细菌菌落数（≤100CFU/ml）。","key":"限值正确但频次错误是典型陷阱：每月测细菌、每季度测内毒素。","page":2},{"id":7,"chapter":"第1章 血液透析的医疗质量管理与持续改进","section":"第1节 一、医疗机构相关感染管理的质控指标","roles":["医生","护士"],"level":"基础","type":"判断","q":"维持性血液透析患者的乙型肝炎和丙型肝炎发病率，属于医疗机构相关感染控制管理的结果指标。（对/错？）","a":"对。感染控制管理结果指标包括：①血液透析治疗室消毒合格率；②透析用水微生物污染检验合格率；③维持性血液透析患者的乙型肝炎和丙型肝炎发病率（每年新发生乙肝和丙肝的维持性患者比例）。","key":"标志物检验完成率是过程指标，乙丙肝发病率是结果指标，注意区分过程与结果。","page":2},{"id":8,"chapter":"第1章 血液透析的医疗质量管理与持续改进","section":"第1节 二、血液透析质量的质控指标","roles":["医生"],"level":"基础","type":"简答","q":"血液透析质量管理的过程指标有哪些？各自的检测频率是多少？","a":"①尿素清除指数（Kt/V）和尿素下降率（URR）定时记录完成率：每6个月完成Kt/V和URR记录的维持性患者比例；②β2微球蛋白定时检验完成率：每6个月完成β2微球蛋白检验的维持性患者比例。","key":"两项均为每6个月；Kt/V与URR需同时记录。","page":3},{"id":9,"chapter":"第1章 血液透析的医疗质量管理与持续改进","section":"第1节 二、血液透析质量的质控指标","roles":["医生"],"level":"基础","type":"填空","q":"Kt/V和URR控制率：单位时间内，单室Kt/V（spKt/V）大于____且URR大于____的维持性血液透析患者比例。","a":"1.2；65%","key":"两项需同时满足（“且”），且是“大于”。","page":3},{"id":10,"chapter":"第1章 血液透析的医疗质量管理与持续改进","section":"第1节 二、血液透析质量的质控指标","roles":["医生"],"level":"进阶","type":"判断","q":"计算Kt/V和URR控制率时，患者spKt/V＞1.2或URR＞65%满足其一即可计为达标。（对/错？）","a":"错。原文要求spKt/V大于1.2“且”URR大于65%，两项须同时满足方可计入达标。","key":"“且”与“或”的区别是考核常设陷阱。","page":3},{"id":11,"chapter":"第1章 血液透析的医疗质量管理与持续改进","section":"第1节 二、血液透析质量的质控指标","roles":["医生","护士"],"level":"基础","type":"填空","q":"透析间期体重增长控制率，是指透析间期体重增长小于____的维持性血液透析患者比例。","a":"5%","key":"质控指标用的是“<5%”；容量管理理想目标另有“不超过2～3kg或<5%干体重”的表述。","page":3},{"id":12,"chapter":"第1章 血液透析的医疗质量管理与持续改进","section":"第1节 二、血液透析质量的质控指标","roles":["医生","护士"],"level":"进阶","type":"简答","q":"什么是“动静脉内瘘长期生存率”？","a":"同一动静脉内瘘持续使用时间大于2年的维持性血液透析患者比例。","key":"强调“同一”内瘘、持续使用“大于2年”，重建或更换的内瘘不能累计。","page":3},{"id":13,"chapter":"第1章 血液透析的医疗质量管理与持续改进","section":"第1节 二、血液透析质量的质控指标","roles":["医生"],"level":"高级","type":"案例分析","q":"某维持性血透患者近期检测：spKt/V 1.25，URR 63%。质控专员将其计入“Kt/V和URR控制率”达标人数。该做法是否正确？请说明。","a":"不正确。①Kt/V和URR控制率要求spKt/V大于1.2且URR大于65%；②该患者spKt/V达标，但URR 63%未大于65%；③两项未同时达标，不应计入达标人数，应分析透析充分性不足的原因并纳入持续质量改进。","key":"单项达标不等于控制达标，须两项同时满足。","page":3},{"id":14,"chapter":"第1章 血液透析的医疗质量管理与持续改进","section":"第1节 三、血液透析并发症管理的质控指标","roles":["医生","护士"],"level":"进阶","type":"简答","q":"血液透析并发症管理的过程指标包括哪些？各自频率是多少？","a":"①血常规定时检验完成率：每3个月；②血液生化（包括肝肾功能、电解质、血脂等）定时检验完成率：每3个月；③iPTH定时检验完成率：每6个月；④血清铁蛋白和转铁蛋白饱和度定时检验完成率：每6个月；⑤血清前白蛋白定时检验完成率：每6个月；⑥CRP定时检验完成率：每6个月。","key":"记忆口诀：血常规、生化每3个月，其余（iPTH、铁指标、前白蛋白、CRP）每6个月。","page":3},{"id":15,"chapter":"第1章 血液透析的医疗质量管理与持续改进","section":"第1节 三、血液透析并发症管理的质控指标","roles":["医生","护士"],"level":"基础","type":"填空","q":"维持性血液透析患者应每____个月完成血常规检验，每____个月完成血液生化（包括肝肾功能、电解质、血脂等）检验。","a":"3；3","key":"血液生化包括肝肾功能、电解质、血脂等，不要漏掉血脂。","page":3},{"id":16,"chapter":"第1章 血液透析的医疗质量管理与持续改进","section":"第1节 三、血液透析并发症管理的质控指标","roles":["医生"],"level":"基础","type":"判断","q":"按质控过程指标，维持性血液透析患者全段甲状旁腺激素（iPTH）应每3个月检验1次。（对/错？）","a":"错。iPTH定时检验完成率要求每6个月完成1次iPTH检验。","key":"iPTH常被误记为与血钙磷一样每3个月，规程最低频次为每6个月。","page":3},{"id":17,"chapter":"第1章 血液透析的医疗质量管理与持续改进","section":"第1节 三、血液透析并发症管理的质控指标","roles":["医生"],"level":"进阶","type":"简答","q":"高血压控制率的定义是什么？对不同年龄患者的血压标准有何不同？","a":"单位时间内，透析前血压＜140/90mmHg的60岁以下患者和透析前血压＜160/90mmHg的60岁以上（含）患者占同期维持性血液透析患者比例。①＜60岁：透析前＜140/90mmHg；②≥60岁（含60岁）：透析前＜160/90mmHg。","key":"以“透析前”血压为准；60岁归入老年组（含）。","page":4},{"id":18,"chapter":"第1章 血液透析的医疗质量管理与持续改进","section":"第1节 三、血液透析并发症管理的质控指标","roles":["医生"],"level":"高级","type":"案例分析","q":"某中心统计高血压控制率：患者甲65岁，透析前血压150/85mmHg；患者乙55岁，透析前血压145/85mmHg；患者丙60岁，透析前血压158/88mmHg。哪些患者可计为达标？","a":"①甲：≥60岁，标准＜160/90mmHg，150/85达标；②乙：＜60岁，标准＜140/90mmHg，145/85不达标；③丙：60岁属于“60岁以上（含）”，标准＜160/90mmHg，158/88达标。故甲、丙达标，乙不达标。","key":"60岁整按老年组标准；以透析前血压计。","page":4},{"id":19,"chapter":"第1章 血液透析的医疗质量管理与持续改进","section":"第1节 三、血液透析并发症管理的质控指标","roles":["医生"],"level":"基础","type":"填空","q":"肾性贫血控制率：单位时间内，血红蛋白≥____g/L的维持性血液透析患者比例；血清白蛋白控制率：血清白蛋白≥____g/L的患者比例。","a":"110；35","key":"均含等号（≥）。","page":4},{"id":20,"chapter":"第1章 血液透析的医疗质量管理与持续改进","section":"第1节 三、血液透析并发症管理的质控指标","roles":["医生"],"level":"高级","type":"简答","q":"CKD-MBD指标控制率的达标标准是什么？","a":"单位时间内同时满足以下3项的维持性血液透析患者比例：①血钙2.10～2.50mmol/L；②血磷1.13～1.78mmol/L；③iPTH在正常值上限2～9倍。需3项指标同时达标。","key":"三项须同时达标；iPTH以“正常值上限倍数”表示而非绝对值。","page":4},{"id":21,"chapter":"第1章 血液透析的医疗质量管理与持续改进","section":"第1节 三、血液透析并发症管理的质控指标","roles":["医生"],"level":"高级","type":"案例分析","q":"某患者血钙2.30mmol/L，血磷1.90mmol/L，iPTH为正常值上限的5倍。能否计入CKD-MBD指标控制率达标？","a":"不能。①血钙2.30在2.10～2.50mmol/L范围内，达标；②iPTH为正常上限5倍，在2～9倍范围内，达标；③血磷1.90mmol/L超过1.78mmol/L上限，不达标。CKD-MBD要求3项同时达标，故不计入。","key":"高磷血症是最常见的不达标项，任一项不达标即整体不达标。","page":4},{"id":22,"chapter":"第1章 血液透析的医疗质量管理与持续改进","section":"第1节 四、血液透析患者医疗质量管理指标及检测频度","roles":["医生","护士"],"level":"高级","type":"简答","q":"按表1-1，乙型肝炎、丙型肝炎、梅毒和艾滋病标志物的检测频率有哪几种情形？","a":"①新导入或新转入患者：即时检测，3个月内复检；②长期透析患者：每6个月1次；③阳性转阴性患者：前6个月每月1次，后6个月每3个月1次；④新发患者的密切接触者：即时检测。","key":"新转入患者同样需即时检测并3个月内复检（窗口期考虑），常被遗漏。","page":4},{"id":23,"chapter":"第1章 血液透析的医疗质量管理与持续改进","section":"第1节 四、血液透析患者医疗质量管理指标及检测频度","roles":["医生","护士"],"level":"进阶","type":"填空","q":"新导入或新转入血液透析患者的乙肝、丙肝、梅毒和艾滋病标志物应____检测，____个月内复检。","a":"即时；3","key":"3个月内复检是为覆盖窗口期，切勿等到6个月常规复查。","page":4},{"id":24,"chapter":"第1章 血液透析的医疗质量管理与持续改进","section":"第1节 四、血液透析患者医疗质量管理指标及检测频度","roles":["医生","护士"],"level":"高级","type":"案例分析","q":"维持性透析患者张某，既往HCV标志物阳性，经治疗后复查转为阴性。护士长询问其后续传染病标志物检测应如何安排；同时，中心另一名患者新发丙肝阳性，其密切接触者应如何处理？","a":"①张某属“阳性转阴性患者”：前6个月每月检测1次，后6个月每3个月检测1次；②新发患者的密切接触者：即时检测。","key":"阳转阴患者不能直接回到每6个月常规检测，须按“每月×6个月→每3个月×6个月”加密随访。","page":4},{"id":25,"chapter":"第1章 血液透析的医疗质量管理与持续改进","section":"第1节 四、血液透析患者医疗质量管理指标及检测频度","roles":["医生"],"level":"基础","type":"判断","q":"按表1-1，维持性血液透析患者血清铁蛋白和转铁蛋白饱和度的检测频率为每3个月1次。（对/错？）","a":"错。血清铁蛋白和转铁蛋白饱和度为每6个月1次。","key":"表1-1中只有血常规和血液生化为每3个月1次，其余均为每6个月1次（传染病标志物另有规定）。","page":4},{"id":26,"chapter":"第1章 血液透析的医疗质量管理与持续改进","section":"第1节 四、血液透析患者医疗质量管理指标及检测频度","roles":["医生","护士"],"level":"进阶","type":"简答","q":"表1-1中检测频率为“每6个月1次”的项目有哪些（除传染病标志物外）？","a":"①血清铁蛋白和转铁蛋白饱和度；②全段甲状旁腺激素（iPTH）；③血清前白蛋白；④C反应蛋白；⑤β2微球蛋白；⑥Kt/V和URR。","key":"此为最低检测频率，临床可根据病情增加。","page":4},{"id":27,"chapter":"第1章 血液透析的医疗质量管理与持续改进","section":"第2节 一、持续质量改进实施的组织结构和工作制度","roles":["医生","护士","技师"],"level":"基础","type":"简答","q":"持续质量改进（CQI）在血液透析中的地位是什么？其范畴包括哪些？应注重什么？","a":"①秉持以患者为中心，CQI是确保血液透析医疗质量和安全的核心制度；②范畴包括诊疗操作、人员和设备管理等每一项工作流程和环节；③应以问题为导向，进行循环式、持续性质量改进；④不但要注重终末质量，更要注重过程管理及环节控制。","key":"“更要注重过程管理及环节控制”是常考核心表述。","page":5},{"id":28,"chapter":"第1章 血液透析的医疗质量管理与持续改进","section":"第2节 一、持续质量改进实施的组织结构和工作制度","roles":["医生","护士","技师"],"level":"进阶","type":"判断","q":"血液透析持续质量改进的重点是终末质量，过程管理只是辅助。（对/错？）","a":"错。CQI不但要注重终末质量，更要注重过程管理及环节控制。","key":"过程与环节控制的地位高于终末质量，判断题常反向设陷阱。","page":5},{"id":29,"chapter":"第1章 血液透析的医疗质量管理与持续改进","section":"第2节 一、持续质量改进实施的组织结构和工作制度","roles":["医生","护士","技师"],"level":"基础","type":"简答","q":"血液透析室（中心）质量控制小组由哪些人员组成？第一责任人是谁？","a":"以肾脏病科室或透析室（中心）主任为第一责任人；护士长或护理组长、技师/工程师、主诊医师等为核心成员。","key":"技师/工程师是核心成员，不可遗漏；第一责任人是科室/中心主任而非护士长。","page":5},{"id":30,"chapter":"第1章 血液透析的医疗质量管理与持续改进","section":"第2节 一、持续质量改进实施的组织结构和工作制度","roles":["医生","护士","技师"],"level":"高级","type":"简答","q":"血液透析室（中心）应建立健全的CQI核心制度包括哪些？","a":"①工作计划；②质量控制成员岗位职责；③血液透析CQI实施办法与流程；④血液透析医疗质量指标；⑤定期医疗工作总结和质量分析；⑥医护缺陷与差错的报告和登记；⑦疑难危重与死亡病例讨论；⑧血液透析室（中心）质量控制工作文书与文件管理等制度。","key":"缺陷与差错的“报告和登记”、文书与文件管理常被督查时发现缺失。","page":5},{"id":31,"chapter":"第1章 血液透析的医疗质量管理与持续改进","section":"第2节 二、持续质量改进实施规范和流程","roles":["医生","护士","技师"],"level":"基础","type":"填空","q":"血液透析室（中心）应定期对本中心血液透析质量进行评估并召开全员质量分析会议，要求每____个月进行1次，年终进行____，并形成年度质量评价和分析报告。","a":"3；年度总结","key":"是“全员”质量分析会议，且需做好记录（表1-2）。","page":5},{"id":32,"chapter":"第1章 血液透析的医疗质量管理与持续改进","section":"第2节 二、持续质量改进实施规范和流程","roles":["医生","护士","技师"],"level":"进阶","type":"简答","q":"对医疗质量过程和结果指标不达标或不理想的项目，应如何处理？改进到什么程度？","a":"①提出具体的改进目标、计划和措施；②对改进的结果进行再评估；③直至需要改进的质量指标达到或超过全国平均水平。","key":"终点是“达到或超过全国平均水平”，不是达到本中心既往水平。","page":5},{"id":33,"chapter":"第1章 血液透析的医疗质量管理与持续改进","section":"第2节 二、持续质量改进实施规范和流程","roles":["医生","护士","技师"],"level":"进阶","type":"判断","q":"对不达标的质量指标进行改进后，只要较本中心上一年度有所提高，即可结束该项改进。（对/错？）","a":"错。需对改进结果进行再评估，直至需要改进的质量指标达到或超过全国平均水平。","key":"对标对象是全国平均水平。","page":5},{"id":34,"chapter":"第1章 血液透析的医疗质量管理与持续改进","section":"第2节 二、持续质量改进实施规范和流程","roles":["医生","护士","技师"],"level":"基础","type":"简答","q":"《血液透析室（中心）持续质量改进记录表》（表1-2）包括哪些项目？由谁签名？","a":"项目：执行日期、改进项目、质量控制小组负责人、参与人员、问题、原因分析、预期目标、改进措施、改进效果；签名：单位名称、执行者签名、科主任签名。","key":"“原因分析”和“改进效果”是记录表最常空缺的栏目。","page":6},{"id":35,"chapter":"第1章 血液透析的医疗质量管理与持续改进","section":"第2节 二、持续质量改进实施规范和流程","roles":["医生","护士","技师"],"level":"基础","type":"简答","q":"PDCA循环中P、D、C、A分别代表什么？","a":"①P计划（plan）：明确问题并对可能的原因及解决方案进行假设；②D实施（do）：实施行动计划；③C评估（check）：评估结果；④A处理（act）：如果对结果不满意就返回到计划阶段，如果结果满意就对解决方案进行标准化。","key":"A阶段两个走向：不满意返回P，满意则标准化。","page":6},{"id":36,"chapter":"第1章 血液透析的医疗质量管理与持续改进","section":"第2节 二、持续质量改进实施规范和流程","roles":["医生","护士","技师"],"level":"进阶","type":"判断","q":"PDCA循环的A（处理）阶段，若对结果不满意，应直接将现有方案标准化并进入下一循环。（对/错？）","a":"错。对结果不满意应返回到计划阶段；只有结果满意时才对解决方案进行标准化。","key":"标准化的前提是结果满意。","page":6},{"id":37,"chapter":"第1章 血液透析的医疗质量管理与持续改进","section":"第2节 二、持续质量改进实施规范和流程","roles":["医生","护士","技师"],"level":"高级","type":"简答","q":"血液透析室（中心）开展质量改进的具体对象和流程是什么？改进的依据有哪些？","a":"对象：运营、管理、诊疗技术以及操作规范等环节存在的隐患、质控指标达标不够理想的项目、出现的问题或缺陷。流程：①首先进行原因查找和分析；②依据国家卫生健康行政部门颁布的与血液透析治疗相关的各项法规和管理规范，国际、国内血液透析诊疗操作规范和指南，提出改进目标、计划和措施，并实施整改；③按照计划检查、评估改进效果，明确是否实现预期目标；④未达到预期目标则重新检查找出问题和原因，进行相应处理和改进；⑤总结经验和教训，制定新的标准和制度。由此形成质量改进工作的闭合链条。","key":"最终落脚点是“制定新的标准和制度”，形成闭合链条（见图1-1）。","page":6},{"id":38,"chapter":"第1章 血液透析的医疗质量管理与持续改进","section":"第2节 二、持续质量改进实施规范和流程","roles":["医生","护士","技师"],"level":"高级","type":"案例分析","q":"某透析中心季度质量分析发现肾性贫血控制率明显偏低。请按规程要求的PDCA方法说明该中心应如何开展持续质量改进并做好记录。","a":"①P：明确问题（Hb≥110g/L患者比例偏低），进行原因查找和分析，对可能原因及解决方案提出假设，依据相关法规、规范和国内外指南提出改进目标、计划和措施；②D：实施行动计划进行整改；③C：按计划检查、评估改进效果，明确是否实现预期目标；④A：结果满意则将解决方案标准化，制定新的标准和制度；不满意则返回计划阶段重新查找问题和原因。⑤全过程填写持续质量改进记录表（改进项目、负责人、参与人员、问题、原因分析、预期目标、改进措施、改进效果，执行者及科主任签名）；⑥每3个月评估1次，直至指标达到或超过全国平均水平，年终纳入年度质量评价和分析报告。","key":"常见错误是只有措施没有原因分析和效果再评估，未形成闭环。","page":6},{"id":39,"chapter":"第2章 血液透析患者管理标准操作规程","section":"一、血液透析患者的营养管理","roles":["医生"],"level":"进阶","type":"简答","q":"血液透析患者营养不良常见的病因有哪些？","a":"①摄食减少和厌食症；②高分解代谢状态；③炎症和共存疾病；④胰岛素抵抗；⑤代谢性酸中毒；⑥透析不充分；⑦透析过程中营养素丢失；⑧膳食限制及药物等。","key":"代谢性酸中毒、透析不充分和透析中营养素丢失是透析相关可干预因素。","page":8},{"id":40,"chapter":"第2章 血液透析患者管理标准操作规程","section":"一、血液透析患者的营养管理","roles":["医生","护士"],"level":"进阶","type":"简答","q":"血液透析患者营养状态评估包括哪些内容？营养不良有何危害？","a":"评估内容：①临床调查；②饮食评估；③人体测量；④生化指标；⑤主观综合性评估；⑥人体成分分析。危害：营养不良是贫血、微炎症状态和心血管并发症的重要病因；相当一部分患者存在蛋白质-能量消耗（PEW），加重各种代谢紊乱，与死亡和住院事件风险增加密切相关。","key":"营养状态评估是营养不良治疗的基础；详细方法见第27章。","page":8},{"id":41,"chapter":"第2章 血液透析患者管理标准操作规程","section":"一、血液透析患者的营养管理","roles":["医生"],"level":"进阶","type":"简答","q":"血液透析患者营养治疗方案应如何制订？","a":"应综合患者年龄、生理需求及原发疾病等因素，在充分评估营养状况的基础上，制订包括能量、蛋白质、脂肪、碳水化合物、维生素及水电解质等个体化的营养治疗方案，并通过定期监测进行调整。","key":"关键词：充分评估在先、个体化、定期监测调整。","page":8},{"id":42,"chapter":"第2章 血液透析患者管理标准操作规程","section":"二、血管通路管理（一）自体动静脉内瘘的管理","roles":["护士"],"level":"基础","type":"简答","q":"自体动静脉内瘘术前应如何保护血管资源？","a":"①注意保护上肢血管资源，避免腕部以上部位血管穿刺和采血；②保护手臂皮肤不要破损。","key":"CKD患者住院期间常在前臂静脉随意采血、留置针，需提前宣教。","page":8},{"id":43,"chapter":"第2章 血液透析患者管理标准操作规程","section":"二、血管通路管理（一）自体动静脉内瘘的管理","roles":["护士"],"level":"基础","type":"填空","q":"自体动静脉内瘘术后____h可进行握拳锻炼；伤口____d换药1次，____d拆线。","a":"72；3～7；10～14","key":"握拳锻炼从术后72h开始，促进内瘘成熟。","page":8},{"id":44,"chapter":"第2章 血液透析患者管理标准操作规程","section":"二、血管通路管理（一）自体动静脉内瘘的管理","roles":["护士"],"level":"进阶","type":"简答","q":"自体动静脉内瘘术后护理要点有哪些？伤口渗血如何处理？","a":"①抬高术肢，促进血液回流，减轻水肿；②及时活动手指，降低血栓形成风险；③术后72h可进行握拳锻炼；④伤口如有渗血可轻压止血，并听诊杂音，避免压迫过重导致内瘘闭塞；严重出血需开放止血；⑤3～7d换药1次，10～14d拆线；⑥避免内瘘侧肢体负重、受压、测血压、输血、输液及采血。","key":"压迫止血时必须同时听诊杂音，压迫过重会导致内瘘闭塞。","page":8},{"id":45,"chapter":"第2章 血液透析患者管理标准操作规程","section":"二、血管通路管理（一）自体动静脉内瘘的管理","roles":["护士"],"level":"基础","type":"判断","q":"自体动静脉内瘘术后，内瘘侧肢体可以测量血压，但不宜输液。（对/错？）","a":"错。内瘘侧肢体应避免负重、受压、测血压、输血、输液及采血。","key":"测血压同样禁忌，是病房护理最常见违规。","page":8},{"id":46,"chapter":"第2章 血液透析患者管理标准操作规程","section":"二、血管通路管理（一）自体动静脉内瘘的管理","roles":["医生"],"level":"进阶","type":"简答","q":"合并血液高凝状态的患者，内瘘术后如何预防血栓？","a":"如止血良好，术后可给予低分子量肝素或阿司匹林等预防血栓形成，但要注意个体化处理。","key":"前提是“止血良好”，并强调个体化，不可常规一律抗凝。","page":9},{"id":47,"chapter":"第2章 血液透析患者管理标准操作规程","section":"二、血管通路管理（一）自体动静脉内瘘的管理","roles":["医生","护士"],"level":"基础","type":"填空","q":"自体动静脉内瘘术后____周，内瘘成熟后进行穿刺透析。","a":"8～12","key":"评估成熟也可提前，但仍是以成熟为前提。","page":9},{"id":48,"chapter":"第2章 血液透析患者管理标准操作规程","section":"二、血管通路管理（一）自体动静脉内瘘的管理","roles":["医生","护士"],"level":"进阶","type":"案例分析","q":"患者自体内瘘术后第6周，医生评估内瘘已成熟，患者希望尽早改用内瘘透析。应如何处理？","a":"①规程一般要求术后8～12周、内瘘成熟后穿刺；②如果评估内瘘成熟，也可考虑提前穿刺透析；③提前使用时尽可能选择其他静脉穿刺作静脉回路，减轻内瘘损伤；④初期由经验丰富的护士穿刺，有条件时首次使用建议超声引导下穿刺。","key":"提前使用时内瘘只作动脉端，静脉回路尽量另选静脉。","page":9},{"id":49,"chapter":"第2章 血液透析患者管理标准操作规程","section":"二、血管通路管理（一）自体动静脉内瘘的管理","roles":["护士"],"level":"进阶","type":"简答","q":"自体动静脉内瘘穿刺前应检查哪些内容？","a":"①内瘘区域皮肤颜色、温度，有无肿胀、疼痛及破溃；②内瘘震颤及杂音情况；③血管弹性、张力及搏动情况；④举臂试验及搏动增强试验。发现异常情况及时行超声或影像学检查。","key":"举臂试验与搏动增强试验是评估流出道/流入道狭窄的简便物理检查，常被省略。","page":9},{"id":50,"chapter":"第2章 血液透析患者管理标准操作规程","section":"二、血管通路管理（一）自体动静脉内瘘的管理","roles":["护士"],"level":"基础","type":"简答","q":"初期内瘘由谁穿刺？什么情况下建议超声引导下穿刺？连接体外循环有何要求？","a":"①初期内瘘由经验丰富的护士进行穿刺；②有条件的单位，内瘘首次使用或遇疑难情况时建议超声引导下穿刺；③连接体外循环应依照无菌原则规范化操作。","key":"新瘘不宜安排低年资护士练手。","page":9},{"id":51,"chapter":"第2章 血液透析患者管理标准操作规程","section":"二、血管通路管理（一）自体动静脉内瘘的管理","roles":["护士"],"level":"进阶","type":"案例分析","q":"患者透析结束拔针后，内瘘穿刺区域出现血肿。护士应如何处理和指导？","a":"①拔针后压迫穿刺点15～30min；②出现血肿时，24h内适当间断冷敷，并注意观察内瘘震颤情况；③24h后确认不再渗血，可热敷或涂抹消肿类软膏，或采用理疗等方式消肿。","key":"24h内冷敷、24h后且确认不再渗血才可热敷，顺序颠倒会加重出血。","page":9},{"id":52,"chapter":"第2章 血液透析患者管理标准操作规程","section":"二、血管通路管理（一）自体动静脉内瘘的管理","roles":["护士"],"level":"基础","type":"简答","q":"自体动静脉内瘘日常护理应指导患者做到哪些？","a":"①注意内瘘局部卫生；②每日检查内瘘：触诊震颤、听诊杂音，观察有无红、肿、热、痛及异常搏动，发现异常及时向医护人员汇报；③衣袖宜宽松，防止内瘘受压，避免内瘘侧肢体负重，睡眠时避免内瘘侧肢体受压；④每次透析前内瘘侧肢体用肥皂水清洗干净；⑤透析后穿刺点敷料在第2日撤除，避免穿刺点沾水，洗澡时以防水贴保护。","key":"“每日”自查震颤杂音是早期发现血栓的关键。","page":9},{"id":53,"chapter":"第2章 血液透析患者管理标准操作规程","section":"二、血管通路管理（一）自体动静脉内瘘的管理","roles":["护士"],"level":"进阶","type":"填空","q":"透析后内瘘穿刺点敷料应在第____日撤除；建议常规____个月左右进行内瘘超声检查。","a":"2；3","key":"超声检查目的在于早期发现狭窄、血栓及血管瘤等并发症，有异常随时检查。","page":9},{"id":54,"chapter":"第2章 血液透析患者管理标准操作规程","section":"二、血管通路管理（二）带隧道带涤纶套导管的管理","roles":["护士"],"level":"进阶","type":"简答","q":"带隧道带涤纶套导管每次治疗前应观察哪些内容？","a":"①导管出口处皮肤有无压痛、红肿、分泌物、出血及渗液；②Cuff处是否红肿、破溃、脱出；③导管尾翼缝线固定情况；④导管外接头部分有无破裂、打折，管腔通畅程度。","key":"Cuff脱出提示导管移位风险，需与出口感染一并观察。","page":9},{"id":55,"chapter":"第2章 血液透析患者管理标准操作规程","section":"二、血管通路管理（二）带隧道带涤纶套导管的管理","roles":["医生","护士"],"level":"进阶","type":"简答","q":"带隧道带涤纶套导管出现血流量不足或闭塞时应如何处理？","a":"应立即通过超声及影像学检查判断导管内有无血栓及纤维蛋白鞘形成，及时行溶栓或换管处理。","key":"需先明确是血栓还是纤维蛋白鞘再决定溶栓或换管。","page":9},{"id":56,"chapter":"第2章 血液透析患者管理标准操作规程","section":"二、血管通路管理（二）带隧道带涤纶套导管的管理","roles":["护士"],"level":"基础","type":"判断","q":"已经部分脱出的中心静脉导管，经严格消毒后可重新插入血管继续使用。（对/错？）","a":"错。禁止将已经脱出的导管消毒之后再插入血管中。","key":"导管外露段无法达到无菌，回送是导管相关血流感染的重要来源。","page":10},{"id":57,"chapter":"第2章 血液透析患者管理标准操作规程","section":"二、血管通路管理（二）带隧道带涤纶套导管的管理","roles":["医生","护士"],"level":"基础","type":"判断","q":"非抢救状况时，中心静脉透析导管可兼用于输血、输液。（对/错？）","a":"错。非抢救状况时，中心静脉导管仅用于血液净化治疗，不用于输血、输液。","key":"仅“抢救状况”例外。","page":10},{"id":58,"chapter":"第2章 血液透析患者管理标准操作规程","section":"二、血管通路管理（二）带隧道带涤纶套导管的管理","roles":["医生","护士"],"level":"高级","type":"案例分析","q":"带隧道带涤纶套导管透析患者，治疗前诉近2日畏寒、发热。应如何处理？若抗生素治疗后感染仍不能控制，又该怎么办？","a":"①一旦疑似导管相关感染，立即停止使用导管；②同时进行血液和导管口分泌物病原菌培养；③根据培养结果选用敏感抗菌药物；经验性用药可选择针对革兰氏阳性球菌为主的抗生素；④静脉用药同时联合抗生素封管；⑤经抗生素治疗后仍不能有效控制，及时拔除导管，同时留取导管尖端及非导管所在肢体的外周血进行病原学培养；⑥如需更换新导管，需重新建立隧道或选择新的静脉重新置管，继续抗生素治疗1～2周。","key":"疑似即停用导管；静脉抗生素必须联合封管；外周血须取自非导管所在肢体。","page":10},{"id":59,"chapter":"第2章 血液透析患者管理标准操作规程","section":"二、血管通路管理（二）带隧道带涤纶套导管的管理","roles":["医生"],"level":"进阶","type":"填空","q":"因感染需要更换新的中心静脉导管时，需重新建立____或选择新的静脉重新置管，继续抗生素治疗____周。","a":"隧道；1～2","key":"不能原隧道原位更换。","page":10},{"id":60,"chapter":"第2章 血液透析患者管理标准操作规程","section":"二、血管通路管理（三）移植物内瘘的管理","roles":["医生","护士"],"level":"基础","type":"填空","q":"移植物内瘘术后____周穿刺；即穿型移植物内瘘术后____即可穿刺。","a":"2～4；次日","key":"与自体内瘘8～12周不同，切勿混淆。","page":10},{"id":61,"chapter":"第2章 血液透析患者管理标准操作规程","section":"二、血管通路管理（三）移植物内瘘的管理","roles":["护士"],"level":"高级","type":"简答","q":"移植物内瘘穿刺有哪些技术要求？","a":"①准确判断血流方向；②穿刺点距离吻合口3cm以上；③动静脉穿刺点相距5cm以上；④避免在血管袢的转角处穿刺；⑤建议绳梯式穿刺，避免同一穿刺点反复多次穿刺，以免血管壁受损，减少瘢痕、动脉瘤及局部狭窄形成。","key":"距吻合口3cm、两针相距5cm；移植物推荐绳梯式而非定点穿刺。","page":10},{"id":62,"chapter":"第2章 血液透析患者管理标准操作规程","section":"二、血管通路管理（三）移植物内瘘的管理","roles":["护士"],"level":"进阶","type":"案例分析","q":"移植物内瘘患者透析结束，护士指导其自行压迫止血，患者在拔针过程中即开始用力按压皮肤进针点，压迫约5min后松手。指出其错误并给出正确做法。","a":"错误：①拔针过程中即加压；②压迫的是皮肤进针位置；③用力过大；④压迫时间不足。正确做法：①必须在穿刺针完全拔出后加压；②徒手用纱布卷轻压穿刺针刺入血管的位置而非皮肤进针位置；③压迫止血10～15min；④压力适中，既能止血又不阻断血流。","key":"移植物的血管进针点与皮肤进针点不在同一位置，按错位置易形成血肿。","page":10},{"id":63,"chapter":"第2章 血液透析患者管理标准操作规程","section":"二、血管通路管理（三）移植物内瘘的管理","roles":["医生","护士"],"level":"进阶","type":"简答","q":"移植物内瘘的常规监测频率和内容是什么？","a":"①每周进行移植血管的物理检查，包括杂音、震颤、搏动及有无血管瘤形成等；②每1～3个月进行常规超声检查。","key":"AVG超声频率（1～3个月）高于自体内瘘（3个月左右）。","page":10},{"id":64,"chapter":"第2章 血液透析患者管理标准操作规程","section":"二、血管通路管理（三）移植物内瘘的管理","roles":["医生"],"level":"高级","type":"案例分析","q":"移植物内瘘患者穿刺部位红肿、流脓，伴发热。应如何处理？经验性抗感染应覆盖哪些病原菌？","a":"①建议切除感染段或全部移植血管，并进行局部引流；②留取血及移植物进行细菌培养和药敏试验；③及时给予抗感染治疗，经验性治疗应覆盖革兰氏阳性及阴性菌；④参考药敏结果调整后续治疗。","key":"与导管感染经验用药以革兰氏阳性球菌为主不同，移植物感染需同时覆盖阳性及阴性菌，且需外科处理感染移植物。","page":10},{"id":65,"chapter":"第2章 血液透析患者管理标准操作规程","section":"三、容量管理","roles":["医生"],"level":"基础","type":"简答","q":"什么是最佳干体重？容量管理的目标是什么？","a":"最佳干体重：透析后可耐受的最低体重，此时患者仅有极轻微的低血容量或血容量过多的症状或体征。目标：通过容量管理达到最佳干体重，采取个体化措施，保持透析间期血容量过多与透析时低血容量之间的平衡。","key":"“可耐受的最低体重”与“仅有极轻微症状”两个要素缺一不可。","page":11},{"id":66,"chapter":"第2章 血液透析患者管理标准操作规程","section":"三、容量管理","roles":["医生"],"level":"高级","type":"简答","q":"容量超负荷对血液透析患者有哪些危害？","a":"①是透析患者心血管事件的重要原因；②透析间期易导致高血压、心力衰竭；③使透析时单位时间脱水量增加，易引起透析中低血压、心律失常、透析不充分等；④长期容量超负荷是血液透析患者死亡的独立危险因素；⑤与营养不良相互关联影响，形成恶性循环。","key":"“死亡的独立危险因素”是高频考点。","page":11},{"id":67,"chapter":"第2章 血液透析患者管理标准操作规程","section":"三、容量管理","roles":["医生","护士"],"level":"高级","type":"简答","q":"透析患者容量评估包括哪些内容？","a":"①病史和体格检查：透析间期是否出现直立性低血压症状（蹲位或卧位直立后头晕目眩），透析中是否出现目标循环容量过低的症状（肌肉痉挛、低血压等）；注意体重与血压测定，透析前颈静脉搏动、肺部听诊及外周水肿检查；②临床检验：血清钠、血清钙及血浆利钠肽浓度测定；③有条件的单位可使用生物阻抗容积描记法、相对血浆容量监测、下腔静脉直径测定等较精确的方法。","key":"透析中肌肉痉挛、低血压提示干体重可能设定过低。","page":11},{"id":68,"chapter":"第2章 血液透析患者管理标准操作规程","section":"三、容量管理","roles":["医生","护士"],"level":"基础","type":"填空","q":"血液透析患者应坚持限盐饮食，每日摄入____g钠元素，或____g食盐。","a":"1.5～2.0；3～5","key":"容量管理以控制钠盐摄入为主，单纯限水而不限钠难以奏效。","page":11},{"id":69,"chapter":"第2章 血液透析患者管理标准操作规程","section":"三、容量管理","roles":["医生","护士"],"level":"基础","type":"判断","q":"透析间期体重增加的理想情况为不超过2～3kg，或＜5%干体重。（对/错？）","a":"对。避免透析间期体重增加过多（理想情况为不超过2～3kg，或＜5%干体重），以限制透析时超滤量。","key":"分母是“干体重”。","page":11},{"id":70,"chapter":"第2章 血液透析患者管理标准操作规程","section":"三、容量管理","roles":["医生"],"level":"高级","type":"案例分析","q":"某患者评估存在容量超负荷，需下调目标干体重。应如何逐步调整？若患者难以耐受或干体重难以降低，有哪些措施？","a":"①先准确评估干体重，防止过量超滤；②在数日到数周期间调整目标体重：每次透析增加0.5L超滤量，逐渐降低至目标干体重；③若不能耐受，尝试每次透析增加0.2L超滤量；④难以降低目标干体重者，可延长透析时间、增加透析频率或可调钠透析；⑤同时强化限盐（每日钠1.5～2.0g或食盐3～5g）、控制透析间期体重增长。","key":"一次性大幅下调干体重易致透析中低血压，应“数日到数周”逐步调整。","page":11},{"id":71,"chapter":"第2章 血液透析患者管理标准操作规程","section":"四、血液透析相关医疗指标的监测管理","roles":["医生","护士"],"level":"基础","type":"简答","q":"新入血液透析和维持性血液透析患者需定期检测哪些传染病学指标？维持性患者慢性并发症指标监测涉及哪些方面？","a":"①传染病学指标：肝炎病毒标志物、人类免疫缺陷病毒标志物、梅毒螺旋体，需定期检测（具体见第3章感染控制标准操作规程）；②慢性并发症指标：肾性贫血、CKD-MBD、微炎症状态等，其最低检测频率见第1章（表1-1）。","key":"表1-1给出的是“最低”检测频率。","page":12},{"id":72,"chapter":"第2章 血液透析患者管理标准操作规程","section":"五、血液透析患者主要并发症的管理","roles":["医生"],"level":"基础","type":"简答","q":"血液透析患者的主要并发症有哪些？分别参见规程哪一章进行管理？","a":"①高血压：第19章 血液透析患者高血压的治疗；②营养不良：第27章 血液透析患者营养不良的评估与治疗；③肾性贫血：第25章 血液透析患者的贫血治疗；④CKD-MBD：第26章 慢性肾脏病矿物质与骨异常的防治。","key":"四大主要并发症与对应质控结果指标（高血压控制率、白蛋白、Hb、CKD-MBD）一一对应。","page":12},{"id":73,"chapter":"第2章 血液透析患者管理标准操作规程","section":"六、血液透析患者的运动康复管理","roles":["医生","护士"],"level":"进阶","type":"简答","q":"运动对血液透析患者有哪些益处？","a":"①改善钙磷代谢；②改善营养状态；③改善生活质量、心理与睡眠状况；④防止肌肉萎缩；⑤提高免疫、心肺功能与透析充分性；⑥有助于控制血压与血糖。","key":"运动可提高透析充分性，常被忽视。","page":12},{"id":74,"chapter":"第2章 血液透析患者管理标准操作规程","section":"六、血液透析患者的运动康复管理","roles":["医生","护士"],"level":"基础","type":"填空","q":"透析患者运动处方按FITT原则制订，F、I、T、T分别为频率、强度、时间、____；运动频率为每周____次，每次____min。","a":"方式；3～5；30～60","key":"FITT中最后一个T是type（方式）。","page":12},{"id":75,"chapter":"第2章 血液透析患者管理标准操作规程","section":"六、血液透析患者的运动康复管理","roles":["医生","护士"],"level":"进阶","type":"判断","q":"规律运动的透析患者应在康复医师指导下每3个月评定1次。（对/错？）","a":"错。在康复医师的指导下对规律运动的透析患者，每6个月评定1次。","key":"评定频率为6个月。","page":12},{"id":76,"chapter":"第2章 血液透析患者管理标准操作规程","section":"六、血液透析患者的运动康复管理","roles":["医生","护士"],"level":"进阶","type":"简答","q":"血液透析患者运动强度如何把握？","a":"以中低强度的运动量为宜，即心率不超过最大心率的60%～70%，或主观疲劳感觉评分12～16分，即自感稍累或累，但又不精疲力竭的状态。","key":"不是高强度训练；心率上限为最大心率的60%～70%。","page":12},{"id":77,"chapter":"第2章 血液透析患者管理标准操作规程","section":"六、血液透析患者的运动康复管理","roles":["护士"],"level":"基础","type":"简答","q":"血液透析患者运动的时间如何安排？","a":"①透析间期：饭后2h、至少睡前1h，早晨与傍晚为佳；②透析治疗过程中：前2h。","key":"透析中运动只在前2h，后期血容量下降易低血压。","page":13},{"id":78,"chapter":"第2章 血液透析患者管理标准操作规程","section":"六、血液透析患者的运动康复管理","roles":["护士"],"level":"进阶","type":"简答","q":"血液透析患者可选择哪些运动方式？","a":"可为以下一种或多种方式联合：①灵活性运动：如颈关节、上下肢关节、髋关节等；②有氧运动：非透析期如行走、慢跑、游泳、保健操、太极拳等，透析过程中如脚踏车等；③抗阻力运动：透析期及非透析期均可进行非内瘘侧上肢或双上肢举哑铃、弹力带训练、进行性脚踝负重、阻力带训练、膝盖伸展运动、髋关节屈曲、踝伸屈运动、递增式的仰卧抬腿等。","key":"抗阻力运动透析期及非透析期均可进行，但透析中上肢训练须用非内瘘侧，避免影响内瘘穿刺侧。","page":13},{"id":79,"chapter":"第2章 血液透析患者管理标准操作规程","section":"六、血液透析患者的运动康复管理","roles":["医生","护士"],"level":"进阶","type":"简答","q":"血液透析患者运动中出现哪些情况应终止运动？","a":"明显疲劳、与运动不相符的呼吸困难、胸痛、快速或不规则心律失常、低血压或高血压发作、头痛或嗜睡、肌肉痉挛、关节疼痛等明显不适。","key":"透析中运动出现肌肉痉挛或低血压须立即停止，并评估干体重与超滤。","page":13},{"id":80,"chapter":"第2章 血液透析患者管理标准操作规程","section":"六、血液透析患者的运动康复管理","roles":["医生"],"level":"高级","type":"案例分析","q":"维持性血透患者李某，Hb 55g/L，本次透析间期体重增加达干体重的6%，希望在透析中进行脚踏车运动。是否可行？运动的禁忌证有哪些？","a":"不可行。①Hb＜60g/L属严重贫血，为运动禁忌证；②透析间期体重增加＞5%干体重时，不宜进行透析期运动。禁忌证包括：透析方案及服药方案改变初期、发热、严重心血管病变、血压过高、血压过低、视网膜病变、体能状况恶化、未控制好血糖的糖尿病、严重贫血（Hb＜60g/L）、发生过骨折的肾性骨营养不良或运动可能加重关节、骨骼病变等。","key":"严重贫血界值为Hb＜60g/L；IDWG＞5%干体重仅限制“透析期运动”。","page":13},{"id":81,"chapter":"第3章 血液透析室（中心）感染控制标准操作规程","section":"一、血液透析室（中心）感染控制的基本设施","roles":["护士","技师"],"level":"基础","type":"简答","q":"血液透析室（中心）按感染控制要求划分为哪三类区域？各包括哪些房间？","a":"①清洁区域：治疗准备室、水处理间、清洁库房、配液间、复用后透析器储存间及医护人员办公室和生活区；②潜在感染区域：透析治疗室、专用手术室/操作室、接诊室/区及患者更衣室；③污染区域：透析器复用间、污物处理室及洁具间。进入潜在感染区域和/或污染区域的被污染物品，未经消毒不得返回清洁区域。","key":"“复用后透析器储存间”属清洁区而“透析器复用间”属污染区，接诊室和更衣室属潜在感染区，是考核高频混淆点。","page":14},{"id":82,"chapter":"第3章 血液透析室（中心）感染控制标准操作规程","section":"一、血液透析室（中心）感染控制的基本设施","roles":["护士","技师"],"level":"基础","type":"填空","q":"透析治疗室每个血液透析床/椅间距不小于____；每个透析单元应当有电源插座组、____接口、____接口等。","a":"1米；反渗水供给；透析废液排水。","key":"床间距“不小于1米”是硬性布局标准，新建或扩容透析室验收必查。","page":14},{"id":83,"chapter":"第3章 血液透析室（中心）感染控制标准操作规程","section":"一、血液透析室（中心）感染控制的基本设施","roles":["护士"],"level":"基础","type":"简答","q":"每个分隔透析治疗区域应配置哪些手卫生设施？配置原则是什么？","a":"①洗手池；②非手触式水龙头；③洗手液；④速干手消毒剂；⑤干手物品或设备。手卫生设施的位置和数量应满足工作和感染控制的需要。","key":"要求“每个分隔透析治疗区域”均配置，且水龙头必须是非手触式，常被检查扣分。","page":14},{"id":84,"chapter":"第3章 血液透析室（中心）感染控制标准操作规程","section":"一、血液透析室（中心）感染控制的基本设施","roles":["护士","技师"],"level":"基础","type":"简答","q":"透析治疗室在个人防护设备和空气环境方面的基本设施要求是什么？","a":"①应配备足够的工作人员个人防护设备：手套、口罩、工作服、护目镜/防护面罩等；②透析治疗室应具备通风设施和/或空气消毒装置，光线充足、通风良好；③达到《医院消毒卫生标准》（GB 15982-2012）的Ⅲ类环境。","key":"透析治疗室环境级别是Ⅲ类，不是Ⅱ类；护目镜/防护面罩是常被忽略的必备防护用品。","page":14},{"id":85,"chapter":"第3章 血液透析室（中心）感染控制标准操作规程","section":"一、血液透析室（中心）感染控制的基本设施","roles":["医生","护士"],"level":"基础","type":"判断","q":"具有传染性的乙肝、丙肝、梅毒及艾滋病患者只能在隔离透析治疗室/区专机透析，不能选择居家透析。（对/错？）","a":"错。规程规定此类血源性传染病患者应在隔离透析治疗室/区进行专机血液透析，也可进行居家透析治疗。","key":"居家透析是规程明确允许的选项，尤其适合HIV等推荐转诊的患者。","page":14},{"id":86,"chapter":"第3章 血液透析室（中心）感染控制标准操作规程","section":"一、血液透析室（中心）感染控制的基本设施","roles":["医生","护士"],"level":"基础","type":"简答","q":"乙肝、丙肝、梅毒、艾滋病患者满足哪些条件应在隔离透析治疗室/区进行血液透析？","a":"①HBV：HBsAg（+）或HBV-DNA（+）；②HCV：HCV-RNA（+），有条件单位检测HCV抗原，HCV抗原（+）应隔离；③梅毒螺旋体：RPR高滴度（+）、TRUST高滴度（+）、梅毒螺旋体IgM抗体（+）或暗视野显微镜下见到可活动的梅毒螺旋体；④HIV：HIV抗体（+）或HIV-RNA（+）。","key":"丙肝隔离依据是HCV-RNA（或HCV抗原）阳性而非抗体阳性；梅毒是“高滴度”阳性，低滴度不作为隔离条件。","page":15},{"id":87,"chapter":"第3章 血液透析室（中心）感染控制标准操作规程","section":"一、血液透析室（中心）感染控制的基本设施","roles":["医生","护士"],"level":"进阶","type":"判断","q":"凡HCV抗体阳性的血液透析患者均应进入隔离透析治疗室/区进行专机透析。（对/错？）","a":"错。丙肝进入隔离区的条件是HCV-RNA（+）（检测HCV抗原时HCV抗原（+）也应隔离）。HCV抗体（+）且HCV-RNA（-）的新导入或新转入患者，按规程④的方案管理。","key":"抗体阳性仅提示既往或现症感染，“按抗体隔离”是最常见的过度隔离错误。","page":15},{"id":88,"chapter":"第3章 血液透析室（中心）感染控制标准操作规程","section":"一、血液透析室（中心）感染控制的基本设施","roles":["医生"],"level":"进阶","type":"填空","q":"HCV-RNA（+）定义为采用高灵敏度检测方法HCV-RNA≥____IU/ml；建议有条件的单位检测____，有助于减少HCV感染窗口期的漏诊。","a":"15；HCV抗原。","key":"阈值15IU/ml必须基于“高灵敏度检测方法”，低灵敏度方法阴性不能作为转阴依据。","page":15},{"id":89,"chapter":"第3章 血液透析室（中心）感染控制标准操作规程","section":"一、血液透析室（中心）感染控制的基本设施","roles":["医生","护士"],"level":"高级","type":"简答","q":"血液透析期间HCV-RNA转阴的丙肝患者，自首次报告转阴之日起6个月内应如何安排透析？","a":"①继续在隔离透析治疗室/区透析；②相对固定透析机位，并在每个透析日将其安排在该机位第一个进行透析；③透析前严格按照透析机使用说明对透析机进行消毒，对透析床单元严格清洁、消毒，更换相应物品并做好记录；④其间应当每月1次监测HCV-RNA。","key":"转阴后前6个月仍在隔离区但排“第一个”透析，转入普通区后才排“末班”，两者顺序极易记反。","page":15},{"id":90,"chapter":"第3章 血液透析室（中心）感染控制标准操作规程","section":"一、血液透析室（中心）感染控制的基本设施","roles":["医生","护士"],"level":"高级","type":"简答","q":"HCV-RNA持续阴性达到6个月以上的患者如何转入普通透析区？转入后如何监测？","a":"①可安置于普通透析室/区透析，相对固定透析机位，安排末班透析；②透析结束后严格按要求进行透析机和透析床单元的清洁和消毒；③由隔离区转入普通区的患者应当在1、3、6个月各检测1次HCV-RNA。","key":"转入普通区后监测节点是第1、3、6个月，不是每月一次；排班必须是末班。","page":15},{"id":91,"chapter":"第3章 血液透析室（中心）感染控制标准操作规程","section":"一、血液透析室（中心）感染控制的基本设施","roles":["医生","护士"],"level":"高级","type":"案例分析","q":"新转入患者王某，HCV抗体（+），本院查HCV-RNA（-），并携带外院确切检验资料证实HCV-RNA（-）已持续8个月。请问如何安排其透析？若外院资料不全又如何处理？","a":"①有确切临床资料证实HCV-RNA（-）持续6个月以上：无需隔离透析，但需在普通透析治疗室/区持续末班透析6个月，每月1次监测HCV-RNA；②若不能确认HCV-RNA（-）持续6个月以上：按转阴患者②方案安排，即在隔离区透析、相对固定机位、每个透析日排该机位第一个，透析前严格消毒机器与床单元，每月1次监测HCV-RNA。","key":"关键在“确切临床资料”能否证实阴性≥6个月；即便免隔离，也要末班透析6个月并每月监测，不能直接按普通患者管理。","page":15},{"id":92,"chapter":"第3章 血液透析室（中心）感染控制标准操作规程","section":"一、血液透析室（中心）感染控制的基本设施","roles":["医生","护士"],"level":"高级","type":"判断","q":"乙肝重叠丙肝感染的患者，如条件实在有限，可在丙肝透析治疗区透析。（对/错？）","a":"错。乙肝重叠丙肝患者应在隔离透析治疗室/区专机透析；如条件实在有限，可在乙肝透析治疗区透析，但相对固定透析机位并安排末班透析。","key":"重叠感染退而求其次只能放“乙肝区”，且须固定机位、末班。","page":15},{"id":93,"chapter":"第3章 血液透析室（中心）感染控制标准操作规程","section":"一、血液透析室（中心）感染控制的基本设施","roles":["护士"],"level":"基础","type":"简答","q":"传染病隔离透析治疗室/区在物品配置和标识方面有哪些要求？","a":"①应配备专用的透析操作用品车，且不能在隔离透析治疗室/区和普通透析治疗室/区之间交叉使用；②隔离区的设备和物品如病历、血压计、听诊器、治疗车、机器等应有明确标识。","key":"病历、血压计、听诊器也须专用并标识，临床常见借用普通区血压计的违规行为。","page":15},{"id":94,"chapter":"第3章 血液透析室（中心）感染控制标准操作规程","section":"一、血液透析室（中心）感染控制的基本设施","roles":["护士","技师"],"level":"高级","type":"填空","q":"同时设置普通区、乙肝和丙肝隔离区且未设独立物品通道的透析室，物品流动顺序应为：清洁区→____→____→____，被污染且未经消毒的物品不得____流动。","a":"普通透析治疗室/区；丙型病毒性肝炎隔离透析治疗室/区；乙型病毒性肝炎隔离透析治疗室/区；逆向。","key":"丙肝区在前、乙肝区在最后（乙肝传染性最强、环境存活力强），顺序常被记反。","page":16},{"id":95,"chapter":"第3章 血液透析室（中心）感染控制标准操作规程","section":"一、血液透析室（中心）感染控制的基本设施","roles":["护士"],"level":"进阶","type":"简答","q":"传染病隔离透析治疗室/区护理人员的安排和防护要求是什么？","a":"①护理人员相对固定；②同一班次的护理人员不能交叉管理隔离区和普通区的透析患者；③应加强防护，进行血管通路连接或断开操作时，应佩戴护目镜/防护面罩、穿隔离衣等。","key":"“同一班次不得交叉管理”是排班硬杠杠；通路连接/断开时护目镜和隔离衣缺一不可。","page":16},{"id":96,"chapter":"第3章 血液透析室（中心）感染控制标准操作规程","section":"一、血液透析室（中心）感染控制的基本设施","roles":["医生"],"level":"进阶","type":"简答","q":"HIV阳性、确诊传染性梅毒、合并活动性肺结核及呼吸道传染病患者的透析场所分别有何建议？","a":"①HIV阳性或确诊传染性梅毒：建议到指定传染病专科医疗机构或卫生健康行政部门指定的医疗机构接受透析，或进行居家透析；②合并活动性肺结核：应在呼吸道隔离病房或到指定医疗机构接受透析；③呼吸道传染病疫情期间：透析前进行体温检测等预检分诊，可疑和确诊患者在呼吸道隔离病房或到指定医疗机构透析；④合并呼吸道感染/传染病的患者进入透析室应佩戴一次性医用外科口罩。","key":"活动性肺结核不能放在普通隔离区（血源性隔离区无呼吸道隔离条件），须呼吸道隔离病房或指定机构。","page":16},{"id":97,"chapter":"第3章 血液透析室（中心）感染控制标准操作规程","section":"二、血液透析室（中心）感染控制的规章制度","roles":["医生","护士"],"level":"进阶","type":"填空","q":"透析室感控制度的依据中，《医院感染管理办法》为卫生部令第____号，《突发公共卫生事件与传染病疫情监测信息报告管理办法》为卫生部令第____号，《医务人员手卫生规范》标准号为____。","a":"48；37；WS/T 313-2019。","key":"48号令管院感暴发上报，37号令管传染病疫情上报，两者对应的上报时限不同。","page":16},{"id":98,"chapter":"第3章 血液透析室（中心）感染控制标准操作规程","section":"二、血液透析室（中心）感染控制的规章制度","roles":["医生","护士","技师"],"level":"基础","type":"填空","q":"血液透析室（中心）应建立感染控制的规章制度、流程和预案，组织医护人员认真学习、熟练掌握，每年至少____次培训与考核。","a":"1。","key":"“至少每年1次”是培训与考核的下限，且培训和考核都要有记录。","page":17},{"id":99,"chapter":"第3章 血液透析室（中心）感染控制标准操作规程","section":"二、血液透析室（中心）感染控制的规章制度","roles":["医生","护士","技师"],"level":"进阶","type":"简答","q":"血液透析室（中心）感染控制相关的规章制度至少应包括哪些？","a":"①感染防控的组织机构和全员培训制度；②医护人员手卫生规范和无菌操作制度；③医疗机构相关感染控制及消毒隔离制度；④医疗机构相关感染监测和报告制度；⑤传染病患者隔离制度；⑥传染病新发、播散报告制度；⑦设备设施及一次性使用医疗物品的管理制度；⑧透析液和透析用水质量监测制度；⑨库房管理制度；⑩医疗废物管理制度；⑪职业安全防护制度。","key":"共11项，库房管理、透析液与透析用水质量监测、职业安全防护制度最易漏答。","page":17},{"id":100,"chapter":"第3章 血液透析室（中心）感染控制标准操作规程","section":"三、血液透析患者治疗前准备","roles":["医生","护士"],"level":"基础","type":"简答","q":"血液透析治疗前在告知与知情同意方面应做哪些工作？","a":"①告知患者血液透析可能带来的血源性或呼吸道传染性疾病感染的风险；②要求患者遵守透析室消毒隔离、定期监测等传染病控制相关规定；③签署透析治疗知情同意书（附录三）；④透析器复用患者应同时签署透析器复用知情同意书（附录四）。","key":"复用患者须“同时”签两份同意书，漏签复用同意书是常见医疗文书缺陷。","page":17},{"id":101,"chapter":"第3章 血液透析室（中心）感染控制标准操作规程","section":"三、血液透析患者治疗前准备","roles":["医生"],"level":"进阶","type":"简答","q":"哪些患者必须在透析治疗前进行传染病标志物检测？检测哪些项目？","a":"对象：首次开始血液透析的患者、由其他透析室（中心）转入的患者、近期接受血液制品治疗的患者。项目：乙肝病毒、丙肝病毒、梅毒螺旋体及人类免疫缺陷病毒标志物（包括抗原和/或抗体），推荐同时检测HBV-DNA和HCV-RNA。保留原始记录，登记检查结果。","key":"“近期接受血液制品治疗”这一类对象最容易漏查。","page":17},{"id":102,"chapter":"第3章 血液透析室（中心）感染控制标准操作规程","section":"三、血液透析患者治疗前准备","roles":["医生"],"level":"进阶","type":"案例分析","q":"新导入患者李某，HBsAg（-）、HCV抗体（-）、梅毒和HIV标志物均阴性，但谷丙转氨酶不明原因显著升高。另一患者HBsAg（+），第三位患者HCV抗体（+）。分别应如何进一步检查？","a":"①乙肝病毒抗原阴性但存在不能解释的转氨酶异常升高：进一步行HBV-DNA和HCV-RNA检测；②乙肝病毒标志物阳性：进一步行HBV-DNA及肝功能指标检测；③HCV抗体阳性：进一步行HCV-RNA及肝功能指标检测。均应保留原始记录并登记。","key":"不明原因转氨酶升高要“同时”查HBV-DNA和HCV-RNA，以发现隐匿性乙肝或窗口期丙肝。","page":17},{"id":103,"chapter":"第3章 血液透析室（中心）感染控制标准操作规程","section":"三、血液透析患者治疗前准备","roles":["医生"],"level":"基础","type":"简答","q":"哪些患者在透析前应进行结核相关筛查？筛查内容是什么？","a":"对象：首次开始血液透析的患者、由其他透析室（中心）转入的患者、既往或现患肺结核的患者。内容：胸部X线和/或肺部CT，以及结核感染标志物检查。","key":"结核筛查对象包括“既往”肺结核患者，不只是现患。","page":18},{"id":104,"chapter":"第3章 血液透析室（中心）感染控制标准操作规程","section":"三、血液透析患者治疗前准备","roles":["护士"],"level":"基础","type":"简答","q":"对合并传染性疾病的透析患者，在病历档案和相关文件上应如何管理？","a":"应建立患者病历档案，在排班表、病历及相关文件上对合并传染性疾病的患者作明确标识；检查结果保留原始记录并登记。","key":"排班表标识是落实分区、分机、排班顺序的前提，不能省略。","page":18},{"id":105,"chapter":"第3章 血液透析室（中心）感染控制标准操作规程","section":"三、血液透析患者治疗前准备","roles":["护士"],"level":"基础","type":"填空","q":"呼吸道传染病疫情期间，透析前应检测患者____，____患者应进行相关呼吸道传染病检查。","a":"体温；发热。","key":"疫情期间体温检测是透析前常规预检，不能等到上机后再测。","page":18},{"id":106,"chapter":"第3章 血液透析室（中心）感染控制标准操作规程","section":"四、血液透析治疗过程中的规范化操作","roles":["护士"],"level":"基础","type":"简答","q":"透析治疗中使用的医疗器械、器具和物品应分别达到什么消毒灭菌水平？","a":"①进入患者组织、无菌器官的医疗器械、器具和物品达到灭菌水平；②接触患者完整皮肤、黏膜的达到消毒水平；③用于注射、穿刺、采血等有创操作的医疗器具一人一用一灭菌；④一次性使用的医疗器械、器具（包括注射器等）不得重复使用；⑤所用消毒药械、一次性医疗器械和器具应当符合国家有关规定。","key":"有创器具是“一人一用一灭菌”，而非消毒即可。","page":18},{"id":107,"chapter":"第3章 血液透析室（中心）感染控制标准操作规程","section":"四、血液透析治疗过程中的规范化操作","roles":["护士"],"level":"基础","type":"填空","q":"以____或____作为血管通路的患者，血管通路的连接和断开均应进行无菌操作技术；患者透析时应严格限制____进入透析治疗室/区。","a":"中心静脉导管；移植物内瘘；非工作人员。","key":"导管和移植物内瘘感染后果严重，连接与“断开”同样要求无菌操作，下机环节常被放松。","page":18},{"id":108,"chapter":"第3章 血液透析室（中心）感染控制标准操作规程","section":"四、血液透析治疗过程中的规范化操作","roles":["护士"],"level":"进阶","type":"简答","q":"透析治疗过程中肝素、促红素、铁剂等治疗药品的配制和使用有哪些感控要求？","a":"①肝素溶液、低分子量肝素制剂、红细胞生成刺激剂、铁剂等药品必须在透析治疗准备室针对每位患者进行配制；②配制后直接送至每位患者的透析单元，标识清楚，一人一用；③已进入透析治疗室/区的药品不可返回透析治疗准备室；④指定患者配制的、已进入透析单元的未使用药品不能用于其他患者。","key":"禁止在透析单元床旁配药，也禁止“多人共用一瓶”分装，这是透析室丙肝暴发的经典原因。","page":18},{"id":109,"chapter":"第3章 血液透析室（中心）感染控制标准操作规程","section":"四、血液透析治疗过程中的规范化操作","roles":["护士"],"level":"高级","type":"案例分析","q":"护士为3床患者配制好蔗糖铁并送至其透析单元，后因医嘱暂停未使用。恰好5床有相同医嘱，护士拟将该药用于5床；另一护士建议送回治疗准备室冰箱留待下次。如何评价？","a":"两种做法都错误。①指定患者配制的、已进入透析单元的未使用药品不能用于其他患者，不能给5床使用；②已经进入透析治疗室/区的药品不可返回透析治疗准备室；③应按规定废弃处理，5床药品在治疗准备室针对该患者单独配制。","key":"“进单元即不可回流、不可转用”是一条单向规则，为节约药品而转用属严重违规。","page":18},{"id":110,"chapter":"第3章 血液透析室（中心）感染控制标准操作规程","section":"四、血液透析治疗过程中的规范化操作","roles":["医生","护士"],"level":"高级","type":"案例分析","q":"夜间一名高钾血症患者需紧急血液透析，入院时血源性传染病标志物检测结果尚未回报。应如何安排透析机？","a":"可安排用于急诊的血液透析机进行治疗；透析结束后对该血液透析机表面和内部进行严格消毒。同时应追踪标志物结果，根据结果决定后续是否进入隔离区透析。","key":"不能因急而占用普通区常规机或隔离区专机，急诊机用后“表面+内部”均需严格消毒。","page":18},{"id":111,"chapter":"第3章 血液透析室（中心）感染控制标准操作规程","section":"四、血液透析治疗过程中的规范化操作","roles":["护士"],"level":"基础","type":"判断","q":"同一患者在同一次透析中使用的一次性注射器，可在更换针头后重复抽取药液。（对/错？）","a":"错。一次性使用的医疗器械、器具（包括注射器等）不得重复使用；各种用于注射、穿刺、采血等有创操作的医疗器具应一人一用一灭菌。","key":"“换针头不换注射器”是导致血源性病原体交叉污染药瓶的典型错误。","page":18},{"id":112,"chapter":"第3章 血液透析室（中心）感染控制标准操作规程","section":"五、血液透析治疗结束后的消毒","roles":["护士"],"level":"基础","type":"简答","q":"每班次及每日透析结束后，在空气和床单位方面应做哪些处理？","a":"①每班次透析结束后，透析治疗室/区应通风，保持空气清新；②每日透析结束后应进行有效的空气净化/消毒；③每班次透析结束后，患者使用的床单、被套、枕套等物品应当一人一用一更换。","key":"床单位是“每班次”一人一用一更换，不是每日更换一次。","page":19},{"id":113,"chapter":"第3章 血液透析室（中心）感染控制标准操作规程","section":"五、血液透析治疗结束后的消毒","roles":["护士"],"level":"基础","type":"填空","q":"透析机外部等物品表面采用____mg/L含氯消毒剂或其他有效消毒剂擦拭消毒；如有血液污染，应立即用____mg/L含氯消毒剂的一次性使用布巾擦拭或用可吸附材料清除血迹后，再用____mg/L含氯消毒剂擦拭消毒。","a":"500；2000；500。","key":"血液污染是“两步法”：先2000mg/L或吸附材料清除血迹，再500mg/L擦拭，并做好记录。","page":19},{"id":114,"chapter":"第3章 血液透析室（中心）感染控制标准操作规程","section":"五、血液透析治疗结束后的消毒","roles":["护士"],"level":"进阶","type":"案例分析","q":"下机回血时管路接头松脱，血液溅到透析机外壳、透析床和地面。请写出规范的处理流程。","a":"①立即用2000mg/L浓度含氯消毒剂的一次性使用布巾擦拭，或使用可吸附的材料清除血迹；②再用500mg/L浓度的含氯消毒剂擦拭消毒；③对有血液污染的区域（地面、墙面）按要求使用消毒液擦拭；④遵循先清洁再消毒的原则，参照WS/T 512-2016对透析单元内所有物品表面及地面清洁消毒；⑤做好消毒工作记录。","key":"很多人直接用500mg/L擦血迹，浓度不足；也有人忘记记录，导致无法追溯。","page":19},{"id":115,"chapter":"第3章 血液透析室（中心）感染控制标准操作规程","section":"五、血液透析治疗结束后的消毒","roles":["护士"],"level":"基础","type":"判断","q":"血液透析室环境、物体表面清洁与消毒应遵循先消毒再清洁的原则。（对/错？）","a":"错。应遵循先清洁再消毒的原则，根据环境、物体表面及其污染程度选择有效的清洁剂或消毒剂。","key":"有机物会消耗含氯消毒剂有效氯，先清洁才能保证消毒效果（血液污染除外需先按要求清除血迹）。","page":19},{"id":116,"chapter":"第3章 血液透析室（中心）感染控制标准操作规程","section":"五、血液透析治疗结束后的消毒","roles":["技师","护士"],"level":"进阶","type":"简答","q":"每次透析结束后透析机内部管路如何消毒？采用中心供液、无透析液内部管路的透析机有何不同？","a":"①按照透析机使用说明书要求对机器内部管路进行消毒；②必须使用经国家药品监督管理局批准的消毒液，或具有所在地省级卫生健康行政部门发放的卫生许可证或备案的消毒液商品；③采用中心供液自动透析系统、无透析液内部管路的透析机，可自动冲洗后开始下次透析，无需进行机器内部管路消毒；但每日透析结束后应进行透析系统的整体消毒，并做好记录。","key":"中心供液机型“班间免内部消毒”不等于“每日免消毒”，每日整体消毒必须做。","page":19},{"id":117,"chapter":"第3章 血液透析室（中心）感染控制标准操作规程","section":"五、血液透析治疗结束后的消毒","roles":["技师","护士"],"level":"高级","type":"案例分析","q":"透析进行到第2小时，机器报漏血警报，确认透析器破膜，同时发现静脉压传感器保护罩被血液浸湿并渗漏至根部。请问透析结束后该机如何处理？","a":"①透析器破膜或传感器渗漏，应在透析结束时立即进行透析机消毒；②传感器渗漏至根部时应更换透析机内部传感器；③经处理后的透析机方可再次使用；④同时对机器外表面按血液污染流程处理并记录。","key":"渗漏至“根部”必须更换内部传感器，仅外部消毒或只换保护罩不合格。","page":19},{"id":118,"chapter":"第3章 血液透析室（中心）感染控制标准操作规程","section":"五、血液透析治疗结束后的消毒","roles":["技师","护士"],"level":"基础","type":"简答","q":"血液透析器/滤器复用的基本原则是什么？哪些患者和耗材不得复用？","a":"①经国家药品监督管理局批准的可复用透析器/滤器才可重复使用，遵照2005年卫生部《血液透析器复用操作规范》（卫医发〔2005〕330号）操作和管理；②合并乙肝、丙肝、梅毒及艾滋病等血源性传染疾病患者不得复用透析器/滤器；③透析管路（包括血液滤过的连接管路）不能复用。","key":"管路一律不得复用；传染病患者的透析器即便使用专用复用机也不能复用。","page":19},{"id":119,"chapter":"第3章 血液透析室（中心）感染控制标准操作规程","section":"五、血液透析治疗结束后的消毒","roles":["技师","护士"],"level":"进阶","type":"简答","q":"透析器/滤器复用操作在人员、防护、设备、用水及存放方面有哪些要求？","a":"①复用人员必须是护士、技术员或经过培训的专门人员；②复用时应戴好手套、围裙、防护面罩或护目镜；③必须使用国家药品监督管理局批准的清洁剂和消毒液以及透析器复用机器，不得人工清洗消毒；④复用应使用符合透析用水水质生物学标准的反渗水，并且有一定的压力和流速；⑤已处理的透析器/滤器应在指定区域存放，并与待处理的透析器/滤器分开放置。","key":"“围裙+面罩/护目镜”是复用岗防护要点；人工复用一律禁止。","page":19},{"id":120,"chapter":"第3章 血液透析室（中心）感染控制标准操作规程","section":"五、血液透析治疗结束后的消毒","roles":["护士","技师"],"level":"基础","type":"简答","q":"治疗结束后，对水处理系统、护士站公用物品及清洁用具有哪些清洁消毒要求？","a":"①按照水处理系统使用说明书要求，定期对水处理系统进行冲洗消毒；②护士站桌面、电话按键、电脑键盘、鼠标等应保持清洁，必要时使用消毒剂擦拭消毒；③清洁用具应分区使用，不同区域使用的清洁工具应明确标识，并分别清洗、消毒，分开干燥存放。","key":"键盘、鼠标、电话是手污染的“中转站”，常被忽视。","page":20},{"id":121,"chapter":"第3章 血液透析室（中心）感染控制标准操作规程","section":"六、医疗废物处理","roles":["护士"],"level":"基础","type":"简答","q":"血液透析室（中心）医疗废物处理应遵循哪些要求？","a":"①遵循《医疗废物管理条例》及配套文件分类管理，封闭转运；排出污水遵循《医疗机构水污染物排放标准》（GB 18466-2005）；②医疗废物与生活垃圾分类处理；③使用专用包装袋或容器，防渗漏、遗撒和穿漏，符合《医疗废物专用包装物、容器标准和警示标识规定》；④按规定的时间、线路移送到暂时存放的专用设施，并定期清洁消毒；⑤存放时间不得超过24h。","key":"暂存时限24h、按规定“时间+线路”转运，是院感督查必查项。","page":20},{"id":122,"chapter":"第3章 血液透析室（中心）感染控制标准操作规程","section":"六、医疗废物处理","roles":["护士"],"level":"进阶","type":"填空","q":"医疗废物应按规定的____、____移送到暂时存放的专用设施，存放时间不得超过____h；透析排出的污水应遵循《医疗机构水污染物排放标准》（____）。","a":"时间；线路；24；GB 18466-2005。","key":"污水排放标准号GB 18466-2005常与GB 15982-2012（消毒卫生标准）混淆。","page":20},{"id":123,"chapter":"第3章 血液透析室（中心）感染控制标准操作规程","section":"七、感染控制监测","roles":["护士"],"level":"基础","type":"填空","q":"透析室空气平均细菌菌落总数应≤____CFU/（5min·9cm直径平皿），物体表面平均细菌菌落总数应≤____CFU/cm²，医务人员卫生手消毒后手表面细菌菌落总数应≤____CFU/cm²。","a":"4；10；10。","key":"空气单位是“CFU/（5min·9cm直径平皿）”（沉降法），与物表、手的CFU/cm²不同，单位常写错。","page":20},{"id":124,"chapter":"第3章 血液透析室（中心）感染控制标准操作规程","section":"七、感染控制监测","roles":["护士"],"level":"基础","type":"简答","q":"透析室物体表面和空气的微生物监测频率和范围是什么？","a":"每月对透析室空气、物体、机器表面及部分医务人员手抽样进行病原微生物的培养监测，保留原始记录，建立登记表。","key":"频率是“每月”，且必须包括医务人员手和机器表面。","page":20},{"id":125,"chapter":"第3章 血液透析室（中心）感染控制标准操作规程","section":"七、感染控制监测","roles":["医生","护士"],"level":"进阶","type":"判断","q":"首次开始血液透析的患者，若初次血源性传染病标志物检测阴性，则此后按长期透析患者每6个月复查即可。（对/错？）","a":"错。首次开始透析、外院转入或近期接受血液制品治疗的患者，即使标志物检测阴性，至少3个月内应重复检测传染病标志物，以覆盖窗口期。","key":"新患者“3个月内复检”是为规避窗口期漏诊，最易被遗漏。","page":20},{"id":126,"chapter":"第3章 血液透析室（中心）感染控制标准操作规程","section":"七、感染控制监测","roles":["医生","护士"],"level":"基础","type":"填空","q":"长期透析的患者应每____个月检查1次乙肝病毒、丙肝病毒、梅毒螺旋体及人类免疫缺陷病毒标志物；存在不能解释的肝脏转氨酶异常升高的患者，应进行____和____定量检测。","a":"6；HBV-DNA；HCV-RNA。","key":"转氨酶不明原因升高要查“定量”核酸，而非仅复查抗体。","page":21},{"id":127,"chapter":"第3章 血液透析室（中心）感染控制标准操作规程","section":"七、感染控制监测","roles":["医生","护士"],"level":"高级","type":"案例分析","q":"某透析中心长期透析患者张某，本次半年例行复查发现HCV抗体由阴性转为阳性。作为感控负责人，应采取哪些措施？","a":"①立即对密切接触者（使用同一台血液透析机或相邻透析单元的患者）进行乙肝病毒或丙肝病毒标志物（抗原和/或抗体）检测，包括HBV-DNA和HCV-RNA检测；②检测阴性的患者应3个月内重复检测；③对张某查HCV-RNA及肝功能，HCV-RNA（+）（或HCV抗原+）者转入隔离透析治疗室/区专机透析；④新发传染病24h内上报并填写传染病报告表（附录七）；⑤建议丙型肝炎患者进行药物治疗。","key":"密切接触者范围是“同一台机+相邻单元”，阴性者3个月内必须复检，不能查一次了事。","page":21},{"id":128,"chapter":"第3章 血液透析室（中心）感染控制标准操作规程","section":"七、感染控制监测","roles":["医生"],"level":"进阶","type":"简答","q":"对于乙肝病毒易感者和丙型肝炎患者，规程分别有何建议？","a":"①建议乙肝病毒易感（HBsAb阴性）患者接种乙肝病毒疫苗；②建议丙型肝炎患者进行药物治疗。","key":"“易感”的判定标准是HBsAb阴性；丙肝抗病毒治疗是促成解除隔离的根本手段。","page":21},{"id":129,"chapter":"第3章 血液透析室（中心）感染控制标准操作规程","section":"七、感染控制监测","roles":["医生","护士"],"level":"高级","type":"简答","q":"在隔离区透析的乙肝、丙肝、梅毒患者满足哪些条件可考虑解除隔离？艾滋病患者能否解除隔离？","a":"满足下列全部条件可考虑解除隔离：①乙肝：HBsAg（-）和HBV-DNA（-）；②丙肝：HCV-RNA（-），检测HCV抗原时HCV抗原（-）；③梅毒：规范治疗1年以上，IgM抗体（-）、RPR和TRUST阴性或低滴度、暗视野显微镜下无梅毒螺旋体。艾滋病患者不能解除隔离（表3-1）。","key":"乙肝须HBsAg与HBV-DNA“同时”阴性；艾滋病不存在解除隔离路径。","page":21},{"id":130,"chapter":"第3章 血液透析室（中心）感染控制标准操作规程","section":"七、感染控制监测","roles":["医生","护士"],"level":"高级","type":"简答","q":"符合解除隔离标准的患者，解除隔离透析治疗的实施方案是什么？","a":"①传染病标志物检测首次转阴之日起6个月继续在隔离区透析，相对固定机位，透析日安排第一个透析，每月1次监测标志物，连续6个月；②标志物持续阴性达6个月以上，可安排在普通区透析，相对固定机位，透析日安排最后一个透析；转入后1、3、6个月各检测1次，持续转阴者按普通患者每6个月监测1次；③监测中如出现标志物阳转，则转回隔离区透析；持续阴性则在普通区透析。","key":"“隔离区排第一、普通区排最后”的逻辑是让最可能残余传染性的患者避开易感者，务必理解后记忆。","page":21},{"id":131,"chapter":"第3章 血液透析室（中心）感染控制标准操作规程","section":"七、感染控制监测","roles":["医生","护士"],"level":"高级","type":"案例分析","q":"乙肝患者赵某经抗病毒治疗后HBsAg（-）、HBV-DNA（-），自首次转阴之日起已在隔离区透析满6个月，期间每月监测均阴性。请制订下一步透析与监测计划。","a":"①可安排在普通透析治疗室/区透析，相对固定透析机位，透析日安排最后一个透析；②转入普通区后第1、3、6个月各检测1次标志物；③持续转阴者按普通透析患者每6个月监测1次标志物；④监测过程中一旦出现标志物阳转，立即转回隔离透析治疗室/区。","key":"表3-1将其概括为“前6个月每月1次、后6个月每3个月1次”，两种表述须对应理解。","page":21},{"id":132,"chapter":"第3章 血液透析室（中心）感染控制标准操作规程","section":"七、感染控制监测","roles":["医生"],"level":"进阶","type":"判断","q":"梅毒患者规范治疗满6个月、梅毒螺旋体IgM抗体转阴，即可解除隔离。（对/错？）","a":"错。梅毒患者解除隔离需同时满足：规范治疗1年以上，IgM抗体（-），RPR和TRUST阴性或低滴度，暗视野显微镜下无梅毒螺旋体。","key":"规范治疗时间要求是“1年以上”，且须四项条件全部满足。","page":21},{"id":133,"chapter":"第3章 血液透析室（中心）感染控制标准操作规程","section":"七、感染控制监测","roles":["技师"],"level":"进阶","type":"填空","q":"每年每台透析机应至少进行____次透析液的细菌和内毒素检测；透析用水和透析液培养方法参照《血液透析及相关治疗用水》（____）标准执行。","a":"1；YY 0572-2015。","key":"“每台机每年至少1次”需建立轮检计划，确保全部机器覆盖。","page":22},{"id":134,"chapter":"第3章 血液透析室（中心）感染控制标准操作规程","section":"七、感染控制监测","roles":["技师"],"level":"进阶","type":"简答","q":"透析用水和透析液细菌培养及内毒素检测的方法学要求有哪些？","a":"①培养基：可选择胰化蛋白胨葡萄糖（TGEA）培养基、R2A营养琼脂培养基或其他确认能提供相同结果的培养基；②不能使用血琼脂培养基和巧克力琼脂培养基；③推荐17～23℃培养温度和7d培养时间；④内毒素应使用鲎试剂法测定，或其他确认能提供相同结果的方法。","key":"沿用临床微生物室的血平板、35～37℃短时培养会严重低估水中贫营养菌，是最常见错误。","page":22},{"id":135,"chapter":"第3章 血液透析室（中心）感染控制标准操作规程","section":"七、感染控制监测","roles":["技师"],"level":"高级","type":"填空","q":"每月1次进行透析用水和透析液的细菌检测，保持细菌数量≤____CFU/ml，细菌数量＞____CFU/ml应进行干预；至少每____个月进行1次内毒素检测，保持透析用水内毒素≤____EU/ml及透析液内毒素≤____EU/ml，超过最大允许水平的____应进行干预。","a":"100；50；3；0.25；0.5；50%。","key":"细菌“每月”、内毒素“至少每3个月”，频次不同；透析用水与透析液内毒素限值不同（0.25 vs 0.5）。","page":22},{"id":136,"chapter":"第3章 血液透析室（中心）感染控制标准操作规程","section":"七、感染控制监测","roles":["技师"],"level":"高级","type":"案例分析","q":"季度检测报告：透析用水细菌30CFU/ml，内毒素0.15EU/ml；各透析机透析液检测合格。技师认为均在最大允许值内无需处理。是否正确？应如何处理？","a":"不正确。透析用水内毒素最大允许水平为0.25EU/ml，超过其50%（即＞0.125EU/ml）应进行干预，0.15EU/ml已达干预水平。处理：①对水处理系统进行消毒；②重新检测，符合标准后方可使用；③做好记录。细菌30CFU/ml未超过50CFU/ml干预水平。","key":"“合格”与“需干预”是两条线，只看最大允许值而忽略50%干预线是常见失误。","page":22},{"id":137,"chapter":"第3章 血液透析室（中心）感染控制标准操作规程","section":"七、感染控制监测","roles":["技师"],"level":"高级","type":"案例分析","q":"某月检测透析用水细菌和内毒素均合格，但8号透析机透析液细菌计数为120CFU/ml。应如何处理？","a":"①透析用水合格而透析液超标，应对所有同型号透析机进行透析液细菌和内毒素检测；②校验透析机消毒程序；③8号机必须重新消毒，检测符合标准后方可使用；④做好记录。","key":"问题在机器端而非水端，要扩大到“所有同型号”机器排查并校验消毒程序，不能只处理单台。","page":22},{"id":138,"chapter":"第3章 血液透析室（中心）感染控制标准操作规程","section":"八、医疗机构内感染和传染病上报","roles":["医生"],"level":"进阶","type":"简答","q":"按照《医院感染管理办法》，经调查证实发生哪些情形时医疗机构应在12h内报告？向谁报告？","a":"情形：①5例以上医疗机构相关感染暴发；②由于医疗机构相关感染暴发直接导致患者死亡；③由于医疗机构相关感染暴发导致3人以上人身损害后果。应于12h内向所在地的县级地方人民政府卫生健康行政部门报告，并同时向所在地疾病预防控制机构报告。","key":"“5例以上/死亡/3人以上人身损害”三条与12h、县级+疾控要一一对应记忆。","page":22},{"id":139,"chapter":"第3章 血液透析室（中心）感染控制标准操作规程","section":"八、医疗机构内感染和传染病上报","roles":["医生"],"level":"进阶","type":"简答","q":"哪些医疗机构相关感染情形应按照《国家突发公共卫生事件相关信息报告管理工作规范（试行）》报告？","a":"①10例以上的医疗机构相关感染暴发事件；②发生特殊病原体或者新发病原体的医疗机构相关感染；③可能造成重大公共影响或者严重后果的医疗机构相关感染。","key":"5例走院感12h报告，10例以上升级为突发公共卫生事件报告，阈值易混。","page":22},{"id":140,"chapter":"第3章 血液透析室（中心）感染控制标准操作规程","section":"八、医疗机构内感染和传染病上报","roles":["医生"],"level":"基础","type":"填空","q":"甲类传染病和乙类传染病中的肺炭疽、传染性非典型肺炎、脊髓灰质炎、人感染高致病性禽流感患者或疑似患者，或其他传染病和不明原因疾病暴发，应于____h内上报；其他乙、丙类传染病患者或疑似患者诊断后，____h内上报。","a":"2；24。","key":"乙类中按甲类管理的4种疾病走2h通道；透析室常见的乙肝、丙肝、梅毒、艾滋病为24h。","page":23},{"id":141,"chapter":"第3章 血液透析室（中心）感染控制标准操作规程","section":"八、医疗机构内感染和传染病上报","roles":["医生"],"level":"基础","type":"判断","q":"透析室新发乙型病毒性肝炎患者应在48h内上报。（对/错？）","a":"错。乙肝、丙肝、梅毒及艾滋病新发传染病均应在24h内上报（表3-1），并填写传染病报告表（附录七、血液净化治疗患者传染病报告表单）。","key":"四种血源性传染病新发上报时限统一为24h。","page":23},{"id":142,"chapter":"第3章 血液透析室（中心）感染控制标准操作规程","section":"七、感染控制监测","roles":["医生","护士"],"level":"进阶","type":"判断","q":"HIV感染的透析患者经抗病毒治疗HIV-RNA转阴后，可按解除隔离方案逐步转入普通透析区。（对/错？）","a":"错。根据表3-1，艾滋病患者“不能解除隔离”，也无解除隔离透析治疗方案。","key":"解除隔离只适用于乙肝、丙肝、梅毒，HIV病毒载量检测不到也不例外。","page":24},{"id":143,"chapter":"第3章 血液透析室（中心）感染控制标准操作规程","section":"九、血液透析室（中心）工作人员职业安全防护和手卫生规范","roles":["医生","护士","技师"],"level":"基础","type":"简答","q":"透析室工作人员健康管理有哪些要求？","a":"①上岗前应掌握和遵循透析室感染控制制度和规范；②建立工作人员健康档案；③定期（原则上至少1次/年）进行健康体检以及乙肝病毒、丙肝病毒、梅毒螺旋体和HIV标志物检测，并管理保存体检资料；④建议乙肝病毒易感（HBsAb阴性）的工作人员注射乙肝病毒疫苗。","key":"体检和标志物检测“原则上至少每年1次”，技师、保洁等也应纳入。","page":24},{"id":144,"chapter":"第3章 血液透析室（中心）感染控制标准操作规程","section":"九、血液透析室（中心）工作人员职业安全防护和手卫生规范","roles":["护士"],"level":"进阶","type":"简答","q":"医护人员个人防护装备的选择原则是什么？","a":"①执行可能暴露于血液、体液的操作（血管穿刺及血管通路连接与断开等）时，遵循标准预防的个人防护装备使用要求，合理选择；②处置传染病患者时，遵循《传染病防治法》和《国务院办公厅关于加强传染病防治人员安全防护的意见》（国办发〔2015〕1号），在标准预防基础上根据传播途径采取额外隔离措施，选择不同防护级别的个人防护装备。","key":"核心是“标准预防+基于传播途径的额外隔离”，而非一律最高级防护。","page":24},{"id":145,"chapter":"第3章 血液透析室（中心）感染控制标准操作规程","section":"九、血液透析室（中心）工作人员职业安全防护和手卫生规范","roles":["护士"],"level":"基础","type":"简答","q":"工作人员发生锐器伤后的紧急处理步骤是什么？","a":"依据《血源性病原体职业接触防护导则》（GBZ/T 213-2018）：①从近心端向远心端挤出伤口部位的血液，避免挤压伤口局部，尽可能挤出损伤处的血液；②用流动水冲洗（黏膜用生理盐水反复冲洗）；③用聚维酮碘（碘伏）或其他消毒液（如75%乙醇）消毒；④用防水敷料包扎伤口；⑤填写《医务人员职业暴露登记表》，上交感染防控管理部门备案。","key":"顺序是“挤—冲—消—包—报”，挤血方向为近心端向远心端，且避免挤压伤口局部。","page":25},{"id":146,"chapter":"第3章 血液透析室（中心）感染控制标准操作规程","section":"九、血液透析室（中心）工作人员职业安全防护和手卫生规范","roles":["护士"],"level":"基础","type":"判断","q":"锐器伤后应立即在伤口局部用力挤压，以尽可能挤出血液。（对/错？）","a":"错。应从近心端向远心端挤出伤口部位的血液，避免挤压伤口局部，再用流动水冲洗、消毒、包扎。","key":"局部挤压会使伤口周围组织损伤、促进病原体吸收。","page":25},{"id":147,"chapter":"第3章 血液透析室（中心）感染控制标准操作规程","section":"九、血液透析室（中心）工作人员职业安全防护和手卫生规范","roles":["护士"],"level":"基础","type":"填空","q":"锐器伤后用流动水冲洗，黏膜用____反复冲洗；然后用____或其他消毒液（如____乙醇）消毒，并用____敷料包扎伤口。","a":"生理盐水；聚维酮碘（碘伏）；75%；防水。","key":"乙醇浓度为75%；包扎须用防水敷料。","page":25},{"id":148,"chapter":"第3章 血液透析室（中心）感染控制标准操作规程","section":"九、血液透析室（中心）工作人员职业安全防护和手卫生规范","roles":["医生"],"level":"进阶","type":"简答","q":"被HBV阳性患者血液、体液污染的锐器刺伤后，应根据暴露者免疫状态如何处理？","a":"①未接种乙肝疫苗者：注射乙肝病毒免疫球蛋白和接种疫苗；②接种过疫苗并且HBsAb阳性者：无需处理；③接种过疫苗但HBsAb阴性者：注射乙肝病毒免疫球蛋白和接种疫苗；④乙肝病毒感染状况不明确：注射乙肝病毒免疫球蛋白和接种疫苗，同时检测乙肝病毒血清学标志，根据结果确认是否接种第2、3针乙肝疫苗。建议在最后一剂疫苗接种1～2个月后进行病毒抗体追踪检测。","key":"“接种过疫苗”不等于有保护，HBsAb阴性仍需免疫球蛋白+疫苗。","page":25},{"id":149,"chapter":"第3章 血液透析室（中心）感染控制标准操作规程","section":"九、血液透析室（中心）工作人员职业安全防护和手卫生规范","roles":["医生","护士"],"level":"高级","type":"案例分析","q":"护士小王为乙肝隔离区患者（HBsAg+）拔针时被内瘘穿刺针刺伤手指。小王3年前接种过乙肝疫苗，本次急查HBsAb阴性。请给出完整处理方案。","a":"①紧急处理：从近心端向远心端挤出伤口血液，避免挤压伤口局部，流动水冲洗，碘伏或75%乙醇消毒，防水敷料包扎；②填写《医务人员职业暴露登记表》上交感染防控管理部门备案；③因接种过疫苗但HBsAb阴性，应注射乙肝病毒免疫球蛋白并接种疫苗；④在最后一剂疫苗接种1～2个月后进行病毒抗体追踪检测。","key":"既往接种史不能替代当前抗体检测结果，免疫失败者必须补HBIG+疫苗。","page":25},{"id":150,"chapter":"第3章 血液透析室（中心）感染控制标准操作规程","section":"九、血液透析室（中心）工作人员职业安全防护和手卫生规范","roles":["医生","护士"],"level":"进阶","type":"简答","q":"被HCV阳性患者血液、体液污染的锐器刺伤后，是否推荐预防性用药？后续如何随访？","a":"①先按规范紧急处理伤口，填写《医务人员职业暴露登记表》上交感染防控管理部门备案；②目前不推荐采用接触后预防性药物治疗；③建议于接触4～6个月后进行丙型肝炎抗体和谷丙转氨酶（丙氨酸转氨酶）基线检测和追踪检测。","key":"HCV暴露“不推荐预防用药”，与HBV、HIV处理逻辑不同。","page":25},{"id":151,"chapter":"第3章 血液透析室（中心）感染控制标准操作规程","section":"九、血液透析室（中心）工作人员职业安全防护和手卫生规范","roles":["医生"],"level":"进阶","type":"判断","q":"被HIV阳性患者血液污染的锐器刺伤后，所有暴露者均应立即启动预防性抗病毒治疗。（对/错？）","a":"错。应有专业人员对暴露级别进行评估，根据暴露级别和病毒载量水平，咨询专业医师考虑是否进行预防性治疗。","key":"规程强调“评估暴露级别+病毒载量+咨询专业医师”，但临床上评估须尽快完成，不可拖延。","page":25},{"id":152,"chapter":"第3章 血液透析室（中心）感染控制标准操作规程","section":"九、血液透析室（中心）工作人员职业安全防护和手卫生规范","roles":["护士"],"level":"基础","type":"简答","q":"医务人员在哪些情况下应洗手和/或使用速干手消毒剂进行卫生手消毒？","a":"①接触患者前；②清洁、无菌操作前，包括进行侵入性操作前；③暴露患者体液风险后，包括接触患者黏膜、破损皮肤或伤口、血液、体液、分泌物、排泄物、伤口敷料之后；④接触患者后；⑤接触患者周围环境后，包括接触患者周围的医疗相关器械、用具等物体表面后。","key":"第⑤时刻“接触患者周围环境后”（如调整透析机）最常被遗漏。","page":25},{"id":153,"chapter":"第3章 血液透析室（中心）感染控制标准操作规程","section":"九、血液透析室（中心）工作人员职业安全防护和手卫生规范","roles":["护士"],"level":"基础","type":"判断","q":"手部有肉眼可见的血液污染时，可直接使用速干手消毒剂代替洗手。（对/错？）","a":"错。手部有血液或其他体液等肉眼可见的污染时应洗手，不可单纯使用速干手消毒剂；手部没有肉眼可见污染时，宜用速干手消毒剂进行卫生手消毒。","key":"速干手消毒剂对有机物污染无效，可见污染必须流动水洗手。","page":25},{"id":154,"chapter":"第3章 血液透析室（中心）感染控制标准操作规程","section":"九、血液透析室（中心）工作人员职业安全防护和手卫生规范","roles":["护士"],"level":"进阶","type":"简答","q":"哪些情况下应洗手，不可单纯使用速干手消毒剂进行卫生手消毒？","a":"①当手部有血液或其他体液等肉眼可见的污染；②可能接触艰难梭菌、肠道病毒等对速干手消毒剂不敏感的病原微生物。","key":"艰难梭菌芽孢、肠道病毒对醇类不敏感，透析患者腹泻时须洗手。","page":26},{"id":155,"chapter":"第3章 血液透析室（中心）感染控制标准操作规程","section":"九、血液透析室（中心）工作人员职业安全防护和手卫生规范","roles":["护士"],"level":"进阶","type":"填空","q":"接触传染病患者的血液、体液和分泌物以及被传染性病原微生物污染的物品，或直接为传染病患者进行检查、护理、治疗或处理其污物时，医务人员应先____，然后____。","a":"洗手；进行卫生手消毒。","key":"顺序是“先洗手、后卫生手消毒”，两步都不能省。","page":26},{"id":156,"chapter":"第3章 血液透析室（中心）感染控制标准操作规程","section":"九、血液透析室（中心）工作人员职业安全防护和手卫生规范","roles":["护士"],"level":"进阶","type":"简答","q":"透析室工作人员在哪些操作时应戴清洁手套？哪些操作应戴无菌手套？","a":"清洁手套：①接触透析单元内可能被污染的物体表面时；②注射药物、抽血、处理血标本、处理插管及通路部位、处理或清洗透析机等操作时；③进入不同治疗单元、清洗不同机器时应洗手或卫生手消毒并更换清洁手套；④处理医疗废物时；⑤复用透析器时。无菌手套：进行深静脉插管、拔管和连接血管通路以及移植物内瘘穿刺时。","key":"移植物内瘘穿刺和导管连接用“无菌手套”，与自体内瘘常规穿刺区分。","page":26},{"id":157,"chapter":"第3章 血液透析室（中心）感染控制标准操作规程","section":"九、血液透析室（中心）工作人员职业安全防护和手卫生规范","roles":["护士"],"level":"进阶","type":"简答","q":"透析室工作人员在哪些情况下不应戴手套？","a":"①透析前准备（透析机检测、安装及冲洗管路和透析器）；②测量患者血压等体检操作；③离开透析单元时，应脱下手套，并洗手或卫生手消毒；④配制各种药品；⑤接触医疗文件；⑥接触门把手、电脑、键盘、电话等公用物品；⑦接触手机等个人用品。","key":"“安装管路不戴手套”“配药不戴手套”与直觉相反，是考核高频点。","page":26},{"id":158,"chapter":"第3章 血液透析室（中心）感染控制标准操作规程","section":"九、血液透析室（中心）工作人员职业安全防护和手卫生规范","roles":["护士"],"level":"进阶","type":"案例分析","q":"护士戴手套为5床患者连接内瘘通路后，未脱手套即到护士站录入电脑、接听电话，随后直接去6床调整透析机参数。请指出存在的问题。","a":"①离开透析单元时应脱下手套，并进行洗手或卫生手消毒；②接触电脑、键盘、电话等公用物品时不应戴手套；③进入不同治疗单元前应洗手或卫生手消毒，并更换清洁手套；④戴手套不能代替手卫生，脱手套后应进行手卫生。","key":"“一副手套走全场”是透析室血源性病原体传播的主要途径。","page":26},{"id":159,"chapter":"第3章 血液透析室（中心）感染控制标准操作规程","section":"九、血液透析室（中心）工作人员职业安全防护和手卫生规范","roles":["护士"],"level":"基础","type":"判断","q":"操作时只要全程佩戴手套，就可以免去戴手套前和脱手套后的手卫生。（对/错？）","a":"错。戴手套不能代替手卫生，戴手套前和脱手套后应进行手卫生。","key":"手套存在微孔和脱卸污染，脱手套后手卫生不可省。","page":26},{"id":160,"chapter":"第3章 血液透析室（中心）感染控制标准操作规程","section":"十、血液透析室（中心）高传染性呼吸道传染病防控管理规范","roles":["医生"],"level":"进阶","type":"简答","q":"高传染性呼吸道传染病防控中，定点血液透析治疗医院的设置及转诊对象是什么？","a":"①建议各级卫生健康行政部门依据本地区维持性血液透析患者数量及呼吸道传染病流行情况，指定设置定点血液透析治疗医院，主要收治传染性结核以及合并流行性、传染性较强的呼吸道传染病的透析患者；②定点医院应具备呼吸道传染病的医疗服务能力，其透析室应具备防控设施；③合并传染性结核或确诊高传染性呼吸道传染病的在透或拟导入透析患者，应转入定点血液透析治疗医院治疗。","key":"传染性结核同样属于定点医院收治范围，不能留在普通透析室。","page":27},{"id":161,"chapter":"第3章 血液透析室（中心）感染控制标准操作规程","section":"十、血液透析室（中心）高传染性呼吸道传染病防控管理规范","roles":["医生"],"level":"高级","type":"案例分析","q":"在透患者孙某发热、咳嗽，流行病学史阳性，疑似高传染性呼吸道传染病，尚未确诊；血钾6.8mmol/L伴心电图改变。应如何安排？","a":"①疑似患者应收入院单人隔离治疗；②住院期间迅速完善相关检测和检查，尽快明确诊断；③该患者存在紧急血液透析适应证，可采用床旁肾脏替代治疗，而非进入血液透析室；④若无紧急透析适应证，可延缓血液透析；⑤确诊后应转入定点血液透析治疗医院。","key":"疑似者“单人隔离+床旁治疗”，严禁为赶透析而送入公共透析室。","page":27},{"id":162,"chapter":"第3章 血液透析室（中心）感染控制标准操作规程","section":"十、血液透析室（中心）高传染性呼吸道传染病防控管理规范","roles":["医生"],"level":"进阶","type":"简答","q":"处于高传染性呼吸道传染病隔离观察期的患者如何安排透析？","a":"①建议集中在指定机构进行隔离观察和床旁肾脏替代治疗；②拟导入透析的患者无紧急透析适应证，可延缓至隔离观察期结束后再导入；存在紧急适应证的可先在隔离区进行床旁肾脏替代治疗；③符合标准出院后需进一步隔离观察的患者，建议继续在定点医院透析，完成隔离观察。","key":"出院后仍在观察期的患者应留在定点医院完成观察，不宜直接回原透析中心。","page":27},{"id":163,"chapter":"第3章 血液透析室（中心）感染控制标准操作规程","section":"十、血液透析室（中心）高传染性呼吸道传染病防控管理规范","roles":["医生"],"level":"进阶","type":"简答","q":"高传染性呼吸道传染病疫期内，拟导入透析治疗的患者首选何种透析方式？存在禁忌证时如何处理？","a":"①建议优先选择腹膜透析治疗；②存在腹膜透析禁忌证的患者，按规程规定方式进行血液透析导入：疑似患者收入院单人隔离，有紧急透析适应证者可采用床旁肾脏替代治疗；隔离观察期患者无紧急适应证可延缓至观察期结束后再导入，有紧急适应证者先在隔离区床旁肾脏替代治疗。","key":"居家腹透可减少往返医院和聚集，是疫期导入的首选。","page":27},{"id":164,"chapter":"第3章 血液透析室（中心）感染控制标准操作规程","section":"十、血液透析室（中心）高传染性呼吸道传染病防控管理规范","roles":["技师","护士"],"level":"高级","type":"简答","q":"高传染性呼吸道传染病防控对透析室通风及空调新风系统有何要求？","a":"①建议透析室具备自然通风条件；②使用新风系统装置的，疫期内应加强清洁消毒，增加换气频率；③发生疑似或确诊病例后，应立即关闭空调通风系统，采取清洗、消毒措施，经检测合格后方可重新运行。","key":"出现病例后须“先关闭、再清洗消毒、检测合格才重启”，不能仅消毒后直接继续运行。","page":27},{"id":165,"chapter":"第3章 血液透析室（中心）感染控制标准操作规程","section":"十、血液透析室（中心）高传染性呼吸道传染病防控管理规范","roles":["医生","护士"],"level":"进阶","type":"简答","q":"高传染性呼吸道传染病疫期内，透析室应补充执行哪些规章制度？","a":"①每日排查报告制度；②工作人员每日报告制度；③风险教育和感控培训制度；④家属/陪护的培训宣教制度；⑤患者和家属签署疫情防控知情同意书（承诺如实告知透析间期移动轨迹、接触史及症状，配合排查，杜绝隐瞒不报）。","key":"疫情防控知情同意书要求“患者和家属”都签，并承诺如实告知轨迹与接触史。","page":28},{"id":166,"chapter":"第3章 血液透析室（中心）感染控制标准操作规程","section":"十、血液透析室（中心）高传染性呼吸道传染病防控管理规范","roles":["医生","护士","技师"],"level":"进阶","type":"填空","q":"疫期内透析室全部工作人员每日需报告个人去向及____次体温监测数据（上午、下午各1次）；出现呼吸道传染病确诊和疑似病例的透析患者，应立即上报所在医疗机构，并____上报所在省级肾病学/血液净化质控中心。","a":"2；当日。","key":"“全部工作人员”包括保洁员、外送员；质控中心为“当日”上报。","page":28},{"id":167,"chapter":"第3章 血液透析室（中心）感染控制标准操作规程","section":"十、血液透析室（中心）高传染性呼吸道传染病防控管理规范","roles":["护士"],"level":"基础","type":"简答","q":"疫期内预检分诊护士的防护要求和岗位职责是什么？","a":"防护：正确佩戴合适的口罩、护目镜/防护面罩、戴乳胶手套，建议穿防护服。职责：①测量并记录患者体温；②调查并记录患者及其家属透析间期移动轨迹，与疫区人员及确诊、疑似患者及隔离观察者的接触史；③询问透析间期有无乏力、咳嗽、咳痰、鼻塞、流涕、咽痛及呼吸困难等症状；④对体温≥37.3℃、可疑感染患者护送至发热门诊。","key":"流调对象包括“患者及其家属”，发热阈值为37.3℃。","page":28},{"id":168,"chapter":"第3章 血液透析室（中心）感染控制标准操作规程","section":"十、血液透析室（中心）高传染性呼吸道传染病防控管理规范","roles":["护士"],"level":"基础","type":"简答","q":"疫期内对透析患者及其家属/陪护人员有哪些管理要求？","a":"患者：①在透析室期间佩戴合适的口罩；②进出透析室前后洗手；③透析期间不进食；④透析前后测量体温，并在透析治疗单中记录。家属及陪护：疫情防控期内禁止进入透析室，由护士或辅助护理人员协助患者更衣及在透析室内移动。","key":"疫期“透析期间不进食”以避免摘口罩，常被患者质疑，需做好宣教。","page":29},{"id":169,"chapter":"第3章 血液透析室（中心）感染控制标准操作规程","section":"十、血液透析室（中心）高传染性呼吸道传染病防控管理规范","roles":["护士"],"level":"进阶","type":"填空","q":"疫期每班次治疗后开窗通风____min；机器、床、餐桌等物体表面和地面采用____mg/L含氯消毒剂彻底擦拭消毒；如有患者血迹、排泄物、分泌物、呕吐物等污染，先用吸湿材料去除可见污染，再用____mg/L含氯消毒剂擦拭消毒。","a":"30；500；1000。","key":"疫期污染物处理浓度为1000mg/L，与第五节常规血液污染的2000mg/L两步法属不同条款，切勿混用。","page":29},{"id":170,"chapter":"第3章 血液透析室（中心）感染控制标准操作规程","section":"十、血液透析室（中心）高传染性呼吸道传染病防控管理规范","roles":["护士"],"level":"高级","type":"案例分析","q":"疫期内某患者透析中突然呕吐，呕吐物污染床旁地面和餐桌；当班护士使用接触式体温计为下一位患者测温。请写出规范处理。","a":"①先用纸巾等吸湿材料去除可见的污染，再用1000mg/L含氯消毒剂擦拭消毒机器、床、餐桌及地面，并做好记录；②环境物表和地面消毒按《医疗机构消毒技术规范》（WS/T 367-2012）执行；③推荐使用非接触式体温仪排查，如为接触式应一用一消毒；④医疗废物分类、标识、密闭运送并登记；⑤每班次治疗后开窗通风30min，每日结束后用紫外线照射或符合要求的方式消毒并记录。","key":"接触式体温计“一用一消毒”常被忽视；先去除可见污染再消毒的顺序不能颠倒。","page":29},{"id":171,"chapter":"第4章 血液透析室（中心）管理规范","section":"一、候诊区和接诊室管理规范","roles":["护士"],"level":"基础","type":"简答","q":"候诊区和接诊室的功能是什么？其秩序管理有哪些要求？","a":"功能：患者等候区域，也是称量体重、分配透析单元、评估生命体征、制订治疗方案及开取处方和化验单的工作区域。要求：①教育患者遵守透析室规章制度，配合医护工作；②保持透析等候区、更衣室安静和整洁；③等候区地面清洁、防湿滑，不得摆放杂物，避免患者跌绊；④设置清晰的挂号、就诊、收费、取药、化验和辅助检查等诊治流程提示板；⑤人群集中高峰时段安排专人疏导和管理。","key":"透析患者跌倒风险高，“防湿滑、无杂物”是候诊区安全重点。","page":30},{"id":172,"chapter":"第4章 血液透析室（中心）管理规范","section":"二、血液透析治疗准备室管理规范","roles":["护士"],"level":"基础","type":"简答","q":"血液透析治疗准备室的功能定位和设置管理要求是什么？","a":"①是放置各种药物和无菌物品的清洁区域，设置在透析室清洁区；②每班次应设置专职护士进行相关操作；③进出人员应由透析中心管理人员授权，封闭管理；④非传染病和传染病患者应分区，宜设置传染病患者专用治疗准备室；⑤应达到《医院消毒卫生标准》（GB 15982-2012）Ⅲ类环境。","key":"准备室需“授权、封闭管理”，非授权人员（含患者家属）不得进入。","page":30},{"id":173,"chapter":"第4章 血液透析室（中心）管理规范","section":"二、血液透析治疗准备室管理规范","roles":["护士"],"level":"进阶","type":"简答","q":"治疗准备室的药品与冰箱管理要求有哪些？","a":"①各种药品标识明确，独立存放，毒麻药双人双锁专人管理；②静脉用、口服用、外用药物及一次性医疗物品标识明确并分类存放，按有效期顺序放置；③根据药物特性放入冰箱或药柜保存，按时间顺序分类放置；④定期检查药品有效期，过期药品及时更换；⑤冰箱应使用冰箱温度表持续监测，保持清洁，物品分类摆放整齐。","key":"毒麻药“双人双锁专人管理”，冰箱温度须“持续”监测。","page":30},{"id":174,"chapter":"第4章 血液透析室（中心）管理规范","section":"二、血液透析治疗准备室管理规范","roles":["护士"],"level":"基础","type":"判断","q":"为便于配药后及时处理废弃物，治疗准备室内可放置医疗废物桶。（对/错？）","a":"错。治疗准备室生活垃圾桶加盖，垃圾产生后随时清理；不得放置医疗废物桶。此外，进入透析治疗区域的物品不得再次进入治疗准备室。","key":"准备室是清洁区，医疗废物桶会造成污染源进入。","page":31},{"id":175,"chapter":"第4章 血液透析室（中心）管理规范","section":"二、血液透析治疗准备室管理规范","roles":["护士"],"level":"进阶","type":"简答","q":"在治疗准备室进行药品准备和配制时，应遵循哪些操作要求？","a":"药品准备：①衣帽整洁、戴口罩，严格执行无菌操作原则；②每次配药前先对治疗台面清洁消毒擦拭；③根据医嘱核对药名剂量，检查有效期、有无破损变色渗漏沉淀等；④摆药、配药后产生的垃圾及时分类处理；⑤每班清点药物。药品配制：①操作台上多种药物时使用阻隔措施；②遵循一药一具，不得交叉使用；③静脉药物现用现配。","key":"“一药一具”与“多种药物时使用阻隔措施”是防止交叉污染的关键，常被忽略。","page":31},{"id":176,"chapter":"第4章 血液透析室（中心）管理规范","section":"二、血液透析治疗准备室管理规范","roles":["护士"],"level":"基础","type":"填空","q":"配制好的药品应注明____、____、____及____，放置在专用无菌治疗盘内备用，根据说明书要求存放，不能超过____h。","a":"患者姓名；药品名称；剂量；配制时间；2。","key":"“2h”时限从配制时间起算，标签缺配制时间即无法判定，属不合格。","page":31},{"id":177,"chapter":"第4章 血液透析室（中心）管理规范","section":"二、血液透析治疗准备室管理规范","roles":["护士"],"level":"高级","type":"案例分析","q":"早班护士6:30在治疗准备室为全天患者集中配好肝素盐水，标签仅写“肝素”，9:30第二批患者上机时拟继续使用。请指出问题。","a":"①配制好的药品存放不能超过2h，6:30配制至9:30已超时，不得使用；②静脉药物应现用现配，并针对每位患者分别配制，不能批量集中配制；③标签应注明患者姓名、药品名称、剂量及配制时间；④药品配制前后应二人查对并签名，使用前再次查对。","key":"批量预配肝素盐水既违反时限又违反“每位患者分别配制”，是典型检查扣分点。","page":31},{"id":178,"chapter":"第4章 血液透析室（中心）管理规范","section":"二、血液透析治疗准备室管理规范","roles":["护士"],"level":"进阶","type":"判断","q":"治疗车、托盘等可复用物品接触过患者后，只要外观无可见污染，即可直接推回治疗准备室使用。（对/错？）","a":"错。所有接触过患者的一次性使用物品直接丢弃；所有接触过患者的可复用物品如治疗车、托盘、仪器等必须经过清洁、消毒后才可再次进入治疗准备室。","key":"“外观干净”不等于无污染，治疗车回流是准备室污染的重要途径。","page":31},{"id":179,"chapter":"第4章 血液透析室（中心）管理规范","section":"二、血液透析治疗准备室管理规范","roles":["护士"],"level":"进阶","type":"填空","q":"药品配制前后应____人查对并签名，药品使用前应____进行查对；各种一次性医疗物品应遵循一人、一穿刺针、一____和一次性废弃原则。","a":"二；再次；注射器。","key":"“配前、配后、用前”三次查对，配制环节须二人签名。","page":31},{"id":180,"chapter":"第4章 血液透析室（中心）管理规范","section":"三、血液透析治疗室/区管理规范","roles":["护士"],"level":"基础","type":"简答","q":"透析治疗室/区在物品放置方面有哪些禁止性规定？","a":"①禁止摆放鲜花、带土植物及水生植物水族箱，不得存放工作人员生活用品；②不能存放非本班次、未使用的透析耗材、浓缩液及消毒用品；③医疗物品与患者生活物品不得混放；④一个透析单元不能同时放置多个患者的治疗用品。","key":"“非本班次耗材”不得提前堆放在治疗区，常被为图方便而违规。","page":32},{"id":181,"chapter":"第4章 血液透析室（中心）管理规范","section":"三、血液透析治疗室/区管理规范","roles":["护士"],"level":"基础","type":"填空","q":"打开的透析用医疗物品应封闭保存，注明____，有效期____h。","a":"开包时间；4。","key":"开包物品4h有效期与配制药品2h时限不同，勿混淆。","page":32},{"id":182,"chapter":"第4章 血液透析室（中心）管理规范","section":"三、血液透析治疗室/区管理规范","roles":["护士"],"level":"进阶","type":"判断","q":"为节省时间，透析机开机、管路安装及预冲期间，患者可提前进入透析治疗区上床等候。（对/错？）","a":"错。透析机开机、透析管路安装及预冲期间，患者及其照护人员不能进入透析治疗室/区。","key":"预冲期间人员走动增加管路污染风险，患者须在候诊区等待。","page":32},{"id":183,"chapter":"第4章 血液透析室（中心）管理规范","section":"三、血液透析治疗室/区管理规范","roles":["护士"],"level":"进阶","type":"简答","q":"透析治疗区公用医疗器械、氧疗用品及急救器械应如何消毒管理？","a":"①监护仪、除颤器、输液泵、理疗仪等公用医疗器械一人一用一消毒；②一次性使用氧气湿化瓶和氧气管专人专用，一次性使用；③复用氧气湿化瓶一人一用一消毒；④急救车内喉镜、开口器、舌钳、重复使用简易呼吸气囊等用后送消毒供应中心集中清洗消毒，避污保存；⑤每次治疗结束对透析机表面清洁消毒并记录，机器表面不得有胶迹、血渍、污渍等。","key":"急救器械须送消毒供应中心集中处理，不能在科室自行浸泡了事。","page":32},{"id":184,"chapter":"第4章 血液透析室（中心）管理规范","section":"三、血液透析治疗室/区管理规范","roles":["护士"],"level":"高级","type":"案例分析","q":"质控检查发现：3床透析单元同时放着本班患者和下一班患者的透析器与穿刺包；一护士戴着手套推治疗车经过走廊；透析机侧面残留胶布痕迹。请逐条指出问题并纠正。","a":"①一个透析单元不能同时放置多个患者的治疗用品，下一班用品不得提前放置，且治疗区不能存放非本班次未使用耗材；②实施有创操作时正确使用个人防护用具，禁止在非操作区域戴手套；③每次治疗结束对透析机表面清洁消毒并做好记录，机器表面不得有胶迹、血渍、污渍等。","key":"“非操作区域戴手套”既污染环境又违反手卫生，是现场检查最常见问题。","page":32},{"id":185,"chapter":"第4章 血液透析室（中心）管理规范","section":"四、水处理间与配液间管理规范","roles":["技师"],"level":"基础","type":"简答","q":"水处理间与配液间的管理规范有哪些？","a":"①授权封闭管理；②保持地面清洁、干燥，不得堆放杂物；③使用过的透析液桶、消毒液桶等放置在专门存放区，不能与未使用桶装液体混放；④各种水质监测工具应独立存放，保存完好，效期、功能状态正常；⑤透析浓缩液配制前，对透析干粉进行二人查对，现用现配；⑥应达到《医院消毒卫生标准》（GB 15982-2012）Ⅲ类环境。","key":"已用桶与未用桶混放易导致错用消毒液桶配液，是严重安全隐患。","page":32},{"id":186,"chapter":"第4章 血液透析室（中心）管理规范","section":"五、污物处理室管理规范","roles":["护士"],"level":"基础","type":"简答","q":"透析室医疗废弃物的处理原则及分类放置要求是什么？","a":"原则：第一时间、现场（透析治疗区）分类处理，封闭包装，封闭转运，严禁渗漏和遗撒，严禁锐器、生活与医疗废物混放。具体：①透析穿刺针、注射针头等使用后即刻放置专用锐器盒；②治疗结束后尽快将透析器膜内、膜外及管路内液体通过污水管道密闭排放；③透析器、管路及注射器、护理包、棉签、手套等放于黄色医疗废物袋；④生活废弃物一律放置黑色垃圾袋。","key":"透析器和管路内液体须先经污水管道“密闭排放”再装袋，避免运输中渗漏。","page":33},{"id":187,"chapter":"第4章 血液透析室（中心）管理规范","section":"五、污物处理室管理规范","roles":["护士"],"level":"基础","type":"填空","q":"污物处理室各种医疗、生活废弃物密闭存放，存放时间不能超过____h；污物间台面、地面、门把手和保洁车等，每天用含氯消毒剂（____mg/L）或国家许可物表消毒用品进行消毒。","a":"24；500。","key":"污物间消毒是“每天”，对象包括门把手和保洁车。","page":33},{"id":188,"chapter":"第4章 血液透析室（中心）管理规范","section":"五、污物处理室管理规范","roles":["护士"],"level":"进阶","type":"判断","q":"透析结束后，可将未排空液体的透析器和管路直接装入黄色医疗废物袋封口转运。（对/错？）","a":"错。治疗结束后应尽快将透析器膜内、膜外及管路内液体通过污水管道密闭排放，再将透析器、管路放入黄色医疗废物袋，严禁渗漏和遗撒。","key":"带液装袋是转运渗漏的主要原因。","page":33},{"id":189,"chapter":"第4章 血液透析室（中心）管理规范","section":"六、洁具间管理规范","roles":["护士"],"level":"进阶","type":"简答","q":"洁具间的管理规范有哪些？","a":"①保持干净整齐，通风良好，无异味；②消毒剂应现用现配，监测有效浓度，记录详实；③清洁用具分区使用，各区域清洁用具分开放置，并在清洁用具上做清晰标识；④配置清洁区与污染区（含潜在感染风险区域）分开、普通区与隔离区分开的水池和拖布清洗池；⑤各区域清洁工具分别冲洗、消毒，分开干燥存放。","key":"水池/拖布池需按“清洁区与污染区、普通区与隔离区”双重分开设置，常被合并使用。","page":33},{"id":190,"chapter":"第4章 血液透析室（中心）管理规范","section":"六、洁具间管理规范","roles":["护士"],"level":"高级","type":"案例分析","q":"保洁员用同一把拖布先拖乙肝隔离区地面，再拖普通透析区；拖布在同一水池清洗，消毒液是前一天配好的。作为护士长应如何整改？","a":"①清洁用具应分区使用，各区域清洁用具分开放置并清晰标识，隔离区与普通区拖布不得混用；②配置清洁区与污染区分开、普通区与隔离区分开的水池和拖布清洗池，各区域工具分别冲洗、消毒，分开干燥存放；③消毒剂应现用现配，监测有效浓度，记录详实；④对保洁员进行培训，并将其纳入感控培训考核。","key":"保洁环节常是隔离区病原体外溢的“隐形通道”，护士长应把保洁纳入感控管理。","page":33},{"id":191,"chapter":"第5章 透析用水处理设备及透析用水质量控制","section":"章首（水处理设备定义）","roles":["技师"],"level":"基础","type":"简答","q":"按规程定义，血液透析用水处理设备包括哪些范围和组成部分？","a":"①范围：从市政（含自取）饮用水源进入水处理设备的连接点，到设备所生产水的使用点之间的所有装置、管路及配件（或配套设备）；②组成：电气系统、水净化系统（前处理、反渗透机）、存储与输送系统及消毒系统等；③血液透析室（中心）必须进行相应保养、维修、消毒、更新、检测，并进行相应记录。","key":"终点是“使用点”，供水管路及输送系统同样属于水处理设备管理范围，不能只管主机。","page":35},{"id":192,"chapter":"第5章 透析用水处理设备及透析用水质量控制","section":"一、透析用水处理设备管理人员要求","roles":["技师"],"level":"基础","type":"简答","q":"透析用水处理设备的工程师/技师应具备哪些能力与要求？","a":"①具有相关资质，负责设备运行、维护与管理；②具备较好的电气基本原理与操作技能；③熟知水处理设备与水质量控制管理规范，掌握透析用水质量控制方法；④熟练掌握设备工作原理、维护及应急使用方案；⑤参与相关专业知识与技能培训，每年应获得一定数量的培训学分。","key":"“应急使用方案”与“每年培训学分”是考核易漏项。","page":35},{"id":193,"chapter":"第5章 透析用水处理设备及透析用水质量控制","section":"二、透析用水处理设备的基本要求","roles":["技师"],"level":"基础","type":"填空","q":"透析用水中的细菌总数≤____CFU/ml，＞____CFU/ml 应给予干预；内毒素含量≤____EU/ml，＞____EU/ml 应给予干预。","a":"100；50；0.25；0.125。","key":"最大允许值与干预值不要混淆，干预值为最大允许值的50%。","page":35},{"id":194,"chapter":"第5章 透析用水处理设备及透析用水质量控制","section":"二、透析用水处理设备的基本要求","roles":["技师"],"level":"基础","type":"简答","q":"透析用水处理设备的基本要求有哪些？产水须符合哪项标准？","a":"①应具有国家药品监督管理局颁发的注册证、生产许可证等；②产水水质必须符合并达到透析用水国家行业标准《血液透析及相关治疗用水》（YY 0572-2015）的要求，包括生物污染物标准和化学污染物标准（表5-1）。","key":"标准编号YY 0572-2015需准确记忆，常与浓缩物标准YY 0598-2015混淆。","page":35},{"id":195,"chapter":"第5章 透析用水处理设备及透析用水质量控制","section":"二、透析用水处理设备的基本要求","roles":["技师"],"level":"基础","type":"填空","q":"按表5-1，透析用水中铝的最高允许浓度为____mg/L，总氯为____mg/L，铅为____mg/L。","a":"0.01；0.1；0.005。","key":"铝是透析脑病相关重要指标，限值0.01mg/L极低。","page":36},{"id":196,"chapter":"第5章 透析用水处理设备及透析用水质量控制","section":"二、透析用水处理设备的基本要求","roles":["技师"],"level":"进阶","type":"填空","q":"按表5-1，透析用水中钙最高允许浓度为____mg/L（____mmol/L），镁为4mg/L（0.15mmol/L），钾为8mg/L（0.2mmol/L），钠为____mg/L（____mmol/L）。","a":"2；0.05；70；3.0。","key":"钙、钠的mg/L与mmol/L双单位都要掌握，钙2mg/L对应0.05mmol/L。","page":36},{"id":197,"chapter":"第5章 透析用水处理设备及透析用水质量控制","section":"二、透析用水处理设备的基本要求","roles":["技师"],"level":"进阶","type":"判断","q":"透析用水中氟化物的最高允许浓度为2mg/L。（对/错？）","a":"错。氟化物最高允许浓度为0.2mg/L；2mg/L是硝酸盐（氮）的限值。","key":"氟化物0.2与硝酸盐（氮）2极易互换混淆。","page":36},{"id":198,"chapter":"第5章 透析用水处理设备及透析用水质量控制","section":"二、透析用水处理设备的基本要求","roles":["技师"],"level":"高级","type":"简答","q":"请写出表5-1中砷、镉、汞、铬、铊、铍、硫酸盐的最高允许浓度（mg/L）。","a":"①砷0.005；②镉0.001；③汞0.0002；④铬0.014；⑤铊0.002；⑥铍0.0004；⑦硫酸盐100。（另：铜0.1、锌0.1、钡0.1、硒0.09、银0.005、锑0.006、硝酸盐（氮）2）","key":"汞0.0002为表中最低限值，铍0.0004次之；硫酸盐100为最高。","page":36},{"id":199,"chapter":"第5章 透析用水处理设备及透析用水质量控制","section":"三、透析用水处理设备与管理规范（一）软水器出水硬度的监测","roles":["技师"],"level":"基础","type":"简答","q":"树脂罐（软水器）出水硬度的监测频率、合格标准和监测方法是什么？","a":"①频率：每天1次；②标准：出水硬度推荐＜1GPG（或17.1mg/L）；③方法：建议每天透析治疗前检测，在水处理设备运转状态下打开树脂罐出水取样阀，放水至少60s后采集样本测定，并记录结果。","key":"必须在设备运转状态下取样，并放水至少60s，停机静置时取样会失真。","page":36},{"id":200,"chapter":"第5章 透析用水处理设备及透析用水质量控制","section":"三、透析用水处理设备与管理规范（一）软水器出水硬度的监测","roles":["技师"],"level":"基础","type":"填空","q":"树脂罐（软水器）的出水硬度推荐＜____GPG（或____mg/L）。","a":"1；17.1。","key":"1GPG=17.1mg/L，单位换算常考。","page":36},{"id":201,"chapter":"第5章 透析用水处理设备及透析用水质量控制","section":"三、透析用水处理设备与管理规范（一）软水器出水硬度的监测","roles":["技师"],"level":"基础","type":"判断","q":"检测软水器出水硬度时，打开取样阀放水约15s即可采样。（对/错？）","a":"错。应在水处理设备运转状态下打开树脂罐出水取样阀，放水至少60s后采样。15min是活性炭罐总氯检测前设备运转时间。","key":"硬度取样“放水60s”与总氯“设备运转15min”不要混淆。","page":36},{"id":202,"chapter":"第5章 透析用水处理设备及透析用水质量控制","section":"二、透析用水处理设备的基本要求","roles":["技师"],"level":"进阶","type":"案例分析","q":"某中心月度透析用水细菌培养结果为80CFU/ml，季度内毒素0.10EU/ml。技师认为“均未超标，无需处理”。请评价并给出处理。","a":"①细菌80CFU/ml虽≤100CFU/ml最大允许值，但已＞50CFU/ml干预值，应给予干预；②内毒素0.10EU/ml≤0.125EU/ml，未达干预水平；③按规程，细菌数＞50CFU/ml时应进行水处理系统完整消毒（主动性干预处理，按说明书选热消毒或化学消毒）；④消毒后复检确认达标并记录，排查反渗透膜密封件泄漏、膜破损等原因。","key":"“合格≠无需干预”，超过干预值即须启动系统消毒，这是质控考核高频点。","page":37},{"id":203,"chapter":"第5章 透析用水处理设备及透析用水质量控制","section":"三、透析用水处理设备与管理规范（一）软水器出水硬度的监测","roles":["技师"],"level":"进阶","type":"简答","q":"树脂罐（软水器）出水硬度超标的常见原因及处理方法有哪些？","a":"①再生周期过长或再生水流量过大：根据软水控制器控制方式调整再生周期或再生制水量；②盐水未饱和、吸盐水量不足：保证盐桶有足够饱和盐水，检查吸盐管路，进行手动再生；③控制头故障、再生未正常进行：检查控制头设定，观察动作状态，维修或更换控制头；④控制头或中心管密封泄漏：检查更换密封件；⑤树脂罐偏流、树脂丢失：加强再生反向冲洗，更换或补充树脂。","key":"最常见原因是盐箱缺盐/吸盐不良，处理后须手动再生再复测。","page":37},{"id":204,"chapter":"第5章 透析用水处理设备及透析用水质量控制","section":"三、透析用水处理设备与管理规范（一）软水器出水硬度的监测","roles":["技师"],"level":"进阶","type":"案例分析","q":"晨间检测软水器出水硬度为1.5GPG，巡视发现盐箱内已看不到未溶解的盐。请分析原因并给出处理步骤。","a":"①硬度超过推荐值＜1GPG（17.1mg/L），判定超标；②盐箱内未持续可见未溶解盐，说明盐量不足、盐水未饱和，吸盐水量不足导致再生不良；③处理：及时加盐保证盐箱有足够饱和盐水，检查吸盐管路，进行手动再生；④检查控制头设定与再生动作、密封件；⑤再生后复测硬度达标并记录加盐量和再生情况。","key":"盐充足标准是“盐箱内持续可见未溶解盐”，看不到未溶解盐即应补盐。","page":37},{"id":205,"chapter":"第5章 透析用水处理设备及透析用水质量控制","section":"三、透析用水处理设备与管理规范（二）活性炭罐出水总氯的监测","roles":["技师"],"level":"基础","type":"简答","q":"活性炭罐出水总氯的监测频率、合格标准和监测方法是什么？","a":"①频率：每天1次；②标准：总氯含量≤0.1mg/L；③方法：每天开始透析治疗前，透析用水处理设备运转至少15min后开启活性炭罐出水取样阀，取样测定并记录。","key":"必须“运转至少15min后”取样，开机即测会出现假阴性/假阳性。","page":37},{"id":206,"chapter":"第5章 透析用水处理设备及透析用水质量控制","section":"三、透析用水处理设备与管理规范（二）活性炭罐出水总氯的监测","roles":["技师","护士"],"level":"基础","type":"判断","q":"活性炭罐出水总氯＞0.1mg/L时，可先完成当天透析治疗，结束后再处理。（对/错？）","a":"错。总氯＞0.1mg/L时应立即停止该水处理设备供水，查找并处理相关原因。","key":"总氯超标是“立即停止供水”的红线，氯胺可致溶血。","page":37},{"id":207,"chapter":"第5章 透析用水处理设备及透析用水质量控制","section":"三、透析用水处理设备与管理规范（二）活性炭罐出水总氯的监测","roles":["技师"],"level":"进阶","type":"简答","q":"活性炭罐出水总氯超标的常见原因及处理方法有哪些？","a":"①反向冲洗周期过长：调整反向冲洗周期；②用水量增加、活性炭充填量不足：补充活性炭；③控制头故障或设定错误：检查设定、观察动作状态，维修或更换控制头；④控制头或中心管密封泄漏：检查并更换密封件；⑤活性炭被包裹或丢失：加强反向冲洗，更换或补充活性炭。","key":"用水量增加（增加透析机位）时，活性炭充填量不足是常被忽视的原因。","page":37},{"id":208,"chapter":"第5章 透析用水处理设备及透析用水质量控制","section":"三、透析用水处理设备与管理规范（二）活性炭罐出水总氯的监测","roles":["技师","护士"],"level":"高级","type":"案例分析","q":"某日07:00开机运转20min后检测活性炭罐出水总氯为0.15mg/L，此时已有患者准备上机。作为值班技师应如何处置？","a":"①0.15mg/L＞0.1mg/L，判定超标，应立即停止该水处理设备供水，通知医护暂停上机；②查找原因：反向冲洗周期是否过长、活性炭充填量是否不足（用水量增加）、控制头故障或设定错误、控制头或中心管密封泄漏、活性炭被包裹或丢失；③对应处理：调整反洗周期、补充活性炭、维修/更换控制头、更换密封件、加强反冲洗或更换活性炭；④复测总氯≤0.1mg/L后方可恢复供水；⑤记录检测结果与处理过程。","key":"不能“边透析边处理”；先停供水再排查，复测达标才可恢复。","page":37},{"id":209,"chapter":"第5章 透析用水处理设备及透析用水质量控制","section":"三、透析用水处理设备与管理规范（三）透析用水的生物污染物监测","roles":["技师"],"level":"基础","type":"填空","q":"透析用水细菌培养应至少每____1次；内毒素检测至少每____1次。","a":"月；3个月。","key":"透析用水与透析液的细菌（每月）、内毒素（每3个月）频率相同，但透析液还要求每次至少2台机。","page":37},{"id":210,"chapter":"第5章 透析用水处理设备及透析用水质量控制","section":"三、透析用水处理设备与管理规范（三）透析用水的生物污染物监测","roles":["技师","护士"],"level":"进阶","type":"简答","q":"透析用水生物污染物检测的取样方法有哪些要求？","a":"①取样点至少应包括供水回路的末端；②样本取样口保持开启并放水至少60s；③对取样口消毒：可使用75%乙醇擦拭出水口外表面3次；④待乙醇完全挥发后方可采样；⑤不能使用其他消毒剂。","key":"“乙醇完全挥发后采样”和“不能用其他消毒剂”最易出错，残留消毒剂会造成假阴性。","page":37},{"id":211,"chapter":"第5章 透析用水处理设备及透析用水质量控制","section":"三、透析用水处理设备与管理规范（三）透析用水的生物污染物监测","roles":["技师","护士"],"level":"进阶","type":"判断","q":"透析用水细菌培养采样前，可用含氯消毒剂擦拭取样口外表面以确保无菌。（对/错？）","a":"错。应使用75%乙醇擦拭出水口外表面3次，待乙醇完全挥发后采样，不能使用其他消毒剂。","key":"含氯等其他消毒剂残留会抑菌导致假阴性。","page":37},{"id":212,"chapter":"第5章 透析用水处理设备及透析用水质量控制","section":"三、透析用水处理设备与管理规范（三）透析用水的生物污染物监测","roles":["技师"],"level":"进阶","type":"简答","q":"透析用水生物污染物超标的常见问题及处理方法有哪些？","a":"①未进行有效消毒：细菌数＞50CFU/ml或内毒素＞0.125EU/ml时，应进行水处理系统完整消毒；②反渗透膜密封件泄漏：检查更换密封件；③反渗透膜破损：更换反渗透膜。","key":"启动完整消毒的阈值是干预值（50CFU/ml、0.125EU/ml），而非最大允许值。","page":38},{"id":213,"chapter":"第5章 透析用水处理设备及透析用水质量控制","section":"三、透析用水处理设备与管理规范（四）透析用水的化学污染物监测","roles":["技师"],"level":"基础","type":"填空","q":"透析用水的化学污染物至少每____测定1次，取样点应至少包括____，取样口应开启至少____s后用专用容器取样送检。","a":"年；供水回路的末端；60。","key":"化学污染物“至少每年1次”，取样同样须在回路末端并放水60s。","page":38},{"id":214,"chapter":"第5章 透析用水处理设备及透析用水质量控制","section":"三、透析用水处理设备与管理规范（四）透析用水的化学污染物监测","roles":["技师"],"level":"基础","type":"简答","q":"透析用水化学污染物超标的常见问题及处理方法有哪些？","a":"①反渗透膜密封件泄漏：检查更换密封件；②反渗透脱盐率下降：降低回收率，更换反渗透膜；③反渗透膜破损：更换反渗透膜。","key":"脱盐率下降的处理是“降低回收率+更换反渗透膜”，常漏答降低回收率。","page":38},{"id":215,"chapter":"第5章 透析用水处理设备及透析用水质量控制","section":"三、透析用水处理设备与管理规范（五）特殊情况下的监测与处理","roles":["技师"],"level":"基础","type":"简答","q":"哪些情况下水处理设备必须进行系统性消毒，并检测达标后方可投入使用？","a":"①疑似透析用水污染物超标；②新安装的水处理设备；③更换反渗透膜后；④更换透析用水供水管路后。以上均须进行系统性消毒处理，理化与生物污染检测达标后方可投入使用。","key":"“更换供水管路后”易被遗漏；须理化+生物双项达标。","page":38},{"id":216,"chapter":"第5章 透析用水处理设备及透析用水质量控制","section":"三、透析用水处理设备与管理规范（五）特殊情况下的监测与处理","roles":["技师"],"level":"高级","type":"案例分析","q":"某中心周末更换了透析用水供水管路，周一早晨技师计划冲洗后直接供水开机透析。是否妥当？应如何做？","a":"①不妥当；②按规程，更换透析用水供水管路后，必须对水处理设备进行系统性消毒处理；③完成消毒并彻底冲洗、确认消毒剂残留在安全范围内；④进行理化与生物污染检测（化学污染物、细菌、内毒素），达标后方可投入使用；⑤做好记录。","key":"仅冲洗不能替代系统消毒+理化生物检测，检测未出结果前不能投入使用。","page":38},{"id":217,"chapter":"第5章 透析用水处理设备及透析用水质量控制","section":"四、透析用水处理设备的维护（一）维护原则","roles":["技师"],"level":"基础","type":"简答","q":"透析用水处理设备的维护原则有哪些？","a":"①滤芯、活性炭、树脂、反渗膜等需根据水质检测结果或按制造商规定进行调试、维护、保养与更换，并记录和保存文档；②每年应进行一次全面的维护、保养和检测，包括报警功能模拟测试、电气检测等，并有维护记录；③每天监测实际产水量，在制造商标称的最低温度条件下应不少于实际透析所需的水使用量，并记录。","key":"年度全面维护须包括“报警功能模拟测试、电气检测”。","page":38},{"id":218,"chapter":"第5章 透析用水处理设备及透析用水质量控制","section":"四、透析用水处理设备的维护（二）常规维护内容","roles":["技师"],"level":"进阶","type":"简答","q":"按表5-2（YY/T 1269-2015），水处理设备各部件的常规监测项目和周期是什么？","a":"①砂滤器：入、出口压降，每天；②砂滤器反向冲洗循环：反向冲洗循环、时间设定，每天；③滤芯式过滤器：入、出口压降，每天；④软化器：原水的软化，每天；⑤软化器盐箱：未溶解的盐和盐溶液的量，每天；⑥软化器再生循环：再生循环时间或流量设定，每天；⑦活性炭吸附器：出水总氯含量，每天治疗前运转15min后；⑧反渗透装置：处理水电导率、产水和浓缩水流量，每天（持续的监测）。","key":"反渗透装置的电导率和流量是“持续的监测”，不是每天一次。","page":39},{"id":219,"chapter":"第5章 透析用水处理设备及透析用水质量控制","section":"四、透析用水处理设备的维护（三）前处理系统的维护","roles":["技师"],"level":"基础","type":"填空","q":"滤芯式滤器当水阻压力（入口压力减去出口压力）大于____MPa应更换滤芯，或根据情况定期更换，更换周期应小于____个月。","a":"0.06；3。","key":"水阻=入口压力−出口压力，周期“小于3个月”。","page":39},{"id":220,"chapter":"第5章 透析用水处理设备及透析用水质量控制","section":"四、透析用水处理设备的维护（三）前处理系统的维护","roles":["技师"],"level":"基础","type":"案例分析","q":"技师巡视时读取保安滤器入口压力0.30MPa、出口压力0.22MPa，该滤芯已使用2个月。应如何处理？","a":"①水阻压力=0.30−0.22=0.08MPa；②已＞0.06MPa，应更换滤芯；③即使未达压差阈值，更换周期也应小于3个月；④记录压力数据与滤器更换。","key":"按压差和时间双标准管理，任一达到即更换。","page":39},{"id":221,"chapter":"第5章 透析用水处理设备及透析用水质量控制","section":"四、透析用水处理设备的维护（三）前处理系统的维护","roles":["技师"],"level":"进阶","type":"简答","q":"每天巡视前处理系统（砂滤、树脂、活性炭罐）应观察哪些内容？","a":"①砂滤、树脂、活性炭罐控制阀（头）工作情况；②控制器显示时间应与当前时间相符，误差大于30min应校准；③观察自来水进水水压及砂滤、树脂、活性炭罐出水水压；④检查自动反向冲洗时间设定是否正确，观察反向冲洗过程是否正常；⑤罐体水阻增大不能满足反渗透主机用水时查找原因；⑥砂滤罐反洗、活性炭罐反洗、树脂再生应分别进行。","key":"控制器时间误差＞30min会导致反洗/再生在透析时段启动，必须校准。","page":39},{"id":222,"chapter":"第5章 透析用水处理设备及透析用水质量控制","section":"四、透析用水处理设备的维护（三）前处理系统的维护","roles":["技师"],"level":"进阶","type":"判断","q":"为节省时间，砂滤罐反向冲洗、活性炭罐反向冲洗和树脂再生可安排同时进行。（对/错？）","a":"错。规程要求砂滤罐反向冲洗、活性炭罐反向冲洗、树脂再生应分别进行。","key":"同时进行会导致进水压力、流量不足，反洗/再生效果差。","page":39},{"id":223,"chapter":"第5章 透析用水处理设备及透析用水质量控制","section":"四、透析用水处理设备的维护（三）前处理系统的维护","roles":["技师"],"level":"高级","type":"判断","q":"活性炭罐出水总氯为0.08mg/L，未超过0.1mg/L，说明活性炭工作正常，无需任何处理。（对/错？）","a":"错。规程指出活性炭颗粒被污物包裹、结块、破损、缺失等导致清除总氯能力下降时，检测活性炭罐出水总氯含量＞0.07mg/L，此时可进行反向冲洗、维护等处理；仍不能达标且排除其他原因时，必须更换活性炭滤料。","key":"0.07mg/L是活性炭能力下降的预警信号，不能等到0.1mg/L才处理。","page":39},{"id":224,"chapter":"第5章 透析用水处理设备及透析用水质量控制","section":"四、透析用水处理设备的维护（三）前处理系统的维护","roles":["技师"],"level":"进阶","type":"简答","q":"什么情况下必须更换钠型阳离子树脂？","a":"①树脂颗粒破损、结块、缺失、失效、再生不良等，导致清除钙、镁离子能力下降；②经有效再生仍不能满足临床需要（如不能满足1天透析用水）；③并排除其他原因。满足以上即必须更换树脂。","key":"须先“有效再生”并“排除其他原因”，不能一超标就换树脂。","page":39},{"id":225,"chapter":"第5章 透析用水处理设备及透析用水质量控制","section":"四、透析用水处理设备的维护（四）主机的维护","roles":["技师"],"level":"基础","type":"简答","q":"反渗透机工作时应观察哪些重要参数？","a":"①高压泵出口压力；②反渗透机产水（透析用水）侧与排水（浓水）侧压力；③反渗透机进水、产水的电导率变化；④产水与排水的流量；⑤进水温度。","key":"进水温度直接影响产水量，常被漏观察。","page":40},{"id":226,"chapter":"第5章 透析用水处理设备及透析用水质量控制","section":"四、透析用水处理设备的维护（四）主机的维护","roles":["技师"],"level":"基础","type":"填空","q":"反渗透水供水压力控制在____MPa，产水量应大于最大用水量的____%。","a":"0.10～0.3；20。","key":"产水量余量20%是相对“最大用水量”。","page":40},{"id":227,"chapter":"第5章 透析用水处理设备及透析用水质量控制","section":"四、透析用水处理设备的维护（四）主机的维护","roles":["技师"],"level":"进阶","type":"简答","q":"监测透析用水电导率有何意义？何时应考虑反渗透膜老化或损坏，如何处理？","a":"①电导率可直接反映反渗透机产水水质（离子）变化，电导率与水中含盐量呈正相关；②当透析用水电导率明显升高、脱盐率小于95%时，应考虑反渗透膜老化、损坏；③应对透析用水进行化学污染物检测，确定透析用水是否合格。","key":"脱盐率95%是关键阈值；电导率升高须追加化学污染物检测。","page":40},{"id":228,"chapter":"第5章 透析用水处理设备及透析用水质量控制","section":"四、透析用水处理设备的维护（四）主机的维护","roles":["技师"],"level":"进阶","type":"简答","q":"哪些情况下应更换反渗透膜？更换后应做什么？","a":"应更换：①产水水质下降，脱盐率下降至95%以下，清洗无效；②产水量不能满足需要，清洗无效，排除其他可纠正因素；③反渗透组件损坏（破膜、膜脱落、压密、被氧化）。更换后：应对系统进行消毒，并对透析用水进行化学污染物检测和细菌、内毒素检测。","key":"前两种情况的前提是“清洗无效”；换膜后三项检测缺一不可。","page":40},{"id":229,"chapter":"第5章 透析用水处理设备及透析用水质量控制","section":"四、透析用水处理设备的维护（四）主机的维护","roles":["技师"],"level":"高级","type":"案例分析","q":"某反渗透机进水电导率500μS/cm，产水电导率35μS/cm，化学清洗后无改善，产水量尚可。请计算脱盐率并给出处置。","a":"①脱盐率≈(1−35/500)×100%=93%；②低于95%，且清洗无效，属于应更换反渗透膜的情形；③先对透析用水进行化学污染物检测，确定是否合格；④更换反渗透膜，换后对系统进行消毒；⑤对透析用水进行化学污染物检测和细菌、内毒素检测，达标后方可投入使用；⑥同时排查密封件泄漏等机械损伤，可考虑降低回收率作为过渡。","key":"脱盐率按进、产水电导率估算；换膜属“必须系统消毒+理化生物检测达标后使用”的情形。","page":40},{"id":230,"chapter":"第5章 透析用水处理设备及透析用水质量控制","section":"四、透析用水处理设备的维护（五）消毒","roles":["技师"],"level":"进阶","type":"填空","q":"反渗透膜热水消毒要求____℃≤水温≤____℃，维持时间应＞____min；热水供水管路消毒要求回水端水温≥____℃，维持时间＞20min；透析治疗前必须降至常温。","a":"80；85；20；85。","key":"RO膜是80～85℃区间（不能超85℃），管路是回水端≥85℃。","page":40},{"id":231,"chapter":"第5章 透析用水处理设备及透析用水质量控制","section":"四、透析用水处理设备的维护（五）消毒","roles":["技师"],"level":"进阶","type":"简答","q":"水处理设备使用过氧乙酸进行化学消毒时，有效浓度、水温和浸泡时间有何要求？对消毒液资质有何要求？","a":"①过氧乙酸有效浓度1500～2000mg/L，水温＜25℃，浸泡时间≤2h；②也可使用设备专用消毒剂，按说明书使用；③消毒液应具有国家药品监督管理局颁发的注册证、生产许可证，或具有所在地省级卫生健康行政部门发放的卫生许可证或备案的消毒液商品；④应监测最小有效浓度、接触时间，每次消毒后必须测定残留浓度。","key":"水温＜25℃、浸泡≤2h是保护RO膜的关键限制。","page":40},{"id":232,"chapter":"第5章 透析用水处理设备及透析用水质量控制","section":"四、透析用水处理设备的维护（五）消毒","roles":["技师"],"level":"高级","type":"案例分析","q":"夏季某日技师用过氧乙酸（有效浓度1800mg/L）消毒反渗透复合膜，当时水温28℃，为求“消毒彻底”浸泡了3h，且本月已第3次进行该操作。请指出问题。","a":"①浓度1500～2000mg/L符合要求；②水温应＜25℃，28℃不符合；③浸泡时间应≤2h，3h超时；④氧化性药剂（如过氧乙酸）会对反渗透膜造成一定破坏，应节制使用，频繁高强度消毒易致膜氧化、脱盐率下降，严重时需换膜；⑤消毒周期应根据说明书确定，并监测最小有效浓度、接触时间，每次消毒后必须测定残留浓度；⑥复合膜不能改用含氯消毒剂。","key":"“水温＜25℃、浸泡≤2h、节制使用”三条同时约束过氧乙酸膜消毒。","page":40},{"id":233,"chapter":"第5章 透析用水处理设备及透析用水质量控制","section":"四、透析用水处理设备的维护（五）消毒","roles":["技师"],"level":"进阶","type":"判断","q":"复合反渗透膜可以使用含氯消毒剂消毒，且过氧乙酸对反渗透膜无损害可频繁使用。（对/错？）","a":"错。复合膜不能用含氯消毒剂消毒；氧化性药剂（如过氧乙酸）均会对反
