渗透膜造成一定破坏，应节制使用。","key":"含氯消毒剂只可用于供水管路，不能用于复合膜。","page":41},{"id":234,"chapter":"第5章 透析用水处理设备及透析用水质量控制","section":"四、透析用水处理设备的维护（五）消毒","roles":["技师","护士"],"level":"基础","type":"填空","q":"准备透析治疗前，消毒剂残留量超标（过氧乙酸残余≥____mg/L、总氯含量≥____mg/L）者，严禁用于透析治疗。","a":"1；0.1。","key":"合格是过氧乙酸＜1mg/L、总氯＜0.1mg/L，等于即超标。","page":41},{"id":235,"chapter":"第5章 透析用水处理设备及透析用水质量控制","section":"四、透析用水处理设备的维护（五）消毒","roles":["技师"],"level":"高级","type":"简答","q":"什么是水路盲端？规程推荐的盲端消毒方法是什么？","a":"①盲端：供水管路出口和透析机之间的连接管路部分，常是常规消毒的盲区；②方法：供水管路消毒时，用含消毒剂的水或热水来回冲洗透析机（透析机必须处于水洗操作状态）；③化学消毒时监测透析机排水中消毒剂浓度，待有效浓度达标（过氧乙酸1500～2000mg/L；含氯消毒剂1500～2000mg/L）后停机浸泡；④浸泡结束后对每台透析机彻底水洗，检测残留，符合标准（过氧乙酸残余＜1mg/L、总氯＜0.1mg/L）方可使用。","key":"透析机须处于“水洗”状态才能把消毒液吸入盲端；每台机都要测残留。","page":41},{"id":236,"chapter":"第5章 透析用水处理设备及透析用水质量控制","section":"四、透析用水处理设备的维护（五）消毒","roles":["技师","护士"],"level":"高级","type":"案例分析","q":"供水管路过氧乙酸消毒、冲洗后，抽检3号透析机排水过氧乙酸残余为1.2mg/L，其余机器＜1mg/L。护士询问3号机能否先上机。请处理。","a":"①不能上机：过氧乙酸残余≥1mg/L严禁用于透析治疗；②原因多为连接软管/三通盲端冲洗不彻底；③对3号机继续进行彻底水洗操作，同时冲洗其供水连接软管和三通处；④复测透析机排水残余＜1mg/L后方可使用；⑤记录残留检测结果，必要时复查其他机位。","key":"残留检测是逐台把关，单台不达标即该机禁用。","page":41},{"id":237,"chapter":"第5章 透析用水处理设备及透析用水质量控制","section":"四、透析用水处理设备的维护（五）消毒","roles":["技师"],"level":"基础","type":"填空","q":"透析用水处理设备停机≥____h，使用前必须进行一次包括主机和____的系统性消毒，要求细菌和内毒素水平达到国家行业标准。","a":"48；供水管路。","key":"停机时间界值是“≥48h”，消毒范围必须包括供水管路。","page":41},{"id":238,"chapter":"第5章 透析用水处理设备及透析用水质量控制","section":"四、透析用水处理设备的维护（五）消毒","roles":["技师"],"level":"进阶","type":"案例分析","q":"春节期间透析中心停诊，水处理设备停机3天。节后复诊前技师应如何操作？","a":"①停机已≥48h，使用前必须进行一次系统性消毒，包括主机和供水管路；②按说明书选择热消毒或化学消毒并达到有效温度/浓度和时间；③化学消毒后彻底冲洗并检测残留（过氧乙酸＜1mg/L、总氯＜0.1mg/L），注意连接软管和三通；④细菌和内毒素水平必须达到YY 0572-2015标准；⑤复诊前完成软水硬度、总氯等日常检测并记录。","key":"节假日停机复用是高发事件，规程要求的是“系统性消毒+细菌内毒素达标”。","page":41},{"id":239,"chapter":"第5章 透析用水处理设备及透析用水质量控制","section":"四、透析用水处理设备的维护（六）反渗透水处理系统运行记录","roles":["技师"],"level":"基础","type":"简答","q":"透析用反渗透水处理系统运行记录中，预处理部分应记录哪些内容？","a":"硬度、总氯、自来水压力、砂滤罐压力差、树脂罐压力差、活性炭罐压力差、砂滤罐反向冲洗、活性炭罐反向冲洗、树脂再生情况、加盐量以及滤器更换。","key":"加盐量与滤器更换常被漏记。","page":41},{"id":240,"chapter":"第5章 透析用水处理设备及透析用水质量控制","section":"四、透析用水处理设备的维护（六）反渗透水处理系统运行记录","roles":["技师"],"level":"进阶","type":"填空","q":"按图5-1，自来水压力为P1，砂滤罐压力差为____，树脂罐压力差为____，活性炭罐压力差为____。","a":"P2−P3；P3−P4；P4−P5。","key":"P2砂滤进水、P3树脂进水、P4活性炭进水、P5活性炭出水，压差为前一罐进水减后一罐进水。","page":42},{"id":241,"chapter":"第5章 透析用水处理设备及透析用水质量控制","section":"四、透析用水处理设备的维护（六）反渗透水处理系统运行记录","roles":["技师"],"level":"高级","type":"简答","q":"在图5-2中，P6～P13、C1/C2、F1～F4、T分别代表什么？","a":"①压力：P6水机进水压力；P7一级膜进水压力；P8一级膜排水压力；P9一级膜产水压力；P10二级膜进水压力；P11二级膜排水压力；P12二级膜产水压力；P13产水回水压力；②电导率：C1进水电导率，C2产水电导率；③水量：F1进水量，F2产水量，F3废水量，F4回水量；④T：进水温度。","key":"F3是废水量、F4是回水量，C1/C2进出顺序勿颠倒。","page":42},{"id":242,"chapter":"第5章 透析用水处理设备及透析用水质量控制","section":"五、故障的原因与处理（一）反渗透组件产水量下降","roles":["技师"],"level":"进阶","type":"简答","q":"反渗透组件产水量下降的原因有哪些？","a":"①系统运行压力降低：进水压力流量太低、前级加压泵故障、预处理组件内水阻增大、保安过滤器阻塞、高压泵效率降低、循环量或排放量过大等，找出原因并处理；②进水电导增加使渗透压增加、驱动力减少（进水电导增高、回收率过高等）；③反渗透膜组件压密：需更换反渗透膜；④反渗透膜表面被污染：需清洗、消毒反渗透膜；⑤进水温度过低：常发生在冬季，水温降到5℃以下时尤为明显。","key":"排查顺序从前处理压力/保安滤器入手，再考虑膜本身。","page":44},{"id":243,"chapter":"第5章 透析用水处理设备及透析用水质量控制","section":"五、故障的原因与处理（一）反渗透组件产水量下降","roles":["技师"],"level":"进阶","type":"填空","q":"一般复合膜的运行压力在____MPa，低压膜的运行压力在____MPa。","a":"1～1.5；1.05。","key":"勿与反渗透水供水压力0.10～0.3MPa混淆。","page":44},{"id":244,"chapter":"第5章 透析用水处理设备及透析用水质量控制","section":"五、故障的原因与处理（一）反渗透组件产水量下降","roles":["技师"],"level":"高级","type":"案例分析","q":"1月份某中心反渗透机产水量明显下降，不足以满足全部机位，进水温度显示4℃，前处理压差正常，脱盐率97%。请分析原因与对策。","a":"①进水温度过低是冬季产水量下降的常见原因，水温降到5℃以下尤为明显；②前处理压差正常、脱盐率＞95%，提示膜未明显损坏；③继续排查运行压力（高压泵效率、保安过滤器、循环量/排放量是否过大）、进水电导与回收率、膜压密或污染；④维护原则要求在制造商标称的最低温度条件下产水量应不少于实际透析所需用水量，每天监测并记录；⑤若排除可纠正因素、清洗无效仍不能满足需要，属应更换反渗透膜情形。","key":"冬季低温是产水量下降的高频原因，设备选型/验收须按最低温度核算产水量。","page":44},{"id":245,"chapter":"第5章 透析用水处理设备及透析用水质量控制","section":"五、故障的原因与处理（二）反渗透组件产水水质下降","roles":["技师"],"level":"进阶","type":"简答","q":"反渗透组件产水水质下降的表现和主要原因是什么？","a":"表现：电导率升高、水中含盐量增加、系统脱盐率下降。原因：①反渗透膜被氧化：氯、臭氧或其他氧化剂有氧化损害，消毒时氧化剂浓度、时间超标可致膜氧化，严重时需换膜；②机械损伤：反渗透膜或连接件机械损坏使给水或浓水渗入产品水，脱盐率下降、产品水流量升高，常见密封圈泄漏、膜卷窜动、膜表面磨损，应找出原因并处理。","key":"消毒剂浓度/时间超标是人为导致膜氧化的常见原因。","page":44},{"id":246,"chapter":"第5章 透析用水处理设备及透析用水质量控制","section":"五、故障的原因与处理（二）反渗透组件产水水质下降","roles":["技师"],"level":"高级","type":"判断","q":"反渗透膜发生机械损伤（如密封圈泄漏）时，表现为系统脱盐率下降、产品水流量下降。（对/错？）","a":"错。机械损伤会造成给水或浓水渗入产品水中，表现为系统脱盐率下降，产品水流量升高。","key":"“脱盐率降+产水量升”是机械损伤的特征组合，可与膜污染（产水量降）鉴别。","page":44},{"id":247,"chapter":"第6章 血液透析器和滤器复用标准操作规程","section":"一、定义和概述","roles":["医生","护士","技师"],"level":"基础","type":"简答","q":"什么是血液透析器/滤器复用？","a":"对使用过的透析器/滤器经过冲洗、清洁、消毒等一系列处理程序，并达到规范要求后，再次应用于同一患者进行透析治疗的过程。","key":"定义的两个要件：①处理达到规范要求；②只能再次用于“同一患者”。","page":45},{"id":248,"chapter":"第6章 血液透析器和滤器复用标准操作规程","section":"一、定义和概述","roles":["医生","护士"],"level":"进阶","type":"简答","q":"简述血液透析器/滤器复用的主要缺点和规范复用的优势。","a":"缺点：①增加患者的感染危险；②降低透析器/滤器的效能；③复用过程中增加患者和医务人员接触化学试剂的机会；④透析器破膜失血等。优势：①提高透析器生物相容性；②减少免疫系统的激活；③减少“首次使用综合征”发生；④降低透析成本等。","key":"原文明确复用“存在争议”，我国大多数透析室（中心）为一次性使用；考核常把“减少首次使用综合征”作为优势要点。","page":45},{"id":249,"chapter":"第6章 血液透析器和滤器复用标准操作规程","section":"二、血液透析器/滤器复用原则","roles":["护士","技师"],"level":"基础","type":"填空","q":"需复用的血液透析器/滤器，下机后____min内或下机后立即处理；如遇特殊情况，____h内不能处理的可在冲洗后冷藏，但____h之内必须完成消毒和灭菌程序处理。","a":"15～30；2；24","key":"“冷藏”的前提是先冲洗；冷藏不是无限期延后，24h内必须完成消毒灭菌。","page":45},{"id":250,"chapter":"第6章 血液透析器和滤器复用标准操作规程","section":"二、血液透析器/滤器复用原则","roles":["医生"],"level":"基础","type":"简答","q":"哪些患者禁止或不能复用血液透析器/滤器？","a":"①合并乙型病毒性肝炎、丙型病毒性肝炎、梅毒及艾滋病等可能通过血液传播的传染性疾病的患者禁止复用；②对复用过程中使用的消毒剂过敏的患者不能复用。","key":"梅毒同样属于禁止复用范围，易被遗漏；消毒剂过敏是另一独立禁忌。","page":45},{"id":251,"chapter":"第6章 血液透析器和滤器复用标准操作规程","section":"二、血液透析器/滤器复用原则","roles":["医生"],"level":"进阶","type":"简答","q":"血液透析器/滤器是否复用由谁决定？复用前在医患沟通方面有何要求？责任主体是谁？","a":"①是否复用由主管医师决定；②主管医师要告知患者复用可能产生的风险，患者签署“血液透析器/滤器复用知情同意书”；③医疗单位应对规范复用透析器和滤器行为负责。","key":"决定权在主管医师而非护士或技师；知情同意书须由患者签署，缺一不可。","page":45},{"id":252,"chapter":"第6章 血液透析器和滤器复用标准操作规程","section":"二、血液透析器/滤器复用原则","roles":["医生","护士","技师"],"level":"基础","type":"简答","q":"对可复用的血液透析器/滤器本身及复用操作管理依据有何要求？","a":"①必须有国家药品监督管理局颁发的注册证、生产许可证等，并明确标明为可复用的血液透析器/滤器；②遵照2005年卫生部印发的《血液透析器复用操作规范》（卫医发〔2005〕330号）进行操作和管理。","key":"标明“一次性使用”的透析器不得复用；文件号卫医发〔2005〕330号常考。","page":45},{"id":253,"chapter":"第6章 血液透析器和滤器复用标准操作规程","section":"二、血液透析器/滤器复用原则","roles":["医生"],"level":"进阶","type":"案例分析","q":"新入透析患者，入院筛查HBsAg阳性，肝功能正常。科室为控制成本，拟对其使用高通量透析器复用。作为主管医师应如何处理？","a":"①该患者合并乙型病毒性肝炎（可经血液传播的传染性疾病），按规程禁止复用透析器/滤器；②应使用一次性透析器/滤器；③是否复用由主管医师决定，医疗单位对规范复用行为负责，不能因成本考虑违反禁忌。","key":"肝功能正常不改变禁忌；乙肝、丙肝、梅毒、艾滋病患者一律禁止复用。","page":45},{"id":254,"chapter":"第6章 血液透析器和滤器复用标准操作规程","section":"二、血液透析器/滤器复用原则","roles":["护士","技师"],"level":"基础","type":"判断","q":"为降低成本，血液透析的透析管路（包括血液滤过的连接管路）可与透析器一同规范复用。（对/错？）","a":"错。原文规定透析管路（包括血液滤过的连接管路）不能复用，可复用的仅限明确标明可复用的透析器/滤器。","key":"“管路不能复用”是红线条款，包括血液滤过的连接管路。","page":46},{"id":255,"chapter":"第6章 血液透析器和滤器复用标准操作规程","section":"三、复用血液透析器和滤器人员培训及建立健康档案","roles":["护士","技师"],"level":"基础","type":"简答","q":"对血液透析器/滤器复用操作人员的资质、培训考核及健康管理有哪些要求？","a":"①操作人员必须是护士、技术员或经过培训的专门人员；②经过培训，能正确掌握操作程序和规范；③应定期考核，考核合格后才可进行复用操作；④血液透析室（中心）负责复用操作人员技术资格的认定；⑤建立复用操作人员健康档案，定期检查肝炎等传染病指标，并接受免疫接种。","key":"“定期考核、合格后上岗”与“健康档案+免疫接种”是检查中最常缺失的两项。","page":46},{"id":256,"chapter":"第6章 血液透析器和滤器复用标准操作规程","section":"三、复用血液透析器和滤器人员培训及建立健康档案","roles":["护士","技师"],"level":"进阶","type":"判断","q":"复用操作人员的技术资格由透析器生产厂家负责认定，经厂家培训即可独立进行复用操作。（对/错？）","a":"错。复用操作人员技术资格由血液透析室（中心）负责认定，且须经培训、定期考核合格后才可进行复用操作。","key":"认定主体是透析室（中心），不是厂家。","page":46},{"id":257,"chapter":"第6章 血液透析器和滤器复用标准操作规程","section":"四、复用消毒程序（一）复用条件（二）复用室环境与安全要求","roles":["技师"],"level":"基础","type":"简答","q":"开展透析器/滤器复用应具备哪些基本条件？","a":"①具备专用复用室；②室内设反渗水接口；③全自动复用机；④在透析室（中心）清洁区域内设置复用透析器/滤器储存室。","key":"规程要求“全自动”复用机，复用次数上限也是以全自动复用程序为前提。","page":46},{"id":258,"chapter":"第6章 血液透析器和滤器复用标准操作规程","section":"四、复用消毒程序（一）复用条件（二）复用室环境与安全要求","roles":["护士","技师"],"level":"基础","type":"填空","q":"复用室应设置在____区，保持清洁卫生、通风良好，并具备____、____设施；复用透析器/滤器储存室应设置在____区。","a":"污染区；排风；排水；清洁","key":"复用室在污染区、储存室在清洁区，二者位置相反，最易混淆。","page":46},{"id":259,"chapter":"第6章 血液透析器和滤器复用标准操作规程","section":"四、复用消毒程序（一）复用条件（二）复用室环境与安全要求","roles":["技师"],"level":"进阶","type":"判断","q":"复用室的反渗水接口可从水处理主管路引出一段盲端支管供复用机使用。（对/错？）","a":"错。复用室内反渗水管路应为循环管路设置，不能为盲端。","key":"盲端易形成死水滋生细菌和生物膜，是水路设计的常见缺陷。","page":46},{"id":260,"chapter":"第6章 血液透析器和滤器复用标准操作规程","section":"四、复用消毒程序（一）复用条件（二）复用室环境与安全要求","roles":["护士","技师"],"level":"基础","type":"简答","q":"复用操作人员的个人防护及复用室安全设施有何要求？","a":"①操作者应穿戴防护手套和防护衣（隔离衣）；②遵守感染控制规范，须佩戴防护面罩或护目镜、口罩；③复用室应设有冲眼装置，确保一旦发生眼部职业暴露时能即刻有效地冲洗。","key":"面罩/护目镜与冲眼装置针对化学消毒剂飞溅的眼部暴露，是现场检查重点。","page":46},{"id":261,"chapter":"第6章 血液透析器和滤器复用标准操作规程","section":"四、复用消毒程序（一）复用条件（二）复用室环境与安全要求","roles":["护士","技师"],"level":"进阶","type":"案例分析","q":"质控检查发现某中心将复用后的透析器整齐码放在复用室内的货架上备用，复用室内无冲眼装置。请指出问题并提出整改。","a":"①复用后的透析器/滤器应贮存于透析室（中心）清洁区设置的复用透析器/滤器储存室，复用室属污染区，不能在此存放；②复用室应设冲眼装置，保证眼部职业暴露时能即刻有效冲洗，须补设。","key":"复用后透析器放在污染区存放会造成再污染，是常见违规。","page":46},{"id":262,"chapter":"第6章 血液透析器和滤器复用标准操作规程","section":"四、复用消毒程序（三）消毒剂的使用和贮存","roles":["技师"],"level":"进阶","type":"简答","q":"复用用消毒剂在来源和选择上有何要求？","a":"①必须使用国家药品监督管理局批准，或取得所在地省级卫生健康行政部门发放的卫生许可证或备案的消毒液商品；②按透析器复用机使用说明书选择消毒剂。","key":"消毒剂选择依据是复用机说明书，不可随意替换品种。","page":46},{"id":263,"chapter":"第6章 血液透析器和滤器复用标准操作规程","section":"四、复用消毒程序（三）消毒剂的使用和贮存","roles":["技师"],"level":"基础","type":"填空","q":"按表6-1，过氧乙酸用于透析器复用的浓度为____%，需要最短消毒时间及温度为____，消毒有效期为____d。","a":"0.3～0.5；6h，20℃；3","key":"过氧乙酸有效期仅3d，远短于renalin和戊二醛的14～30d。","page":47},{"id":264,"chapter":"第6章 血液透析器和滤器复用标准操作规程","section":"四、复用消毒程序（三）消毒剂的使用和贮存","roles":["技师"],"level":"进阶","type":"填空","q":"按表6-1，renalin（冷式清洗灭菌剂）浓度为____%，最短消毒时间及温度为____，消毒有效期为____d；戊二醛浓度为____%，最短消毒时间及温度为____，有效期为____d。","a":"3.5；11h，20℃；14～30；0.75；1h，20℃；14～30","key":"renalin最短消毒时间11h最长，戊二醛1h最短，二者有效期相同。","page":47},{"id":265,"chapter":"第6章 血液透析器和滤器复用标准操作规程","section":"四、复用消毒程序（三）消毒剂的使用和贮存","roles":["技师"],"level":"高级","type":"判断","q":"以过氧乙酸消毒的复用透析器在储存室存放5d后，只要外观正常即可直接给该患者使用。（对/错？）","a":"错。过氧乙酸消毒有效期为3d，超过表中所列时间，血液透析器必须重新消毒方可使用。","key":"超过有效期需“重新消毒”，不是只做外观检查或冲洗。","page":47},{"id":266,"chapter":"第6章 血液透析器和滤器复用标准操作规程","section":"四、复用消毒程序（三）消毒剂的使用和贮存","roles":["护士","技师"],"level":"高级","type":"案例分析","q":"某患者透析器上午9时完成renalin灌注（室温20℃），患者当日下午14时临时要求提前上机使用该透析器。应如何处理？","a":"①renalin在20℃下需要最短消毒时间11h；②复用血液透析器使用前必须经过最短消毒时间消毒后方可使用，本例仅5h，未达最短消毒时间，不能使用；③应待满足最短消毒时间后再用，或另行安排（如该患者改用新透析器）。","key":"最短消毒时间是硬性前提，且表中时间对应20℃条件。","page":47},{"id":267,"chapter":"第6章 血液透析器和滤器复用标准操作规程","section":"四、复用消毒程序（四）全自动复用机操作程序","roles":["护士","技师"],"level":"基础","type":"简答","q":"血液透析器/滤器首次复用前应贴的复用标签包括哪些内容？复用手册应包括哪些内容？","a":"姓名、性别、年龄、住院号或门诊号、透析器/滤器型号、复用日期、复用次数、操作人员姓名或编号；复用后专人专用。复用手册内容包括复用的相关规定、复用程序、复用记录等。","key":"标签必须在“首次复用前”贴上，且须含操作人员姓名或编号、复用次数。","page":47},{"id":268,"chapter":"第6章 血液透析器和滤器复用标准操作规程","section":"四、复用消毒程序（四）全自动复用机操作程序","roles":["技师"],"level":"进阶","type":"填空","q":"复用时常用消毒剂灌入透析器/滤器的血室和透析液室，保证至少应有____个血室容量的消毒剂经过透析器/滤器，使消毒剂不被水稀释，并能维持原有浓度的____以上。","a":"3；90%","key":"血室和透析液室都要灌注；3个血室容量是防稀释的关键。","page":47},{"id":269,"chapter":"第6章 血液透析器和滤器复用标准操作规程","section":"四、复用消毒程序（四）全自动复用机操作程序","roles":["护士","技师"],"level":"进阶","type":"简答","q":"复用过程中如何减少交叉感染？透析器/滤器外壳如何处理？","a":"①不同透析器/滤器对应连接不同的防交叉感染连接接头；②透析结束后在清洁卫生的环境中运送并立即处置；③外壳使用与透析器/滤器外部材料相适应浓度的消毒液（如0.05%次氯酸钠）浸泡或清洗外部的血迹及污物。","key":"外壳消毒液浓度要与外壳材料相适应，示例为0.05%次氯酸钠。","page":47},{"id":270,"chapter":"第6章 血液透析器和滤器复用标准操作规程","section":"四、复用消毒程序（五）复用后检测","roles":["护士","技师"],"level":"基础","type":"简答","q":"复用后透析器/滤器外观检查包括哪些内容？","a":"①标签字迹清楚，牢固贴附于透析器/滤器上；②透析器/滤器外观正常，无结构损坏和堵塞；③端口封闭良好、无泄漏；④存储时间在规定期限内。","key":"“存储时间在规定期限内”也属外观检查内容，常被忽略。","page":47},{"id":271,"chapter":"第6章 血液透析器和滤器复用标准操作规程","section":"四、复用消毒程序（五）复用后检测","roles":["技师"],"level":"基础","type":"填空","q":"复用后容量检测：全自动复用机自动检测透析器/滤器血室容积，透析器/滤器容量至少应是原有初始容量的____%。","a":"80","key":"低于80%即不合格应废弃。","page":47},{"id":272,"chapter":"第6章 血液透析器和滤器复用标准操作规程","section":"四、复用消毒程序（五）复用后检测","roles":["技师"],"level":"进阶","type":"填空","q":"复用后压力检测：维持透析器/滤器血室____mmHg正压____s，压力下降应＜____mmHg/s；对高通量膜，压力下降应＜____mmHg/s。","a":"250；30；0.83；1.25","key":"高通量膜允许压降更大（1.25），低通量为0.83，数值勿记反。","page":47},{"id":273,"chapter":"第6章 血液透析器和滤器复用标准操作规程","section":"四、复用消毒程序（五）复用后检测","roles":["护士","技师"],"level":"进阶","type":"简答","q":"复用透析器/滤器的消毒剂浓度检测应在什么时机进行？目的是什么？","a":"①在透析器/滤器灌注灭菌剂后和使用前检测；②目的是确认透析器/滤器内灭菌剂浓度达到灭菌标准，确定灭菌有效；③不同的消毒剂采用不同的试纸检测。","key":"浓度检测（灭菌有效）与残余量检测（安全）是两回事，前者两个时间点都要做。","page":48},{"id":274,"chapter":"第6章 血液透析器和滤器复用标准操作规程","section":"四、复用消毒程序（五）复用后检测","roles":["护士","技师"],"level":"高级","type":"填空","q":"复用透析器残余消毒剂浓度要求：过氧乙酸＜____μg/L、renalin＜____μg/L、戊二醛＜____μg/L；消毒剂残余量检测后____min内应开始透析。","a":"1；3；1～3；15","key":"15min内开始透析是为防止消毒液浓度反跳。","page":48},{"id":275,"chapter":"第6章 血液透析器和滤器复用标准操作规程","section":"四、复用消毒程序（五）复用后检测","roles":["护士","技师"],"level":"高级","type":"案例分析","q":"护士于13:00完成患者复用透析器冲洗及过氧乙酸残余量检测（合格），因患者穿刺困难、更换穿刺者，13:40才准备开始引血。应如何处理？","a":"①规程要求消毒剂残余量检测后15min内应开始透析，防止可能的消毒液浓度反跳；②本例已等待40min，应重新清洁、冲洗，重新测定消毒剂残余量，使之低于允许的最高限度（过氧乙酸＜1μg/L）后再开始透析。","key":"最常见错误是直接沿用之前的合格结果上机。","page":48},{"id":276,"chapter":"第6章 血液透析器和滤器复用标准操作规程","section":"五、血液透析器/滤器复用用水要求","roles":["技师"],"level":"进阶","type":"简答","q":"血液透析器/滤器复用用水有何要求？","a":"①应使用反渗水；②必须符合水质的生物学标准；③有一定的压力（1.5～2.0kg/m2）和流速（3～4L/min）；④必须满足高峰运行状态下的设备用水要求；⑤水处理系统设计应易于整个系统的清洁和消毒，消毒程序应包括冲洗系统的所有部分，确保消毒剂残余量控制在安全标准允许范围内。","key":"流速3～4L/min和满足“高峰运行状态”需求是设计验收要点。","page":48},{"id":277,"chapter":"第6章 血液透析器和滤器复用标准操作规程","section":"五、血液透析器/滤器复用用水要求","roles":["技师"],"level":"基础","type":"填空","q":"复用用水细菌水平不得超过____CFU/ml，干预限度为____CFU/ml；内毒素含量不得超过____EU/ml，干预限度为____EU/ml。","a":"100；50；0.25；0.125","key":"干预限度均为最大允许值的一半。","page":48},{"id":278,"chapter":"第6章 血液透析器和滤器复用标准操作规程","section":"五、血液透析器/滤器复用用水要求","roles":["技师"],"level":"高级","type":"简答","q":"复用用水水质检测的采样点在哪里？达到干预限度时应如何处理？","a":"①应在血液透析器/滤器与复用系统连接处或尽可能接近此处进行水质检测；②达到干预限度时，可继续使用水处理系统，但应采取措施（如消毒水处理系统），防止系统污染进一步加重。","key":"达干预限度≠停用，但必须采取干预措施；采样点要尽量靠近透析器连接处。","page":48},{"id":279,"chapter":"第6章 血液透析器和滤器复用标准操作规程","section":"五、血液透析器/滤器复用用水要求","roles":["技师"],"level":"进阶","type":"简答","q":"复用用水细菌学、内毒素的检测频率如何规定？","a":"最初应每周检测1次，连续2次检测结果符合要求后，细菌学检测应每月1次，内毒素检测应至少每3个月1次。","key":"细菌每月、内毒素至少每3个月，二者频率不同。","page":48},{"id":280,"chapter":"第6章 血液透析器和滤器复用标准操作规程","section":"五、血液透析器/滤器复用用水要求","roles":["技师"],"level":"高级","type":"案例分析","q":"某中心复用水例行检测：复用机连接处细菌68CFU/ml，内毒素0.10EU/ml。技师应如何判断和处理？","a":"①细菌68CFU/ml未超过100CFU/ml，但已超过干预限度50CFU/ml；内毒素0.10EU/ml低于干预限度0.125EU/ml，合格；②达到干预限度时可继续使用水处理系统，但应采取措施（如消毒水处理系统），防止系统污染进一步加重；③处理后复测确认。","key":"“未超标但达干预限度”必须干预，不可视为合格放任。","page":48},{"id":281,"chapter":"第6章 血液透析器和滤器复用标准操作规程","section":"七、复用血液透析器/滤器的使用注意事项","roles":["技师"],"level":"进阶","type":"案例分析","q":"某低通量透析器第6次复用后，全自动复用机检测血室容量为初始容量的76%，压力检测合格，外观正常。能否继续使用？","a":"不能。透析器/滤器容量至少应是原有初始容量的80%；复用次数应依据TCV、膜的完整性实验和外观检查确定，三项中任何一项不符合要求即应废弃，故该透析器应废弃。","key":"未达复用次数上限不代表可用，三项任一不合格即废弃。","page":49},{"id":282,"chapter":"第6章 血液透析器和滤器复用标准操作规程","section":"六、复用所致不良事件的相关临床表现","roles":["医生","护士"],"level":"高级","type":"案例分析","q":"某复用透析器患者近两周多次在透析开始后出现不明原因的发热、寒战，并诉内瘘侧上肢疼痛，血培养阴性。应考虑什么？需做哪些检测？","a":"①应注意是否与复用相关；②检测复用冲洗用反渗水的内毒素含量；③检测复用透析器/滤器的消毒剂残余量；④每次使用前及治疗中监测体温及其他生命体征和临床症状。","key":"血管通路侧上肢疼痛提示消毒剂残留可能，发热寒战提示内毒素，两项检测都要做。","page":49},{"id":283,"chapter":"第6章 血液透析器和滤器复用标准操作规程","section":"七、复用血液透析器/滤器的使用注意事项","roles":["护士","技师"],"level":"进阶","type":"简答","q":"复用透析器/滤器的复用次数依据什么确定？何时应废弃？","a":"依据透析器/滤器整体纤维容积（TCV）、膜的完整性实验和外观检查来确定；三项中任何一项不符合要求即应废弃；同时低通量不得超过10次、高通量不得超过20次（全自动复用程序）。","key":"不是“用满次数”才废弃，任一项不合格即废弃。","page":49},{"id":284,"chapter":"第6章 血液透析器和滤器复用标准操作规程","section":"七、复用血液透析器/滤器的使用注意事项","roles":["护士"],"level":"基础","type":"判断","q":"复用透析器/滤器经规范消毒后，在紧急情况下可给同一血型且传染病指标阴性的其他患者使用。（对/错？）","a":"错。复用透析器/滤器只能同一患者使用，不得他人使用。","key":"专人专用无任何例外。","page":49},{"id":285,"chapter":"第6章 血液透析器和滤器复用标准操作规程","section":"七、复用血液透析器/滤器的使用注意事项","roles":["护士"],"level":"基础","type":"简答","q":"使用复用血液透析器/滤器的患者，在监测方面有何要求？","a":"每次使用复用血液透析器/滤器前及治疗中应监测体温，以及其他生命体征和临床症状。","key":"重点是体温——发热是复用相关不良事件的首要表现。","page":49},{"id":286,"chapter":"第7章 血液净化设备的使用与维护","section":"一、血液净化设备的基本要求","roles":["技师"],"level":"基础","type":"简答","q":"血液净化设备及透析用水处理设备应符合哪些资质和标准要求？","a":"①血液净化设备必须有国家药品监督管理局颁发的注册证等，符合《血液透析设备》（YY 0054-2010）、《连续性血液净化设备》（YY 0645-2018）及相关标准；②透析用水处理设备应有国家药品监督管理局颁发的注册证等，符合《血液透析和相关治疗用水处理设备技术要求》；③产水水质必须符合《血液透析及相关治疗用水》（YY 0572-2015）。","key":"三个标准号易混：YY 0054-2010透析设备、YY 0645-2018连续性血液净化设备、YY 0572-2015透析用水。","page":50},{"id":287,"chapter":"第7章 血液净化设备的使用与维护","section":"二、血液净化设备的使用与维护基本要求","roles":["技师"],"level":"基础","type":"简答","q":"医疗机构对每一台血液净化设备应如何建立档案？档案包括哪些内容？","a":"应为每一台血液净化设备（包括水处理设备、血液透析机、血液透析滤过机等）编号并建立档案，内容包括透析机的相关信息、故障、维修、保养、转让、实际使用时间等事项。","key":"水处理设备同样需编号建档；“实际使用时间”“转让”常漏记。","page":50},{"id":288,"chapter":"第7章 血液净化设备的使用与维护","section":"二、血液净化设备的使用与维护基本要求","roles":["技师"],"level":"进阶","type":"填空","q":"血液透析室（中心）应按产品说明书要求进行检查、检验、校准、保养、维护并予以记录，记录保存期限不得少于医疗器械规定使用期限终止后____年。依据为《医疗器械监督管理条例》（国务院令第____号）。","a":"5；650","key":"从“使用期限终止后”起算5年，不是从记录之日起算。","page":50},{"id":289,"chapter":"第7章 血液净化设备的使用与维护","section":"二、血液净化设备的使用与维护基本要求","roles":["技师"],"level":"进阶","type":"简答","q":"更改血液透析机/血液透析滤过机消毒程序，或改变消毒液原液浓度或吸入量时，应如何确认安全？","a":"应在消毒完成后，使用消毒剂残留量试纸（试剂）在排水口取样，检测水路中的残留浓度，达到安全标准后方可应用。","key":"取样点为排水口；未检测合格不得上机。","page":50},{"id":290,"chapter":"第7章 血液净化设备的使用与维护","section":"二、血液净化设备的使用与维护基本要求","roles":["护士","技师"],"level":"基础","type":"判断","q":"为节省时间，透析机的参数校对等维护工作可在患者透析治疗进行中完成。（对/错？）","a":"错。血液净化设备的维护工作必须在人机分离的情况下进行，以确保患者安全。","key":"“人机分离”是设备维护的前提。","page":50},{"id":291,"chapter":"第7章 血液净化设备的使用与维护","section":"二、血液净化设备的使用与维护基本要求","roles":["技师"],"level":"基础","type":"填空","q":"建议血液透析室（中心）配备备用透析机，备用透析机停用＞____h，使用前应进行一次完整的____消毒。","a":"48；水路","key":"备用机久置易滋生细菌，48h是界值。","page":51},{"id":292,"chapter":"第7章 血液净化设备的使用与维护","section":"二、血液净化设备的使用与维护基本要求","roles":["医生","护士","技师"],"level":"进阶","type":"简答","q":"血液净化设备的使用环境和不良事件监测有何要求？","a":"①应按照设备使用说明书，在设备规定的环境下（包括温度、湿度、电压、供水压力等）使用，并按要求操作；②按照《医疗器械监督管理条例》（国务院令第650号），应监测血液净化设备不良事件，发现不良事件或者可疑不良事件，应向医疗器械不良事件监测技术机构报告。","key":"“可疑”不良事件也要报告。","page":51},{"id":293,"chapter":"第7章 血液净化设备的使用与维护","section":"三、血液净化设备维护内容","roles":["技师"],"level":"基础","type":"简答","q":"从结构上看，透析机分为哪几个部分？维护要求是什么？","a":"分为电路控制与监测（“电路”）、外部血液循环通路（“血路”）、透析液通路（“水路”）3个部分；应定期校准与维护水路、电路、血路各项参数（详见透析机技术说明书）。水处理系统维护参见第5章。","key":"三路均需定期校准，不能只维护水路。","page":51},{"id":294,"chapter":"第7章 血液净化设备的使用与维护","section":"四、血液净化设备报警处理原则","roles":["护士","技师"],"level":"基础","type":"简答","q":"血液净化设备报警处理的基本原则有哪些？","a":"①报警装置应按要求定期校准其精度，发现问题及时处理，不得废除报警装置或随意改变报警参数；②发生报警时应按消音键，查看报警内容，找出报警原因，正确处理后再复位或继续透析治疗；③原因不明或报警原因未解决时，不得进入透析治疗状态；④治疗中判定是透析机故障时，应终止治疗或更换机器。","key":"顺序是“消音—查看—找原因—处理—复位”，不能消音后直接复位。","page":51},{"id":295,"chapter":"第7章 血液净化设备的使用与维护","section":"四、血液净化设备报警处理原则","roles":["护士","技师"],"level":"进阶","type":"判断","q":"某台透析机静脉压报警频繁，护士可适当放宽报警窗口以减少报警干扰，保证治疗连续性。（对/错？）","a":"错。不得废除报警装置或随意改变报警参数；应找出报警原因并正确处理，原因不明或未解决时不得进入透析治疗状态。","key":"随意放宽报警窗口是严重安全隐患。","page":51},{"id":296,"chapter":"第7章 血液净化设备的使用与维护","section":"四、血液净化设备报警处理原则","roles":["护士","技师"],"level":"进阶","type":"案例分析","q":"透析进行2h时机器反复出现报警，经护士和技师排查，确认非操作和患者因素，判定为透析机故障。下一步应如何处理？","a":"当透析治疗过程中判定是透析机故障时，应终止治疗或更换机器；原因未解决时不得继续进入透析治疗状态；维修须在人机分离下进行，并记录于设备档案，必要时按不良事件报告。","key":"不允许“带病”继续治疗。","page":51},{"id":297,"chapter":"第7章 血液净化设备的使用与维护","section":"五、透析机常见报警的处理","roles":["技师"],"level":"进阶","type":"简答","q":"透析液温度报警时透析机处于什么状态？常见原因有哪些？","a":"①发生温度报警时透析机进入旁路状态；②原因：进水温度异常、透析液流量不稳定、加热器损坏、温度传感器工作点漂移或损坏、控制电路故障及除气系统工作不良。","key":"进水温度异常与除气系统工作不良常被忽视。","page":51},{"id":298,"chapter":"第7章 血液净化设备的使用与维护","section":"五、透析机常见报警的处理","roles":["护士","技师"],"level":"基础","type":"简答","q":"发生电导率报警时，透析机处于什么状态？应首先检查哪些项目？","a":"透析机进入旁路状态。应首先检查：①A、B浓缩液量是否足够；②A、B浓缩液吸液管连接是否牢固；③吸液管路内是否有气泡；④A、B浓缩液的配制或原液型号是否正确；发现问题进行相应处理。","key":"先排查浓缩液和吸液管等操作因素，再考虑机器混液系统故障。","page":51},{"id":299,"chapter":"第7章 血液净化设备的使用与维护","section":"五、透析机常见报警的处理","roles":["技师"],"level":"高级","type":"简答","q":"透析机电导率监测和显示故障的常见原因是什么？为什么具有潜在危险？混液系统故障的主要原因有哪些？","a":"①监测/显示故障常见原因：电导率传感器或温度补偿传感器被污染、结垢，传感器连接件接触不良，传感器工作点漂移，或显示异常时的不正确操作；②危险：可导致显示值与透析液实际值不符而透析机不报警，不合格的透析液将通过透析器，给患者带来不适或严重后果；③混液系统故障主要原因：A或B浓缩液泵故障、透析液的流量异常、控制系统故障。","key":"“不报警的错误”比报警更危险。","page":52},{"id":300,"chapter":"第7章 血液净化设备的使用与维护","section":"五、透析机常见报警的处理","roles":["技师"],"level":"进阶","type":"填空","q":"当透析机的电导率显示值与设定值出现偏差大于±____ms/cm时，应用标准电导率仪或送实验室检测透析液电解质浓度。","a":"0.3","key":"疑似偏差时也应用标准电导率仪检测，不必等到明确超过0.3。","page":52},{"id":301,"chapter":"第7章 血液净化设备的使用与维护","section":"五、透析机常见报警的处理","roles":["医生","护士","技师"],"level":"进阶","type":"简答","q":"哪些情况下应对透析液进行离子浓度检测？电导率相关的日常维护是什么？","a":"①更换不同规格A、B浓缩物、调整混合比时；②患者出现疑似透析液离子浓度偏差引起的症状，或透析治疗后实验室检测血液中离子浓度异常时，应立即检测；③电导率显示值与设定值偏差大于±0.3ms/cm时；日常维护：透析治疗结束后对透析机进行酸洗，并定期清洁电导率传感器；不得随意改变报警窗口。","key":"更换浓缩物品牌/规格后的离子检测最容易被省略。","page":52},{"id":302,"chapter":"第7章 血液净化设备的使用与维护","section":"五、透析机常见报警的处理","roles":["医生","护士","技师"],"level":"高级","type":"案例分析","q":"某中心更换新厂家A、B浓缩液后，同一台透析机上的患者连续出现透析中头痛、恶心、血压升高，透析机电导率显示正常且无报警，透析后血钠偏高。应如何分析处理？","a":"①患者出现疑似透析液离子浓度偏差症状且血离子异常，应立即检测透析液离子浓度；②更换不同规格A、B浓缩物、调整混合比时本应进行离子检测；③考虑电导率传感器或温度补偿传感器污染、结垢、工作点漂移等导致显示值与实际值不符而不报警；④用标准电导率仪或送实验室检测，发现问题及时处理（清洁/校准传感器、确认浓缩液型号与配比）；⑤不得随意改变报警窗口；必要时停用该机。","key":"“机器不报警”不能排除透析液异常。","page":52},{"id":303,"chapter":"第7章 血液净化设备的使用与维护","section":"五、透析机常见报警的处理","roles":["护士","技师"],"level":"进阶","type":"简答","q":"发生漏血报警时透析机如何动作？护士应如何处理？","a":"①透析机进入旁路状态，阻止透析液流向透析器（滤器）和/或阻止置换液流进血液；②首先观察透析器是否破膜，如透析液侧可见血细胞，应按操作规定更换透析器；③如未发现漏血，经两人确认后可按透析治疗键继续透析治疗。","key":"未见漏血继续治疗必须“两人确认”。","page":52},{"id":304,"chapter":"第7章 血液净化设备的使用与维护","section":"五、透析机常见报警的处理","roles":["护士","技师"],"level":"高级","type":"案例分析","q":"透析中出现漏血报警，两人观察透析液侧未见血细胞，按透析治疗键后报警仍持续存在。应如何判断和处理？","a":"①上述操作后报警继续存在，确认为误报警；②判断可能是空气进入漏血传感器时，检查透析液连接口是否密封，透析器凝血或脱气泵效率降低也可引起；③误报警解除困难时原则上应分离患者，停止透析；④之后清洁（次氯酸钠化学方法或人工）并按说明书重新校准漏血传感器，校准无效考虑传感器损坏或电路故障。","key":"误报警解除困难不能长时间带报警治疗，原则上分离患者。","page":52},{"id":305,"chapter":"第7章 血液净化设备的使用与维护","section":"五、透析机常见报警的处理","roles":["技师"],"level":"进阶","type":"简答","q":"漏血误报警的常见原因有哪些？一般处理方法是什么？","a":"①常见原因：漏血报警传感器被污染、漏血传感器工作点漂移、漏血传感器进入较多空气；②一般处理：用化学方法（次氯酸钠）或人工清洁漏血传感器污染后，按透析机说明书重新校准漏血传感器；校准无效时应考虑漏血传感器损坏或电路故障。","key":"先清洁再校准，校准无效再考虑硬件损坏。","page":53},{"id":306,"chapter":"第7章 血液净化设备的使用与维护","section":"五、透析机常见报警的处理","roles":["技师"],"level":"高级","type":"简答","q":"发生静脉压、动脉压报警时应如何处理？如何检验压力传感器是否故障或工作点漂移？","a":"①应首先判断是否因操作、治疗引发的报警；②检验方法：夹紧动脉压或静脉压测量接管，分开与透析机测量接口的连接，测量接口对空气开放，此时显示应为0±3mmHg，如不为0说明压力传感器故障或工作点漂移；③传感器故障时应更换，工作点漂移时按说明书重新校准。","key":"检验前必须先夹紧测量接管，防止血液外溢或空气进入。","page":53},{"id":307,"chapter":"第7章 血液净化设备的使用与维护","section":"五、透析机常见报警的处理","roles":["护士","技师"],"level":"基础","type":"填空","q":"空气监测：静脉管路内出现＞____ml气泡时，气泡监测器应发出报警；当静脉壶内液面低于____时，液面监测器应发出报警。","a":"0.05；监测器","key":"气泡阈值0.05ml。","page":53},{"id":308,"chapter":"第7章 血液净化设备的使用与维护","section":"五、透析机常见报警的处理","roles":["护士","技师"],"level":"进阶","type":"简答","q":"发生空气监测报警时透析机如何动作？主要原因有哪些？如何处理？","a":"①透析机进入旁路状态，血泵停止工作，静脉管路夹关闭；②先检查静脉壶内血液平面或静脉管路内是否有气泡，如有应查找原因并相应处理，再进入透析治疗状态；③主要原因：体外循环血液管路血泵前管路微漏、接头不严、透析器排气不充分（主要原因）；血液管路与传感器接触不良（如管路、静脉壶直径细），可用清水或酒精擦拭传感器表面；传感器工作点漂移或损坏。","key":"血泵前管路为负压段，微漏易吸入空气。","page":53},{"id":309,"chapter":"第7章 血液净化设备的使用与维护","section":"五、透析机常见报警的处理","roles":["护士","技师"],"level":"进阶","type":"判断","q":"发生透析液压或跨膜压（TMP）报警时，透析机进入旁路状态，但血泵继续运转。（对/错？）","a":"错。发生透析液压或跨膜压报警时，透析机进入旁路状态，血泵停止工作；由于透析器血液侧与透析液侧对水阻力较小、压力相互影响，应判断是透析治疗所致还是透析机故障引起。","key":"TMP报警与空气报警一样血泵停止。","page":53},{"id":310,"chapter":"第7章 血液净化设备的使用与维护","section":"六、脱水（超滤）误差","roles":["技师"],"level":"基础","type":"判断","q":"脱水误差由透析机原因造成时，透析机一定会发出报警，因此无报警即可排除机器原因。（对/错？）","a":"错。脱水误差因透析机原因造成时透析机一般不报警，只有具有脱水泵或平衡装置监测系统的透析机才能发出脱水泵或平衡装置异常报警。","key":"不报警≠机器正常。","page":53},{"id":311,"chapter":"第7章 血液净化设备的使用与维护","section":"六、脱水（超滤）误差","roles":["医生","护士","技师"],"level":"进阶","type":"简答","q":"哪些因素引起的脱水误差不属于透析机脱水误差？","a":"①体重计（秤）引起的计量误差（常用体重计分度值50～200g）；②患者正常生理代谢；③患者透析治疗过程中摄入量误差；④透析治疗脱水的设定误差；⑤血液管路盐水预冲量和回水量及治疗中补液量等引起的误差；⑥计量单位不同（脱水设定是L，患者体重是kg）产生的误差。","key":"先排除这些非机器因素，再怀疑机器。","page":54},{"id":312,"chapter":"第7章 血液净化设备的使用与维护","section":"六、脱水（超滤）误差","roles":["技师"],"level":"进阶","type":"填空","q":"透析治疗结束后，患者的脱水量与设定脱水量差值小于±____kg（体重计分度值100g）时，可忽略不计；差值＞±____ml/h时应暂停使用透析机。","a":"0.2；50","key":"0.2kg为总量，50ml/h为每小时速率，单位不同。","page":54},{"id":313,"chapter":"第7章 血液净化设备的使用与维护","section":"六、脱水（超滤）误差","roles":["技师"],"level":"高级","type":"简答","q":"对有平衡装置的透析机，如何用电子秤检验脱水准确性？判定标准是什么？","a":"①透析机准备好，进入模拟透析状态；②把透析液接头放入盛水容器内（约3000ml），容器放在电子秤上（精度2g），电子秤置零；③透析机设定除水量1000ml、脱水速度1000ml/h，进入治疗状态；④观察电子秤显示值与透析机记录脱水量的情况，差值在±40ml/（g•h）之内说明误差在允许范围内；反之存在平衡装置误差或脱水泵误差，应检查平衡系统或校正脱水泵。","key":"透析机脱水误差=脱水泵误差与平衡装置误差叠加。","page":54},{"id":314,"chapter":"第7章 血液净化设备的使用与维护","section":"六、脱水（超滤）误差","roles":["护士","技师"],"level":"高级","type":"判断","q":"透析机设定脱水速度为0时，所有透析机均不会产生任何脱水。（对/错？）","a":"错。有些透析机为防止反超滤的发生设定了最小超滤量（50～100ml/h），设定脱水速度为0时仍会有50～100ml/h的脱水。","key":"无超滤需求患者（如低血压、单纯弥散）需注意这部分隐性脱水。","page":54},{"id":315,"chapter":"第7章 血液净化设备的使用与维护","section":"六、脱水（超滤）误差","roles":["医生","护士","技师"],"level":"高级","type":"案例分析","q":"某患者透析4h，设定脱水2.0L，下机称重实际脱水约2.8kg，已排除体重计、进食、补液及预冲回水量等因素。应如何处理？","a":"①差值约0.8kg，超过±0.2kg，折算约200ml/h，大于±50ml/h，应暂停使用该透析机；②怀疑透析机故障时检测脱水准确性：有平衡装置的机器用电子秤法检验（模拟透析，设定1000ml、1000ml/h，差值应在±40ml/（g•h）内）；③检查平衡装置及平衡系统水路有无泄漏、故障，校正脱水泵；④脱水误差由透析机造成时机器一般不报警，不能以无报警排除机器故障。","key":"机器源性脱水误差“一般不报警”，需靠结果比对发现。","page":54},{"id":316,"chapter":"第7章 血液净化设备的使用与维护","section":"六、脱水（超滤）误差","roles":["技师"],"level":"进阶","type":"简答","q":"透析机脱水误差的定义是什么？透析治疗中发现机器泄漏应如何处理？","a":"①透析机脱水误差指透析机平衡装置和脱水泵故障引起的脱水误差，为脱水泵误差和平衡装置误差叠加而成；②平衡装置本身或平衡系统内的水路部分出现泄漏、故障都可引起脱水误差；③治疗中发现透析机有泄漏现象，应找出泄漏点。","key":"水路泄漏是脱水误差的重要隐性原因。","page":54},{"id":317,"chapter":"第8章 集中供液系统操作规范","section":"章首（集中供液系统分类）","roles":["技师"],"level":"基础","type":"简答","q":"集中供液系统主要分为哪两类？请写出中英文名称及缩写。","a":"①集中供浓缩透析液系统（central concentrate delivery system，CCDS）；②集中供透析液系统（central dialysis fluid delivery system，CDDS）。","key":"CCDS供的是浓缩液（A/B液），CDDS供的是成品透析液，两者质控标准不同。","page":55},{"id":318,"chapter":"第8章 集中供液系统操作规范","section":"第1节 集中供浓缩透析液系统 一、中心供液配制室","roles":["技师","护士"],"level":"基础","type":"简答","q":"中心供液配制室的选址和环境有哪些要求？","a":"①位于透析室清洁区内相对独立区域，周围无污染源，符合《医院消毒卫生标准》Ⅲ类环境，保持清洁；②房间选择满足供液系统安装要求；面积应为中心供液装置占地面积的1.5倍以上，周围有足够检修维护空间，地面承重符合设备要求，地面防水处理并设置地漏；③保持干燥，水电分开，有良好隔音和通风设施，满足设备所需温度、湿度和气压；④中心供液设备应避免日光直射；⑤配液所用反渗水符合YY 0572-2015，供应量满足配液要求。","key":"“清洁区、Ⅲ类环境、水电分开、避免日光直射”是验收检查要点。","page":55},{"id":319,"chapter":"第8章 集中供液系统操作规范","section":"第1节 集中供浓缩透析液系统 一、中心供液配制室","roles":["技师"],"level":"基础","type":"判断","q":"为保持配制室干燥，中心供液设备宜放置在阳光直射处。（对/错？）","a":"错。配制室应保持干燥，但中心供液设备应避免日光直射。","key":"日光直射可促进藻类/微生物生长并使温度升高。","page":55},{"id":320,"chapter":"第8章 集中供液系统操作规范","section":"第1节 集中供浓缩透析液系统 二、设备安装、培训及验收","roles":["技师"],"level":"基础","type":"简答","q":"CCDS设备的安装有哪些要求？","a":"①由生产厂商专业技术人员按照标准安装；②安装后专业人员必须对全部设备进行测试和验证，确保正常工作、安全有效，并提供安装记录和测试记录；③供应商应提供系统流程图与系统安装布局图、操作手册、维护保养记录表、相关使用注意事项等；④安装调试后，供应商应对设备维护工程师/技师或专职人员、操作人员进行系统培训，并有培训记录。","key":"安装记录、测试记录、培训记录三类文档缺一不可。","page":55},{"id":321,"chapter":"第8章 集中供液系统操作规范","section":"第1节 集中供浓缩透析液系统 二、设备安装、培训及验收","roles":["技师"],"level":"进阶","type":"简答","q":"CCDS安装初期应如何检测才能认为系统进入正常稳定状态？","a":"①每隔1周检测1次透析液中的细菌、内毒素、电解质；②连续检测3次，对每次数据记录保存；③连续测定的3次数值趋势稳定且合格，可认为系统进入正常稳定状态。","key":"“每隔1周、连续3次、趋势稳定且合格”三个条件同时满足。","page":56},{"id":322,"chapter":"第8章 集中供液系统操作规范","section":"第1节 集中供浓缩透析液系统 二、设备安装、培训及验收","roles":["技师"],"level":"进阶","type":"简答","q":"CCDS验收应满足哪些条件？","a":"①设备涉及的相关标准，由厂商提供国家药品监督管理局认定的第三方检测机构出具的检测报告；②配制浓缩液达到YY 0598-2015（细菌≤100CFU/ml，内毒素≤0.5EU/ml）；③运行后检测透析液各成分浓度、pH、渗透压等，确认与处方一致；④安装初期每隔1周检测细菌、内毒素、电解质，连续3次稳定合格；⑤试用一定时间后证实操作便利性、参数设置合理性、性能稳定性，通过报警测试和功能测试，性能、功能与规格说明书相符方可验收。","key":"运行后须核对各成分浓度、pH、渗透压，不能只看电导率。","page":56},{"id":323,"chapter":"第8章 集中供液系统操作规范","section":"第1节 集中供浓缩透析液系统 二、设备安装、培训及验收","roles":["技师","护士"],"level":"进阶","type":"案例分析","q":"某中心新装CCDS，第1周检测细菌、内毒素、电解质均合格，主任要求即刻正式验收全面使用。作为技师如何回应？","a":"①不符合规程：安装初期需每隔1周检测1次细菌、内毒素、电解质，连续检测3次并记录；②连续3次数值趋势稳定且合格，方可认为系统进入正常稳定状态；③运行后还须检测透析液各成分浓度、pH、渗透压，确认与处方一致；④验收还需厂商提供第三方检测报告，且试用一定时间后通过报警测试和功能测试，性能、功能与说明书相符方可验收。","key":"单次合格不代表系统稳定，“连续3次”是硬性要求。","page":56},{"id":324,"chapter":"第8章 集中供液系统操作规范","section":"第1节 集中供浓缩透析液系统 三、浓缩透析液配制","roles":["技师","护士"],"level":"基础","type":"简答","q":"浓缩透析液配制的制剂要求和人员要求是什么？","a":"制剂：①配制用反渗水必须符合YY 0572-2015；②使用国家药品监督管理局批准的透析液干粉，具有注册证、生产许可证、经营许可证。人员：A液、B液配制应由经过培训的工程师/技师、护士完成，做好配制记录，并有专人核查登记。","key":"“专人核查登记”是双人核对制度，单人配制无核查不合规。","page":56},{"id":325,"chapter":"第8章 集中供液系统操作规范","section":"第1节 集中供浓缩透析液系统 三、浓缩透析液配制","roles":["技师","护士"],"level":"基础","type":"简答","q":"浓缩液配制的签字登记制度应登记哪些信息？配制人员着装有何要求？","a":"登记：配制时间、配制种类、批号、干粉量、电导率或密度、pH、配制人、核对人等。着装：佩戴口罩、手套、帽子、袖套，着工作服。","key":"袖套常被遗漏；登记中“批号”是追溯关键。","page":57},{"id":326,"chapter":"第8章 集中供液系统操作规范","section":"第1节 集中供浓缩透析液系统 三、浓缩透析液配制","roles":["技师","护士"],"level":"基础","type":"判断","q":"使用CCDS时，每次配制前后需清洗配液桶，连续配制时中途也必须清洗。（对/错？）","a":"错。使用CCDS每次配制前后需清洗配液桶，连续配制时中途可不清洗。","key":"注意“连续配制中途可不清洗”这一例外。","page":57},{"id":327,"chapter":"第8章 集中供液系统操作规范","section":"第1节 集中供浓缩透析液系统 三、浓缩透析液配制","roles":["技师","护士"],"level":"基础","type":"简答","q":"配制浓缩透析液前须检查哪些内容？","a":"①透析粉有效日期、合格证；②包装上配制比例与血液透析机设定的透析液处方比例是否一致；③透析粉包装是否完好、有无泄漏；④目视是否有杂质。确认无异常后方可配制，否则严禁使用。","key":"配比与透析机处方比例一致是防止电解质紊乱的关键核对点。","page":57},{"id":328,"chapter":"第8章 集中供液系统操作规范","section":"第1节 集中供浓缩透析液系统 三、浓缩透析液配制","roles":["技师","护士"],"level":"进阶","type":"案例分析","q":"配液时护士发现新到一批A粉包装上标注的配制比例与本中心透析机设定的处方比例不同，但其他信息无异常。是否可以配制使用？","a":"①不可以；②规程要求配制前检查包装上配制比例与透析机设定的透析液处方比例是否一致，确认无异常后方可配制，否则严禁使用；③应停用该批次，上报并联系供应商核实/更换；④做好登记记录。","key":"比例不符将导致透析液成分错误，属严重安全事件，“严禁使用”。","page":57},{"id":329,"chapter":"第8章 集中供液系统操作规范","section":"第1节 集中供浓缩透析液系统 三、浓缩透析液配制","roles":["技师","护士"],"level":"高级","type":"简答","q":"为保证B浓缩液浓度和微生物符合要求，透析B粉溶解应遵循哪些原则？","a":"①现配现用、少量多次；②设定合适的搅拌时间和强度，确保充分溶解，同时避免过度搅拌，具体根据B粉溶解情况及碳酸氢根检测结果确定；③具有加热功能的CCDS须设定合适的加热温度，避免二氧化碳析出及后级系统碳酸氢钠结晶，具体温度根据碳酸氢钠溶解度及碳酸氢根检测结果确定。","key":"过度搅拌和温度不当都会导致CO2逸出、碳酸氢根降低。","page":57},{"id":330,"chapter":"第8章 集中供液系统操作规范","section":"第1节 集中供浓缩透析液系统 三、浓缩透析液配制","roles":["技师"],"level":"高级","type":"案例分析","q":"某中心CCDS的B液碳酸氢根检测偏低，后级管路出现白色结晶，B液每天早上一次配足全天用量。请分析并提出改进。","a":"①违反“现配现用、少量多次”原则，B液放置时间长，CO2逸出、碳酸氢根降低且易滋生微生物；②检查搅拌时间与强度是否过度，应根据B粉溶解情况及碳酸氢根检测结果调整；③若CCDS具加热功能，核查加热温度设置，避免CO2析出及后级碳酸氢钠结晶；④配制后检测电导率或密度在合格范围内方能使用；⑤每天治疗后将系统内所有B液排空并用合格透析用水完整冲洗；⑥输送管路已有沉淀或盐积聚，推荐用1%～2%醋酸溶液清洗。","key":"B液结晶/碳酸氢根偏低需从配制方式、搅拌、加热三方面查找。","page":57},{"id":331,"chapter":"第8章 集中供液系统操作规范","section":"第1节 集中供浓缩透析液系统 四、设备管理和维护（一）一般性维护","roles":["技师"],"level":"基础","type":"简答","q":"CCDS一般性维护中，各项检查/校验的频次分别是多少？","a":"①每月：检查系统管路（电路、水路、连接件、阀门等），破损漏液或损耗组件及时更换；②每季度：检查储液桶上的空气过滤器，如已潮湿应予更换；③每半年：设备参数校验及功能测试检查；④微粒过滤器和内毒素过滤器：根据设备生产商要求及实际使用情况更换并记录。","key":"月-季-半年三个频次常被打乱考查。","page":57},{"id":332,"chapter":"第8章 集中供液系统操作规范","section":"第1节 集中供浓缩透析液系统 四、设备管理和维护（一）一般性维护","roles":["技师"],"level":"基础","type":"简答","q":"中心供液设备的工作档案应包括哪些内容？由谁负责维护？","a":"①每台设备建立独立工作档案，包括运行状态、变更参数设置、滤芯更换、清洗消毒、故障维修等；②由专职工程师/技师进行系统维护，按操作说明书进行管理与维护保养；③系统出现故障后应联系专业人员维修。","key":"“每台设备独立档案”与“变更参数设置”需记录。","page":57},{"id":333,"chapter":"第8章 集中供液系统操作规范","section":"第1节 集中供浓缩透析液系统 四、设备管理和维护（二）消毒和清洗","roles":["技师","护士"],"level":"基础","type":"简答","q":"CCDS消毒时有哪些安全警示和隔离要求？","a":"①在桶外悬挂“消毒中”警示牌，并通知值班医师及护士；②采用自动消毒程序时，消毒系统的激活应能导致报警系统的激活；③集中供液和/或透析机消毒时，应确保输送管路与血液透析机断开或阀门为关闭状态；④每次消毒数据记录于专用消毒登记本。","key":"防止消毒液误入透析机/患者是首要安全目标。","page":58},{"id":334,"chapter":"第8章 集中供液系统操作规范","section":"第1节 集中供浓缩透析液系统 四、设备管理和维护（二）消毒和清洗","roles":["技师","护士"],"level":"基础","type":"判断","q":"集中供液系统消毒时，可保持输送管路与血液透析机连通，以便同步消毒透析机。（对/错？）","a":"错。集中供液和/或透析机进行消毒时，应确保其输送管路与血液透析机断开或阀门为关闭状态。","key":"连通状态下消毒有消毒液进入透析回路的风险。","page":58},{"id":335,"chapter":"第8章 集中供液系统操作规范","section":"第1节 集中供浓缩透析液系统 四、设备管理和维护（二）消毒和清洗","roles":["技师"],"level":"基础","type":"填空","q":"CCDS每周至少消毒B液配制桶____次，并更换____μm过滤器的滤芯；B液系统化学消毒频率不应低于每周____次。","a":"1；1；1。","key":"B液系统是微生物控制重点，每周至少1次。","page":58},{"id":336,"chapter":"第8章 集中供液系统操作规范","section":"第1节 集中供浓缩透析液系统 四、设备管理和维护（二）消毒和清洗","roles":["技师"],"level":"进阶","type":"判断","q":"CCDS的A液配制桶和管路与B液一样，需每周常规消毒。（对/错？）","a":"错。A液配制桶和管路不需要常规消毒，但新装管路或管路有明显污垢时需要冲洗和消毒。","key":"A液为酸性不易滋菌，不需常规消毒；新装或有污垢是例外。","page":58},{"id":337,"chapter":"第8章 集中供液系统操作规范","section":"第1节 集中供浓缩透析液系统 四、设备管理和维护（二）消毒和清洗","roles":["技师"],"level":"进阶","type":"简答","q":"B液系统化学消毒的消毒剂、浓度和时间有何要求？","a":"①必须使用具有国家药品监督管理局或所在地省级卫生健康行政部门发放的卫生许可证或备案的消毒剂商品；②使用0.3%～0.5%过氧乙酸或0.5%～1%次氯酸钠溶液，消毒时间30min；③或使用系统说明书推荐的其他消毒液、有效浓度和时间；④频率不低于每周1次。","key":"浓缩液系统消毒浓度以百分比表示（0.3%～0.5%过氧乙酸），与水处理的1500～2000mg/L不同。","page":58},{"id":338,"chapter":"第8章 集中供液系统操作规范","section":"第1节 集中供浓缩透析液系统 四、设备管理和维护（二）消毒和清洗","roles":["技师"],"level":"高级","type":"案例分析","q":"技师对B液系统进行过氧乙酸消毒，直接将消毒液注入未冲洗的B液配液罐，发现大量气泡产生，消毒效果不佳。请分析错误并给出正确流程。","a":"①错误：使用过氧乙酸等酸性消毒液前未先将B液配液罐、储液罐及输送管路中的碳酸氢钠冲洗干净，酸碱反应产气并消耗消毒剂；②正确流程：先冲净碳酸氢钠→使用0.3%～0.5%过氧乙酸（或0.5%～1%次氯酸钠）消毒30min→循环结束开始浸泡前，分别在配液罐、储液罐、浓缩液管路末端检测消毒液有效浓度→消毒包含整个输送管路（T型连接含支管，每个端口打开用消毒剂冲洗，再用反渗水冲洗）→冲洗后检测残余浓度（过氧乙酸＜1mg/L）→记录于消毒登记本。","key":"酸性消毒剂前必须冲净碳酸氢钠，是B液消毒最常见的操作错误。","page":58},{"id":339,"chapter":"第8章 集中供液系统操作规范","section":"第1节 集中供浓缩透析液系统 四、设备管理和维护（二）消毒和清洗","roles":["技师"],"level":"进阶","type":"简答","q":"B液系统化学消毒时，应在何处检测消毒液有效浓度？T型连接时有何特别要求？","a":"①消毒液循环结束开始浸泡前，分别在配液罐、储液罐、浓缩液管路末端检测有效浓度；②消毒需包含整个输送管路，T型连接时应包括与透析机连接的支管路；③每个与透析机连接的端口应打开并用消毒剂冲洗，然后用反渗水冲洗。","key":"T型支管是消毒盲区，必须逐个端口打开冲洗。","page":58},{"id":340,"chapter":"第8章 集中供液系统操作规范","section":"第1节 集中供浓缩透析液系统 四、设备管理和维护（二）消毒和清洗","roles":["技师","护士"],"level":"基础","type":"填空","q":"B液系统消毒冲洗结束后，应检测消毒液残余浓度：过氧乙酸＜____mg/L，次氯酸钠＜____mg/L。","a":"1；0.1。","key":"若用其他消毒液，应低于说明书推荐的残余浓度。","page":58},{"id":341,"chapter":"第8章 集中供液系统操作规范","section":"第1节 集中供浓缩透析液系统 四、设备管理和维护（二）消毒和清洗","roles":["技师"],"level":"进阶","type":"填空","q":"CCDS系统热消毒每周____次或更高频率；在距离加热器____的管路末端温度应不低于____℃，持续时间大于____min；热消毒后水温须降至____方可配液。","a":"1；最远；85；20；常温。","key":"测温点必须是距加热器最远的管路末端。","page":59},{"id":342,"chapter":"第8章 集中供液系统操作规范","section":"第1节 集中供浓缩透析液系统 四、设备管理和维护（二）消毒和清洗","roles":["技师"],"level":"进阶","type":"简答","q":"CCDS使用其他消毒方式及消毒策略验证有何要求？输送管路有沉淀时如何处理？","a":"①使用其他消毒方式应按系统说明书实施，消毒时监测消毒液有效成分确保有效，消毒后监测残留成分确保患者安全；②血液透析室（中心）应根据微生物监测结果对消毒策略进行验证；③每天治疗后将系统内所有B液排空，用合格透析用水完整冲洗；④输送管路发生沉淀或盐积聚时，推荐使用1%～2%醋酸溶液清洗。","key":"消毒策略要用微生物监测结果“验证”，不是一成不变。","page":59},{"id":343,"chapter":"第8章 集中供液系统操作规范","section":"第1节 集中供浓缩透析液系统 五、质量管理（一）透析干粉混合溶解系统监测","roles":["技师"],"level":"进阶","type":"简答","q":"CCDS每次配液后如何检测浓缩液是否合格？检测仪器校准有何要求？","a":"每次配液搅拌后对完全溶解的浓缩液检测，可用电导率和/或密度检测：①电导率：在线或离线检测，与透析干粉说明书离子总浓度对应的浓缩液电导率数值对比，判断是否符合要求或是否充分溶解；每年至少1次校准电导率检测仪，防止腐蚀产生较大误差；②密度：根据供应商提供的浓缩液密度数值测量对比；每年至少1次校准压力传感器。","key":"电导率仪易被腐蚀，年度校准不可省略；合格范围由制造商在安装检测完成后给出。","page":59},{"id":344,"chapter":"第8章 集中供液系统操作规范","section":"第1节 集中供浓缩透析液系统 五、质量管理（二）生物污染监测","roles":["技师","护士"],"level":"基础","type":"填空","q":"含碳酸氢盐的浓缩透析液细菌总数≤____CFU/ml，真菌总数≤____CFU/ml，大肠埃希菌____；内毒素水平≤____EU/ml。","a":"100；10；不得检出；0.5。","key":"真菌≤10CFU/ml、大肠埃希菌不得检出是常漏点。","page":59},{"id":345,"chapter":"第8章 集中供液系统操作规范","section":"第1节 集中供浓缩透析液系统 五、质量管理（二）生物污染监测","roles":["技师","护士"],"level":"基础","type":"简答","q":"透析液细菌和内毒素检测的频次和覆盖要求是什么？","a":"①细菌检测：每月1次，每次至少检测2台血液透析机；每台透析机每年至少检测1次；②内毒素检测：每3个月1次，每次至少检测2台血液透析机；每台透析机每年至少检测1次。","key":"“每次至少2台、每台每年至少1次”需轮换覆盖全部机器。","page":59},{"id":346,"chapter":"第8章 集中供液系统操作规范","section":"第1节 集中供浓缩透析液系统 五、质量管理（二）生物污染监测","roles":["医生","护士","技师"],"level":"进阶","type":"填空","q":"按表7-1，标准透析液微生物总数最大允许水平＜____CFU/ml、干预水平____CFU/ml，内毒素最大允许水平＜____EU/ml、干预水平____EU/ml；超纯透析液微生物总数＜____CFU/ml，内毒素＜____EU/ml。","a":"100；50；0.5；0.25；0.1；0.03。","key":"一般情况下干预水平为最大允许水平的50%。","page":60},{"id":347,"chapter":"第8章 集中供液系统操作规范","section":"第1节 集中供浓缩透析液系统 五、质量管理（二）生物污染监测","roles":["技师","护士"],"level":"基础","type":"判断","q":"透析液内毒素检测应每月1次，每次至少检测2台血液透析机。（对/错？）","a":"错。透析液内毒素检测为每3个月1次，每次至少检测2台血液透析机，每台每年至少1次；每月1次的是细菌检测。","key":"细菌每月、内毒素每季度。","page":60},{"id":348,"chapter":"第8章 集中供液系统操作规范","section":"第1节 集中供浓缩透析液系统 五、质量管理（二）生物污染监测","roles":["技师","护士"],"level":"进阶","type":"简答","q":"透析液微生物检测应采用哪些方法？首选哪种？检测超纯透析液有何特殊要求？","a":"①常规方法：倾注平板法、涂布平板法、薄膜过滤法获得细菌总数（标准培养皿计数）；②薄膜过滤法是首选；③检测是否达到超纯透析液标准，应使用薄膜过滤法，或其他确认能提供相同结果的方法。","key":"超纯透析液菌数极低（＜0.1CFU/ml），只有薄膜过滤法能满足灵敏度。","page":60},{"id":349,"chapter":"第8章 集中供液系统操作规范","section":"第1节 集中供浓缩透析液系统 五、质量管理（二）生物污染监测","roles":["技师","护士"],"level":"进阶","type":"判断","q":"对透析液和碳酸氢盐浓缩液进行细菌培养，可选用血琼脂培养基或巧克力琼脂培养基。（对/错？）","a":"错。宜选用胰化蛋白胨葡萄糖（TGEA）培养基、R2A营养琼脂培养基（R2A）或其他确认能提供相同结果的培养基，不能使用血琼脂培养基和巧克力琼脂培养基。","key":"检验科常规用血平板，送检时须注明培养基要求。","page":60},{"id":350,"chapter":"第8章 集中供液系统操作规范","section":"第1节 集中供浓缩透析液系统 五、质量管理（二）生物污染监测","roles":["技师","护士"],"level":"进阶","type":"填空","q":"透析液细菌培养温度为____℃，培养时间为____d；样本如不能在____h内检测，需遵循转运和检测要求，用于菌落计数的样本不应被____。","a":"17～23；7；4；冻结。","key":"不是37℃、48h的临床常规条件。","page":60},{"id":351,"chapter":"第8章 集中供液系统操作规范","section":"第1节 集中供浓缩透析液系统 五、质量管理（二）生物污染监测","roles":["技师","护士"],"level":"高级","type":"简答","q":"透析液微生物检测在培养与样本处理过程中有哪些注意事项？","a":"①培养基选TGEA、R2A或等效培养基，禁用血琼脂和巧克力琼脂；②培养温度17～23℃，时间7d；③每种培养皿孵化时应储存在密封塑料袋中，避免琼脂干燥；④样本收集后尽快检测，不能在4h内检测须遵循转运和检测要求，菌落计数样本不应冻结；⑤对监测结果进行趋势分析。","key":"低温长时培养+密封防干是水系菌检出的关键。","page":60},{"id":352,"chapter":"第8章 集中供液系统操作规范","section":"第1节 集中供浓缩透析液系统 五、质量管理（二）生物污染监测","roles":["医生","技师"],"level":"高级","type":"案例分析","q":"某日同一班次2名使用CCDS供液的患者透析中出现寒战、发热，医生怀疑菌血症。从集中供液质控角度应如何处置？","a":"①按规程，出现患者发热、疑似菌血症/真菌血症病例，应及时检测并给予相应处理；②及时采样检测相关透析机透析液及碳酸氢盐浓缩液的细菌（薄膜过滤法首选，TGEA/R2A培养基，17～23℃培养7d）和内毒素，必要时检测透析用水；③对照标准：浓缩液细菌≤100CFU/ml、真菌≤10CFU/ml、大肠埃希菌不得检出、内毒素≤0.5EU/ml；④对B液系统等进行消毒处理，复核消毒记录与频次（B液每周至少1次、更换1μm滤芯）；⑤结合既往监测进行趋势分析，根据结果验证并调整消毒策略。","key":"患者发热是启动“及时检测”的触发条件，不必等月度例行检测。","page":60},{"id":353,"chapter":"第8章 集中供液系统操作规范","section":"第1节 集中供浓缩透析液系统 五、质量管理（二）生物污染监测","roles":["技师"],"level":"高级","type":"简答","q":"对浓缩液和透析干粉进行内毒素检测时，供试液如何制备与测定？","a":"①浓缩液：直接取样成供试液；②干粉：称取样品5g，用细菌内毒素检查用水按使用说明书配制成浓缩液供试液；③取供试液按使用说明的比例混合，以细菌内毒素检查用水代替透析用水稀释；④按《中华人民共和国药典（二部）》（2010年版）附录ⅪE方法检查。","key":"稀释必须用细菌内毒素检查用水，不能用透析用水。","page":60},{"id":354,"chapter":"第8章 集中供液系统操作规范","section":"第2节 集中供透析液系统 二、设备安装、培训及验收","roles":["技师"],"level":"基础","type":"填空","q":"CDDS配制的透析液须达到超纯透析液的标准（ISO 11663-2014）：细菌数量＜____CFU/ml，内毒素＜____EU/ml。","a":"0.1；0.03。","key":"CDDS直接供成品透析液，标准为超纯级，远严于CCDS浓缩液。","page":61},{"id":355,"chapter":"第8章 集中供液系统操作规范","section":"第2节 集中供透析液系统 二、设备安装、培训及验收","roles":["技师"],"level":"进阶","type":"判断","q":"CDDS验收时，透析液细菌≤100CFU/ml、内毒素≤0.5EU/ml即可判定合格。（对/错？）","a":"错。该标准适用于CCDS浓缩液（YY 0598-2015）；CDDS配制的透析液须达到超纯透析液标准：细菌＜0.1CFU/ml，内毒素＜0.03EU/ml。","key":"CCDS与CDDS验收标准差异是高频考点。","page":61},{"id":356,"chapter":"第8章 集中供液系统操作规范","section":"第2节 集中供透析液系统 四、设备管理和维护","roles":["技师","护士"],"level":"进阶","type":"简答","q":"CDDS消毒和清洗有哪些要求？","a":"①采用自动消毒程序时，消毒系统的激活应自动激活报警系统；②确保消毒时透析治疗模式为禁用状态；③每次消毒数据记录于专用消毒登记本；④当日透析治疗结束后，按厂家说明书要求执行消毒；⑤根据微生物监测结果对消毒方案进行验证。","key":"CDDS的特有要求是“消毒时透析治疗模式禁用”。","page":62},{"id":357,"chapter":"第8章 集中供液系统操作规范","section":"第2节 集中供透析液系统 四、设备管理和维护","roles":["技师","护士"],"level":"高级","type":"案例分析","q":"某中心CDDS在下午最后一班透析尚有2台机器未下机时启动了自动消毒程序。请指出问题并说明正确做法。","a":"①问题：消毒期间仍有透析在进行，违反“消毒时透析治疗模式为禁用状态”的要求，存在消毒液进入透析液路的严重风险；②正确：当日透析治疗全部结束后，按厂家说明书要求执行消毒；③自动消毒激活时应自动激活报警系统；④确保透析治疗模式禁用；⑤消毒数据记录于专用登记本，并根据微生物监测结果验证消毒方案。","key":"CDDS是成品液直供，消毒时机与治疗模式锁定直接关乎患者安全。","page":62},{"id":358,"chapter":"第8章 集中供液系统操作规范","section":"第2节 集中供透析液系统 五、质量管理","roles":["技师","护士"],"level":"基础","type":"简答","q":"CDDS的配制登记和配制后检测要求有哪些？生物污染标准是什么？","a":"①必须建立签字登记制度（配制时间、种类、批号、干粉量、电导率或密度、pH、配制人、核对人）；②配制人员戴口罩、手套、帽子、袖套，着工作服；③严格按厂商说明及流程配制，配制前检查有效期、合格证、配比、包装、杂质；④配制完成后必须检测电导率或密度，在合格范围内方能使用；⑤生物污染标准：微生物总数＜0.1CFU/ml，内毒素＜0.03EU/ml，检测方法同CCDS。","key":"CDDS日常生物污染标准即超纯标准，需薄膜过滤法检测。","page":63},{"id":359,"chapter":"第8章 集中供液系统操作规范","section":"附：集中供液系统设备要求 一、（一）材料的相容性","roles":["技师"],"level":"进阶","type":"简答","q":"集中供液系统对材料相容性有何要求？哪些材料禁止使用？","a":"①溶解系统、储存系统、泵、管路、阀门、密封圈、供液系统和检测装置等所有接触浓缩液部分，不应与浓缩透析液发生相互作用，消毒时不应与消毒液相互作用；②铜、黄铜、铅、锌、电镀材料和铝等已证明在血液透析中会产生毒素的材料禁止使用；③证明试验参照YY 0598-2015附录C，由设备厂商提供报告。","key":"改造维修时自行更换黄铜接头是现场常见违规。","page":63},{"id":360,"chapter":"第8章 集中供液系统操作规范","section":"附：集中供液系统设备要求 （前言）","roles":["技师"],"level":"基础","type":"判断","q":"按规程附录所述，集中供液系统目前在中国已纳入医疗器械管理。（对/错？）","a":"错。规程指出集中供液系统在中国尚未列入医疗器械管理，鉴于其发展迅速、产品缺乏监管，建议将其纳入医疗器械管理。","key":"注意是“建议纳入”，而非已纳入。","page":63},{"id":361,"chapter":"第8章 集中供液系统操作规范","section":"附：集中供液系统设备要求 一、（二）溶解系统","roles":["技师"],"level":"进阶","type":"简答","q":"CCDS溶解系统应满足哪些要求？","a":"①材料抗腐蚀；②能按比例准确并充分溶解干粉；③能将桶内浓缩液完全排空并具备反渗水自动清洗功能；④具备高、低液位报警及防止溢流、防止泵空转功能；⑤不应使用液位观察管，以免导致藻类和真菌类生长；⑥浓缩液溶解后注入储存桶前应经过1μm和0.22μm（或更精细）过滤器过滤，过滤器无纤维释放且不含已知对人体有害材料。","key":"禁用液位观察管（藻类、真菌滋生）是易忽视点。","page":64},{"id":362,"chapter":"第8章 集中供液系统操作规范","section":"附：集中供液系统设备要求 一、（三）储液系统","roles":["技师"],"level":"进阶","type":"简答","q":"CCDS储液系统有哪些设计要求？","a":"①碳酸氢盐浓缩液储存罐应有锥形或碗形底，从底部最低点引流；刚性、非伸屈性酸性浓缩液容器可为平底，并以防止污染的方式确保液体流出；②碳酸氢盐储存容器应有密封盖，建议安装≤0.45μm疏水性空气过滤器通风；③具备高、低液位报警及防止溢流、防止泵空转功能；④配有采样口；⑤B浓缩液储液罐后建议安装0.1μm（或更精细）内毒素过滤器。","key":"B液罐锥形/碗形底、底部最低点引流是为了排空无残留。","page":64},{"id":363,"chapter":"第8章 集中供液系统操作规范","section":"附：集中供液系统设备要求 一、（三）储液系统","roles":["技师"],"level":"高级","type":"填空","q":"碳酸氢盐储存容器建议安装≤____μm的疏水性空气过滤器通风，一般____年更换一次，如潮湿应立即更换；B浓缩液储液罐后建议安装孔径为____μm（或更精细）的内毒素过滤器，一般____个月更换1次。","a":"0.45；1～2；0.1；3～6。","key":"空气过滤器每季度检查、潮湿即换；内毒素滤器3～6个月。","page":64},{"id":364,"chapter":"第8章 集中供液系统操作规范","section":"附：集中供液系统设备要求 一、（四）供液系统","roles":["技师","护士"],"level":"基础","type":"简答","q":"CCDS供液系统有哪些要求？连接透析机的颜色标识如何规定？","a":"①输送方式分压力输送和重力输送，供液压力均应符合透析机吸液压力要求；②供液管路与透析机连接处建议有常规颜色标识：A液红色，B液蓝色，A液有多个配方时接口应有标识；③设计和操作应最大程度降低细菌繁殖和生物膜形成；④B液管路采用全循环管路，与透析机连接方式有U型和T型，建议使用U型；⑤浓缩液管路末端应有采样口。","key":"A红B蓝；B液建议U型连接以减少盲端。","page":64},{"id":365,"chapter":"第8章 集中供液系统操作规范","section":"附：集中供液系统设备要求 一、（五）安全性要求","roles":["技师"],"level":"进阶","type":"简答","q":"为什么B液管路建议采用U型连接？浓缩液混合装置的最低安全要求是什么？","a":"①B液管路采用全循环管路，U型连接可避免T型支管形成死腔、降低细菌繁殖和生物膜形成（T型连接时消毒须包括支管路并逐个端口冲洗）；②最低安全要求：安装操作控制器，将操作疏忽和功能重置降至最低；对分配控制器进行清晰标识，将浓缩液转送过程中出现错误的可能性降至最低。","key":"U型优于T型的核心是消除支管盲端。","page":64},{"id":366,"chapter":"第8章 集中供液系统操作规范","section":"附：集中供液系统设备要求 一、（七）管道系统","roles":["技师"],"level":"基础","type":"判断","q":"集中供液管道系统维修时，可使用黄铜或镀锌接头替代原塑料接头。（对/错？）","a":"错。管道系统构造不应含有铝、铜、黄铜、铅、锌和电镀组件。","key":"这些材料会溶出有毒金属离子。","page":65},{"id":367,"chapter":"第8章 集中供液系统操作规范","section":"附：集中供液系统设备要求 一、（六）紫外线辐照器","roles":["技师"],"level":"高级","type":"填空","q":"浓缩透析液系统配置紫外线辐照器时，射线波长应为____nm；配以校准的紫外线强度仪时应能提供____mW·s/cm²的辐照剂量，否则应能提供____mW·s/cm²；辐照器后应配有一个____。","a":"254；16；30；内毒素滤器。","key":"紫外线杀菌后菌体释放内毒素，故其后须配内毒素滤器。","page":65},{"id":368,"chapter":"第8章 集中供液系统操作规范","section":"附：集中供液系统设备要求 一、（七）管道系统","roles":["技师"],"level":"进阶","type":"简答","q":"CCDS管道系统在微生物控制方面有何要求？","a":"①分配系统不应对浓缩液造成微生物污染，设计和操作应最大程度降低细菌繁殖和生物膜形成；②高频次消毒是最大程度降低细菌增殖和生物膜形成的方式；③构造不应含铝、铜、黄铜、铅、锌和电镀组件；④通过YY 0598-2015 6.3和C.3的试验方法，证实溶液内不存在细菌和特异性化学污染物。","key":"防生物膜靠高频次消毒，而非仅靠过滤。","page":65},{"id":369,"chapter":"第8章 集中供液系统操作规范","section":"附：集中供液系统设备要求 一、（八）电气安全（九）电磁兼容","roles":["技师"],"level":"高级","type":"简答","q":"集中供浓缩透析液系统的电气安全和电磁兼容应符合哪些标准？","a":"①有可能因患者持续利用液体通路而传导电流时，应符合GB 9706.1-2007；②电气系统与患者隔离时，应符合GB 4793.1-2007；③电磁兼容应符合YY 0505-2012。","key":"是否与患者电气隔离决定适用GB 9706.1还是GB 4793.1。","page":65},{"id":370,"chapter":"第8章 集中供液系统操作规范","section":"附：集中供液系统设备要求 二、集中供透析液系统","roles":["技师"],"level":"高级","type":"简答","q":"集中供透析液系统由哪些部分组成？其设备安全和材料生物学安全要求有哪些？","a":"组成：溶解装置和透析液配比及供给装置，与无配比系统的透析机（透析监视装置）组成中心供透析液自动透析系统；包括透析水储存、溶解装置与浓缩液制备、透析液配比、分配与供给系统。安全：①全系统满足GB 9706.1-2007、GB 9706.15-2008、YY 0709-2009；②透析监视装置满足GB 9706.2-2003、YY 0054-2010。生物学（GB/T 16886.1-2011）：细胞毒性计分不大于1；无迟发型超敏反应；无皮内反应；无急性全身毒性；血液溶血率小于5%。","key":"溶血率＜5%、细胞毒性≤1是常考数值。","page":66},{"id":371,"chapter":"第9章 血管通路的建立与管理","section":"章首 概述","roles":["医生","护士"],"level":"基础","type":"简答","q":"对于长期维持性血液透析患者，规程推荐首选哪种血管通路？应在何时完成构建？","a":"①推荐选择自体动静脉内瘘；②至少在透析导入前2～4周完成构建。","key":"“2～4周”是透析导入前的最晚构建时间，不要与内瘘成熟所需的4～6周混淆。","page":68},{"id":372,"chapter":"第9章 血管通路的建立与管理","section":"章首 概述","roles":["医生"],"level":"基础","type":"填空","q":"对于血管条件较差、难以完成自体动静脉内瘘构建的长期维持性透析患者，推荐选择____或____。","a":"移植血管内瘘；带涤纶套带隧道导管。","key":"急性肾损伤则依据预测的血液净化时间选无涤纶套无隧道导管或带涤纶套带隧道导管。","page":68},{"id":373,"chapter":"第9章 血管通路的建立与管理","section":"章首 概述","roles":["医生"],"level":"进阶","type":"案例分析","q":"患者男，72岁，CKD 5期拟行维持性血液透析，合并慢性心力衰竭，反复心衰住院。按规程，该患者长期血管通路应优先推荐哪类？为什么不首选常规自体内瘘？","a":"①推荐选择带涤纶套带隧道导管或动脉表浅化；②动静脉内瘘建立后形成动静脉分流，增加心脏负荷，合并慢性心衰者易诱发/加重心力衰竭；③最终仍需充分告知利弊，由患者行使最终选择权。","key":"心衰患者通路选择是高频考点：答案是“带涤纶套带隧道导管或动脉表浅化”，两者缺一不可。","page":68},{"id":374,"chapter":"第9章 血管通路的建立与管理","section":"章首 概述","roles":["医生","护士"],"level":"基础","type":"判断","q":"血管通路类型的最终选择权在主管医生，患者及家属只需配合。（对/错？）","a":"错。规程强调患者具有血管通路的最终选择权；医护人员的职责是充分向患者及其家属说明各种血管通路的利弊，以及患者适合的血管通路类型。","key":"知情选择是考核中常设陷阱的伦理要点。","page":68},{"id":375,"chapter":"第9章 血管通路的建立与管理","section":"章首 概述","roles":["医生","护士"],"level":"进阶","type":"简答","q":"规程指出“血管通路功能的长期维持应从构建血管通路开始”，请列出维持血管通路长期功能的主要措施。","a":"①构建时保持内瘘内膜光滑的规范缝合；②端侧吻合与端端吻合时形成面向近心端U型自然弯曲；③中心静脉导管放置于合适位置；④有计划、规律与规范的内瘘穿刺操作与保养；⑤中心静脉导管连接的无菌操作和合理抗凝；⑥内瘘经皮腔内治疗应严格把握适应证，考虑效益与卫生经济学比值，并获得患者或家属知情同意。","key":"“面向近心端的U型自然弯曲”是外科构建质量的核心描述，贯穿AVF手术步骤与术后检查。","page":68},{"id":376,"chapter":"第9章 血管通路的建立与管理","section":"第1节 中心静脉导管置管术 一、无隧道无涤纶套中心静脉导管置管术","roles":["医生"],"level":"基础","type":"简答","q":"无隧道无涤纶套中心静脉导管的置入部位有哪些？为什么锁骨下静脉不做常规选择？","a":"①主要部位：颈内静脉、股静脉和锁骨下静脉；②锁骨下静脉穿刺的血栓、狭窄发生率高，故不做常规选择；③目前双腔导管最常用。","key":"锁骨下静脉狭窄会毁掉同侧上肢未来的内瘘，这是不首选的核心原因。","page":68},{"id":377,"chapter":"第9章 血管通路的建立与管理","section":"第1节 中心静脉导管置管术 一、无隧道无涤纶套中心静脉导管置管术","roles":["医生"],"level":"基础","type":"简答","q":"无隧道无涤纶套中心静脉导管置管术的适应证有哪些？","a":"①急性药物中毒、免疫性疾病或危重症等需要建立体外循环进行血液净化治疗；②急性肾损伤需要血液净化治疗；③需要维持性或长期血液透析，但动静脉内瘘尚未成熟或内瘘失功；④腹膜透析出现并发症需要血液透析临时过渡治疗。","key":"注意第③④条：内瘘未成熟/失功及腹透临时过渡同样是临时导管适应证。","page":68},{"id":378,"chapter":"第9章 血管通路的建立与管理","section":"第1节 中心静脉导管置管术 一、无隧道无涤纶套中心静脉导管置管术","roles":["医生"],"level":"基础","type":"简答","q":"无隧道无涤纶套中心静脉导管置管术有无绝对禁忌证？相对禁忌证有哪些？","a":"无绝对禁忌证。相对禁忌证：①广泛腔静脉系统血栓形成；②穿刺局部有感染；③凝血功能障碍；④患者不配合。","key":"凝血功能障碍只是相对禁忌证，常被误答为绝对禁忌证。","page":69},{"id":379,"chapter":"第9章 血管通路的建立与管理","section":"第1节 中心静脉导管置管术 一、无隧道无涤纶套中心静脉导管置管术","roles":["医生"],"level":"基础","type":"简答","q":"无隧道无涤纶套中心静脉导管置管的术前评估与准备包括哪些内容？","a":"①签署知情同意书；②确定是否有可供置管用的中心静脉（颈内静脉、股静脉及锁骨下静脉等）；③根据条件选择患者体位和穿刺部位；④建议采用超声引导穿刺；⑤建议在手术室或治疗室内进行操作；⑥操作应由经过培训的专业医师完成。","key":"超声引导、规范场所和培训医师是质控检查的重点项目。","page":69},{"id":380,"chapter":"第9章 血管通路的建立与管理","section":"第1节 中心静脉导管置管术 一、无隧道无涤纶套中心静脉导管置管术","roles":["医生","护士"],"level":"进阶","type":"判断","q":"三腔中心静脉导管可同时输液和透析，规程推荐危重患者常规使用三腔导管。（对/错？）","a":"错。双（三）腔导管“死腔”减少、再循环减少，但三腔导管感染机会增加，不推荐常规使用；目前主要使用双腔导管。","key":"三腔管“不推荐常规使用”的理由是感染增加。","page":69},{"id":381,"chapter":"第9章 血管通路的建立与管理","section":"第1节 中心静脉导管置管术 一、无隧道无涤纶套中心静脉导管置管术","roles":["医生","护士"],"level":"基础","type":"填空","q":"临时中心静脉置管所需药品：2%利多卡因____ml、肝素____U（____mg）和生理盐水____ml。","a":"5；12500；100；200。","key":"肝素U与mg换算（1mg≈125U）需熟练，避免配制错误。","page":69},{"id":382,"chapter":"第9章 血管通路的建立与管理","section":"第1节 中心静脉导管置管术 一、无隧道无涤纶套中心静脉导管置管术","roles":["医生","护士"],"level":"进阶","type":"填空","q":"Seldinger法置管时，导管各腔先充满____肝素生理盐水后沿导丝插入；置管完成后用____肝素生理盐水或____溶液充满导管各腔并盖好肝素帽。","a":"250～500U/ml（2～4mg/ml）；1000U/ml（8mg/ml）；4%枸橼酸。","key":"预充浓度与封管浓度相差数倍，护理中混用是典型差错。","page":70},{"id":383,"chapter":"第9章 血管通路的建立与管理","section":"第1节 中心静脉导管置管术 一、无隧道无涤纶套中心静脉导管置管术","roles":["医生"],"level":"进阶","type":"简答","q":"简述以Seldinger方法行无隧道无涤纶套中心静脉置管的操作步骤。","a":"①按穿刺部位取体位（颈内静脉取头低仰卧位/Trendelenburg体位）；②穿刺部位皮肤消毒；③戴无菌手套、铺无菌巾；④0.5%～1.0%利多卡因局部浸润麻醉；⑤穿刺针穿刺并确认进入目标静脉；⑥固定穿刺针插入导丝（困难时不可强行插入）；⑦扩张器沿导丝扩张皮肤及皮下组织；⑧导管各腔充满250～500U/ml肝素生理盐水，沿导丝插入中心静脉；⑨抽出导丝；⑩分别检查各腔血流是否通畅；⑪用1000U/ml肝素生理盐水或4%枸橼酸充满各腔并盖肝素帽；⑫缝合固定导管；⑬局部无菌包扎。","key":"导丝插入困难“不可强行插入”是安全红线。","page":70},{"id":384,"chapter":"第9章 血管通路的建立与管理","section":"第1节 中心静脉导管置管术 一、无隧道无涤纶套中心静脉导管置管术","roles":["医生","护士"],"level":"基础","type":"简答","q":"无隧道无涤纶套中心静脉导管的拔除指征有哪些？拔除步骤如何？","a":"指征：①导管相关性感染；②导管失功，不能满足透析血流量；③导管周围出血且止血失败；④不再需要血液净化治疗，或可使用其他血管通路。步骤：①拔管前评估患者和导管状况；②局部消毒；③术者戴无菌手套、铺无菌巾；④无菌剪刀剪开固定缝线；⑤拔除导管；⑥压迫穿刺点止血；⑦局部无菌包扎。","key":"拔管前评估与拔管后压迫止血常被遗漏。","page":70},{"id":385,"chapter":"第9章 血管通路的建立与管理","section":"第1节 一、（七）经皮颈内静脉置管术","roles":["医生"],"level":"基础","type":"简答","q":"哪些患者不建议行经皮颈内静脉置管？颈内静脉置管有何优缺点？","a":"不建议：有明显充血性心力衰竭、呼吸困难、颈部较大肿瘤者。优点：①颈部易于保护，不易感染，使用时间相对较长；②颈内静脉压力较低，容易压迫止血；③血栓形成和血管狭窄发生机会少。缺点：①穿刺对体位要求较高；②不够美观、影响头部活动。","key":"心衰难以平卧者应改股静脉置管，这是临床最常见的部位选择题。","page":71},{"id":386,"chapter":"第9章 血管通路的建立与管理","section":"第1节 一、（七）经皮颈内静脉置管术","roles":["医生"],"level":"进阶","type":"简答","q":"为何临时置管首选右颈内静脉？若必须穿刺左侧颈内静脉，应注意什么？","a":"首选右侧原因：①右颈内静脉与无名静脉和上腔静脉几乎成一直线；②右侧胸膜顶低于左侧；③右侧无胸导管。左侧注意：左颈内静脉与锁骨下静脉汇合成左头臂静脉后形成一定角度，扩皮器进入不要太深，以免损伤血管。","key":"三条解剖理由须答全；左侧置管的核心风险是扩皮器过深致血管损伤。","page":71},{"id":387,"chapter":"第9章 血管通路的建立与管理","section":"第1节 一、（七）经皮颈内静脉置管术","roles":["医生"],"level":"进阶","type":"填空","q":"颈内静脉前路法：定位于胸锁乳突肌前缘中点（喉结/甲状软骨上缘水平），触及颈总动脉后旁开约____cm；针干与皮肤冠状面成____，针尖指向____。","a":"0.5～1.0；30°～45°；同侧乳头。","key":"前路法位置高、颈内静脉深、气胸少，但易误入颈总动脉。","page":71},{"id":388,"chapter":"第9章 血管通路的建立与管理","section":"第1节 一、（七）经皮颈内静脉置管术","roles":["医生"],"level":"进阶","type":"简答","q":"颈内静脉穿刺中路法如何定位和进针？为何最常用？","a":"①定位：胸锁乳突肌三角（锁骨头、胸骨头和锁骨形成的三角区）顶端为穿刺点，距锁骨上缘约3～5cm，颈总动脉前外侧；②进针：以锁骨内侧端上缘切迹为骨性标志，左拇指按压此切迹，在其上方3～5cm进针，针干与皮肤成30°～45°，针尖略偏外；③此路径颈内静脉较浅，穿刺成功机会大，故最常用。","key":"中路法针尖“略偏外”，偏内易误入颈总动脉。","page":71},{"id":389,"chapter":"第9章 血管通路的建立与管理","section":"第1节 一、（七）经皮颈内静脉置管术","roles":["医生"],"level":"进阶","type":"填空","q":"颈内静脉后路法以胸锁乳突肌外侧缘中、下____交点为进针点（锁骨上缘____cm），针体与皮肤呈____，针尖朝向____。","a":"1/3；3～5；15°～20°；颈静脉切迹（胸骨上切迹）。","key":"后路法进针角度（15°～20°）明显小于前、中路（30°～45°），易混淆。","page":72},{"id":390,"chapter":"第9章 血管通路的建立与管理","section":"第1节 一、（七）经皮颈内静脉置管术","roles":["医生"],"level":"进阶","type":"填空","q":"颈内静脉置管进针深度一般____，肥胖者____；置管长度男性____，女性____，小儿____。","a":"1.5～3cm；2～4cm；13～15cm；12～14cm；5～8cm。","key":"置管过深可致心律失常，过浅影响血流，长度需按性别/年龄选择。","page":72},{"id":391,"chapter":"第9章 血管通路的建立与管理","section":"第1节 一、（七）经皮颈内静脉置管术","roles":["医生","护士"],"level":"基础","type":"判断","q":"推荐颈内静脉临时置管后行胸部X线摄片，以了解导管位置。（对/错？）","a":"对。规程推荐置管后行胸部X线摄片了解导管位置；导丝插入过深或导管过长可致心律失常。","key":"带隧道导管更要求X线确认尖端位于右心房上部1/3。","page":72},{"id":392,"chapter":"第9章 血管通路的建立与管理","section":"第1节 一、（七）经皮颈内静脉置管术","roles":["医生"],"level":"进阶","type":"简答","q":"颈内静脉穿刺时如何判断穿刺针进入静脉还是误入动脉？需警惕哪些干扰判断的情况？","a":"①有突破感后见暗红色回血，推注压力小，提示进入静脉可能性大；②不能确定时可拔出注射器保留针头，观察血液流出速度；③血液呈喷射状或鲜红色，可能误穿动脉；④合并心力衰竭者静脉压较高，低氧血症患者动脉血颜色较暗，需注意鉴别。","key":"心衰（静脉压高）和低氧血症（动脉血暗）是导致“颜色判断失误”的两大陷阱。","page":73},{"id":393,"chapter":"第9章 血管通路的建立与管理","section":"第1节 一、（七）经皮颈内静脉置管术","roles":["医生"],"level":"进阶","type":"案例分析","q":"护士配合医生行右颈内静脉置管，回抽见鲜红色血液、呈喷射状。应如何处理？后续如何继续？","a":"①判断为误入动脉，立即拔出穿刺针，充分压迫（指压至少10min，否则易发生血肿）；②确认无出血后再继续穿刺；③如有明显血肿，建议改换其他部位；④避免同一部位反复穿刺；⑤密切观察血肿变化，警惕血肿压迫气管致窒息。","key":"压迫“至少10min”是硬指标；有明显血肿须换部位，不可原位继续。","page":73},{"id":394,"chapter":"第9章 血管通路的建立与管理","section":"第1节 一、（七）经皮颈内静脉置管术","roles":["医生"],"level":"进阶","type":"简答","q":"颈内静脉置管并发气胸及血气胸的原因、临床表现及预防处理是什么？","a":"原因：①患者不配合；②胸廓畸形，胸膜有粘连；③穿刺点过低。表现：①一般为局限气胸，可无症状、自行闭合；②呼吸困难、同侧呼吸音减低，胸部X线或CT确诊。预防处理：防止穿刺点过低，避免扩皮器进入太深，发生后按一般气胸处理。","key":"颈内静脉置管气胸较锁骨下穿刺少见，多见于经锁骨下或锁骨下凹切迹穿刺者。","page":73},{"id":395,"chapter":"第9章 血管通路的建立与管理","section":"第1节 一、（七）经皮颈内静脉置管术","roles":["医生","护士"],"level":"高级","type":"案例分析","q":"临时导管置管过程中，患者突发呼吸困难、口唇发绀、血氧下降，心尖部闻及水轮样杂音。最可能的诊断？需与哪些疾病鉴别？如何紧急处理？","a":"①诊断：空气栓塞（少见但可致命），超声检查有助诊断；②鉴别：心律失常、大面积肺栓塞、急性心肌梗死和心脏压塞；③处理：左侧头低位；经皮行右心房或右心室穿刺抽气；呼吸循环支持，高浓度吸氧。","key":"体位是“左侧头低位”，不是右侧卧位；水轮样杂音为特征性体征。","page":73},{"id":396,"chapter":"第9章 血管通路的建立与管理","section":"第1节 一、（七）经皮颈内静脉置管术","roles":["医生","护士"],"level":"基础","type":"简答","q":"颈内静脉导管相关感染的临床表现及处理原则是什么？","a":"表现：①不能解释的寒战、发热，尤其在透析过程中；②局部压痛和炎症反应；③白细胞增高，血培养确诊。处理：严格无菌操作；确诊后即应拔除导管，并做细菌培养，应用抗生素治疗。","key":"颈内静脉导管感染率远较股静脉低，但长期留置仍增加感染机会；临时导管感染确诊即拔管。","page":74},{"id":397,"chapter":"第9章 血管通路的建立与管理","section":"第1节 一、（七）经皮颈内静脉置管术","roles":["医生"],"level":"进阶","type":"简答","q":"中心静脉置管引起心律失常的原因、表现和预防措施有哪些？","a":"原因：导丝插入过深或导管过长。表现：多为窦性心动过速、室上性期前收缩或心动过速，且为一过性；严重心脏病患者有时可引起致命室性心律失常。预防：严重心脏疾病患者应避免颈内静脉或锁骨下静脉插管；操作建议在心电监护下进行。","key":"严重心脏病患者应避开颈内/锁骨下路径，并全程心电监护。","page":74},{"id":398,"chapter":"第9章 血管通路的建立与管理","section":"第1节 一、（七）经皮颈内静脉置管术","roles":["医生","护士"],"level":"高级","type":"案例分析","q":"患者行左颈内静脉临时置管，误刺动脉后术者继续操作，10min后颈部皮下血肿急骤增大，患者出现呼吸窘迫、喘鸣。请分析原因并给出处理，以及当日透析如何安排。","a":"①原因：损伤颈内静脉后压迫不准确或误刺动脉后继续操作，造成大出血压迫气管致窒息；②处理：对持续增大的血肿切开皮肤减压并压迫或缝合出血点；已出现严重窒息症状应及时气管插管，必要时立即气管切开；③避免当日透析，如确需透析，应采用无肝素透析。","key":"误刺动脉后“继续操作”是窒息的直接原因；当日确需透析必须无肝素。","page":74},{"id":399,"chapter":"第9章 血管通路的建立与管理","section":"第1节 一、（八）经皮股静脉置管术","roles":["医生"],"level":"基础","type":"简答","q":"经皮股静脉置管术的适用范围有哪些？","a":"①操作较容易，适合新开展经皮中心静脉置管技术的单位或术者；②卧床及全身情况较差者；③锁骨下静脉、上腔静脉血栓形成或颈内、锁骨下静脉插管有困难者；④无需长期留置导管或即插即用者；⑤插管后需紧急透析者。","key":"股静脉适合短期、紧急、不能配合或不能搬动的患者。","page":74},{"id":400,"chapter":"第9章 血管通路的建立与管理","section":"第1节 一、（八）经皮股静脉置管术","roles":["医生","护士"],"level":"基础","type":"简答","q":"经皮股静脉置管有哪些优缺点？","a":"优点：①操作简单、安全；②适用于需紧急抢救，神志不清、不能主动配合及不能搬动的患者。缺点：①邻近外阴、肛门，易污染，感染率较高，保留时间短；②易误穿股动脉；③导管易折，且不易固定；④下肢活动相对受限。","key":"股静脉导管感染率高、不宜长时间使用，护理重点在会阴区清洁与导管固定。","page":75},{"id":401,"chapter":"第9章 血管通路的建立与管理","section":"第1节 一、（八）经皮股静脉置管术","roles":["医生","护士"],"level":"基础","type":"填空","q":"股静脉置管体位：患者仰卧位，屈膝、大腿外旋外展____；穿刺点选择腹股沟韧带下____，股动脉内侧____处；导管长度至少____。","a":"45°；2～3cm；0.5～1cm；19～20cm（临时导管至少19cm）。","key":"股静脉导管过短（如15cm）尖端位于髂静脉，再循环高，务必选≥19cm。","page":75},{"id":402,"chapter":"第9章 血管通路的建立与管理","section":"第1节 一、（八）经皮股静脉置管术","roles":["医生"],"level":"进阶","type":"判断","q":"合并心力衰竭、不能平卧的患者，可在完全坐位或前倾位下行股静脉置管。（对/错？）","a":"错。合并心力衰竭、不能平卧者可采用半坐位；完全坐位或前倾位则不宜行股静脉置管。","key":"“半坐位可以、完全坐位/前倾位不宜”是体位考点。","page":75},{"id":403,"chapter":"第9章 血管通路的建立与管理","section":"第1节 一、（八）经皮股静脉置管术","roles":["医生"],"level":"进阶","type":"简答","q":"股静脉置管时导丝送入、扩皮、插管环节及并发症处理有哪些特别注意事项？","a":"①预冲导管时避免混入气泡；②导丝遇阻力切勿强行推进，转动方向后再进，仍有阻力则退出穿刺针和导丝重新选择穿刺部位；③扩皮动作轻柔，避免将导丝压折；④插导管前体外导丝长度应长于导管，沿导丝插管时及时打开静脉夹使导丝露出；⑤血管条件差、触不到股动脉者应做血管超声，有条件超声引导；⑥并发症：穿刺部位出血或血肿（包括腹膜后），局部压迫即可，腹膜后大血肿需外科处理，其余同颈内静脉置管。","key":"体外导丝必须长于导管，否则导丝可能随导管滑入血管内。","page":75},{"id":404,"chapter":"第9章 血管通路的建立与管理","section":"第1节 一、（九）经皮锁骨下静脉置管术","roles":["医生"],"level":"基础","type":"判断","q":"锁骨下静脉置管不易感染、血流量较高、患者耐受性好，因此推荐作为临时置管的常规部位。（对/错？）","a":"错。虽有不易感染、活动不受限、血流量较高等优点，但穿刺技术难度较高、并发症严重，一般不推荐应用。","key":"优点不能掩盖其严重并发症（血气胸、远期锁骨下静脉狭窄）。","page":76},{"id":405,"chapter":"第9章 血管通路的建立与管理","section":"第1节 一、（九）经皮锁骨下静脉置管术","roles":["医生"],"level":"高级","type":"填空","q":"锁骨下静脉置管锁骨下径路：头低足高____，穿刺点为锁骨中、外1/3交界处，锁骨下____cm；针干与皮肤表面成____，进针____。","a":"15°；1.0；25°～30°；3～5cm。","key":"锁骨上径路则为锁骨上约1.0cm、朝向胸锁关节进针1.5～2.0cm，注意区分。","page":76},{"id":406,"chapter":"第9章 血管通路的建立与管理","section":"第1节 一、（九）经皮锁骨下静脉置管术","roles":["医生"],"level":"进阶","type":"简答","q":"锁骨下静脉置管有哪些注意事项？导丝误入颈内静脉时有何表现、如何处理？","a":"①尽量保持穿刺针与胸壁呈水平位，贴近锁骨后缘；②锁骨下静脉走行弯曲，扩张器进入血管不宜过深，一般以2～3cm为宜；③锁骨下静脉与颈内静脉成角较大甚至接近直线，导丝易进入颈内静脉，此时患者可感同侧颈部或耳部不适，应退出导丝5～10cm再轻柔重新插入；④有条件可超声引导以提高成功率、减少并发症。","key":"颈部/耳部不适提示导丝进入颈内静脉，退5～10cm重插。","page":77},{"id":407,"chapter":"第9章 血管通路的建立与管理","section":"第1节 一、（九）经皮锁骨下静脉置管术","roles":["医生"],"level":"进阶","type":"简答","q":"锁骨下静脉置管的主要并发症有哪些？血气胸如何预防处理？","a":"①血气胸：较常见，与术者熟练程度相关；尽量避免刺破胸膜，一旦出现立即拔出导管，严重者胸腔引流；②上腔静脉或右心房穿孔、纵隔出血、心脏压塞：与解剖变异、导管质硬不光滑、扩张器进入过深有关；③心律失常；④胸导管损伤：左锁骨下静脉插管偶可引起乳糜胸或淋巴瘘，可见乳状液体从穿刺部位漏出；⑤锁骨下静脉狭窄：远期并发症，发生率高且临床意义大。","key":"胸导管汇入左锁骨下静脉与颈内静脉连接处，故乳糜胸见于左侧置管。","page":77},{"id":408,"chapter":"第9章 血管通路的建立与管理","section":"第1节 一、（九）经皮锁骨下静脉置管术","roles":["医生"],"level":"高级","type":"案例分析","q":"患者2年前曾行右锁骨下静脉临时置管透析，此后在右前臂建立自体内瘘，术后数周右上肢逐渐出现明显水肿，内瘘静脉压升高。最可能的原因？机制？处理？","a":"①锁骨下静脉狭窄（远期并发症），原因为锁骨下静脉内膜增生肥厚和/或血栓形成；②轻度狭窄平时无症状，建立内瘘后静脉回流量增加，出现上肢不同程度水肿；③处理：将内瘘结扎，或在狭窄静脉处应用球囊扩张或放入支架治疗。","key":"这是“为什么要避免锁骨下置管”的最典型临床场景。","page":77},{"id":409,"chapter":"第9章 血管通路的建立与管理","section":"第1节 中心静脉导管置管术 二、带隧道带涤纶套中心静脉导管置管术","roles":["医生"],"level":"基础","type":"简答","q":"带隧道带涤纶套中心静脉导管置管术的适应证有哪些？","a":"①预期需要4周以上血液净化治疗的患者；②不适宜自体内瘘及移植物内瘘建立，或手术失败患者；③预期生命有限的血液透析患者。","key":"“4周以上”是临时导管与长期导管的分界线。","page":77},{"id":410,"chapter":"第9章 血管通路的建立与管理","section":"第1节 中心静脉导管置管术 二、带隧道带涤纶套中心静脉导管置管术","roles":["医生"],"level":"基础","type":"简答","q":"带隧道带涤纶套中心静脉导管置管的相对禁忌证有哪些？","a":"无绝对禁忌证。相对禁忌证：①置管部位皮肤或软组织存在破损、感染、血肿、肿瘤；②患者不能配合，不能平卧；③合并难以纠正的严重出血倾向；④存在颈内静脉解剖变异或严重狭窄。","key":"“不能平卧”为长期导管相对禁忌证，术前须评估心衰体位耐受。","page":78},{"id":411,"chapter":"第9章 血管通路的建立与管理","section":"第1节 中心静脉导管置管术 二、带隧道带涤纶套中心静脉导管置管术","roles":["医生"],"level":"基础","type":"填空","q":"带隧道带涤纶套导管置管部位首选____；其他部位包括____、____、____；尽量避免使用____。","a":"右侧颈内静脉；左侧颈内静脉、颈外静脉、股静脉；锁骨下静脉。","key":"长期导管避免锁骨下静脉，以保护上肢未来内瘘的回流。","page":78},{"id":412,"chapter":"第9章 血管通路的建立与管理","section":"第1节 中心静脉导管置管术 二、带隧道带涤纶套中心静脉导管置管术","roles":["医生"],"level":"进阶","type":"填空","q":"带隧道带涤纶套导管置管时，涤纶套（Cuff）应位于皮肤出口内____cm处；导管尖端体表定位于右侧胸骨旁第____肋间；X线确认尖端理想位置应位于____。","a":"1～2；3、4；右心房上部1/3。","key":"临时导管与长期导管尖端位置要求不同，长期导管要求进入右心房上部1/3。","page":78},{"id":413,"chapter":"第9章 血管通路的建立与管理","section":"第1节 中心静脉导管置管术 二、带隧道带涤纶套中心静脉导管置管术","roles":["医生"],"level":"高级","type":"简答","q":"以右侧颈内静脉为例，简述带隧道带涤纶套中心静脉导管置管的主要步骤。","a":"①手术室进行，推荐超声引导，必要时X线引导；②仰卧、头略偏左，暴露右颈部三角区；③戴帽子口罩、建议穿一次性无菌手术衣，消毒、戴无菌手套、铺巾；④0.5%～1.0%利多卡因局麻后穿刺，负压进针，突破感、回抽通畅、推注压力不大、血色暗红判定入静脉；⑤送入导丝、拔出穿刺针；⑥体表标记出口，使Cuff在出口内1～2cm、尖端位于右侧胸骨旁第3、4肋间；⑦出口处切约2cm小口，分离皮下形成隧道至导丝出口处，导丝出口处做2cm切口；⑧隧道针将导管末端经隧道引至导丝处，调整Cuff距出口1～2cm；⑨扩张器扩张后沿导丝置入带芯撕脱鞘；⑩拔出导丝及鞘芯，无阀门鞘立即指腹堵口；⑪沿鞘置入导管，撕开撕脱鞘，避免打折；⑫抽吸推注确认两端通畅；⑬X线确认尖端在右心房上部1/3；⑭1000U/ml肝素生理盐水或4%枸橼酸封管、关夹、拧肝素帽；⑮缝合切口、固定导管、无菌包扎。","key":"撕脱鞘环节是空气栓塞高风险点，动作要快并堵住鞘口。","page":79},{"id":414,"chapter":"第9章 血管通路的建立与管理","section":"第1节 中心静脉导管置管术 二、带隧道带涤纶套中心静脉导管置管术","roles":["医生","护士"],"level":"进阶","type":"判断","q":"带隧道导管置管时，对于不自带阀门的撕脱鞘，拔出导丝及鞘芯后应立即以指腹堵住鞘口。（对/错？）","a":"对。目的是避免血液流出或空气进入血管；沿撕脱鞘放置导管时动作要快，以免空气栓塞。","key":"空气栓塞预防是带隧道导管置管最关键的安全细节。","page":79},{"id":415,"chapter":"第9章 血管通路的建立与管理","section":"第1节 中心静脉导管置管术 二、带隧道带涤纶套中心静脉导管置管术","roles":["医生"],"level":"进阶","type":"简答","q":"与临时导管相比，带隧道带涤纶套中心静脉置管需要特殊注意哪些事项？","a":"①推荐超声引导下穿刺置管，必要时X线引导；②皮肤切口应包括皮肤全层和皮下组织，不宜过小，减少鞘管针通过阻力，避免鞘管口开裂；③沿撕脱鞘放置导管动作要快，以免空气栓塞；④避免导管在皮下打折、扭转，确保管腔通畅。","key":"切口过小导致鞘管口开裂是新手常见失误。","page":79},{"id":416,"chapter":"第9章 血管通路的建立与管理","section":"第1节 中心静脉导管置管术 二、带隧道带涤纶套中心静脉导管置管术","roles":["医生","护士"],"level":"进阶","type":"案例分析","q":"患者带隧道带涤纶套导管透析1年，近期透析开始后约30min出现寒战、高热，导管出口无明显红肿。应如何处理？","a":"①考虑导管相关感染，进行血培养及管腔内容物培养；②药敏结果未出前，常规应用广谱抗革兰氏阳性球菌药物抗菌治疗；③根据药敏调整；④抗菌治疗无效及时拔出导管。","key":"长期导管感染并非一律立即拔管（临时导管确诊即拔），而是先抗感染、无效再拔。","page":79},{"id":417,"chapter":"第9章 血管通路的建立与管理","section":"第2节 自体动静脉内瘘成形术 一、定义及概述/二、适应证及禁忌证","roles":["医生"],"level":"基础","type":"简答","q":"什么是自体动静脉内瘘成形术（AVF）？","a":"通过外科手术吻合患者的外周动脉和浅表静脉，使动脉血液流至浅表静脉、静脉动脉化，达到血液透析所需的血流量要求，血管直径及深度便于穿刺，从而建立血液透析体外循环。","key":"要点是“静脉动脉化”，以及血流量、直径、深度三方面满足透析需求。","page":80},{"id":418,"chapter":"第9章 血管通路的建立与管理","section":"第2节 自体动静脉内瘘成形术 一、定义及概述/二、适应证及禁忌证","roles":["医生"],"level":"基础","type":"填空","q":"诊断慢性肾衰竭，eGFR＜____ml/（min·1.73m²），并预期____个月内需要实施血液透析治疗的患者，应考虑实施自体动静脉内瘘成形术。","a":"25；3～6。","key":"老年、糖尿病、SLE及合并其他脏器功能不全者更应尽早实施。","page":80},{"id":419,"chapter":"第9章 血管通路的建立与管理","section":"第2节 自体动静脉内瘘成形术 一、定义及概述/二、适应证及禁忌证","roles":["医生"],"level":"基础","type":"简答","q":"自体动静脉内瘘成形术的绝对禁忌证有哪些？","a":"①左心室射血分数小于30%；②四肢近端大静脉或中心静脉存在严重狭窄、明显血栓或因邻近病变影响静脉回流，且不能纠正；③前臂艾伦试验（Allen's test）阳性，禁止行前臂动静脉内瘘端端吻合。","key":"LVEF＜30%是AVF、AVG及介入治疗共同的禁忌界值。","page":80},{"id":420,"chapter":"第9章 血管通路的建立与管理","section":"第2节 自体动静脉内瘘成形术 一、定义及概述/二、适应证及禁忌证","roles":["医生"],"level":"进阶","type":"简答","q":"自体动静脉内瘘成形术的相对禁忌证有哪些？对术者资质和手术环境有何要求？","a":"相对禁忌证：①预期存活时间短于3个月；②心血管状态不稳，心力衰竭未控制或低血压；③手术部位存在感染；④同侧锁骨下静脉安装心脏起搏器电极导线；⑤未纠正的严重凝血功能障碍。资质：经过相关专科培训、达到熟练操作的医师才可独立实施。环境：符合《医院手术部（室）管理规范（试行）》（卫医政发〔2009〕90号）要求的手术室。","key":"起搏器同侧为相对禁忌，术前评估时应避免在起搏器同侧上肢造瘘。","page":80},{"id":421,"chapter":"第9章 血管通路的建立与管理","section":"第2节 自体动静脉内瘘成形术 一、定义及概述/二、适应证及禁忌证","roles":["医生"],"level":"进阶","type":"案例分析","q":"患者拟行左前臂桡动脉-头静脉内瘘，术前行Allen试验：压迫桡、尺动脉后放开尺动脉，手掌颜色长时间不恢复（阳性）。该结果对术式选择有何影响？","a":"①Allen试验阳性提示掌动脉弓不完整、尺动脉代偿不足，属于绝对禁忌证：禁止行前臂动静脉内瘘端端吻合；②术前评估要求选择前臂端端吻合术式时同肢体掌动脉弓应完整；③可改选非端端吻合术式（规程首选静脉-动脉端侧吻合）。","key":"Allen阳性禁止的是“前臂端端吻合”，不是禁止所有内瘘。","page":81},{"id":422,"chapter":"第9章 血管通路的建立与管理","section":"第2节 自体动静脉内瘘成形术 三、术者资质和手术环境/四、术前评估","roles":["医生"],"level":"基础","type":"填空","q":"AVF术前血管条件：预期选择的静脉直径≥____mm，动脉直径≥____mm，且近心端深静脉和/或中心静脉无明显狭窄、血栓或邻近组织病变。","a":"2.0；1.5。","key":"AVG要求吻合动静脉内径不小于3mm，勿与AVF标准混淆。","page":81},{"id":423,"chapter":"第9章 血管通路的建立与管理","section":"第2节 自体动静脉内瘘成形术 三、术者资质和手术环境/四、术前评估","roles":["医生"],"level":"基础","type":"简答","q":"AVF手术部位选择原则是什么？最常用的血管是哪组？还可选用哪些血管？","a":"原则：先上肢，后下肢；先非惯用侧，后惯用侧；先远心端后近心端。最常用：前臂腕部桡动脉-头静脉内瘘。其次：腕部尺动脉-贵要静脉内瘘、前臂静脉转位内瘘（主要是贵要静脉-桡动脉）、肘部内瘘、下肢内瘘（大隐静脉-足背动脉、大隐静脉-胫前或胫后动脉）、鼻烟窝内瘘等。","key":"“先远后近”是为了保留近端血管资源以备后续再造。","page":81},{"id":424,"chapter":"第9章 血管通路的建立与管理","section":"第2节 自体动静脉内瘘成形术 三、术者资质和手术环境/四、术前评估","roles":["医生"],"level":"基础","type":"判断","q":"AVF血管吻合方式包括端端、端侧和侧侧吻合，首选动、静脉端端吻合。（对/错？）","a":"错。首选静脉-动脉端侧吻合。","key":"吻合方式三种：端端、端侧、侧侧；首选的是“静脉-动脉端侧吻合”。","page":81},{"id":425,"chapter":"第9章 血管通路的建立与管理","section":"第2节 自体动静脉内瘘成形术 五、操作步骤","roles":["医生"],"level":"进阶","type":"填空","q":"头静脉-桡动脉端侧吻合时，头静脉游离长度为____cm；桡动脉游离____cm；桡动脉上壁纵向切口____mm；吻合使用____无创伤血管缝合线。","a":"3～5；1.0～1.5；6～8；7-0。","key":"AVG吻合用6-0线，AVF用7-0线，常被混考。","page":82},{"id":426,"chapter":"第9章 血管通路的建立与管理","section":"第2节 自体动静脉内瘘成形术 五、操作步骤","roles":["医生"],"level":"高级","type":"简答","q":"AVF端侧吻合缝合时有哪些注意事项？缝合完毕后血管夹开放顺序如何？","a":"注意事项：①剪除多余血管及外膜，以免嵌入血管腔；②避免血管钳直接钳夹血管及边缘，用血管镊夹持边缘、牵拉外膜撑开管腔，避免夹持内膜；③必须垂直进针全层缝合，以防遗漏内膜，有斑块的动脉应由内膜向外膜进针，避免斑块脱落；④缝合必须外翻，不可内翻；⑤尽量保持针孔与血管壁距离一致；另缝合最后一针前用生理盐水冲洗管腔。开放顺序：摆正吻合口位置后，先松开静脉夹，后松开动脉夹。","key":"“外翻缝合”与“斑块动脉由内向外进针”是保证内膜光滑、防止血栓的关键。","page":83},{"id":427,"chapter":"第9章 血管通路的建立与管理","section":"第2节 自体动静脉内瘘成形术 五、操作步骤","roles":["医生"],"level":"进阶","type":"判断","q":"自体动静脉内瘘端侧吻合完成后，应先松开动脉夹，再松开静脉夹。（对/错？）","a":"错。AVF缝合完毕后摆正吻合口，先松开静脉夹，后松开动脉夹。（注意：移植血管内瘘开放血流时则一般先开放动脉端，待空气由静脉端针眼排出后再开放静脉。）","key":"AVF与AVG开放顺序相反，是高频混淆点。","page":83},{"id":428,"chapter":"第9章 血管通路的建立与管理","section":"第2节 自体动静脉内瘘成形术 五、操作步骤","roles":["医生"],"level":"进阶","type":"简答","q":"AVF开放血流后应如何检查和调整？","a":"①观察吻合口有无漏血：少量漏血用盐水纱布轻压，必要时局部敷凝血酶或生物蛋白胶；漏血较多需找准漏血点单针缝合；②观察通畅情况：静脉段触到较明显震颤说明通畅，否则查找原因，必要时拆线重新吻合；③观察头静脉是否形成面向近心端的U型自然弯曲，若有折曲应再次充分剥离头静脉、结扎相应侧支；④最后缝合皮下和皮肤，皮肤缝合不宜过紧，以免压迫血管。","key":"术中没有震颤绝不能关切口。","page":83},{"id":429,"chapter":"第9章 血管通路的建立与管理","section":"第2节 自体动静脉内瘘成形术 六、术后处置","roles":["医生","护士"],"level":"进阶","type":"案例分析","q":"AVF术后6h，护士发现敷料渗血较多并逐渐扩大。应如何处理？压迫时需注意什么？","a":"①渗血较少可轻压止血，压迫时注意保持血管震颤的存在；②渗血较多需要打开伤口，寻找出血点并结扎止血；③同时检查震颤与杂音，评估内瘘通畅；④抗血小板/抗凝药物仅在无渗血时才考虑使用。","key":"压迫过度会导致内瘘血栓，“保持震颤存在”是压迫止血的底线。","page":83},{"id":430,"chapter":"第9章 血管通路的建立与管理","section":"第2节 自体动静脉内瘘成形术 六、术后处置","roles":["医生","护士"],"level":"基础","type":"简答","q":"AVF术后护理与宣教要点有哪些？","a":"①如高凝或血压较低且无渗血，可个体化给予口服肠溶阿司匹林、氯吡格雷或皮下注射低分子量肝素；②术后检查静脉震颤和血管杂音，早期多次检查以早期发现血栓；③适当抬高术侧肢体减轻水肿；④每3d换药1次，10～14d拆线，包扎敷料不加压力；⑤注意姿势及袖口松紧，避免内瘘侧肢体受压；⑥避免在内瘘侧肢体输液、输血及抽血化验；⑦手术侧禁止测量血压，术后2周内禁止缠止血带；⑧术后24h术侧手部可适当做握拳及腕关节运动。","key":"内瘘侧“禁测血压、禁输液抽血”须对全院宣教。","page":84},{"id":431,"chapter":"第9章 血管通路的建立与管理","section":"第2节 自体动静脉内瘘成形术 六、术后处置","roles":["护士"],"level":"基础","type":"判断","q":"AVF术后2周后，可在手术侧上肢测量血压。（对/错？）","a":"错。手术侧禁止测量血压；“术后2周内”的限制针对的是禁止缠止血带。","key":"两个禁令时限不同：测血压是永久禁止，止血带是2周内禁止。","page":84},{"id":432,"chapter":"第9章 血管通路的建立与管理","section":"第2节 自体动静脉内瘘成形术 七、内瘘的成熟与使用","roles":["护士"],"level":"基础","type":"简答","q":"如何指导患者进行功能锻炼以促使AVF尽快成熟？","a":"①术后1周且伤口无感染、无渗血、愈合良好时，每天用术侧手捏握皮球或橡皮圈数次，每次3～5min；②术后2周可在上臂捆扎止血带或血压表袖套，术侧手做握拳或握球锻炼，每次1～2min，每天可重复10～20次。","key":"上臂加压锻炼须在术后2周后，与“2周内禁止缠止血带”对应。","page":84},{"id":433,"chapter":"第9章 血管通路的建立与管理","section":"第2节 自体动静脉内瘘成形术 七、内瘘的成熟与使用","roles":["医生"],"level":"进阶","type":"填空","q":"内瘘成熟一般需要____周；若术后____周静脉还没有充分扩张，血流量＜____ml/min，透析血流量不足（除外穿刺技术因素），为成熟不良；术后____尚未成熟，则认为内瘘手术失败。","a":"4～6；8；600；3个月。","key":"成熟不良判定血流量界值为600ml/min，而超声成熟标准为自然血流量超过500ml/min，注意区分语境。","page":84},{"id":434,"chapter":"第9章 血管通路的建立与管理","section":"第2节 自体动静脉内瘘成形术 七、内瘘的成熟与使用","roles":["护士"],"level":"基础","type":"简答","q":"AVF的穿刺顺序和方法有何要求？","a":"①内瘘使用要有计划，一般从内瘘远心端到近心端进行阶梯式或扣眼式穿刺，然后再回到远心端，如此反复；②避免定点重复穿刺；③穿刺点应距离吻合口3～5cm以上；④初次穿刺先观察血管走向，触摸管壁厚薄、弹性、深浅及是否通畅。","key":"定点穿刺易致动脉瘤和狭窄，是护理质控常查项目。","page":84},{"id":435,"chapter":"第9章 血管通路的建立与管理","section":"第2节 自体动静脉内瘘成形术 七、内瘘的成熟与使用","roles":["护士"],"level":"基础","type":"填空","q":"AVF使用初期建议使用____穿刺针，采用较低血流量____ml/min；使用____次后，选用____穿刺针，在患者耐受情况下尽量提高血流量至____ml/min。","a":"小号（17G或16G）；200～250；3～5；较粗的（16G或15G）；250～350。","key":"新瘘过早用粗针高流量易致血肿和内瘘损伤；有条件建议用套管针。","page":84},{"id":436,"chapter":"第9章 血管通路的建立与管理","section":"第2节 自体动静脉内瘘成形术 七、内瘘的成熟与使用","roles":["医生","护士"],"level":"基础","type":"判断","q":"通畅的动静脉内瘘听诊时可闻及高调、仅收缩期存在的血管杂音。（对/错？）","a":"错。通畅的内瘘触诊有较明显的震颤，听诊能听到动脉分流产生的粗糙吹风样血管杂音（连续、收缩期和舒张期均有、低调）；高调、仅收缩期、局限的杂音提示狭窄。","key":"杂音“低调连续”为正常，“高调仅收缩期”为狭窄。","page":84},{"id":437,"chapter":"第9章 血管通路的建立与管理","section":"第2节 自体动静脉内瘘成形术 七、内瘘的成熟与使用","roles":["护士"],"level":"基础","type":"案例分析","q":"患者左前臂桡动脉-头静脉内瘘术后6周，震颤、杂音良好，医生评估已成熟，今日首次穿刺透析。责任护士在穿刺前评估、穿刺部位、穿刺针及血流量设置上应如何做？","a":"①穿刺前观察内瘘血管走向，触摸管壁厚薄、弹性、深浅及是否通畅（触诊明显震颤、听诊粗糙吹风样杂音）；②有计划地从远心端开始阶梯式或扣眼式穿刺，避免定点重复穿刺，穿刺点距吻合口3～5cm以上；③初期使用小号（17G或16G）穿刺针，血流量200～250ml/min；④使用3～5次后再改用16G或15G，在耐受情况下提高至250～350ml/min；⑤有条件建议用套管针。","key":"新瘘首穿“小针低流量、远离吻合口”，避免血肿毁瘘。","page":84},{"id":438,"chapter":"第9章 血管通路的建立与管理","section":"第2节 自体动静脉内瘘成形术 八、并发症与处理","roles":["医生"],"level":"基础","type":"简答","q":"AVF血管狭窄的病因、好发部位及处理方法是什么？","a":"①病因：各种原因导致的血管内膜局部增生；②好发部位：吻合口附近及穿刺点部位；③处理：有条件可行经皮血管腔内血管成形术和/或放置支架，也可开放手术纠正狭窄或重建内瘘。","key":"穿刺点狭窄与定点穿刺密切相关。","page":85},{"id":439,"chapter":"第9章 血管通路的建立与管理","section":"第2节 自体动静脉内瘘成形术 八、并发症与处理","roles":["医生"],"level":"高级","type":"案例分析","q":"患者AVF透析3年，今晨发现内瘘震颤和杂音消失，追问昨夜睡眠时压迫手臂且透析后血压偏低，距发现约10h。请分析诱因并给出处理方案。","a":"①诊断：内瘘血栓形成，多发生在狭窄处；诱因包括高凝状态、低血压、压迫时间过长、低温等；②24h内可注射重组组织型纤溶酶原激活剂或局部血管内注射尿激酶药物溶栓；③也可取栓术，成功率可达90%以上，常用Fogarty导管取栓或手术切开取栓；较小血栓可行PTA球囊扩张及碎栓；④提倡尽可能在血栓机化前取栓（血栓1周后仍可能重建）；⑤同时处理基础狭窄。","key":"溶栓时间窗为“24h内”，取栓应争取在血栓机化前。","page":85},{"id":440,"chapter":"第9章 血管通路的建立与管理","section":"第2节 自体动静脉内瘘成形术 八、并发症与处理","roles":["医生"],"level":"高级","type":"简答","q":"自体内瘘感染的预防及处理原则是什么？初始经验性抗生素方案和疗程如何？","a":"①病因：内瘘附近皮肤等感染及长期透析患者免疫功能缺陷；②感染部位禁止穿刺，手臂制动；③在病原微生物监测基础上用抗生素，初始经验治疗推荐广谱的万古霉素联合一种头孢类或青霉素类药物，根据药敏调整；④初次自体内瘘感染治疗时间至少6周；⑤极少数需立即手术，切除感染瘘管，可用自体静脉移植吻合，或在缺损近端再次吻合。","key":"疗程“至少6周”是最易遗漏的数字。","page":85},{"id":441,"chapter":"第9章 血管通路的建立与管理","section":"第2节 自体动静脉内瘘成形术 八、并发症与处理","roles":["医生"],"level":"基础","type":"简答","q":"什么是内瘘（真性）动脉瘤？其诱因和处理原则是什么？","a":"定义：内瘘术后数月或数年吻合口的静脉流出道扩张，隆起于皮肤表面并伴有搏动，入口和出口是连续的血管，多为动脉化的静脉，一般直径大于3cm。诱因：病因不明，血管比较表浅、局域穿刺或静脉高压是主要诱因。处理：①防止继续扩张，尽量避免在动脉瘤上穿刺（表面薄弱易破溃感染）；②静脉流出道动脉瘤应处理狭窄部位，可行血管成形术；③切除血管瘤，重新吻合重建内瘘；④用PTFE血管旁路搭桥；避免在瘘管穿刺部位放支架。","key":"动脉瘤上禁止穿刺；“避免在瘘管穿刺部位放支架”。","page":86},{"id":442,"chapter":"第9章 血管通路的建立与管理","section":"第2节 自体动静脉内瘘成形术 八、并发症与处理","roles":["医生","护士"],"level":"基础","type":"简答","q":"什么是假性动脉瘤？常见原因及预防处理措施有哪些？","a":"定义：外伤、感染或穿刺造成血管壁局部破口，出血后在血管周围形成血肿，血肿壁机化后又与内瘘相通，伴有搏动，也称波动性血肿。原因：透析穿刺后或血管介入后，穿刺针穿破血管后壁或毗邻动脉；患者依从性差、紧张、肢体频繁变动；穿刺后压迫时间不够或位置不准确。预防处理：正确定位，穿刺不宜过深（尤其近肱动脉处）；介入拔鞘后正确定位和手法压迫；合理使用抗凝药；宣教避免肢体乱动、剧烈咳嗽、打喷嚏；密切观测血肿及血压；多数不能自愈，需手术（破口修补、瘤体切除、血管结扎或血管移植重新制作内瘘）。","key":"假性动脉瘤“大多不能自愈”，需外科处理。","page":86},{"id":443,"chapter":"第9章 血管通路的建立与管理","section":"第2节 自体动静脉内瘘成形术 八、并发症与处理","roles":["医生"],"level":"高级","type":"案例分析","q":"患者男，65岁，高血压、贫血，左上臂肱动脉-头静脉内瘘吻合口直径约7mm，近3个月反复出现心力衰竭。请分析并给出处理方案。","a":"①吻合口径大或近心部位内瘘，合并贫血、高血压、器质性心脏病时易发生心衰；②上臂动静脉内瘘吻合口直径一般应限制在4mm以下；③积极治疗基础疾病（贫血、高血压等）；④可行外科限流；⑤反复心力衰竭者必须闭合内瘘，改用动脉表浅化、带隧道带涤纶套中心静脉导管或腹膜透析治疗。","key":"上臂内瘘吻合口“4mm以下”是预防心衰的关键参数。","page":86},{"id":444,"chapter":"第9章 血管通路的建立与管理","section":"第2节 自体动静脉内瘘成形术 八、并发症与处理","roles":["医生"],"level":"进阶","type":"案例分析","q":"AVF术后第10天，患者术侧手部及前臂明显肿胀，抬高后稍减轻；术后第3周仍持续肿胀。如何分阶段处理？","a":"①诊断静脉高压综合征：回流静脉狭窄及动脉血流压力导致肢体远端静脉回流障碍；②2周内出现者可抬高术侧肢体、握拳增加回流以减轻水肿；③超过2周持续肿胀需进一步检查，可采用经皮血管腔内血管成形术解除流出道狭窄，特别注意解决中心静脉狭窄；④必要时结扎内瘘，更换部位重新制作内瘘。","key":"“超过2周”持续肿胀必须查中心静脉狭窄。","page":86},{"id":445,"chapter":"第9章 血管通路的建立与管理","section":"第2节 自体动静脉内瘘成形术 八、并发症与处理","roles":["医生"],"level":"进阶","type":"简答","q":"什么是透析通路相关缺血综合征（HAIDI）？其原因及高危因素有哪些？","a":"定义：动静脉内瘘建立后，动脉血分流入低阻力的内瘘，导致肢体远端一系列缺血相关综合征。原因：①动脉发育不佳、动脉硬化、动脉炎等影响手部供血；②近心端动脉血流增加并直接经吻合口流入低压静脉，血液全部或部分不流入远端动脉；③极少数为手术缝合造成远端动脉闭塞。高危因素：长期胰岛素依赖的糖尿病、高血压、高龄、女性、之前同侧肢体做过内瘘术、高流量内瘘、冠心病、系统性红斑狼疮、外周动脉闭塞性疾病等。","key":"糖尿病、高龄女性、高流量内瘘是筛查HAIDI的重点人群。","page":87},{"id":446,"chapter":"第9章 血管通路的建立与管理","section":"第2节 自体动静脉内瘘成形术 八、并发症与处理","roles":["医生"],"level":"高级","type":"简答","q":"HAIDI的临床症状如何分级？","a":"Ⅰ级：手部苍白、发绀和/或发凉但无疼痛；Ⅱ级：透析期间或运动时出现疼痛痉挛、感觉异常、麻木、寒冷（Ⅱa疼痛可以忍受，Ⅱb疼痛难以忍受）；Ⅲ级：患肢静息痛；Ⅳ级：组织缺失（溃疡、坏死）（Ⅳa缺血好转手部主要功能可能恢复，Ⅳb手或肢体近心端不可逆坏死、手部主要功能丧失）。","key":"分级直接决定治疗：Ⅱb级以上建议手术，Ⅳb级建议截肢。","page":87},{"id":447,"chapter":"第9章 血管通路的建立与管理","section":"第2节 自体动静脉内瘘成形术 八、并发症与处理","roles":["医生"],"level":"高级","type":"填空","q":"HAIDI辅助检查：基础指压（BDP）＜____mmHg，指肱指数（DBI）＜____；治疗上____级以上建议手术，____级建议截肢。","a":"60；0.4；Ⅱb；Ⅳb。","key":"血管造影压迫吻合口后原未显影的远端动脉显影有助于诊断。","page":87},{"id":448,"chapter":"第9章 血管通路的建立与管理","section":"第2节 自体动静脉内瘘成形术 八、并发症与处理","roles":["医生"],"level":"进阶","type":"判断","q":"治疗HAIDI时关闭瘘管既能改善缺血症状，又能保存血透通路。（对/错？）","a":"错。关闭瘘管能改善症状，但丧失了血透通路；既保存通路又缓解症状的术式包括DRAL、Banding、RUDI、DRIL、PAI。","key":"保守治疗为手部保暖、功能锻炼及扩血管药物。","page":87},{"id":449,"chapter":"第9章 血管通路的建立与管理","section":"第2节 自体动静脉内瘘成形术 八、并发症与处理","roles":["医生"],"level":"高级","type":"案例分析","q":"两例HAIDI Ⅱb级患者：甲为高流量肱动脉-头静脉内瘘；乙为正常流量内瘘、远端动脉血液被“窃”入内瘘。希望保留透析通路，各宜选何种术式？","a":"①甲（高流量内瘘）：可选内瘘缩窄术（Banding），或动脉流入道远端化（RUDI）以降低通路流量；②乙（正常或低流量内瘘）：可选远端血管重建并中间结扎（DRIL），或动脉流入道近端化（PAI）；③吻合口远心端桡动脉结扎术（DRAL）仅适用于前臂远端动静脉瘘血液逆流所致缺血；④手术缝合原因引起者建议重新吻合，流入道动脉狭窄/闭塞可介入（球囊扩张、支架）；⑤关闭瘘管虽能改善症状但丧失通路。","key":"按流量选术式：高流量→Banding/RUDI；正常/低流量→DRIL/PAI。","page":88},{"id":450,"chapter":"第9章 血管通路的建立与管理","section":"第3节 移植血管内瘘成形术 一、适应证及禁忌证/三、移植血管材料","roles":["医生"],"level":"基础","type":"简答","q":"移植血管内瘘（AVG）的适应证和绝对禁忌证是什么？","a":"适应证：利用自身血管无法建立自体内瘘者，包括反复制作内瘘使上肢动静脉血管耗竭；糖尿病、周围血管病、银屑病等使上肢自身血管严重破坏；原有内瘘血管瘤或狭窄切除后需用移植血管搭桥。绝对禁忌证：①左室射血分数小于30%；②四肢近心端大静脉或中心静脉存在严重狭窄、明显血栓；③合并全身或局部感染。相对禁忌证同AVF。","key":"“合并全身或局部感染”是AVG特有的绝对禁忌证，因人工血管感染后果严重。","page":88},{"id":451,"chapter":"第9章 血管通路的建立与管理","section":"第3节 移植血管内瘘成形术 一、适应证及禁忌证/三、移植血管材料","roles":["医生"],"level":"进阶","type":"简答","q":"移植血管材料有哪几类？各有何特点？目前应用最广泛的是哪种？","a":"①自体血管：主要是大隐静脉和股浅静脉，取材方便、无抗原性、口径合适，仍较常用；②同种异体血管：尸体大隐静脉、股动脉、脾动脉、肱动脉及胎盘脐静脉等，取材困难，应用越来越少；③异种血管：主要是牛颈动脉，取材易但抗原性强、工序复杂、价格昂贵，较少应用；④人造血管：主要是聚四氟乙烯（PTFE），取材容易、形状口径易控、生物相容性好、易穿刺，是目前应用最广泛的人工血管；⑤生物工程血管。","key":"PTFE是目前应用最广泛的人工血管。","page":89},{"id":452,"chapter":"第9章 血管通路的建立与管理","section":"第3节 移植血管内瘘成形术 四、手术方法","roles":["医生"],"level":"进阶","type":"填空","q":"AVG术前要求拟吻合的动静脉内径不小于____mm；手术前____预防性使用抗生素；人造血管一般选用直径____mm的标准壁人造血管。","a":"3；1h；6。","key":"AVF静脉≥2.0mm、动脉≥1.5mm，AVG动静脉均≥3mm。","page":89},{"id":453,"chapter":"第9章 血管通路的建立与管理","section":"第3节 移植血管内瘘成形术 四、手术方法","roles":["医生","护士"],"level":"进阶","type":"判断","q":"人造血管从包装中取出后，应先用肝素盐水反复灌洗再植入。（对/错？）","a":"错。人造血管取出即可直接使用，可不用肝素盐水灌洗，以减少血流贯通后的血清渗出；需用500U/ml（4mg/ml）肝素盐水反复冲洗的是取出的自体大隐静脉。","key":"肝素会增加血清渗出，与血清肿发生相关。","page":90},{"id":454,"chapter":"第9章 血管通路的建立与管理","section":"第3节 移植血管内瘘成形术 四、手术方法","roles":["医生"],"level":"进阶","type":"简答","q":"AVG最常用的吻合配对血管有哪些？皮下隧道制作有哪些要求？","a":"配对：多用上肢血管，肱动脉与头静脉或贵要静脉、正中静脉、肱静脉（前臂袢式）最常用，成功率高、并发症少；其次为桡动脉根部与贵要静脉或正中静脉、头静脉（前臂袢式）。隧道：用皮下隧道器做袢式（U形）或直桥式（J形）隧道，深浅适中——过深不易穿刺，过浅可发生局部感染和皮肤坏死；移植血管穿过隧道时避免扭曲、成角和受压；跨肘窝的搭桥必须考虑屈肘对血管的影响。","key":"隧道深浅直接影响日后穿刺与感染风险。","page":90},{"id":455,"chapter":"第9章 血管通路的建立与管理","section":"第3节 移植血管内瘘成形术 四、手术方法","roles":["医生"],"level":"基础","type":"简答","q":"移植血管内瘘手术可选用哪些麻醉方式？前臂和上臂AVG一般采用何种麻醉？","a":"①根据手术部位可选用臂丛阻滞麻醉、局部浸润麻醉、蛛网膜下腔阻滞麻醉（下肢手术）和全麻等；②前臂和上臂移植血管内瘘可以采用局部麻醉。","key":"蛛网膜下腔阻滞仅用于下肢手术。","page":90},{"id":456,"chapter":"第9章 血管通路的建立与管理","section":"第3节 移植血管内瘘成形术 四、手术方法","roles":["医生"],"level":"高级","type":"填空","q":"AVG手术中：游离拟吻合动静脉长度为____cm；冲洗动静脉管腔用____肝素盐水；吻合使用____无损伤缝合线；吻合顺序为先吻合____端，后吻合____端。","a":"2～3；0.1%～0.2%；6-0；静脉；动脉。","key":"AVG先吻合静脉端后吻合动脉端，开放时则先开动脉端。","page":91},{"id":457,"chapter":"第9章 血管通路的建立与管理","section":"第3节 移植血管内瘘成形术 四、手术方法","roles":["医生"],"level":"高级","type":"判断","q":"AVG开放血流时应先开放静脉端血管夹，再开放动脉端。（对/错？）","a":"错。一般先开放动脉端血管夹，待移植血管内空气由静脉端吻合口针眼排除后再开放静脉血流；局部渗血轻压止血，活动性喷血点应补针，难以止血可用医用生物蛋白胶；触摸吻合口应可触及震颤。","key":"AVG开放顺序与AVF（先静脉后动脉）相反，目的是排出移植血管内空气。","page":91},{"id":458,"chapter":"第9章 血管通路的建立与管理","section":"第3节 移植血管内瘘成形术 四、手术方法","roles":["医生","护士"],"level":"进阶","type":"填空","q":"AVG术后常规使用抗生素____d（自体移植血管____d，人造血管____d）；人造血管一般____周血清性水肿消退后开始穿刺；自体移植血管成熟时间____周，建议____后使用；即穿型人工血管术后____即可穿刺。","a":"3～10；3～7；7～10；4～6；6～8；2～3个月；次日。","key":"高凝者可每12～24h皮下注射低分子量肝素；即穿型人工血管次日可用。","page":91},{"id":459,"chapter":"第9章 血管通路的建立与管理","section":"第3节 移植血管内瘘成形术 五、常见并发症与处理","roles":["医生"],"level":"高级","type":"案例分析","q":"患者右前臂PTFE人造血管袢式内瘘术后第8天，切口红肿、流脓，伴发热、血培养阳性。如何处理？与后期穿刺相关感染的处理有何不同？","a":"①感染是AVG最严重并发症，可致菌血症、周围脓肿、菌栓、继发性出血及死亡；②术后早期感染时人造血管尚未与组织愈合，感染易扩散，必须手术取出，需切除全部人造血管并重建动脉吻合口，否则残留人造血管感染可致破裂出血危及生命；③后期感染多源于皮肤细菌、穿刺技术所致，应早发现、及时治疗：全身使用抗生素，避开感染区域间置一段人工血管，最后切除感染血管；④预防第一位：感染控制后才可手术，术前皮肤清洁、术中严格无菌、术前预防性抗生素。","key":"早期感染须“切除全部人造血管”，不能部分切除。","page":91},{"id":460,"chapter":"第9章 血管通路的建立与管理","section":"第3节 移植血管内瘘成形术 五、常见并发症与处理","roles":["医生"],"level":"基础","type":"简答","q":"AVG狭窄的好发部位和主要病因有哪些？","a":"好发部位：人造血管静脉吻合口、人造血管穿刺点、中心静脉、人造血管动脉吻合口。病因：多数继发于静脉吻合口狭窄或穿刺部位狭窄；约20%患者无明确病因；其他包括低血压、血液高凝状态、睡眠时人工血管受压、透析后压迫穿刺点用力过度等。","key":"狭窄及血栓形成是AVG最常见并发症，静脉吻合口是首要好发部位。","page":92},{"id":461,"chapter":"第9章 血管通路的建立与管理","section":"第3节 移植血管内瘘成形术 五、常见并发症与处理","roles":["医生"],"level":"高级","type":"案例分析","q":"AVG患者内瘘突然无震颤，超声提示人工血管全程血栓，静脉吻合口重度狭窄，患者有消化道出血史。如何去除血栓并纠正狭窄？","a":"①无论何种方式去除血栓，必须去除动脉端的血栓头（其余为继发红色血栓，可自溶）；②有出血倾向不适合药物溶栓，可用机械溶栓导管；也可用6～7mm球囊扩张导管抽吸挤压碎栓，或切开人工血管用Fogarty导管手术取栓；③纠正狭窄：球囊扩张狭窄段，对短期复发、扩张后残余狭窄＞30%及破裂出血可植入覆膜支架；也可补片成形术（短段狭窄）、人工血管转位术、移植血管间置术、腔外覆膜支架植入术。","key":"遗漏“动脉端血栓头”是取栓失败、早期再栓的主要原因。","page":92},{"id":462,"chapter":"第9章 血管通路的建立与管理","section":"第3节 移植血管内瘘成形术 五、常见并发症与处理","roles":["医生"],"level":"进阶","type":"简答","q":"AVG非感染性假性动脉瘤的形成原因、预防及处理是什么？","a":"①分感染性和非感染性，感染性按感染原则处理；②非感染性主要因反复穿刺同一段人工血管、人工血管被破坏所致；③预防：穿刺不同部位；④一旦形成且有破裂可能，可置换一段人工血管或局部置放覆膜支架。","key":"AVG必须轮换穿刺部位，避免“区域穿刺”。","page":93},{"id":463,"chapter":"第9章 血管通路的建立与管理","section":"第3节 移植血管内瘘成形术 五、常见并发症与处理","roles":["医生"],"level":"高级","type":"案例分析","q":"PTFE人造血管内瘘术后2周，动脉吻合口附近出现无痛性肿块，无红肿，超声示肿块内无血流信号。患者白蛋白25g/L，术中曾用肝素盐水加压充盈人工血管。最可能的诊断？成因及处理？","a":"①诊断：血清肿（人工血管动静脉内瘘特有并发症），为无菌性血清样液体聚集在人工血管周围，外由纤维软组织假包膜包裹；②成因：人工血管多孔结构致血清渗出；人工血管内压力过大（静脉流出道狭窄、术中肝素生理盐水过度加压充盈）、过度拉伸；肝素增加渗出；营养差、低蛋白血症降低胶体渗透压；③治疗：保守治疗纠正上述因素（如纠正低蛋白）；手术跨越血清肿段间置人工血管并去除血清肿，间置用无孔隙的即穿型人工血管更佳；合并感染按感染人工血管处理。","key":"超声“无血流信号”是血清肿与假性动脉瘤的鉴别要点。","page":93},{"id":464,"chapter":"第9章 血管通路的建立与管理","section":"第3节 移植血管内瘘成形术 五、常见并发症与处理","roles":["医生"],"level":"进阶","type":"判断","q":"血清肿是人工血管动静脉内瘘特有的并发症，较多见于人工血管静脉吻合口。（对/错？）","a":"错。血清肿是AVG特有并发症，可发生于人工血管全程，但较多见于人工血管动脉吻合口。","key":"狭窄好发于静脉吻合口，血清肿多见于动脉吻合口，两者易混。","page":93},{"id":465,"chapter":"第9章 血管通路的建立与管理","section":"第4节 血管通路的监测","roles":["医生","护士"],"level":"基础","type":"简答","q":"理想血管通路的标准是什么？血管通路监测的目标和对象分别是什么？","a":"理想标准：①长期使用，感染和栓塞并发症发生率低；②提供高血流量满足设定的透析剂量。监测目标：血管通路中具有生理学意义并可能导致血栓形成的严重狭窄等所有并发症。监测对象：不仅是维持性血液透析患者，还包括已建立血管通路的未透析患者；不成熟的内瘘可通过经皮血管腔内血管成形术和结扎竞争性静脉侧支进行补救。","key":"已建通路尚未透析的患者同样是监测对象，常被忽略。","page":93},{"id":466,"chapter":"第9章 血管通路的建立与管理","section":"第4节 血管通路的监测","roles":["医生","护士"],"level":"基础","type":"简答","q":"血管通路的监测方法包括哪几类？","a":"①物理检查：通过体格检查检测通路功能不良体征，包括观察拔针后出血时间延长、透析不充分、存在再循环、动态静脉压升高；②仪器监测：多普勒超声、磁共振血管检查等周期性评价，包括通路血流量、通路阻力或传导性、通路内压力测定；③通路再循环（大于10%提示狭窄）和Kt/V的测定。","key":"拔针后出血时间延长常提示流出道狭窄，护士应及时上报。","page":94},{"id":467,"chapter":"第9章 血管通路的建立与管理","section":"第4节 血管通路的监测","roles":["医生","护士"],"level":"基础","type":"简答","q":"判断动静脉内瘘成熟的3个重要参数是什么？正常与狭窄时表现有何区别？","a":"参数：搏动、震颤、杂音。①搏动：正常轻柔、容易压迫；狭窄时强度增强、有力。②震颤：正常弥漫、柔和、连续、机器样；狭窄时局限、增强、仅收缩期有、涡流样。③杂音：正常弥漫、连续、收缩期和舒张期均有、低调；狭窄时局限、不连续、仅收缩期有、高调。","key":"“搏动增强”反而提示下游狭窄，不是内瘘好。","page":94},{"id":468,"chapter":"第9章 血管通路的建立与管理","section":"第4节 血管通路的监测","roles":["医生","护士"],"level":"基础","type":"简答","q":"什么是抬臂试验？其原理、意义及局限是什么？","a":"①原理：通路肢体下垂时内瘘有一定程度扩张，抬高超过心脏水平时正常通路会塌陷；②存在静脉狭窄时，狭窄处远心段仍保持扩张而近心段塌陷；③意义：是初步评估通路流出道的最佳方法；④局限：不适合评估移植物血管内瘘。","key":"抬臂试验评估“流出道”，不适用于AVG。","page":94},{"id":469,"chapter":"第9章 血管通路的建立与管理","section":"第4节 血管通路的监测","roles":["医生","护士"],"level":"进阶","type":"判断","q":"搏动增强试验是初步评价动静脉内瘘流出道的最佳方法，且完全不适用于移植物血管内瘘。（对/错？）","a":"错。搏动增强试验是对通路流入道初步评价的最佳方法：在离吻合口一段距离处压闭通路，阻断处远心端搏动增强，增强程度与流入道质量正相关；该试验对评估移植物血管内瘘也有一定价值。评估流出道的最佳方法是抬臂试验。","key":"抬臂→流出道；搏动增强→流入道，务必对应记忆。","page":95},{"id":470,"chapter":"第9章 血管通路的建立与管理","section":"第4节 血管通路的监测","roles":["医生","护士"],"level":"基础","type":"填空","q":"动静脉内瘘成熟时超声测定的自然血流量超过____ml/min，内径≥____mm，距皮深度小于____mm。","a":"500；5；5。","key":"可简记为超声成熟“5-5-500”标准。","page":95},{"id":471,"chapter":"第9章 血管通路的建立与管理","section":"第4节 血管通路的监测","roles":["医生"],"level":"进阶","type":"简答","q":"新建动静脉内瘘成熟失败的病变分为哪三大类？","a":"①流入道问题：供血动脉（管径细小、动脉粥样硬化）、动脉吻合口本身、近吻合口的狭窄或功能不足；②内瘘瘘体问题：狭窄和附属静脉（超过内瘘口径的1/4时可造成成熟不良）；③流出道问题：狭窄或静脉功能不足。","key":"附属静脉超过瘘口径1/4可致成熟不良，可结扎竞争性侧支补救。","page":95},{"id":472,"chapter":"第9章 血管通路的建立与管理","section":"第5节 血管通路的介入治疗 一、总则/二、适应证及禁忌证","roles":["医生"],"level":"基础","type":"简答","q":"开展动静脉内瘘腔内介入治疗对机构和场所有何要求？其禁忌证有哪些？","a":"要求：①具备放射介入或超声介入治疗资质的二级以上医疗机构；②在符合标准的操作场所（放射介入治疗室或手术室）进行；③术前充分评估、制订方案并签署知情同意；④术中出现不可预见并发症，应及时与麻醉科、心血管外科等协作或及时终止。禁忌证：①左室射血分数小于30%或血流动力学不稳定；②合并感染或内瘘局部创面；③严重凝血功能异常或明显出血倾向；④患者不能配合。","key":"资质门槛为“二级以上医疗机构”且具备介入资质。","page":95},{"id":473,"chapter":"第9章 血管通路的建立与管理","section":"第5节 血管通路的介入治疗 一、总则/二、适应证及禁忌证","roles":["医生"],"level":"高级","type":"填空","q":"可考虑干预的内瘘狭窄影像学征象：最狭窄部位狭窄程度＞____、血管内径＜____mm，或峰值血流速为毗邻平直段血管的____倍以上（吻合口后5cm内狭窄为____倍以上）。","a":"50%；1.8；2；3。","key":"需同时伴有血流量不足、难以满足透析需求，才构成介入适应证。","page":96},{"id":474,"chapter":"第9章 血管通路的建立与管理","section":"第5节 血管通路的介入治疗 三、术前检查/四、术前准备","roles":["医生","护士"],"level":"进阶","type":"案例分析","q":"维持性透析患者近2周透析中，血流量设定200ml/min时动脉压反复为-140mmHg（连续3次），调整穿刺针位置后血流量仍＜200ml/min。是否需要进一步检查？依据是什么？","a":"需要进行动静脉内瘘功能检查。依据：透析过程中①血流量＜200ml/min且调整穿刺针位置后不能纠正；②维持200ml/min血流量时动脉压力小于-120mmHg连续2次以上（或静脉压力＞120mmHg）。若功能检查进一步异常，再行影像学检查。","key":"护士在机旁最先发现这些征象，应及时报告医生。","page":96},{"id":475,"chapter":"第9章 血管通路的建立与管理","section":"第5节 血管通路的介入治疗 三、术前检查/四、术前准备","roles":["医生","护士"],"level":"基础","type":"简答","q":"动静脉内瘘物理检查出现哪些征象时应进行内瘘功能检查？","a":"①震颤/杂音明显减弱或消失，或某处震颤/杂音异常增强；②内瘘搏动异常增强或局部短时间内出现明显瘤样扩张；③搏动增强试验或举臂抬高试验结果异常。","key":"某处杂音“异常增强”同样提示狭窄，不能只盯减弱。","page":96},{"id":476,"chapter":"第9章 血管通路的建立与管理","section":"第5节 血管通路的介入治疗 三、术前检查/四、术前准备","roles":["医生"],"level":"高级","type":"填空","q":"内瘘功能检查出现以下征象应行影像学检查：内瘘血流量＜____ml/min或较前下降____以上，或肱动脉血流量＜____ml/min；动脉穿刺点静态压＜____mmHg或Vpa/MAP＜____；静脉穿刺点压力＞____mmHg或Vpv/MAP＞____；再循环率＞____或较前升高25%以上。","a":"500；25%；600；15；0.13；40；0.35；10%。","key":"“较前下降/升高25%”的趋势指标与绝对值同等重要。","page":97},{"id":477,"chapter":"第9章 血管通路的建立与管理","section":"第5节 血管通路的介入治疗 三、术前检查/四、术前准备","roles":["医生"],"level":"进阶","type":"简答","q":"内瘘腔内介入术前准备中，患者评估和术式选择的原则是什么？","a":"评估：①充分评估全身与血管状况及心理情况，严格掌握适应证；②方案由介入治疗、血液净化和麻醉医师共同制订；③告知评估结果并签署知情同意；④术前用彩超、CTA或MRA评估供血动脉、内瘘、外周及中心静脉通畅性，确定狭窄部位程度、有无血栓及侧支，并标记。术式：①单纯内瘘或外周血管病变可超声或DSA引导；②合并中心静脉狭窄应在DSA引导下；③新鲜血栓且量较大（预计＞20ml）可超声引导下腔内溶栓或取栓；④反复狭窄、单纯球囊效果不佳可支架植入或开放手术重建。","key":"中心静脉狭窄必须DSA引导，不能单用超声。","page":98},{"id":478,"chapter":"第9章 血管通路的建立与管理","section":"第5节 血管通路的介入治疗 五、操作流程","roles":["医生"],"level":"高级","type":"填空","q":"扩张静脉的球囊导管内径建议较周围平直段血管增加____，推荐选择爆破压在____以上的高压球囊；中心静脉狭窄一般选择直径____、长度____的球囊。","a":"10%～20%；20个标准大气压；8～12mm；40mm。","key":"动脉与静脉的球囊选择原则截然不同。","page":98},{"id":479,"chapter":"第9章 血管通路的建立与管理","section":"第5节 血管通路的介入治疗 五、操作流程","roles":["医生"],"level":"进阶","type":"判断","q":"扩张动脉狭窄时，宜选用较平直段血管大10%～20%的高压球囊。（对/错？）","a":"错。扩张动脉的球囊导管内径应与周围平直段血管相同或略小，不建议使用高压力扩张动脉；“增加10%～20%＋高压球囊”是针对静脉。重度狭窄/闭塞可先小口径球囊预扩张，普通球囊无法打开时用高压球囊或切割球囊。","key":"动脉“相同或略小、不用高压”，静脉“大10%～20%、高压球囊”。","page":98},{"id":480,"chapter":"第9章 血管通路的建立与管理","section":"第5节 血管通路的介入治疗 五、操作流程","roles":["医生"],"level":"高级","type":"简答","q":"内瘘腔内介入中，支架植入的指征是什么？支架有哪几类？覆膜支架使用注意什么？","a":"指征：球囊扩张效果不佳（残余狭窄＞30%）、反复短期内再狭窄、解剖压迫性病变、闭塞病变（再次开通有风险）可一期行支架植入；但支架在处理透析通路静脉狭窄中的作用并不明确。类型：球囊扩张式支架、自膨支架、覆膜支架、药物洗脱支架。注意：覆膜支架通畅率优于裸支架，但需避免影响其他主干中心静脉回流。","key":"残余狭窄＞30%是支架与手术成功判断共同使用的界值。","page":98},{"id":481,"chapter":"第9章 血管通路的建立与管理","section":"第5节 血管通路的介入治疗 五、操作流程","roles":["医生"],"level":"进阶","type":"填空","q":"介入穿刺应选择直径____以上的相对粗大血管；球囊完全打开时间可根据需要维持____s。","a":"4mm；10～60。","key":"穿刺点优先考虑浅表易止血的血管，人工血管优先。","page":99},{"id":482,"chapter":"第9章 血管通路的建立与管理","section":"第5节 血管通路的介入治疗 五、操作流程","roles":["医生"],"level":"高级","type":"简答","q":"内瘘腔内介入时，不同入路导丝尖端应置于何处？造影范围有何要求？","a":"导丝：①静脉逆行入路导丝尖端置于桡动脉近端或肱动脉内；②上腔静脉入路导丝通过病变后尖端应进入下腔静脉；③股静脉入路导丝应通过右心房进入上腔静脉，衔接上、下腔静脉，防止导丝在右心腔内卷曲引起严重心律失常。造影：自体内瘘应包括吻合口至右心房的所有血管；移植物内瘘包括动脉吻合口至右心房的所有血管；浅表化动脉包括肱动脉至掌动脉弓的所有血管。","key":"导丝在右心腔卷曲可诱发严重心律失常。","page":99},{"id":483,"chapter":"第9章 血管通路的建立与管理","section":"第5节 血管通路的介入治疗 五、操作流程","roles":["医生"],"level":"进阶","type":"判断","q":"超声引导下行内瘘球囊扩张时，压力泵内应抽吸造影剂原液。（对/错？）","a":"错。超声引导下压力泵内应抽吸肝素生理盐水；DSA引导下压力泵内需抽吸造影剂原液或1:1稀释后的造影剂。","key":"按引导方式选择压力泵介质。","page":100},{"id":484,"chapter":"第9章 血管通路的建立与管理","section":"第5节 血管通路的介入治疗 五、操作流程","roles":["医生"],"level":"高级","type":"简答","q":"内瘘腔内介入治疗如何判定手术成功？效果不佳时如何处理？","a":"成功标准：物理检查发现内瘘震颤恢复或明显增强；影像学提示狭窄解除、残余狭窄小于30%；内瘘血流量较术前增加50%以上，或增加至600ml/min以上。效果不佳：可重复治疗、更换更合适的球囊再次治疗，或改行支架植入等额外治疗。","key":"“残余狭窄＜30%、流量增加50%或≥600ml/min”是质控常考数字。","page":100},{"id":485,"chapter":"第9章 血管通路的建立与管理","section":"第5节 血管通路的介入治疗 六、术后处置","roles":["医生","护士"],"level":"基础","type":"简答","q":"内瘘腔内介入术后的监测与护理要求有哪些？","a":"①术后常规行4～6h心电、血氧饱和度监测；②医护人员术后12h内对患者进行系统的内瘘物理检查，护理人员每2～4h进行内瘘触诊及听诊；③穿刺点缝合者术后24h拆线；④进行术后宣教；⑤拔鞘后按压或八字缝合止血，无菌包扎，评估生命体征及出血量。","key":"护士“每2～4h触诊听诊”是术后早期发现再闭塞的关键。","page":101},{"id":486,"chapter":"第9章 血管通路的建立与管理","section":"第5节 血管通路的介入治疗 六、术后处置","roles":["医生"],"level":"进阶","type":"判断","q":"内瘘腔内介入术后应常规使用抗凝抗血小板药物，并围术期预防性使用抗生素。（对/错？）","a":"错。术后不推荐常规使用抗凝抗血小板药物，如存在高凝状态或血压较低且无明确出血倾向，可适当皮下注射低分子量肝素；术前术后均不推荐使用抗生素。","key":"与AVG术前1h预防用抗生素不同，介入治疗不推荐抗生素。","page":101},{"id":487,"chapter":"第9章 血管通路的建立与管理","section":"第5节 血管通路的介入治疗 六、术后处置","roles":["医生","护士"],"level":"基础","type":"简答","q":"内瘘腔内介入治疗后的长期随访有何要求？","a":"①建立血管通路档案，统一管理；②术后1个月内对内瘘及相关血管进行系统评估（物理检查、功能学检查及影像学检查），并每3个月重复，结果记入档案；③随访发现病变再发应及时处理。","key":"“1个月内首评、每3个月复评”是随访频度考点。","page":101},{"id":488,"chapter":"第9章 血管通路的建立与管理","section":"第5节 血管通路的介入治疗 七、并发症与处理","roles":["医生"],"level":"进阶","type":"简答","q":"内瘘介入术中出现血管痉挛、内膜撕裂和球囊破裂时分别如何处理？","a":"①血管痉挛：导丝导管刺激所致，多数数分钟至数小时内自行缓解，无须特殊干预；②内膜撕裂：多数无须干预，如形成夹层或突入管腔影响血流，可在该部位重复球囊扩张使内膜贴合，球囊压力控制在工作压；③球囊破裂：待球囊回抱后撤出并检查完整性，完整者更换球囊继续；不完整有腔内残留者应影像学明确位置，沿导丝置入抓捕装置取出。","key":"球囊破裂后必须检查完整性，防止碎片残留。","page":102},{"id":489,"chapter":"第9章 血管通路的建立与管理","section":"第5节 血管通路的介入治疗 七、并发症与处理","roles":["医生"],"level":"高级","type":"案例分析","q":"PTA球囊扩张后，扩张部位出现迅速增大的搏动性肿块，提示仍有活动性出血。按规程应如何分级并逐步处理？","a":"①分级：Ⅰ级——局部血肿、无活动性出血、不压迫血管、内瘘通畅，无须处理、监测血肿；Ⅱ级——无活动性出血但血肿压迫内瘘致狭窄或闭塞，于受压部位重复球囊扩张至血流恢复；Ⅲ级——仍有活动性出血或假性动脉瘤形成、瘤体增大；②本例为Ⅲ级：先按压吻合口或上游供血动脉阻断内瘘供血；出血停止则按Ⅱ级处理；仍有出血则阻断同时于破裂部位行球囊堵压；仍出血或内瘘血流无法恢复，于破裂部位放置覆膜支架；必要时改开
