活动性出血或DIC”。","page":183},{"id":763,"chapter":"第17章 血浆吸附","section":"三、操作程序","roles":["医生"],"level":"基础","type":"填空","q":"一般单次血浆吸附治疗的剂量为____倍血浆容量，治疗持续时间以____h为宜；若有必要可更换____次吸附柱继续吸附。","a":"2～3；2～3；1。","key":"血浆吸附2～3倍，血浆置换1～1.5倍（≤2倍），勿混淆。","page":184},{"id":764,"chapter":"第17章 血浆吸附","section":"三、操作程序","roles":["医生"],"level":"高级","type":"案例分析","q":"女性患者，体重55kg，血细胞比容0.35，拟行免疫吸附。按规程公式计算血浆容量及单次治疗剂量范围。","a":"①精确公式：（1-0.35）×[864+（47.2×55）]=0.65×3460=2249ml；②估计公式：0.065×55×0.65≈2.32L；③单次吸附剂量为2～3倍血浆容量，约4498～6747ml（以2249ml计），持续2～3h。","key":"女性b=864、c=47.2；剂量倍数用血浆吸附的2～3倍。","page":184},{"id":765,"chapter":"第17章 血浆吸附","section":"三、操作程序","roles":["护士","技师"],"level":"进阶","type":"简答","q":"血浆吸附需设定哪些治疗参数？","a":"血液泵、血浆泵、废液泵和肝素泵流量，血浆处理目标量，温度，以及各种报警参数。","key":"温度和报警参数常被遗漏。","page":185},{"id":766,"chapter":"第17章 血浆吸附","section":"三、操作程序","roles":["护士"],"level":"基础","type":"填空","q":"血浆吸附开始时先全血自循环____min；血流量一般从____ml/min逐渐增加至____ml/min，分离的血浆以____ml/min的流速流经吸附柱。","a":"5～10；50～80；100～150；25～50。","key":"血浆流经吸附柱25～50ml/min，过快影响吸附效率。","page":185},{"id":767,"chapter":"第17章 血浆吸附","section":"三、操作程序","roles":["护士"],"level":"基础","type":"简答","q":"血浆吸附治疗中护士应重点观察哪些内容？","a":"①机器运行：全血流速、血浆流速、动脉压、静脉压、跨膜压变化；②各种滤器情况、血浆颜色，注意有无溶血，如有破膜及时更换相应分离器；③每30min测血压、心率、呼吸、脉搏，询问有无不适；④治疗后记录生命体征、病情变化、治疗参数、过程及结果。","key":"血浆颜色变红提示溶血/破膜，须及时更换分离器。","page":185},{"id":768,"chapter":"第17章 血浆吸附","section":"四、并发症及处理","roles":["医生","护士"],"level":"进阶","type":"简答","q":"血浆吸附中低血压和过敏反应如何预防和处理？","a":"低血压：多由体外循环引起，本身低血容量者上机前酌情补充必要的胶体或晶体溶液。过敏反应：治疗前各种滤器、管路充分预冲，预冲时注意检查吸附柱；出现过敏症状时给予肾上腺糖皮质激素和/或抗组胺药物、吸氧等对症治疗，必要时终止治疗，休克时按过敏性休克处理。","key":"充分预冲是预防过敏的关键。","page":185},{"id":769,"chapter":"第17章 血浆吸附","section":"四、并发症及处理","roles":["医生","护士"],"level":"进阶","type":"填空","q":"血浆吸附凝血多与术前肝素剂量不足、高凝状态或伴有____有关；开始治疗____以内的充分抗凝非常重要；出血多为____所致。","a":"高脂血症；半小时；抗凝剂过量。","key":"高脂血症患者行吸附易凝，前半小时抗凝要足。","page":186},{"id":770,"chapter":"第17章 血浆吸附","section":"四、并发症及处理","roles":["医生","护士"],"level":"高级","type":"案例分析","q":"家族性高胆固醇血症患者行血浆吸附，开始后40min跨膜压短时间内迅速升高，血浆颜色正常。如何分析与处理？","a":"①考虑血浆分离器/吸附柱内凝血（与高脂血症、肝素剂量不足相关）；②临时追加肝素量，并根据跨膜压变化调整肝素追加量；③密切观察，若出现滤器破膜（血浆变红）应立即更换；④总结：开始治疗半小时以内充分抗凝非常重要。","key":"跨膜压迅速升高→临时追加肝素；破膜→立即更换。","page":186},{"id":771,"chapter":"第17章 血浆吸附","section":"四、并发症及处理","roles":["医生","护士"],"level":"高级","type":"案例分析","q":"急性肝衰竭患者，INR 2.8，拟经股静脉置管后行血浆吸附。如何预防穿刺局部血肿、腹膜后出血等并发症？","a":"①肝衰竭患者凝血功能差，可酌情于治疗前输血浆、凝血酶原复合物等补充凝血因子；②治疗中注意肝素用量；③术中、术后卧床休息，减少穿刺部位活动，或局部止血。","key":"规程并发症还包括气胸，提示颈内/锁骨下置管同样需警惕。","page":186},{"id":772,"chapter":"第17章 血浆吸附","section":"附：血浆吸附治疗模式与血浆吸附柱","roles":["医生","技师"],"level":"基础","type":"简答","q":"免疫吸附柱分为哪两大类？各包含哪些结合型？","a":"①生物亲和吸附柱：抗原抗体结合型、补体结合型、Fc结合型三种；②物理化学亲和吸附柱：静电结合型、疏水结合型两种。","key":"生物亲和3型、物理化学亲和2型。","page":186},{"id":773,"chapter":"第17章 血浆吸附","section":"附：血浆吸附治疗模式与血浆吸附柱","roles":["医生","技师"],"level":"高级","type":"判断","q":"葡萄球菌A蛋白（SPA）吸附柱属于物理化学亲和吸附柱。（对/错？）","a":"错。SPA吸附柱属于生物亲和吸附柱；同类还有多克隆抗人ApoB抗体、多克隆抗人IgG抗体、DNA、C1q、抗LDL抗体吸附柱等。","key":"物理化学亲和代表：苯丙氨酸、色氨酸、DSC、胆红素、PMX-F。","page":186},{"id":774,"chapter":"第17章 血浆吸附","section":"附：血浆吸附治疗模式与血浆吸附柱","roles":["医生","技师"],"level":"进阶","type":"填空","q":"苯丙氨酸吸附柱、色氨酸吸附柱、硫酸葡聚糖纤维素（DSC）吸附柱、胆红素吸附柱、多黏菌素B纤维柱（PMX-F）属于____吸附柱。","a":"物理化学亲和。","key":"DSC常用于降LDL，但属物理化学亲和而非抗体型。","page":186},{"id":775,"chapter":"第17章 血浆吸附","section":"附：血浆吸附治疗模式与血浆吸附柱","roles":["医生"],"level":"进阶","type":"简答","q":"什么是血浆灌流吸附（分子筛吸附）？常用吸附剂及主要用途？","a":"应用血浆膜式分离技术将血浆从血液中直接分离出来，进入血液灌流器，吸附血浆中各种毒素后再返回体内。常用吸附剂为活性炭和树脂两种。主要用于清除尿毒症中分子毒素（如β2微球蛋白等）、药物中毒和毒物（白蛋白结合毒素）中毒等。","key":"与血液灌流相比，血浆灌流避免了血细胞与吸附剂直接接触。","page":186},{"id":776,"chapter":"第17章 血浆吸附","section":"附：血浆吸附治疗模式与血浆吸附柱","roles":["医生"],"level":"高级","type":"简答","q":"简述配对血浆滤过吸附（CPFA）的定义、特点和适用情形。","a":"定义：全血先由血浆分离器分离出血浆，血浆经吸附柱吸附后与血细胞混合，再经血液滤过或血液透析后回输体内（也称连续性血浆分离吸附）。特点：溶质筛选系数高、生物相容性好、兼有清除细胞因子和调整内环境功能，能广谱清除促炎及抗炎物质并具有自我调节功能。适用：急性肾损伤、败血症、重症急性胰腺炎、甲状腺毒症、肌溶解、吉兰-巴雷综合征、高蛋白结合毒物或药物中毒和MODS等危重患者。","key":"CPFA = 血浆吸附 + 血液滤过/透析串联，兼顾炎症介质清除与内环境调节。","page":187},{"id":777,"chapter":"第17章 血浆吸附","section":"附：血浆吸附治疗模式与血浆吸附柱","roles":["医生"],"level":"高级","type":"简答","q":"双重血浆分子吸附系统（DPMAS）采用哪两种吸附剂？主要用于哪些疾病？","a":"采用中性大孔树脂和离子交换树脂两种吸附剂联合应用，增加炎性介质、胆红素等多种物质的清除能力；可单独或与血浆置换等联合。用于各种原因导致的肝衰竭、肝肺综合征、MODS等。","key":"DPMAS不需血浆，常与血浆置换联合治疗肝衰竭。","page":187},{"id":778,"chapter":"第18章 血液灌流","section":"一、定义及概述","roles":["医生","护士","技师"],"level":"基础","type":"简答","q":"什么是血液灌流（HP）？其应用范围有哪些拓展？","a":"将患者血液从体内引到体外循环系统，通过灌流器中吸附剂（活性炭、树脂等）与体内待清除的代谢产物、毒性物质及药物间的吸附结合，达到清除这些物质的治疗方法。除药物或毒物中毒外，已广泛用于重症感染、严重肝衰竭、终末期肾脏疾病（尿毒症）以及各种自身免疫性疾病等。","key":"血液灌流是全血直接通过吸附剂，与血浆吸附先分离血浆不同。","page":188},{"id":779,"chapter":"第18章 血液灌流","section":"二、适应证及禁忌证","roles":["医生"],"level":"基础","type":"简答","q":"血液灌流治疗终末期肾脏病（尿毒症）的适用情形有哪些？","a":"特别是合并顽固性瘙痒、难治性高血压、高β2微球蛋白血症、继发性甲状旁腺功能亢进、周围神经病变等患者。","key":"五个合并症需记全，尤其继发性甲旁亢、周围神经病变。","page":188},{"id":780,"chapter":"第18章 血液灌流","section":"二、适应证及禁忌证","roles":["医生"],"level":"进阶","type":"填空","q":"中国患者临床研究显示，每周____次HA树脂血液灌流器与血液透析器串联治疗____h，可显著提高维持性血液透析患者血清____和____的清除率，改善瘙痒症状。","a":"1；2；iPTH；β2微球蛋白。","key":"频次为“每周1次”、时长“2h”。","page":188},{"id":781,"chapter":"第18章 血液灌流","section":"二、适应证及禁忌证","roles":["医生"],"level":"基础","type":"简答","q":"除药物中毒与尿毒症外，血液灌流的其他适应证有哪些？","a":"①重症肝炎，特别是暴发性肝衰竭导致的肝性脑病、高胆红素血症；②系统性炎症反应综合征、脓毒症等重症感染；③银屑病或其他自身免疫性疾病；④其他：海洛因等药物成瘾、家族性高胆固醇血症、重症急性胰腺炎、甲状腺功能亢进危象等。","key":"急性药物或毒物中毒是血液灌流的首位适应证。","page":188},{"id":782,"chapter":"第18章 血液灌流","section":"二、适应证及禁忌证","roles":["医生"],"level":"基础","type":"判断","q":"血液灌流的禁忌证仅为对体外血路或灌流器等材料过敏者。（对/错？）","a":"对。规程列出的血液灌流禁忌证为：对体外血路或灌流器等材料过敏者。","key":"与血浆置换/吸附不同，血液灌流章仅列一条禁忌证。","page":188},{"id":783,"chapter":"第18章 血液灌流","section":"三、血管通路","roles":["医生","护士"],"level":"基础","type":"简答","q":"血液灌流如何选择血管通路？","a":"①药物中毒等短时性血液灌流者以无隧道无涤纶套中心静脉导管为宜；②维持性血液透析患者可采用已建立的血管通路（带涤纶套的隧道式中心静脉导管、自体动静脉内瘘或移植物血管）。","key":"中毒抢救首选无隧道无涤纶套导管。","page":188},{"id":784,"chapter":"第18章 血液灌流","section":"四、操作程序","roles":["护士"],"level":"进阶","type":"简答","q":"简述灌流器静态肝素化的操作步骤。","a":"在治疗准备室严格无菌操作：①用一次性注射器（2～5ml）抽取肝素注射液12500U（100mg）；②打开灌流器一侧保护帽，置于无菌治疗巾内；③去除针头，将肝素直接注入灌流器内保存液中；④取出保护帽覆盖拧紧；⑤将灌流器上下180°反转摇匀（约10次）；⑥置于无菌治疗巾内静置20～30min待用。","key":"肝素需“去针头直接注入保存液”；静态肝素化适于湿法保存的灌流器。","page":189},{"id":785,"chapter":"第18章 血液灌流","section":"四、操作程序","roles":["护士"],"level":"基础","type":"填空","q":"灌流器静态肝素化：抽取肝素注射液____U（____mg）注入灌流器，上下____°反转摇匀约____次，静置____min待用。","a":"12500；100；180；10；20～30。","key":"剂量为一整支肝素12500U，勿与预冲肝素盐水浓度混淆。","page":189},{"id":786,"chapter":"第18章 血液灌流","section":"四、操作程序","roles":["护士","技师"],"level":"基础","type":"判断","q":"中毒抢救情况紧急时，血液灌流机器可简化或跳过部分自检步骤以争取时间。（对/错？）","a":"错。应按照机器要求完成全部自检程序，严禁简化或跳过自检步骤。","key":"“严禁简化或跳过自检”是规程硬性要求。","page":189},{"id":787,"chapter":"第18章 血液灌流","section":"四、操作程序","roles":["护士"],"level":"基础","type":"简答","q":"血液灌流器与管路预冲的血泵速度和预冲总量是多少？预冲中发现游离吸附剂颗粒说明什么？","a":"启动血泵，速度200～300ml/min，一般预冲盐水总量2000～5000ml，或参照产品说明书。如预冲过程中发现游离的吸附剂颗粒冲出，提示吸附剂包膜破损，必须更换血液灌流器。","key":"颗粒冲出必须更换，否则可致吸附剂颗粒栓塞。","page":190},{"id":788,"chapter":"第18章 血液灌流","section":"四、操作程序","roles":["护士","技师"],"level":"进阶","type":"填空","q":"血液灌流动态预冲即将结束前，用肝素生理盐水（生理盐水____ml加入普通肝素____U，即____mg）浸泡管路和滤器____min，上机前应给予不少于____ml的生理盐水冲洗。","a":"500；2500；20；30；500。","key":"肝素类药物过敏或既往HIT患者禁用肝素盐水浸泡。","page":190},{"id":789,"chapter":"第18章 血液灌流","section":"四、操作程序","roles":["医生","护士"],"level":"进阶","type":"判断","q":"既往发生HIT的患者行血液灌流时，仍可使用肝素生理盐水浸泡管路和灌流器，只要上机前充分冲洗即可。（对/错？）","a":"错。肝素类药物过敏或既往发生HIT患者禁用肝素生理盐水浸泡，抗凝可选阿加曲班。","key":"HIT患者任何环节均应避免肝素暴露。","page":190},{"id":790,"chapter":"第18章 血液灌流","section":"四、操作程序","roles":["护士"],"level":"进阶","type":"案例分析","q":"护士预冲活性炭灌流器时，见静脉端流出液中有黑色细小颗粒。应如何处理？若误用可能导致什么并发症？","a":"①提示吸附剂包膜破损，必须更换血液灌流器，不得继续使用；②若继续使用，吸附剂颗粒可进入体内导致吸附剂颗粒栓塞，表现为进行性呼吸困难、胸闷、血压下降等。","key":"预冲阶段就是质量把关环节，颗粒冲出零容忍。","page":190},{"id":791,"chapter":"第18章 血液灌流","section":"四、操作程序","roles":["医生","护士"],"level":"进阶","type":"简答","q":"休克或低血容量患者行血液灌流前如何减少体外循环对血压的影响？","a":"可于灌流治疗开始前进行体外预充，预充液可采用生理盐水、代血浆、新鲜血浆或5%白蛋白，从而降低体外循环对患者血压的影响。","key":"体外预充液可选胶体，休克患者不宜用纯盐水大量预充后直接上机。","page":190},{"id":792,"chapter":"第18章 血液灌流","section":"四、操作程序","roles":["护士"],"level":"基础","type":"简答","q":"维持性透析患者行血液灌流时，动静脉内瘘穿刺的要点有哪些？","a":"①检查通路有无红肿、渗血、硬结，摸清走向与搏动，听诊杂音；②选用合规有效消毒剂消毒；③根据血管粗细和血流量选择穿刺针；④穿刺前戴护目镜/防护面罩、清洁手套，阳性治疗区应穿隔离衣；⑤采用阶梯式、扣眼式等方法，先穿刺静脉、再穿刺动脉，动脉端穿刺点距吻合口3cm以上、动静脉穿刺点间距5cm以上；⑥按医嘱推注首剂量抗凝剂，建立体外循环。","key":"“先静脉后动脉”、“3cm/5cm”是常考数字。","page":191},{"id":793,"chapter":"第18章 血液灌流","section":"四、操作程序","roles":["护士"],"level":"基础","type":"填空","q":"血液灌流启动血泵以____ml/min为宜，逐渐调至____ml/min；体外循环血流量一般以____ml/min为宜。","a":"50～100；100～200；100～200。","key":"血液灌流血流量明显低于常规血液透析。","page":191},{"id":794,"chapter":"第18章 血液灌流","section":"四、操作程序","roles":["医生"],"level":"进阶","type":"简答","q":"血液灌流的普通肝素抗凝方案有何特点？","a":"血液灌流时肝素用量较常规血液透析剂量要大。普通肝素适用于无活动性出血或无出血风险、血液高凝状态者：首剂量62.5～125U/kg（0.5～1.0mg/kg），追加1250～2500U/h（10～20mg/h），间歇静注或持续静脉输注（常用），预期结束前30min可停止追加；剂量个体化；也可采用灌流器静态肝素化法进行治疗前预处理（适于湿法保存的灌流器）。","key":"吸附剂会吸附肝素，故用量较常规透析大。","page":191},{"id":795,"chapter":"第18章 血液灌流","section":"四、操作程序","roles":["医生"],"level":"高级","type":"判断","q":"血液灌流使用阿加曲班的追加剂量与血浆置换相同，均为1～2μg/(kg·min)。（对/错？）","a":"错。血液灌流阿加曲班首剂量250μg/kg、追加剂量2μg/(kg·min)持续滤器前给药；血浆置换追加剂量为1～2μg/(kg·min)；均依据APTT调整。","key":"两章数值不同，是高级考核细节陷阱。","page":191},{"id":796,"chapter":"第18章 血液灌流","section":"四、操作程序","roles":["医生"],"level":"高级","type":"简答","q":"血液灌流的血流速度与疗效关系如何？单次治疗时间和更换灌流器有何规定？","a":"①血流速与疗效显著相关：速度过快所需治疗时间相对较长，速度较慢则所需时间相对较短，但过慢易凝血；②常用树脂、活性炭吸附剂对大多数溶质的吸附一般在2h内达到饱和；如临床需要可每间隔2h更换1个灌流器，但一次连续灌流治疗时间一般不超过6h；③脂溶性较高的药物或毒物治疗后可能从脂肪组织再释放入血，可间隔一定时间后再次灌流。","key":"2h饱和、2h更换、不超过6h。","page":192},{"id":797,"chapter":"第18章 血液灌流","section":"四、操作程序","roles":["医生","护士"],"level":"进阶","type":"填空","q":"常用树脂、活性炭吸附剂对大多数溶质的吸附一般在____h内达到饱和；如临床需要可每间隔____h更换1个灌流器，一次连续灌流治疗时间一般不超过____h。","a":"2；2；6。","key":"超过2h不换灌流器，吸附已饱和，继续灌流意义有限。","page":192},{"id":798,"chapter":"第18章 血液灌流","section":"六、治疗毒物中毒时影响疗效的因素","roles":["医生","护士"],"level":"高级","type":"案例分析","q":"患者口服大量苯巴比妥后昏迷，行单纯血液灌流2h后准备结束治疗。应采用何种回血方式？理由及注意事项是什么？","a":"①采用空气回血法；②理由：生理盐水回血有可能增加毒物与吸附剂洗脱解离而再次入血的风险，空气回血可尽量减少这一风险；③注意事项：基本过程同生理盐水回血，但需警惕空气栓塞风险，严密观察，防止空气进入体内；④苯巴比妥脂溶性较高，治疗后需监测反跳，必要时再次灌流。","key":"空气回血仅用于急性药物中毒抢救，其他情况用生理盐水密闭式回血。","page":193},{"id":799,"chapter":"第18章 血液灌流","section":"四、操作程序","roles":["护士","技师"],"level":"高级","type":"简答","q":"组合式血液灌流联合血液透析的管路预冲步骤是什么？","a":"①动态肝素化法：生理盐水排净动脉端管路气体，连接动脉端管路—灌流器—静脉端管路，用肝素100mg/500ml生理盐水缓慢冲洗，静置20～30min后再用1000ml生理盐水冲洗；②静态肝素化法：连接同上，用生理盐水1000ml冲洗；③断开灌流器与静脉端管路，静脉端管路接透析器静脉端，用连接管连接灌流器静脉端与透析器动脉端，用生理盐水2000ml（或按说明书）串联冲洗；④预冲液直接流入废液收集袋，袋放于机器液体架上，不得低于操作者腰部以下，不建议流入开放式废液桶。","key":"灌流器必须先独立预冲，再与透析器串联预冲；顺序不能颠倒。","page":193},{"id":800,"chapter":"第18章 血液灌流","section":"四、操作程序","roles":["护士"],"level":"高级","type":"简答","q":"组合式血液灌流联合血液透析的操作注意事项有哪些？","a":"①操作复杂、断开连接环节多，要严格无菌操作，严禁液体滴洒和空气进入；②灌流器必须独立预冲后，再与透析器连接串联预冲，严格按预冲剂量和顺序；③推荐使用有多功能连接装置和2个废液收集袋的管路，实现灌流器、透析器分别密闭式独立预冲，避免预冲和撤出灌流器过程中的断开环节。","key":"推荐“多功能连接装置+2个废液袋”的密闭式管路。","page":193},{"id":801,"chapter":"第18章 血液灌流","section":"四、操作程序","roles":["护士"],"level":"进阶","type":"案例分析","q":"维持性透析患者行HA灌流器串联血液透析，灌流2h已完成，需继续透析2h。应如何撤除灌流器？后续抗凝如何调整？","a":"①根据医嘱完成灌流后，调整血液流量至50～100ml/min；②用生理盐水200ml全程回血，灌流器颜色变浅后撤除灌流器，继续透析治疗；③严格无菌操作，严禁断开时血液滴洒和空气进入；④灌流结束后维持透析时追加抗凝剂剂量可适当减少。","key":"撤除灌流器时回血盐水为200ml，撤后肝素追加可减量。","page":194},{"id":802,"chapter":"第18章 血液灌流","section":"五、监测","roles":["护士","技师"],"level":"高级","type":"简答","q":"血液灌流中动、静脉端压力报警各提示什么？","a":"①动脉端低压报警：常见于各种原因导致的血流量不足；②动脉端高压报警：常见于灌流器内血液阻力增加，多见于合并高凝状态，应追加肝素剂量；③静脉端低压报警：多见于灌流器内凝血；④静脉端高压报警：多见于除泡器内凝血、滤网堵塞。","key":"“静脉压低”提示灌流器内凝血，与常规透析思维相反，易判断错误。","page":194},{"id":803,"chapter":"第18章 血液灌流","section":"五、监测","roles":["医生","护士"],"level":"高级","type":"案例分析","q":"有机磷农药中毒患者行血液灌流，30min后血压由105/65mmHg降至78/45mmHg，评估容量充足，考虑为中毒本身所致循环抑制。应如何处理？","a":"①血压下降时先相应减慢血泵速度，适当扩充血容量，必要时加用升压药物；②判断血压下降是由于药物中毒而非血容量减少所致时，应当一边静脉滴注升压药物一边继续进行血液灌流治疗，以免失去抢救治疗的时机；③密切观察呼吸、心率、血压变化。","key":"中毒所致低血压不应停止灌流，否则失去抢救时机。","page":194},{"id":804,"chapter":"第18章 血液灌流","section":"五、监测","roles":["医生"],"level":"进阶","type":"简答","q":"什么是血液灌流治疗毒物中毒时的“反跳现象”？原因和处置？","a":"定义：灌流后临床症状与体征暂时缓解，治疗结束后数小时或次日再次加重。原因：①部分脂溶性较高的药物/毒物（安眠药或有机磷农药等）从组织中再次释放入血；②洗胃不彻底，药物/毒物再次经胃肠道吸收入血。处置：一旦出现反跳，再次进行血液灌流等治疗。","key":"反跳观察窗为“数小时或次日”，灌流后不能过早放松监测。","page":194},{"id":805,"chapter":"第18章 血液灌流","section":"五、监测","roles":["医生","护士"],"level":"基础","type":"判断","q":"对存在出凝血机制紊乱者，建议血液灌流治疗中监测出凝血指标，并借此调整抗凝方案。（对/错？）","a":"对。规程监测部分明确提出此要求。","key":"尤其肝衰竭、中毒致凝血异常患者需动态监测。","page":194},{"id":806,"chapter":"第18章 血液灌流","section":"六、治疗毒物中毒时影响疗效的因素","roles":["医生"],"level":"进阶","type":"简答","q":"毒物中毒时哪些情况应立即进行血液灌流治疗？","a":"判断药物/毒物已入血应尽早灌流。存在下列情况应立即灌流：①毒物中毒剂量过大或已达致死剂量（浓度）者；②病情严重伴脑功能障碍或昏迷者；③伴有肝肾功能障碍者；④老年患者或药物有延迟毒性者。","key":"“老年”和“延迟毒性”两项常被遗漏。","page":195},{"id":807,"chapter":"第18章 血液灌流","section":"六、治疗毒物中毒时影响疗效的因素","roles":["医生"],"level":"基础","type":"简答","q":"治疗毒物中毒时影响血液灌流疗效的因素有哪些？","a":"①药物/毒物的剂量、毒性强弱及个体差异；②治疗时机；③回血方式（应用空气回血法）；④各种原发疾病的病情严重性、复杂性及顽固性。","key":"回血方式被列为影响疗效因素，生理盐水回血可致毒物解离再入血。","page":195},{"id":808,"chapter":"第18章 血液灌流","section":"七、并发症及处理","roles":["医生","护士"],"level":"高级","type":"案例分析","q":"患者行血液灌流40min后出现寒战、发热、胸闷，复查白细胞和血小板较灌流前下降至约35%，血压、氧饱和度尚稳定。如何判断和处理？","a":"①考虑吸附剂生物不相容（典型表现为开始后0.5～1.0h寒战、发热、胸闷、呼吸困难，白细胞或血小板一过性下降，可低至灌流前的30%～40%）；②一般不需要中止灌流，可静脉注射地塞米松、吸氧等处理；③如经处理症状不缓解并严重影响生命体征，应及时中止灌流治疗。","key":"生物不相容一般不必停机，与颗粒栓塞（必须停止）区分。","page":195},{"id":809,"chapter":"第18章 血液灌流","section":"七、并发症及处理","roles":["医生","护士"],"level":"进阶","type":"案例分析","q":"血液灌流开始后患者出现进行性呼吸困难、胸闷、血压下降。应考虑哪些并发症？如何处理？","a":"①应考虑吸附剂颗粒栓塞（尤其预冲或治疗中有颗粒冲出时），一旦出现必须停止治疗，予吸氧或高压氧治疗，同时对症处理；②亦需鉴别空气栓塞（突发呼吸困难、胸闷气短、咳嗽，重者发绀、血压下降甚至昏迷），确诊须立即停止灌流，吸入高浓度氧气，按空气栓塞抢救规范治疗；③与生物不相容鉴别：后者多为寒战发热、一过性血细胞下降，一般无需中止。","key":"颗粒栓塞与空气栓塞均须“立即停止治疗”。","page":195},{"id":810,"chapter":"第18章 血液灌流","section":"七、并发症及处理","roles":["医生"],"level":"进阶","type":"判断","q":"活性炭灌流可能吸附较多凝血因子（如纤维蛋白原），肝性脑病患者灌流时易导致血小板聚集而发生严重凝血，并可诱发血压下降。（对/错？）","a":"对。血小板大量聚集活化后释放大量活性物质，进而诱发血压下降，治疗中应注意观察与处理。","key":"肝性脑病行活性炭灌流需重点防范凝血和低血压。","page":195},{"id":811,"chapter":"第19章 血液透析患者高血压的治疗","section":"一、血液透析患者高血压的分类与定义","roles":["医生","护士"],"level":"基础","type":"简答","q":"血液透析患者高血压包括哪两类？分别如何定义？","a":"①透析高血压：透析过程中平均动脉压较透析前升高15mmHg以上；②透析间期高血压：非透析日血压符合高血压诊断标准（居家自测连续6个非透析日早晨和夜间平均BP≥135/85mmHg，或动态血压非透析日24h平均BP≥130/80mmHg，或非透析日诊室BP≥140/90mmHg）。","key":"透析高血压看的是“平均动脉压”较透前升高＞15mmHg，不是收缩压升高15mmHg。","page":197},{"id":812,"chapter":"第19章 血液透析患者高血压的治疗","section":"一、血液透析患者高血压的分类与定义","roles":["医生","护士"],"level":"基础","type":"填空","q":"透析间期高血压诊断：居家自测血压连续____个非透析日早晨和夜间平均BP≥____mmHg；动态血压非透析日24h平均BP≥____mmHg；非透析日诊室BP≥____mmHg。","a":"6；135/85；130/80；140/90。","key":"三种测量方式阈值不同，诊室最高（140/90）、24h动态最低（130/80），常被混淆。","page":197},{"id":813,"chapter":"第19章 血液透析患者高血压的治疗","section":"二、血液透析患者高血压的主要病因和危险因素","roles":["医生"],"level":"基础","type":"简答","q":"列出血液透析患者高血压的主要病因和危险因素。","a":"①残肾功能丧失和钠盐摄入过多等引起的水钠潴留、容量负荷过重；②RAAS活性增强；③交感神经兴奋；④氧化应激与微炎症状态；⑤甲状旁腺功能亢进；⑥睡眠障碍；⑦药物影响（红细胞生成刺激素、环孢素、他克莫司、肾上腺皮质激素、非甾体类抗炎药等）；⑧血液透析对降压药物体内代谢的影响；⑨其他：高血压、糖尿病等原发病，铅中毒、肾脏移植等。","key":"水钠潴留/容量负荷过重居首位；ESA、钙调磷酸酶抑制剂等药物性因素和睡眠障碍、甲旁亢常被遗漏。","page":197},{"id":814,"chapter":"第19章 血液透析患者高血压的治疗","section":"三、血液透析患者高血压的治疗（一）评估临床类型","roles":["医生","护士"],"level":"基础","type":"简答","q":"对合并高血压的血液透析患者，应如何评估其高血压临床类型？","a":"应连续3个透析日和非透析日的周期，评估患者非透析日及透析日、透析前、透析过程中和透析后的血压，绘制患者血压波动曲线，明确高血压的临床类型。","key":"只看透前诊室血压无法分型，必须覆盖3个“透析日+非透析日”周期并绘制血压波动曲线。","page":198},{"id":815,"chapter":"第19章 血液透析患者高血压的治疗","section":"三、血液透析患者高血压的治疗（一）评估临床类型","roles":["医生"],"level":"高级","type":"简答","q":"“高-下降/低-低-高型”高血压的主要病因是什么？","a":"在容量负荷增多的基础上，透析过程中溶质清除过快导致血浆渗透压降低，引起血管内液体再充盈不足，且合并心力衰竭或交感神经反应性不足，引发透析低血压。","key":"关键机制是“溶质清除过快→渗透压下降→再充盈不足”叠加心衰/交感反应不足，故治疗要降透析效率而非单纯加降压药。","page":198},{"id":816,"chapter":"第19章 血液透析患者高血压的治疗","section":"三、血液透析患者高血压的治疗（一）评估临床类型","roles":["医生"],"level":"进阶","type":"判断","q":"“正常-高-正常-正常型”患者透析中血压升高的主要病因是容量负荷增多。（对/错？）","a":"错。该型主要病因是患者合并肾素-血管紧张素系统或交感神经反应性增强，引发透析高血压；以容量负荷增多为主要病因的是“高-下降-正常-高型”。","key":"透前血压正常提示容量并不突出，透中随超滤升压是RAS/交感激活所致。","page":199},{"id":817,"chapter":"第19章 血液透析患者高血压的治疗","section":"三、（二）控制透析间期体液容量，干体重达标","roles":["医生","护士"],"level":"基础","type":"简答","q":"干体重达标的标准有哪些？","a":"①透析过程中无明显低血压；②透析前血压得到有效控制；③临床无水肿表现；④胸部X线无肺淤血征象；⑤心胸比值男性＜50%，女性＜53%。有条件的中心也可应用生物电阻抗法评估。","key":"心胸比值男女阈值不同（50% vs 53%）；干体重达标是所有高血压透析患者降压治疗的基础。","page":199},{"id":818,"chapter":"第19章 血液透析患者高血压的治疗","section":"三、（二）控制透析间期体液容量，干体重达标","roles":["医生","护士"],"level":"基础","type":"填空","q":"透析间期容量控制目标是体重增加小于干体重的____；一般隔日血液透析患者体重增长不超过____kg，隔2日血液透析患者不超过____kg。","a":"5%；1；1.5～2。","key":"注意是“小于干体重的5%”，并非小于透前体重；长间期（隔2日）允许1.5～2kg。","page":199},{"id":819,"chapter":"第19章 血液透析患者高血压的治疗","section":"三、（二）控制透析间期体液容量，干体重达标","roles":["医生","护士"],"level":"基础","type":"简答","q":"如何控制血液透析患者的水盐摄入？","a":"控制透析间期体重的关键是体内钠平衡的控制：①教育患者食盐（钠盐）摄入＜5g/d；②当透析前血清钠浓度＜135mmol/L时，应限制水摄入。","key":"限盐是核心；只有透前血钠＜135mmol/L（提示水过多）时才强调限水。","page":199},{"id":820,"chapter":"第19章 血液透析患者高血压的治疗","section":"三、（二）控制透析间期体液容量，干体重达标","roles":["医生","护士"],"level":"进阶","type":"简答","q":"对于食盐摄入控制难以达标、透析前血钠较高、透析后口渴明显的患者，如何通过透析模式增加钠清除？","a":"采用序贯透析，在透析过程中患者血钠浓度较高时段（透析初始或钠曲线透析中钠水平较高时段）进行超滤，可明显增加透析中体内钠清除，对血压控制效果较好。","key":"超滤应安排在“血钠较高时段”，安排错时段则钠清除效果大打折扣。","page":199},{"id":821,"chapter":"第19章 血液透析患者高血压的治疗","section":"三、（二）控制透析间期体液容量，干体重达标","roles":["医生","技师"],"level":"进阶","type":"填空","q":"个体化透析液钠浓度：对透析前血清钠正常高限或升高的患者，测定____次透析前血清钠浓度，以其平均值乘以____作为个体化透析液钠浓度标准，并____透析液钠浓度。","a":"3；95%；逐渐递减。","key":"是“平均值×95%”且要逐渐递减，不能一次性大幅下调。","page":200},{"id":822,"chapter":"第19章 血液透析患者高血压的治疗","section":"三、（二）控制透析间期体液容量，干体重达标","roles":["医生","护士","技师"],"level":"进阶","type":"简答","q":"通过限盐、调钠等仍不能控制透析间期体重增长，或合并心衰、RAS/交感反应性不足、透析中低血压而干体重不能达标的患者，可如何变更透析模式？","a":"可采用延长透析时间或增加透析次数，保持较低的超滤率和/或低温透析（透析液温度34～35.5℃）、可调钠透析、使用超滤曲线等方式；必要时可采用缓慢持续超滤治疗，尽可能清除多余水钠，使干体重达标。","key":"低温透析的透析液温度为34～35.5℃；核心是“低超滤率”下完成脱水。","page":200},{"id":823,"chapter":"第19章 血液透析患者高血压的治疗","section":"三、（三）选择降压方案","roles":["医生"],"level":"进阶","type":"判断","q":"福辛普利血液透析清除率约50%，透析后需补充剂量。（对/错？）","a":"错。按表19-1，福辛普利不被血液透析清除、不补充；ACEI中清除50%的是卡托普利、依那普利、赖诺普利、培哚普利。贝那普利“几乎没有”清除但表中透后补充5～10mg。","key":"ACEI中贝那普利、福辛普利是“不易被透析清除”的代表，用于需透析中维持降压的类型。","page":200},{"id":824,"chapter":"第19章 血液透析患者高血压的治疗","section":"三、（三）选择降压方案","roles":["医生","护士"],"level":"基础","type":"判断","q":"ARB类和CCB类降压药均不被血液透析清除，透析后无需补充。（对/错？）","a":"对。表19-1中坎地沙坦、依普沙坦、厄贝沙坦、氯沙坦、奥美沙坦、替米沙坦、缬沙坦及所列各CCB均“不清除、不补充”。","key":"选择透析中持续降压时可首选不被清除的ARB/CCB。","page":200},{"id":825,"chapter":"第19章 血液透析患者高血压的治疗","section":"三、（三）选择降压方案","roles":["医生"],"level":"基础","type":"简答","q":"“高-下降-正常-高型”高血压的治疗原则是什么？","a":"主要是控制患者干体重，力争干体重达标，而非首先应用降压药物。","key":"该型本质是容量负荷，首加降压药会加重透析中血压下降。","page":201},{"id":826,"chapter":"第19章 血液透析患者高血压的治疗","section":"三、（三）选择降压方案","roles":["医生"],"level":"高级","type":"案例分析","q":"男，62岁，血透2年，透前血压165/95mmHg，透析中随超滤血压逐渐下降至85/50mmHg，透后仍偏低，非透析日血压逐渐升高；超声示心功能减退；长期服用卡维地洛。请判断高血压类型并给出治疗方案。","a":"①属“高-下降/低-低-高型”：①控制干体重；②降低透析效率（血流量＜200ml/min，透析液流量＜350ml/min）以减缓血浆溶质清除和血浆容量降低速度；③停用α、β受体拮抗剂，选择透析可清除的ACEI（依那普利、赖诺普利或培哚普利），减少对RAS或交感神经反应性的抑制；④合并心衰者给予多巴酚丁胺或洋地黄类强心药（用洋地黄时注意透析中低钾血症，必要时用钾浓度3.0mmol/L透析液），急性心衰患者停用β受体拮抗剂。","key":"此型要选“透析可清除”的ACEI，与高-升高型选“不易清除”的ACEI正好相反，是高频考点。","page":201},{"id":827,"chapter":"第19章 血液透析患者高血压的治疗","section":"三、（三）选择降压方案","roles":["医生"],"level":"进阶","type":"简答","q":"“高-升高-高-高型”与“正常-高-正常-正常型”的降压药物如何选择？","a":"①高-升高-高-高型：控制干体重基础上，给予不宜被透析清除的ACEI（贝那普利、福辛普利）、ARB和/或α、β受体拮抗剂，抑制RAS或交感神经反应性；疗效欠佳时并用CCB。②正常-高-正常-正常型：给予不宜被透析清除的ACEI（贝那普利、福辛普利）、ARB和/或α、β受体拮抗剂；疗效欠佳时联用CCB。","key":"两型均选不被透析清除的RAS抑制剂/α、β阻滞剂，CCB为疗效欠佳时的联用药。","page":202},{"id":828,"chapter":"第19章 血液透析患者高血压的治疗","section":"三、（三）选择降压方案","roles":["医生"],"level":"高级","type":"案例分析","q":"男，58岁，维持性血透。透前血压90/60mmHg，透析中随超滤血压升至165/95mmHg，透后又降至92/60mmHg，非透析日血压偏低。超声示LVEF明显降低。请判断高血压类型并给出药物治疗方案。","a":"①属“低-升高/正常或高-低-低型”，主要因心衰致透前及间期低血压，透析中容量清除改善心功能加RAS/交感反应性增强致透析高血压；②给予多巴酚丁胺或洋地黄类强心药物改善心功能，急性心衰时停用α、β受体拮抗剂；③给予不易被透析清除的ACEI（贝那普利、福辛普利）或ARB抑制RAS/交感反应性；④疗效欠佳时联用CCB。","key":"先强心再谈降压；透析中高血压不能掩盖其心衰本质。","page":202},{"id":829,"chapter":"第19章 血液透析患者高血压的治疗","section":"三、（四）血压控制达标，动态调整降压治疗方案","roles":["医生","护士"],"level":"基础","type":"填空","q":"血液透析患者血压控制靶目标为诊室透析前血压：60岁以下患者＜____mmHg，60岁以上（含）患者＜____mmHg（含药物治疗）。","a":"140/90；160/90。","key":"60岁“含”在老年组；靶目标是“诊室透析前”血压。","page":202},{"id":830,"chapter":"第19章 血液透析患者高血压的治疗","section":"三、（四）血压控制达标，动态调整降压治疗方案","roles":["医生","护士"],"level":"基础","type":"案例分析","q":"女，68岁，服用氨氯地平，近3次诊室透析前血压分别为152/84、158/86、150/80mmHg，无症状。其血压是否达标？后续如何管理？","a":"①达标：60岁以上（含）患者诊室透前血压靶目标＜160/90mmHg（含药物治疗）；②高血压临床类型在长期透析中可变化，应定期监测透前、透中、透后及透析间期血压，绘制血压曲线，重新评估类型，调整方案；③使用CCB需关注下肢血管神经性水肿及其对干体重评估的影响。","key":"不能套用＜140/90的标准过度降压；分型需动态复评。","page":202},{"id":831,"chapter":"第19章 血液透析患者高血压的治疗","section":"三、（五）关注降压药物不良反应","roles":["医生","护士"],"level":"基础","type":"简答","q":"血液透析患者需特别关注的降压药物不良反应有哪些？","a":"①ACEI/ARB：高钾血症；②钙通道阻滞剂：下肢血管神经性水肿及其对干体重评估的影响；③α、β受体拮抗剂或β受体拮抗剂：负性心肌作用及心动过缓、传导阻滞；④长期使用中枢性降压药：抑郁。","key":"CCB所致下肢水肿易被误判为容量负荷而过度下调干体重。","page":202},{"id":832,"chapter":"第20章 血液透析中低血压的预防与治疗","section":"一、血液透析中低血压的定义","roles":["医生","护士"],"level":"基础","type":"简答","q":"什么是血液透析中低血压（IDH）？其临床意义如何？","a":"目前无统一定义，一般指血液透析中患者血压下降一定的数值或比值，并出现需要进行医学干预的临床症状或体征者。IDH不仅影响生活质量，而且与高死亡率明显相关。","key":"诊断要素是“血压下降+需医学干预的症状/体征”，单纯数值下降而无症状不等同IDH。","page":203},{"id":833,"chapter":"第20章 血液透析中低血压的预防与治疗","section":"二、血液透析中低血压的危险因素","roles":["医生","护士"],"level":"基础","type":"简答","q":"血液透析中低血压的危险因素有哪些？","a":"老年、女性、营养不良、糖尿病、高磷血症、冠脉疾病、左室心肌功能受损、血管淀粉样变、应用硝酸盐制剂或其他血管活性药物等。","key":"女性、高磷血症、血管淀粉样变是常被遗漏的危险因素。","page":203},{"id":834,"chapter":"第20章 血液透析中低血压的预防与治疗","section":"三、（一）一级方案","roles":["医生","护士"],"level":"进阶","type":"简答","q":"预防透析中低血压的一级方案包括哪些措施？","a":"①控制盐摄入，钠盐每日5g以内；②评估透析中钠制剂应用量；③改善营养状态（增加热量、纠正贫血、纠正低蛋白血症）；④透析中禁食；⑤评估调整干体重；⑥采用碳酸氢盐透析液，避免醋酸盐透析液；⑦透析室温度＜24℃，透析液温度设定36.5℃以下；⑧调整降压药物；⑨评估心功能（特别是左心室收缩功能）；⑩治疗导致低血压的原发疾病（如心包积液、淀粉样变性）。","key":"一级方案共10条，其中“透析中禁食”“室温＜24℃”最易漏答。","page":203},{"id":835,"chapter":"第20章 血液透析中低血压的预防与治疗","section":"三、（一）一级方案","roles":["护士","医生"],"level":"进阶","type":"简答","q":"一级方案中“评估血液透析过程中钠制剂的应用量”具体包括哪些钠来源？","a":"①生理盐水预冲量；②透析治疗期间生理盐水冲洗量和高渗盐水给予量；③透析结束回血时生理盐水使用量；④含钠药物使用量。","key":"预冲、冲洗、回血盐水都会增加钠负荷，促进口渴和间期体重增长，护士要记录并控制。","page":203},{"id":836,"chapter":"第20章 血液透析中低血压的预防与治疗","section":"三、（一）一级方案","roles":["护士","医生"],"level":"基础","type":"判断","q":"为预防透析中低血压、改善营养，应鼓励患者在血液透析过程中进食。（对/错？）","a":"错。一级方案明确要求“血液透析中禁食”；改善营养应通过增加热量供给、纠正贫血及低蛋白血症等实现。","key":"透析中进食致内脏血管扩张、血液重分布，诱发低血压。","page":203},{"id":837,"chapter":"第20章 血液透析中低血压的预防与治疗","section":"三、（一）一级方案","roles":["护士","技师"],"level":"基础","type":"填空","q":"预防透析中低血压一级方案要求：透析室温度＜____℃，透析液温度设定为____℃以下；应采用____透析液，避免____透析液。","a":"24；36.5；碳酸氢盐；醋酸盐。","key":"一级方案透析液温度36.5℃以下；二级方案才逐渐降至必要时34℃。","page":204},{"id":838,"chapter":"第20章 血液透析中低血压的预防与治疗","section":"三、（一）一级方案","roles":["医生"],"level":"高级","type":"案例分析","q":"男，72岁，糖尿病肾病血透，透前血压170/95mmHg，透析中常降至85/50mmHg伴头晕。长期服用比索洛尔和氨氯地平（均每日早晨服用）。请从一级方案角度调整降压药物。","a":"①对透前高血压合并透析中低血压者，应选择透析可清除的降压药物；②必须使用透析不能清除的降压药物时，透析日透前暂停，透后根据血压追加；③老年或合并糖尿病者透前高血压合并IDH可能与交感神经反应性不足有关，建议停用交感神经阻断剂（如比索洛尔），改用其他降压药物；④同时评估干体重及左心功能。","key":"比索洛尔、氨氯地平均不被透析清除，透析日晨服是IDH常见诱因。","page":204},{"id":839,"chapter":"第20章 血液透析中低血压的预防与治疗","section":"三、（二）二级方案","roles":["医生","护士","技师"],"level":"进阶","type":"简答","q":"一级方案控制不佳时，预防透析中低血压的二级方案有哪些措施？","a":"①尝试个体化血容量监测与反馈模式；②降低透析效率（血流量＜200ml/min、透析液流量＜350ml/min）；③逐渐降低透析液温度，必要时可降至34℃，注意不良反应；④改变透析方式（可调钠透析、序贯透析或血液滤过）；⑤延长透析时间和/或增加透析频率；⑥采用1.5mmol/L或更高浓度钙的透析液。","key":"降低透析效率的目的是避免血浆渗透压下降过快致再充盈不足。","page":204},{"id":840,"chapter":"第20章 血液透析中低血压的预防与治疗","section":"三、（二）二级方案","roles":["医生","护士","技师"],"level":"进阶","type":"填空","q":"二级方案降低透析效率：调整血流量＜____ml/min、透析液流量＜____ml/min；透析液温度逐渐降低，必要时可降至____℃。","a":"200；350；34。","key":"34℃是“必要时”下限且需注意不良反应，不是常规设置。","page":204},{"id":841,"chapter":"第20章 血液透析中低血压的预防与治疗","section":"三、（二）二级方案","roles":["医生","技师"],"level":"进阶","type":"判断","q":"1.75mmol/L钙透析液可改善心肌收缩功能，透析中低血压患者可长期使用。（对/错？）","a":"错。二级方案推荐1.5mmol/L或更高浓度钙透析液，高钙可一定程度改善心肌收缩；但1.75mmol/L钙透析液有增加血管钙化及心血管事件风险，应尽量避免长期使用。","key":"关键在“避免长期”使用1.75mmol/L。","page":204},{"id":842,"chapter":"第20章 血液透析中低血压的预防与治疗","section":"三、（三）三级方案","roles":["医生"],"level":"高级","type":"简答","q":"一、二级方案均无效时的三级方案是什么？左卡尼汀的用法和注意事项？","a":"①补充左卡尼汀：部分IDH患者给予左卡尼汀1～2g，每次透析结束前静脉注射，可稳定透析中血压；注意该药有增加缺血性脑卒中患者继发性癫痫发病的风险。②腹膜透析：所有方案均不能有效控制者可考虑转为腹膜透析。","key":"左卡尼汀是“透析结束前”静注，且需警惕缺血性卒中患者继发癫痫。","page":205},{"id":843,"chapter":"第20章 血液透析中低血压的预防与治疗","section":"四、血液透析中低血压发作时的治疗","roles":["护士","医生"],"level":"基础","type":"简答","q":"透析中低血压发作时的处理步骤是什么？","a":"①调整体位：采用特伦德伦伯卧位（头低足高位），疗效可能有限；②暂时停止超滤；③停超滤与体位干预无改善者快速输注液体扩容（晶体无效考虑胶体、白蛋白）；④上述无效的顽固性IDH必要时多巴胺20～40mg缓慢静注；⑤仍无效可提前终止透析。","key":"首要动作是停止超滤，补液不宜过多，以免影响干体重达标或诱发急性左心衰。","page":205},{"id":844,"chapter":"第20章 血液透析中低血压的预防与治疗","section":"四、血液透析中低血压发作时的治疗","roles":["护士","医生"],"level":"基础","type":"判断","q":"透析中低血压发作时普遍推荐头低足高位，且该措施疗效确切，可替代停止超滤。（对/错？）","a":"错。特伦德伦伯卧位虽普遍推荐，但疗效可能有限；发作时应暂时停止超滤以利于血管再充盈、恢复有效循环血容量。","key":"体位只是辅助，停超滤才是关键。","page":205},{"id":845,"chapter":"第20章 血液透析中低血压的预防与治疗","section":"四、血液透析中低血压发作时的治疗","roles":["护士","医生"],"level":"进阶","type":"填空","q":"透析中低血压发作补液：50%葡萄糖注射液____ml静脉注射；生理盐水或高渗氯化钠、4%或5%碳酸氢钠____ml快速静脉输注；20%甘露醇____ml快速静滴；羟乙基淀粉一次透析中应用量不宜超过____ml。","a":"40～100；100～200；100～200；100。","key":"输入的钠需在后续透析中超滤清除；羟乙基淀粉在脓毒血症和重症患者禁用。","page":205},{"id":846,"chapter":"第20章 血液透析中低血压的预防与治疗","section":"四、血液透析中低血压发作时的治疗","roles":["护士","医生"],"level":"进阶","type":"案例分析","q":"女，65岁，透析2h超滤1.8L后诉头晕、恶心、打哈欠，血压由140/80降至82/50mmHg。护士应如何处理？","a":"①立即头低足高位；②暂停超滤；③如无改善，快速输注液体：50%葡萄糖40～100ml静注，或生理盐水/高渗盐水/4%或5%碳酸氢钠100～200ml快速静滴，后续超滤清除过多补充的钠，避免过量致急性左心衰；④晶体无效可用20%甘露醇100～200ml或羟乙基淀粉（≤100ml，脓毒症/重症禁用），仍无效考虑人血白蛋白；⑤顽固者多巴胺20～40mg缓慢静注；⑥无效提前终止透析；⑦事后评估干体重、降压药等。","key":"处理顺序：体位→停超滤→晶体→胶体→白蛋白→多巴胺→终止透析。","page":205},{"id":847,"chapter":"第20章 血液透析中低血压的预防与治疗","section":"四、血液透析中低血压发作时的治疗","roles":["医生"],"level":"高级","type":"案例分析","q":"某脓毒血症血透患者透析中低血压，停超滤并输注生理盐水200ml无效，值班医生拟用羟乙基淀粉500ml快速扩容。是否妥当？应如何处理？","a":"不妥。羟乙基淀粉一次透析中用量不宜超过100ml，且合并脓毒血症和重症患者禁用。可选20%甘露醇100～200ml快速静滴；仍无效考虑人血白蛋白；仍无效的顽固性低血压必要时多巴胺20～40mg缓慢静注；上述无效可提前终止透析。","key":"脓毒症禁用羟乙基淀粉、单次≤100ml是双重红线。","page":205},{"id":848,"chapter":"第21章 血液透析患者常见心律失常处理原则和药物选择","section":"概述","roles":["医生","护士"],"level":"基础","type":"简答","q":"血液透析患者常见心律失常类型有哪些？哪些心律失常需要紧急处理？","a":"常见：心房颤动、室性心律失常及房室传导阻滞等。需紧急处理：①快速型：室上性心动过速、快速房颤、室性心动过速、心室颤动等；②缓慢型：二度Ⅱ型及三度房室传导阻滞、严重窦性心动过缓或频发窦性停搏导致血流动力学不稳定或阿-斯综合征者。","key":"缓慢型紧急情况仅指二度Ⅱ型及以上阻滞，二度Ⅰ型不在其列。","page":206},{"id":849,"chapter":"第21章 血液透析患者常见心律失常处理原则和药物选择","section":"一、处理原则（一）透析间期心律失常","roles":["医生"],"level":"进阶","type":"简答","q":"透析间期心律失常应查找哪些病因与诱发因素？","a":"①明确心脏基础病：缺血性心脏病、高血压性心脏病、心肌病、心肌淀粉样变、心脏瓣膜病等；②电解质紊乱：高钾、低钾、低镁、低钙血症；③新发冠脉事件，尤其心肌梗死；④其他：颈内静脉导管置入右心房过深；服用致Q-T间期延长药物。","key":"导管置入右心房过深是透析特有、易被忽视的诱因。","page":206},{"id":850,"chapter":"第21章 血液透析患者常见心律失常处理原则和药物选择","section":"一、处理原则（一）透析间期心律失常","roles":["医生"],"level":"进阶","type":"简答","q":"透析间期心律失常的特殊治疗原则（电复律、起搏器、射频消融、ICD）有哪些？","a":"①电解质紊乱所致者积极纠正，血流动力学稳定者应紧急血液透析；②快速心律失常可能致血流动力学不稳定者尽快电复律，并在心脏专科协助下治疗；③房室传导阻滞二度Ⅱ型以上、严重窦性心动过缓及窦性停搏大于3s者可考虑安置起搏器；④频发室性期前收缩药物无效可行射频消融；⑤多发短阵室速、室颤在药物基础上安置埋藏式心脏除颤仪。","key":"窦性停搏＞3s是起搏器考虑指征的数值界限。","page":206},{"id":851,"chapter":"第21章 血液透析患者常见心律失常处理原则和药物选择","section":"一、处理原则（二）透析中心律失常","roles":["护士","医生"],"level":"基础","type":"简答","q":"透析中发生心律失常，应如何尽快明确类型及原因？","a":"①立即行心电图检查明确类型，给予心电血压监护；②急检血电解质、血气分析；③疑似心肌梗死者急检肌钙蛋白等心肌损伤标志物。","key":"护士第一时间做ECG并上监护，同步抽血送电解质和血气。","page":207},{"id":852,"chapter":"第21章 血液透析患者常见心律失常处理原则和药物选择","section":"一、处理原则（二）透析中心律失常","roles":["医生"],"level":"高级","type":"简答","q":"透析中心律失常常见诱因的紧急处理要点有哪些？","a":"①高钾血症或伴酸中毒者，避免纠正酸中毒、降钾过快而引发或加重心律失常；②低钾或伴低钙者，避免使用低钾、低钙透析液；已出现心律失常时首先经透析管路或静脉补充氯化钾、氯化钙或葡萄糖酸钙；③透前体重增长过多或容量超负荷的心衰患者，超滤速度不宜超过15ml/min，可延长透析时间完成目标；④新发冠脉综合征根据血压给予口服或静滴硝酸甘油、口服抗血小板药，尽快停止透析转专科；⑤心搏骤停立即终止透析，启动心肺复苏。","key":"“降钾/纠酸过快”本身就是致心律失常因素，这是透析特有的考点。","page":207},{"id":853,"chapter":"第21章 血液透析患者常见心律失常处理原则和药物选择","section":"一、处理原则（二）透析中心律失常","roles":["医生","护士"],"level":"基础","type":"填空","q":"透前体重增长过多或容量超负荷的心衰患者，透析中超滤速度不宜超过____ml/min，可通过____完成设定的超滤目标。","a":"15；延长透析时间。","key":"单位是ml/min，不要与心衰章的ml/(kg·h)混淆。","page":207},{"id":854,"chapter":"第21章 血液透析患者常见心律失常处理原则和药物选择","section":"一、处理原则（二）透析中心律失常","roles":["医生","护士"],"level":"进阶","type":"判断","q":"透析中出现心律失常的高钾血症合并酸中毒患者，应尽快纠正酸中毒并快速降钾。（对/错？）","a":"错。应避免纠正酸中毒、降钾过快，以免引发或加重心律失常。","key":"快速纠酸致钾向细胞内转移过快，血钾骤降同样致心律失常。","page":207},{"id":855,"chapter":"第21章 血液透析患者常见心律失常处理原则和药物选择","section":"二、抗心律失常药物治疗（一）室上性心动过速","roles":["护士","医生"],"level":"基础","type":"简答","q":"室上性心动过速首先可采用的非药物方法是什么？","a":"刺激迷走神经：深吸气后屏气同时用力做呼气动作（瓦尔萨尔瓦动作），或用压舌板等刺激咽喉部产生恶心感，可终止发作；如无效给予药物治疗。","key":"先迷走后药物。","page":207},{"id":856,"chapter":"第21章 血液透析患者常见心律失常处理原则和药物选择","section":"二、抗心律失常药物治疗（一）室上性心动过速","roles":["医生"],"level":"进阶","type":"填空","q":"维拉帕米治疗室上速：起始剂量____mg稀释后缓慢静注至少____min；无效____min后重复5mg；静注总量≤____mg。禁用于伴有____的心房颤动。","a":"5；2；15～30；20；预激综合征。","key":"预激伴房颤禁用维拉帕米和洋地黄，可选普罗帕酮。","page":207},{"id":857,"chapter":"第21章 血液透析患者常见心律失常处理原则和药物选择","section":"二、抗心律失常药物治疗（一）室上性心动过速","roles":["医生","护士"],"level":"进阶","type":"简答","q":"胺碘酮治疗室上性心动过速的用法、剂量上限和监护要求？","a":"150mg于10min内静脉注射；之后1mg/min静脉维持6h；随后0.5mg/min静脉滴注维持18h；1天内累积剂量一般不超过1.2g；静脉注射胺碘酮时建议心电监护。","key":"特别适合合并心肌缺血或心衰的器质性心脏病患者；日累积≤1.2g。","page":208},{"id":858,"chapter":"第21章 血液透析患者常见心律失常处理原则和药物选择","section":"二、抗心律失常药物治疗（一）室上性心动过速","roles":["医生"],"level":"进阶","type":"判断","q":"腺苷适用于合并器质性心脏病的老年室上速患者，6mg于1～2min内缓慢静注。（对/错？）","a":"错。腺苷仅适合年轻且心脏无明确器质性病变者；6mg（2ml）应在1～2s内快速静注，无效数分钟后给12mg同样速度静注；有诱发心搏骤停风险，用前应做好复苏准备。","key":"是1～2秒“弹丸式”推注，不是缓慢推注。","page":208},{"id":859,"chapter":"第21章 血液透析患者常见心律失常处理原则和药物选择","section":"二、抗心律失常药物治疗（一）室上性心动过速","roles":["医生","护士"],"level":"进阶","type":"简答","q":"伴心力衰竭的室上速患者使用去乙酰毛花苷的用法及注意事项？","a":"首次0.2～0.4mg，5%葡萄糖液稀释后缓慢静注（10～20min）；2～4h后可再给0.2～0.4mg，总量不超过1.0mg/d。处理同时须检测血电解质，低钾血症、高钙血症易造成洋地黄中毒；预激综合征者禁用。","key":"透析中血钾下降、高钙透析液都可诱发洋地黄中毒。","page":208},{"id":860,"chapter":"第21章 血液透析患者常见心律失常处理原则和药物选择","section":"二、抗心律失常药物治疗（一）室上性心动过速","roles":["医生"],"level":"进阶","type":"填空","q":"普罗帕酮（可用于伴预激综合征者）：____mg/kg或____mg加5%葡萄糖稀释后静注10min，可10～20min重复1次，静注总量不超过____mg；起效后改静滴____mg/min。","a":"1～1.5；70；210；0.5～1.0。","key":"预激伴室上速可选普罗帕酮，而非维拉帕米/洋地黄。","page":208},{"id":861,"chapter":"第21章 血液透析患者常见心律失常处理原则和药物选择","section":"二、抗心律失常药物治疗（二）心房颤动","roles":["医生"],"level":"进阶","type":"简答","q":"不伴心力衰竭、低血压或预激综合征的房颤患者如何静脉控制心室率？","a":"先处理电解质紊乱（如低血钾）。①维拉帕米2.5～5mg稀释后至少2min缓慢静注，每15～30min可重复5～10mg，总量不超过20mg；②美托洛尔5mg（5ml）静注5min，每5min重复，总量不超过15mg，每次注射时测心率、血压。","key":"合并心衰时改用去乙酰毛花苷，不能用维拉帕米。","page":208},{"id":862,"chapter":"第21章 血液透析患者常见心律失常处理原则和药物选择","section":"二、抗心律失常药物治疗（二）心房颤动","roles":["医生"],"level":"高级","type":"简答","q":"房颤合并心力衰竭及合并急性冠脉综合征时分别如何用药？","a":"①合并心衰：去乙酰毛花苷0.2～0.4mg稀释后静注10～20min，无效20～30min后再给0.2～0.4mg，最大1.0mg/d；②合并ACS：先用硝酸酯类扩张冠脉，抗心律失常首选胺碘酮5mg/kg稀释后静脉泵注1h，继之50mg/h泵注6h，随后0.5mg/min维持18h，1天累积一般不超过1.2g。","key":"ACS房颤胺碘酮负荷是5mg/kg泵注1h，与室上速150mg/10min方案不同。","page":208},{"id":863,"chapter":"第21章 血液透析患者常见心律失常处理原则和药物选择","section":"二、抗心律失常药物治疗（二）心房颤动","roles":["医生","护士"],"level":"高级","type":"案例分析","q":"男，66岁，透析中突发快速房颤，心室率170次/min，血压75/45mmHg，大汗、意识淡漠。如何处理？","a":"①血流动力学不稳定，首选同步直流电复律；②复律前地西泮10～15mg使患者处于嗜睡状态；③起始电能60～100J（双相波）或150J（单相波）；④一次无效紧接再次复律（最多3次），再次复律增加电能，最大200J（双相波）或300J（单相波）；⑤同时停超滤、查电解质等诱因。","key":"房颤复律必须“同步”，最多3次。","page":208},{"id":864,"chapter":"第21章 血液透析患者常见心律失常处理原则和药物选择","section":"一、处理原则（二）透析中心律失常","roles":["护士","医生"],"level":"基础","type":"案例分析","q":"女，70岁，血透中突发意识丧失，监护示心室颤动。透析室应如何处理？","a":"①立即终止透析，启动心肺复苏（胸外按压、开放气道、人工呼吸）；②尽早以最大能量（双相波200J或单相波360J）非同步直流电除颤，除颤后立即恢复CPR，5个周期按压与通气后复查心律；③CPR和除颤2min后室颤仍持续，肾上腺素1mg加生理盐水10ml稀释静注，可重复；④仍无效给胺碘酮300mg（5mg/kg）稀释静注10min并再次最大电量除颤，未恢复可追加150mg（2.5mg/kg）；⑤不能用胺碘酮时选利多卡因；⑥查电解质等诱因。","key":"室颤用“非同步”最大能量除颤，与房颤的“同步”电复律区分。","page":209},{"id":865,"chapter":"第21章 血液透析患者常见心律失常处理原则和药物选择","section":"二、抗心律失常药物治疗（三）室性心律失常","roles":["医生"],"level":"基础","type":"简答","q":"不伴器质性心脏病的室性期前收缩如何处理？","a":"不建议常规抗心律失常药物治疗；心率偏快且无禁忌时可用β受体拮抗剂；存在β受体拮抗剂禁忌证且症状明显者，可短期用美西律150～200mg/次，3次/d口服。","key":"无器质性心脏病的室早以不治疗为原则。","page":209},{"id":866,"chapter":"第21章 血液透析患者常见心律失常处理原则和药物选择","section":"二、抗心律失常药物治疗（三）室性心律失常","roles":["医生"],"level":"进阶","type":"填空","q":"室颤用利多卡因：负荷量____mg/kg稀释后静注____min，无效5～10min后可重复，继以____mg/min静滴维持；1h内最大用量不超过____mg（4.5mg/kg）；连续应用____h后半衰期延长，应减少维持量。","a":"1.0；3～5；1～4；200～300；24～48。","key":"利多卡因是不能用胺碘酮时的替代；不能被透析清除。","page":209},{"id":867,"chapter":"第21章 血液透析患者常见心律失常处理原则和药物选择","section":"二、抗心律失常药物治疗（四）缓慢型心律失常","roles":["医生","护士"],"level":"进阶","type":"案例分析","q":"女，67岁，周一透前突发黑矇，心电图示三度房室传导阻滞，心室率32次/min，血压85/50mmHg，急查血钾7.0mmol/L。应如何处理？","a":"①高钾血症所致，紧急降血钾处理；②①存在电解质紊乱如高钾血症，紧急降血钾；②阿托品起始0.5mg稀释后静注，必要时重复，24h总量不超过2.0mg；③阿托品无效可选异丙肾上腺素2～10μg/(kg·min)（或1～3ng/min）静滴，按心率调整；伴血压下降可选多巴酚丁胺250mg稀释后2.5～10μg/(kg·min)静滴；④有血流动力学障碍的心动过缓及传导阻滞，尽早启用起搏器。","key":"透析患者缓慢心律失常首先排查高钾血症。","page":209},{"id":868,"chapter":"第21章 血液透析患者常见心律失常处理原则和药物选择","section":"附：表21-1 抗心律失常药物种类和应用","roles":["医生"],"level":"高级","type":"判断","q":"按表21-1，胺碘酮、利多卡因、维拉帕米可被血液透析清除，而普鲁卡因胺、阿替洛尔不能被清除。（对/错？）","a":"错。表21-1中能被透析清除的是普鲁卡因胺、阿替洛尔、索他洛尔、阿托品；胺碘酮、利多卡因、美西律、普罗帕酮、美托洛尔、普萘洛尔、维拉帕米、去乙酰毛花苷、腺苷不能被清除。","key":"阿替洛尔、索他洛尔主要经肾排出，透析患者t1/2明显延长。","page":212},{"id":869,"chapter":"第22章 血液透析患者心力衰竭的诊断与治疗","section":"一、心力衰竭的分类和分级","roles":["医生","护士"],"level":"基础","type":"简答","q":"心力衰竭按部位、功能状态及发生速度如何分类？","a":"①按部位：左心衰竭（肺循环淤血为主）、右心衰竭（体循环淤血为主）及全心衰竭（多见于心脏病晚期，病情危重）；②按功能：收缩性和舒张性心力衰竭；③按发生时间与速度：急性和慢性心力衰竭。","key":"左心衰看肺淤血，右心衰看体循环淤血。","page":213},{"id":870,"chapter":"第22章 血液透析患者心力衰竭的诊断与治疗","section":"一、心力衰竭的分类和分级","roles":["医生","护士"],"level":"基础","type":"填空","q":"NYHA心功能分级：____级为体力活动明显受限，低于平时一般活动即引起心衰症状；____级为不能从事任何体力活动，休息状态下也存在心衰症状，活动后加重。","a":"Ⅲ；Ⅳ。","key":"Ⅱ级“一般活动出现症状”，Ⅲ级“低于一般活动即出现”，是区分要点。","page":213},{"id":871,"chapter":"第22章 血液透析患者心力衰竭的诊断与治疗","section":"二、透析患者心力衰竭的常见病因","roles":["医生","护士","技师"],"level":"基础","type":"简答","q":"透析患者心力衰竭的常见病因有哪些？","a":"①容量负荷过重（饮水过多、营养不良、贫血及瓣膜关闭不全等）；②压力负荷过重（高血压、主动脉瓣狭窄及肺动脉高压等）；③缺血性心肌病变；④心肌炎和原发性心肌病；⑤心肌代谢性疾病（尿毒症性心肌病、糖尿病心肌病变、心肌淀粉样病变、甲亢/甲减心肌病变等）；⑥透析治疗参数设置不当或操作失误致透析液大量反超，诱发急性左心衰。","key":"透析液大量反超是技术性诱因，技师和护士必须掌握。","page":213},{"id":872,"chapter":"第22章 血液透析患者心力衰竭的诊断与治疗","section":"三、心力衰竭的诊断","roles":["医生","护士"],"level":"基础","type":"简答","q":"透析患者急性左心衰竭的诊断要点有哪些？","a":"①起病急骤；②严重呼吸困难、端坐呼吸、烦躁不安，呼吸频率可达30～40次/min；③频繁咳嗽、咯粉红色泡沫样痰；④心率快，心尖部舒张期奔马律；⑤两肺广泛水泡音和/或哮鸣音；⑥体重增加过多且干体重下降，眼睑及/或下肢明显水肿；⑦胸部X线：肺门血管影模糊、肺纹理增粗和肺小叶间隔增厚；⑧BNP和NT-proBNP浓度增高。","key":"“干体重下降”（肌肉/营养丢失）使原定干体重相对偏高，是透析患者心衰的隐匿诱因。","page":214},{"id":873,"chapter":"第22章 血液透析患者心力衰竭的诊断与治疗","section":"三、心力衰竭的诊断","roles":["医生"],"level":"进阶","type":"判断","q":"慢性肾衰竭患者BNP和NT-proBNP基础水平升高，因此该指标对透析患者心衰无诊断价值。（对/错？）","a":"错。BNP/NT-proBNP升高可为心衰诊断提供重要价值，特别是呼吸困难病因未知时；但慢性肾衰竭时肾脏代谢利钠肽作用降低致基础水平升高，临床需动态观察其变化。","key":"看动态变化而非单次绝对值。","page":214},{"id":874,"chapter":"第22章 血液透析患者心力衰竭的诊断与治疗","section":"三、心力衰竭的诊断","roles":["医生"],"level":"进阶","type":"简答","q":"透析患者慢性右心衰竭的主要病因和诊断要点？","a":"主要见于肺动脉高压、三尖瓣或肺动脉瓣疾病及肺心病等。诊断：①体循环淤血症状：食欲不振、恶心、呕吐，肝区疼痛、右上腹饱胀不适；②体征：颈静脉充盈、肝大、双下肢水肿或胸腹腔积液；③心脏超声提示肺动脉高压、三尖瓣关闭不全等。","key":"右心衰的消化道症状易被误认为尿毒症或透析不充分。","page":215},{"id":875,"chapter":"第22章 血液透析患者心力衰竭的诊断与治疗","section":"四、（一）透析患者心力衰竭的预防","roles":["医生"],"level":"进阶","type":"判断","q":"合并心力衰竭且血红蛋白≥90g/L的透析患者，不建议应用红细胞生成刺激剂（ESAs）治疗。（对/错？）","a":"对。规程在“有效纠正贫血”项下明确此限制。","key":"阈值是90g/L，并非常规贫血靶目标。","page":215},{"id":876,"chapter":"第22章 血液透析患者心力衰竭的诊断与治疗","section":"四、（一）透析患者心力衰竭的预防","roles":["医生"],"level":"进阶","type":"填空","q":"心衰预防中骨矿物质代谢目标：透前校正血钙____mmol/L；透前血磷____mmol/L；透前iPTH____pg/ml。纠正酸中毒目标：透前CO2CP或HCO3-≥____mmol/L且＜____mmol/L。","a":"2.10～2.50；1.13～1.78；150～300；20；26。","key":"酸中毒既要纠正也要避免碱中毒，上限＜26mmol/L。","page":215},{"id":877,"chapter":"第22章 血液透析患者心力衰竭的诊断与治疗","section":"四、（一）透析患者心力衰竭的预防","roles":["医生","护士"],"level":"进阶","type":"填空","q":"心衰预防的容量管理：每日钠盐摄入量＜____g，并以____g以下为宜；透析间期体重增长率＜____干体重；理想超滤率＜____ml/(kg·h)。","a":"5；3；5%；10～13。","key":"超滤率单位是ml/(kg·h)，透析中心衰患者另有“不宜超过15ml/min”的限制。","page":215},{"id":878,"chapter":"第22章 血液透析患者心力衰竭的诊断与治疗","section":"四、（一）透析患者心力衰竭的预防","roles":["医生","护士"],"level":"基础","type":"填空","q":"心衰预防要求定期评估透析充分性：单次透析spKt/V≥____且URR≥____；丧失残肾功能患者每周血液透析时间≥____h；残肾功能＞2ml/min患者每周≥____h。","a":"1.2；65%；12；10。","key":"无残肾者每周≥12h，有残肾（＞2ml/min）者≥10h。","page":216},{"id":879,"chapter":"第22章 血液透析患者心力衰竭的诊断与治疗","section":"四、（一）透析患者心力衰竭的预防","roles":["护士","技师","医生"],"level":"基础","type":"简答","q":"透析治疗过程中，护士和技师在预防心力衰竭方面应做好哪些管理？","a":"①使用超纯透析液，改善微炎症状态；②加强透析过程管理，避免透析液反超；③透析结束回血流速应缓慢，防止血容量快速上升；④心血管状态不稳定者建议采用血液滤过或血液透析滤过模式；⑤容量负荷显著增加者适当延长透析时间或采用缓慢/夜间透析，避免容量快速波动。","key":"回血过快、透析液反超是医源性诱发急性左心衰的常见原因。","page":216},{"id":880,"chapter":"第22章 血液透析患者心力衰竭的诊断与治疗","section":"四、（一）透析患者心力衰竭的预防","roles":["医生"],"level":"进阶","type":"简答","q":"透析患者应慎用哪些增加心衰风险的药物？需积极治疗哪些并发心肺疾病？","a":"慎用：噻唑烷二酮类（格列酮类）、非甾体抗炎药、环氧化酶2抑制剂、地尔硫䓬和维拉帕米等。积极治疗：慢阻肺、肺栓塞、瓣膜狭窄或关闭不全、冠脉病变及心律失常（尤其伴快心室率的房颤）；并及时控制感染，尤其上呼吸道和肺部感染。","key":"非二氢吡啶类CCB（地尔硫䓬、维拉帕米）负性肌力，心衰慎用。","page":216},{"id":881,"chapter":"第22章 血液透析患者心力衰竭的诊断与治疗","section":"四、（二）急性左心衰竭的治疗","roles":["医生"],"level":"进阶","type":"简答","q":"透析患者急性左心衰竭的总体处理原则是什么？","a":"先明确病因，了解是否容量负荷过重及循环灌注情况。容量负荷过重且不合并心源性休克和/或呼吸衰竭者，应尽早实施血液净化（单纯超滤、血液透析和CRRT）以减少容量；存在心源性休克和/或呼吸衰竭者，需立即提供循环支持和/或通气支持，病情稳定后依据容量评估给予血液净化。","key":"休克/呼衰时先支持再净化，顺序不可颠倒。","page":216},{"id":882,"chapter":"第22章 血液透析患者心力衰竭的诊断与治疗","section":"四、（二）急性左心衰竭的治疗","roles":["医生","护士"],"level":"基础","type":"简答","q":"急性左心衰的吸氧和机械通气指征是什么？","a":"监测SpO2；对SpO2＜90%或PaO2＜60mmHg的急性心衰患者给予吸氧，面罩给氧优于鼻导管。无创通气不能纠正呼衰所致低氧血症（PaO2＜60mmHg）、高碳酸血症（PaCO2＞50mmHg）和酸中毒（pH＜7.35）时，推荐机械通气。","key":"吸氧指征SpO2＜90%；机械通气看PaO2、PaCO2、pH三项。","page":217},{"id":883,"chapter":"第22章 血液透析患者心力衰竭的诊断与治疗","section":"四、（二）急性左心衰竭的治疗","roles":["医生","护士"],"level":"基础","type":"填空","q":"急性左心衰：血压稳定者立即单纯超滤，速度____L/30min；烦躁不安首选吗啡____mg静脉注射，高龄、慢支及慢阻肺患者慎用。","a":"0.5～1.0；3～5。","key":"吗啡抑制呼吸，需监测SpO2并备通气支持用具。","page":217},{"id":884,"chapter":"第22章 血液透析患者心力衰竭的诊断与治疗","section":"四、（二）急性左心衰竭的治疗","roles":["医生","护士"],"level":"高级","type":"案例分析","q":"男，60岁，周一透析（距上次透析3天），间期体重增长4.5kg，夜间端坐呼吸、咯粉红色泡沫痰，两肺满布水泡音，BP 185/105mmHg，SpO2 86%，无休克。应如何处理？","a":"①半卧位或坐位、两腿下垂减少回心血量；②SpO2＜90%给氧，面罩优于鼻导管，必要时无创/机械通气；③血压稳定、无休克，立即单纯超滤，速度0.5～1.0L/30min；④烦躁给吗啡3～5mg静注，监测SpO2并备通气支持；⑤高血压伴急性心衰静脉用血管扩张药（如硝酸甘油5～10μg/min起，可调至20～50μg/min）；⑥控制诱因：调整干体重、透析处方，宣教限盐限水。","key":"无休克/呼衰时尽早超滤是透析患者急性左心衰最有效措施。","page":217},{"id":885,"chapter":"第22章 血液透析患者心力衰竭的诊断与治疗","section":"四、（二）急性左心衰竭的治疗","roles":["医生"],"level":"高级","type":"简答","q":"急性左心衰使用血管扩张药物的指征、禁忌及常用药物剂量？","a":"高血压伴急性心衰可静脉使用，密切监测血压，根据情况选一种。显著二尖瓣或主动脉瓣狭窄慎用；收缩压＜90mmHg禁用。①硝酸甘油5～10μg/min起始，可调至20～50μg/min；硝酸异山梨酯1～2mg/h起始，最大通常不超过8～10mg/h；②硝普钠50mg+5%葡萄糖50ml恒速泵入，开始0.6ml/h（10μg/min），极量10μg/(kg·min)；③乌拉地尔100～400μg/min；④酚妥拉明0.1～1mg/min（可致心动过速）。","key":"SBP＜90mmHg是血管扩张剂绝对禁忌。","page":218},{"id":886,"chapter":"第22章 血液透析患者心力衰竭的诊断与治疗","section":"四、（二）急性左心衰竭的治疗","roles":["医生"],"level":"高级","type":"案例分析","q":"男，70岁，血透患者急性左心衰，评估容量充足，但收缩压85mmHg，四肢湿冷、尿少等低灌注表现。能否使用硝酸甘油？应选用哪些药物、剂量如何？若仍有心源性休克怎么办？","a":"①收缩压＜90mmHg禁用血管扩张药物（含硝酸甘油）；②容量充足但血压仍低（收缩压＜90mmHg）和/或有低灌注表现时短期使用：①多巴酚丁胺100～250μg/min；②多巴胺小剂量＜3μg/(kg·min)扩张肾、冠脉和脑血管，＞5μg/(kg·min)增加心肌收缩力，起始2～20μg/(kg·min)，最高20μg/(kg·min)；③米力农首剂25～75μg/kg缓慢静注（＞10min），继以0.375～0.750μg/(kg·min)。经正性肌力药后仍有心源性休克者考虑血管升压药，优先去甲肾上腺素。","key":"用药期间须监测心电图和血压；升压药优先去甲肾上腺素。","page":218},{"id":887,"chapter":"第22章 血液透析患者心力衰竭的诊断与治疗","section":"四、（二）急性左心衰竭的治疗","roles":["医生"],"level":"基础","type":"判断","q":"急性心肌梗死患者急性期24h内不宜使用洋地黄类药物。（对/错？）","a":"对。快心室率房颤者可用去乙酰毛花苷0.2～0.4mg缓慢静注，2～4h后可再用0.2mg；但急性心梗急性期24h内不宜用；β受体拮抗剂可作为控制房颤心室率一线药物，也可用胺碘酮。","key":"急性心梗24h内禁洋地黄是经典考点。","page":219},{"id":888,"chapter":"第22章 血液透析患者心力衰竭的诊断与治疗","section":"四、（三）慢性心力衰竭的治疗","roles":["医生"],"level":"进阶","type":"简答","q":"透析合并慢性心衰患者如何使用利尿剂？","a":"对存在残余肾功能、有液体潴留证据者可给予利尿药，需评估残存肾功能及尿量，建议选择袢利尿剂。呋塞米起始20～40mg/d，常用20～80mg/d，最大120～160mg/d。因利尿剂可激活RAS和交感神经系统，应与ACEI或ARB以及β受体拮抗剂联用。","key":"无尿患者利尿剂无意义；必须联用神经内分泌拮抗剂。","page":220},{"id":889,"chapter":"第22章 血液透析患者心力衰竭的诊断与治疗","section":"四、（三）慢性心力衰竭的治疗","roles":["医生"],"level":"高级","type":"简答","q":"透析合并慢性收缩性心衰患者使用β受体拮抗剂的适应证、推荐药物及剂量目标？","a":"适应证：所有慢性收缩性心衰，NYHAⅡ、Ⅲ级，LVEF＜40%且病情稳定者，除非禁忌或不能耐受，尽早使用并尽可能合用ACEI或ARB；NYHAⅣ级如病情稳定、无体液潴留、体重稳定、无需静脉用药者，可在严密监护下由专科医师指导使用。推荐琥珀酸美托洛尔、比索洛尔或卡维地洛，均不被透析清除，无需补充。达目标剂量或最大耐受剂量，通常静息心率降至55～60次/min；透析患者需循序渐进、个体化。","key":"目标静息心率55～60次/min；三种推荐药均不被透析清除。","page":220},{"id":890,"chapter":"第22章 血液透析患者心力衰竭的诊断与治疗","section":"四、（三）慢性心力衰竭的治疗","roles":["医生"],"level":"进阶","type":"简答","q":"ACEI、ARB、ARNI在透析合并慢性心衰中的地位与使用要点？","a":"①ACEI：多数专家推荐，血钾经常升高者谨慎，合并高钾血症禁用；小剂量起始，密切监测血钾、血压逐渐递增；部分ACEI需透后补充剂量。②ARB：推荐用于不能耐受ACEI者，小剂量起始监测血钾血压；均不被透析清除，无需补充。③ARNI：用于HFrEF（NYHAⅡ～Ⅳ级，LVEF≤40%）可降低心血管死亡和心衰住院风险；ESRD缺乏大样本证据，可根据实际选用，但应遵循超说明书用药流程。","key":"ARNI在透析患者属超说明书用药，需走相关流程。","page":221},{"id":891,"chapter":"第22章 血液透析患者心力衰竭的诊断与治疗","section":"四、（三）慢性心力衰竭的治疗","roles":["医生"],"level":"进阶","type":"判断","q":"为加强心衰治疗，透析患者推荐ACEI联合ARB，并常规加用螺内酯。（对/错？）","a":"错。ACEI与ARB联用证据不多且结论不一，可能增加高钾血症风险，一般不推荐；醛固酮受体拮抗剂（螺内酯、依普利酮）在透析患者循证证据不多，不推荐使用。“黄金搭档”是β受体拮抗剂+ACEI/ARB。","key":"双RAS阻断和螺内酯都会显著升高透析患者高钾风险。","page":222},{"id":892,"chapter":"第22章 血液透析患者心力衰竭的诊断与治疗","section":"四、（三）慢性心力衰竭的治疗","roles":["医生"],"level":"高级","type":"案例分析","q":"男，63岁，血透3年，LVEF 38%，已用琥珀酸美托洛尔、贝那普利，仍有活动后气促，伴快速心室率房颤。拟加用地高辛，应如何选择剂量和监测？还有哪些药物考虑？","a":"①洋地黄适用于LVEF≤45%，已用利尿剂、ACEI/ARB、β受体拮抗剂仍有症状者，伴快速心室率房颤尤为适合；②透析患者地高辛治疗窗窄，宜小剂量0.125mg隔日1次口服；③密切监测心电图和地高辛血药浓度，防中毒；④合并冠心病或其高危因素推荐他汀；⑤不推荐加用螺内酯，一般不联用ACEI+ARB；⑥肾移植可改善心功能、逆转心衰。","key":"地高辛0.125mg“隔日1次”，并注意透析低钾诱发中毒。","page":222},{"id":893,"chapter":"第23章 血液透析患者心源性猝死的防治","section":"概述","roles":["医生","护士"],"level":"基础","type":"填空","q":"心源性猝死是指由于各种心脏原因引起的急性症状发作后____内发生的非预期死亡，或在过去____内无明显非心源性因素作用下发生的非预计/无目击者死亡事件。","a":"1h；24h。","key":"“1h内（有目击）/24h内（无目击）”两个时间窗。","page":223},{"id":894,"chapter":"第23章 血液透析患者心源性猝死的防治","section":"一、血液透析相关的心源性猝死主要危险因素","roles":["医生","护士","技师"],"level":"进阶","type":"简答","q":"血液透析患者心源性猝死的主要危险因素有哪些？","a":"①透析相关心血管等并发症：左心室肥厚、心力衰竭、尿毒症性心肌病、瓣膜病变及钙化、微炎症状态、营养不良、骨矿物质代谢异常、贫血、酸碱平衡紊乱等；②透析治疗相关：透析液钾浓度过低（＜2.0mmol/L）、钙浓度过低（＜1.25mmol/L），透析时血钾波动过快、快速超滤、透析过程低血压、透析间期过长致容量负荷过重和高钾血症。","key":"长间期（周一/周二透析）是猝死高发时段。","page":223},{"id":895,"chapter":"第23章 血液透析患者心源性猝死的防治","section":"二、血液透析患者心源性猝死的防治","roles":["医生","技师","护士"],"level":"基础","type":"填空","q":"为预防心源性猝死，应避免应用钾浓度＜____mmol/L或钙浓度＜____mmol/L的透析液。","a":"2.0；1.25。","key":"技师配液/护士核对处方时需把关低钾、低钙透析液。","page":223},{"id":896,"chapter":"第23章 血液透析患者心源性猝死的防治","section":"二、血液透析患者心源性猝死的防治","roles":["医生","护士"],"level":"高级","type":"案例分析","q":"女，55岁，因故停透5天，透前血钾7.4mmol/L，BP 170/100mmHg，体重增长5kg。从预防心源性猝死角度，本次透析处方和操作应注意什么？","a":"①严重高钾血症开始透析时应适当控制血流量，防止血钾快速变化；②避免使用钾＜2.0mmol/L或钙＜1.25mmol/L透析液；③容量负荷显著增加者避免超滤过快，适当延长透析时间或增加次数、采用缓慢/夜间长时透析；④纠酸避免碱中毒（透前CO2CP/HCO3-≥20且＜26mmol/L）；⑤透析结束回血缓慢；⑥心电监护；⑦宣教控制液体摄入，尽量避免延长透析间期。","key":"高钾患者不是“越快降钾越好”，血钾骤降同样致猝死。","page":223},{"id":897,"chapter":"第23章 血液透析患者心源性猝死的防治","section":"二、血液透析患者心源性猝死的防治","roles":["医生"],"level":"进阶","type":"简答","q":"心源性猝死防治的药物治疗原则是什么？","a":"在有效纠正高血压、低血压、微炎症、营养状态、骨矿物质代谢异常、贫血、酸碱平衡紊乱、高脂血症等基础上，给予RAS抑制剂或α、β受体拮抗剂，降低交感神经活性，改善心脏重塑和心肌耗氧；合并严重心律失常者给予抗心律失常药物；调整干体重，有效治疗心力衰竭。","key":"RAS抑制剂/α、β阻滞剂是降低交感活性、改善重塑的核心用药。","page":223},{"id":898,"chapter":"第23章 血液透析患者心源性猝死的防治","section":"二、血液透析患者心源性猝死的防治","roles":["医生","技师"],"level":"基础","type":"判断","q":"适当将透析液温度调低0.5～2℃，有助于减少透析中低血压引发的心肌顿抑。（对/错？）","a":"对。规程原文列为改善血液透析治疗、预防心源性猝死措施之一。","key":"注意调低幅度是0.5～2℃。","page":224},{"id":899,"chapter":"第23章 血液透析患者心源性猝死的防治","section":"二、血液透析患者心源性猝死的防治","roles":["医生"],"level":"高级","type":"简答","q":"透析患者AICD治疗的一级预防适应证有哪些？","a":"①4周前发生心肌梗死，合并LVEF＜35%以及变异性室速或电生理实验可诱发的室速；②左心室功能不全、LVEF＜35%合并Q-T间期＞120ms；③家族性心脏性猝死的高危患者。（需充分评估获益和风险）","key":"LVEF阈值均为＜35%。","page":224},{"id":900,"chapter":"第23章 血液透析患者心源性猝死的防治","section":"二、血液透析患者心源性猝死的防治","roles":["医生"],"level":"高级","type":"简答","q":"透析患者AICD治疗的二级预防适应证有哪些？AICD有何功能？","a":"二级预防：①发生过室速或心衰诱发的心搏骤停；②室速合并晕厥或血流动力学异常；③室速合并LVEF＜35%。AICD集程序调搏控制室速和自动除颤于一体，可同步转复室速，不成功时释放电能经电极导管除颤，可显著降低高危患者心源性猝死。","key":"一级预防针对“尚未发生”，二级针对“已发生过”恶性事件。","page":224},{"id":901,"chapter":"第24章 血液透析患者脑卒中的诊治","section":"一、血液透析患者急性脑出血的诊治","roles":["医生"],"level":"进阶","type":"简答","q":"原发性脑出血（特别是高血压脑出血）的确诊需满足哪些全部条件？","a":"①确切高血压病史；②典型出血部位（基底节区、脑室、丘脑、脑干、小脑半球）；③DSA、CTA、MRA排除继发性脑血管疾病；④早期（72h内）或晚期（血肿消失3周后）增强MRI排除脑肿瘤或海绵状血管畸形等；⑤排除各种凝血功能障碍性疾病。","key":"须“全部满足”，透析患者尤其不能忽略第⑤条——肝素化导致的凝血异常需先排除。","page":226},{"id":902,"chapter":"第24章 血液透析患者脑卒中的诊治","section":"一、血液透析患者急性脑出血的诊治","roles":["医生","护士"],"level":"基础","type":"判断","q":"透析过程中患者出现急性脑出血的临床表现，应先完成本次透析清除毒素后再停止抗凝。（对/错？）","a":"错。原文要求：透析中出现急性脑出血的临床表现，应立即停止抗凝剂输注，并迅速下机。","key":"“立即停抗凝+迅速下机”是护士第一反应，任何拖延都可能致血肿扩大。","page":226},{"id":903,"chapter":"第24章 血液透析患者脑卒中的诊治","section":"一、血液透析患者急性脑出血的诊治","roles":["医生"],"level":"进阶","type":"简答","q":"血液透析患者急性脑出血合并颅内高压时，推荐用什么药物？无尿患者为何建议在透析过程中使用？","a":"①推荐甘油果糖静脉注射；②无尿患者静脉注射甘油果糖后水分不能从尿中排出，可引起循环血量增多；③因此建议在透析过程中应用甘油果糖，并结合超滤治疗降低颅内压。","key":"常考陷阱：无尿患者透析间期单独大剂量用甘油果糖可致容量负荷过重甚至心衰。","page":226},{"id":904,"chapter":"第24章 血液透析患者脑卒中的诊治","section":"一、血液透析患者急性脑出血的诊治","roles":["医生"],"level":"进阶","type":"填空","q":"透析患者急性脑出血：收缩压＞____mmHg或平均动脉压＞____mmHg者，推荐以前值血压____作为降压目标缓慢降压；收缩压＜____mmHg有助于防止血肿扩大；为预防再发建议控制舒张压＜____mmHg。","a":"180；130；80%；140；90。","key":"脑出血降压目标为“前值80%”，缺血性卒中为“前值85%～95%”，两者极易混淆。","page":226},{"id":905,"chapter":"第24章 血液透析患者脑卒中的诊治","section":"一、血液透析患者急性脑出血的诊治","roles":["医生"],"level":"进阶","type":"简答","q":"血液透析患者发生急性脑出血后，其血液透析治疗应遵循哪些原则？","a":"①发病24h内避免血液透析；②发病早期选择影响颅内压较小的透析方式：连续性血液透析滤过、腹膜透析、每日低效缓慢血液透析；③透析中给予甘油果糖静脉注射，结合超滤降低颅内压；④抗凝可选枸橼酸局部抗凝；使用华法林者停用华法林并给予维生素K；使用肝素或低分子量肝素者给予鱼精蛋白拮抗。","key":"24h内避免透析、首选不加重颅内压的方式是考核高频点；普通HD快速清除溶质易致失衡加重脑水肿。","page":227},{"id":906,"chapter":"第24章 血液透析患者脑卒中的诊治","section":"一、血液透析患者急性脑出血的诊治","roles":["医生","护士"],"level":"高级","type":"案例分析","q":"男，62岁，维持性HD，普通肝素抗凝。透析第2小时突发剧烈头痛、喷射性呕吐、右侧肢体无力，BP 196/110mmHg。急诊CT示左基底节区出血，预测出血量约35ml，伴脑水肿。请写出处理要点。","a":"①立即停止肝素输注并迅速下机；②给予鱼精蛋白拮抗肝素；③转入脑卒中单元或神经内科监护室，呼吸、吸氧、体温、血糖控制同非透析患者；④出血量＞30ml伴脑水肿、颅内压升高，评估外科急诊手术指征；⑤SBP＞180mmHg，以前值80%为目标缓慢降压，可选尼卡地平、盐酸地尔硫䓬、硝酸甘油、硝普钠静滴，SBP＜140mmHg有助防止血肿扩大；⑥发病24h内避免透析，之后早期选CRRT/腹透/每日低效缓慢透析，透析中用甘油果糖结合超滤降颅压，抗凝选枸橼酸局部抗凝。","key":"易错：降压过快过猛；24h内继续常规HD；继续用肝素抗凝。","page":227},{"id":907,"chapter":"第24章 血液透析患者脑卒中的诊治","section":"二、血液透析患者急性缺血性脑卒中的诊治","roles":["医生","护士"],"level":"基础","type":"简答","q":"血液透析患者急性缺血性脑卒中多发于何时？由低血压导致的常见原因有哪些？","a":"多发于透析结束后6h内。常见原因：①脱水引发的低血压和血液浓缩；②透析后直立性低血压导致脑血流量减少；③透析过程中低血压；④患者脑血流量调节功能障碍。","key":"透后6h内是高危窗口，护士应关注透后起立时头晕、肢体无力等症状。","page":227},{"id":908,"chapter":"第24章 血液透析患者脑卒中的诊治","section":"二、血液透析患者急性缺血性脑卒中的诊治","roles":["医生","护士"],"level":"基础","type":"简答","q":"透析患者疑诊脑卒中时应如何急救处理？应避免哪些措施？","a":"急救：①处理气道、呼吸和循环问题；②心脏监护；③建立静脉通道；④吸氧；⑤评估有无低血糖；⑥透析中的患者迅速下机。应避免：①非低血糖患者输含糖液体；②过度降低血压；③大量静脉滴注。","key":"“非低血糖勿输糖、勿过度降压、勿大量补液”三避免为常考点。","page":227},{"id":909,"chapter":"第24章 血液透析患者脑卒中的诊治","section":"二、血液透析患者急性缺血性脑卒中的诊治","roles":["医生"],"level":"高级","type":"判断","q":"多模态MRI中，PWI显示低灌注区而无与其相应大小的弥散异常（弥散-灌注不匹配），提示可能存在缺血半暗带。（对/错？）","a":"对。原文：弥散-灌注不匹配提示可能存在缺血半暗带；DWI在症状出现数分钟内即可发现缺血灶。","key":"但血管病变检查不应延误溶栓或血管内取栓的治疗时机。","page":228},{"id":910,"chapter":"第24章 血液透析患者脑卒中的诊治","section":"二、血液透析患者急性缺血性脑卒中的诊治","roles":["医生"],"level":"进阶","type":"简答","q":"急性缺血性脑卒中的诊断标准是什么？","a":"①急性起病；②局灶性神经功能缺损（一侧面部或肢体无力或麻木、语言障碍等），少数为全面神经功能缺损；③影像学出现责任病灶或症状/体征持续24h以上；④排除非血管性病因；⑤脑CT/MRI排除脑出血。","key":"“症状/体征持续24h以上”与“影像学责任病灶”满足其一即可。","page":229},{"id":911,"chapter":"第24章 血液透析患者脑卒中的诊治","section":"二、血液透析患者急性缺血性脑卒中的诊治","roles":["医生"],"level":"高级","type":"填空","q":"急性缺血性卒中血压管理：无溶栓/取栓适应证者SBP＞____mmHg或DBP＞____mmHg时以前值的____为降压目标；有溶栓/取栓适应证者SBP＞____mmHg或DBP＞____mmHg时，以BP＜____mmHg为目标；血管开通后高血压者控制在低于基础血压____mmHg。","a":"220；120；85%～95%；185；110；180/105；20～30。","key":"无溶栓指征且SBP＜220/DBP＜120者原则上不积极降压（除合并高血压脑病、主动脉夹层、急性肺水肿、急性心梗等）。","page":229},{"id":912,"chapter":"第24章 血液透析患者脑卒中的诊治","section":"二、血液透析患者急性缺血性脑卒中的诊治","roles":["医生","护士"],"level":"进阶","type":"简答","q":"急性缺血性脑卒中透析患者的血液透析治疗与急性脑出血相比，有哪些特别注意点？","a":"相同：发病24h内避免HD；早期选CRRT、腹透或每日低效缓慢HD；透析中甘油果糖结合超滤降颅压。特别注意：①应避免快速、大量脱水，以防血液浓缩致脑血流减少加重脑缺血；②抗血栓治疗时，为减少出血并发症，应减少透析时抗凝剂剂量。","key":"缺血性卒中最怕“脱水过快”，护士需严格控制超滤速度。","page":229},{"id":913,"chapter":"第24章 血液透析患者脑卒中的诊治","section":"二、血液透析患者急性缺血性脑卒中的诊治","roles":["医生"],"level":"高级","type":"案例分析","q":"女，70岁，维持性HD，合并心房颤动。1个月前发生急性缺血性脑卒中，现病情稳定，BP 165/95mmHg。请给出卒中再发预防的抗栓与降压方案要点。","a":"①抗凝：房颤患者谨慎给予华法林，判断治疗获益时建议维持INR＜2.0；多数凝血酶直接抑制剂和磺达肝癸钠经肾代谢，尿毒症患者不宜应用；②抗血小板药物同非透析患者，但增加出血风险；③降压：一般卒中后1个月开始降压，经1～3个月缓慢降至＜140/90mmHg；如出现眩晕、倦怠、头重感、麻木、脱力、神经症状加重，应考虑降压致脑供血不足，减量或换药；④他汀可参照非透析患者。","key":"透析房颤患者INR目标＜2.0，与普通人群2.0～3.0不同，是高频易错点。","page":230},{"id":914,"chapter":"第25章 血液透析患者的贫血治疗","section":"一、血液透析患者贫血诊断、监测与治疗靶目标","roles":["医生"],"level":"基础","type":"简答","q":"血液透析患者贫血的常见病因有哪些？","a":"①内源性EPO缺乏；②铁缺乏；③微炎症状态；④尿毒症毒素；⑤继发性甲状旁腺功能亢进；⑥透析不充分；⑦血液透析失血；⑧合并其他疾病引起的贫血。","key":"肾性贫血并非单纯EPO缺乏，SHPT、透析不充分、透析失血常被忽视。","page":231},{"id":915,"chapter":"第25章 血液透析患者的贫血治疗","section":"一、血液透析患者贫血诊断、监测与治疗靶目标","roles":["医生","护士"],"level":"基础","type":"填空","q":"海平面地区，年龄＞15岁非妊娠女性Hb＜____g/L、妊娠女性Hb＜____g/L、男性Hb＜____g/L可诊断贫血。","a":"120；110；130。","key":"还需考虑年龄、种族、居住地海拔对Hb的影响。","page":231},{"id":916,"chapter":"第25章 血液透析患者的贫血治疗","section":"一、血液透析患者贫血诊断、监测与治疗靶目标","roles":["医生"],"level":"基础","type":"简答","q":"评估血液透析患者铁状态的指标有哪些？原文推荐如何组合评估？","a":"①铁储备：血清铁蛋白（SF）；②可利用铁：转铁蛋白饱和度（TSAT）；③有条件可检测sTfR/log Ferritin比值、网织红细胞血红蛋白含量（CHr）、低色素红细胞百分比（HRC%）或等效实验（地中海贫血不适用）。推荐SF和TSAT联合检测，而非单独SF或TSAT。","key":"SF受炎症影响大，单看SF易误判铁充足。","page":232},{"id":917,"chapter":"第25章 血液透析患者的贫血治疗","section":"一、血液透析患者贫血诊断、监测与治疗靶目标","roles":["医生","护士"],"level":"基础","type":"简答","q":"血液透析患者血常规的监测频率如何规定？","a":"①未合并贫血者至少每3个月1次；②合并贫血者至少每月1次；③ESAs诱导治疗阶段至少每月1次，维持治疗阶段每1～3个月1次；④透析过程中出现贫血症状和体征时应及时检测。","key":"诱导期“至少每月1次”，维持期“1～3个月1次”，常被记反。","page":232},{"id":918,"chapter":"第25章 血液透析患者的贫血治疗","section":"一、血液透析患者贫血诊断、监测与治疗靶目标","roles":["医生","护士"],"level":"基础","type":"判断","q":"使用静脉铁剂的患者，停用静脉铁剂后次日即可抽血检测铁状态指标。（对/错？）","a":"错。必须在停用静脉铁剂1周后才能取血检测铁状态指标，否则检验结果受用药影响而失准。","key":"护士安排采血时需核对末次静脉铁剂时间。","page":232},{"id":919,"chapter":"第25章 血液透析患者的贫血治疗","section":"一、血液透析患者贫血诊断、监测与治疗靶目标","roles":["医生"],"level":"进阶","type":"简答","q":"铁代谢指标应在哪些时点/频率检测？","a":"①ESAs和/或铁剂治疗前；②ESAs诱导治疗阶段及维持治疗阶段贫血加重时，每月1次；③ESAs稳定治疗期间或Hb较稳定者，每3个月1次；④使用静脉铁剂者须停药1周后取血。网织红细胞计数在ESAs和/或铁剂诱导阶段应与血常规同时检测。","key":"稳定期每3个月、诱导期每月1次，与血常规频率相呼应。","page":232},{"id":920,"chapter":"第25章 血液透析患者的贫血治疗","section":"一、血液透析患者贫血诊断、监测与治疗靶目标","roles":["医生"],"level":"基础","type":"填空","q":"血液透析患者贫血治疗靶目标：Hb≥____g/L，但不超过____g/L；建议维持SF____μg/L，TSAT____。","a":"110；130；200～500；20%～50%。","key":"Hb超过130g/L增加卒中、血栓风险。","page":233},{"id":921,"chapter":"第25章 血液透析患者的贫血治疗","section":"一、血液透析患者贫血诊断、监测与治疗靶目标","roles":["医生"],"level":"高级","type":"简答","q":"原文规定的铁状态“达标”判断标准是什么？","a":"SF＞200μg/L，并且TSAT＞20%或者CHr＞29pg/红细胞和/或sTfR/log Ferritin比值≤2；建议维持SF 200～500μg/L，TSAT 20%～50%。","key":"SF必须同时满足＞200μg/L，单纯TSAT达标不等于铁状态达标。","page":233},{"id":922,"chapter":"第25章 血液透析患者的贫血治疗","section":"二、血液透析患者贫血的治疗","roles":["医生"],"level":"基础","type":"简答","q":"血液透析患者何时开始ESAs治疗？","a":"①Hb＜100g/L时开始ESAs治疗，避免Hb降至90g/L以下；②Hb≥100g/L的部分患者应个体化ESAs治疗，以改善生活质量。且ESAs治疗前应纠正铁缺乏、感染、微炎症等可逆因素。","key":"启动阈值100g/L，与靶目标110～130g/L不同，勿混淆。","page":233},{"id":923,"chapter":"第25章 血液透析患者的贫血治疗","section":"二、血液透析患者贫血的治疗","roles":["医生"],"level":"进阶","type":"填空","q":"ESAs初始剂量：rHuEPO每周____IU/kg，每周____次，皮下或静脉注射；达依泊汀α____μg/kg，每____周1次；CERA____μg/kg，每____周1次。","a":"50～150；1～3；0.45；1～2；0.6；2～4。","key":"长效制剂给药间隔不同，换药时注意折算。","page":233},{"id":924,"chapter":"第25章 血液透析患者的贫血治疗","section":"二、血液透析患者贫血的治疗","roles":["医生"],"level":"进阶","type":"案例分析","q":"女，58岁，新入HD，rHuEPO诱导治疗1个月，Hb由85g/L升至110g/L，并出现血压升高。请评估Hb上升速度并调整ESAs。","a":"①初始治疗时Hb增长速度应控制在每月10～20g/L；②本例每月增长25g/L，＞20g/L，应将ESAs剂量减少25%；③（若每月增长＜10g/L，则rHuEPO每次增加20IU/kg、每周3次，或10000IU、每2周3次）；④继续每月监测血常规；Hb达到115g/L时再减量25%，接近130g/L暂停。","key":"Hb上升过快增加高血压和血栓风险，应减量25%而非维持原剂量。","page":233},{"id":925,"chapter":"第25章 血液透析患者的贫血治疗","section":"二、血液透析患者贫血的治疗","roles":["医生"],"level":"进阶","type":"案例分析","q":"男，55岁，HD患者，rHuEPO维持治疗中。本月Hb 116g/L，2个月后Hb 128g/L并继续上升。请按原文给出ESAs剂量调整方案。","a":"①Hb达到115g/L时，应将ESAs剂量减少25%；②Hb升高且接近130g/L时，应暂停ESAs，每月监测Hb；③Hb开始下降时，将ESAs剂量降低约25%后重新给药；④若Hb超过130g/L，应暂停ESAs治疗。","key":"常见错误是Hb接近130仍按原剂量维持，或停药后以原剂量恢复。","page":233},{"id":926,"chapter":"第25章 血液透析患者的贫血治疗","section":"二、血液透析患者贫血的治疗","roles":["医生","护士"],"level":"基础","type":"判断","q":"接受血液透析或血液滤过治疗的患者，ESAs可口服给药。（对/错？）","a":"错。原文规定接受血液滤过或血液透析治疗的患者应静脉或皮下注射给药。","key":"口服抗贫血新药是HIF-PHI（如罗沙司他），不是ESAs。","page":233},{"id":927,"chapter":"第25章 血液透析患者的贫血治疗","section":"二、血液透析患者贫血的治疗","roles":["医生"],"level":"基础","type":"填空","q":"ESAs低反应性定义：皮下注射rHuEPO剂量达到每周____IU/kg或静脉注射剂量达每周____IU/kg时，Hb仍不能达到或维持靶目标值。","a":"300；500。","key":"皮下与静脉阈值不同，静脉更高。","page":234},{"id":928,"chapter":"第25章 血液透析患者的贫血治疗","section":"二、血液透析患者贫血的治疗","roles":["医生"],"level":"基础","type":"简答","q":"ESAs低反应性的常见原因和其他原因有哪些？","a":"常见：铁缺乏、感染和微炎症。其他：透析不充分、严重SHPT、慢性失血、溶血、维生素B12和叶酸缺乏、实体或血液系统恶性肿瘤、骨髓增生不良综合征、血红蛋白病、铝中毒、甲状腺功能减退、使用ACEI/ARB、EPO抗体介导的PRCA等。","key":"先查铁、感染、炎症三大常见原因，ACEI/ARB使用也常被忽视。","page":234},{"id":929,"chapter":"第25章 血液透析患者的贫血治疗","section":"二、血液透析患者贫血的治疗","roles":["医生"],"level":"高级","type":"判断","q":"针对病因治疗后仍为ESAs低反应性的患者，可不受限制地持续增加ESAs剂量直至Hb达标。（对/错？）","a":"错。应个体化增加ESAs剂量，但最大剂量不应超过初始剂量或稳定剂量（基于体重计算）的2倍。","key":"“不超过2倍”是安全上限，盲目加量增加心血管风险。","page":234},{"id":930,"chapter":"第25章 血液透析患者的贫血治疗","section":"二、血液透析患者贫血的治疗","roles":["医生"],"level":"高级","type":"案例分析","q":"女，48岁，HD患者，皮下rHuEPO治疗6个月。近3周Hb每周下降约8g/L，需每1～2周输注红细胞；血小板和白细胞正常，网织红细胞绝对计数8000/μl。应考虑什么？如何确诊和处理？","a":"①ESAs治疗超过4周，出现Hb每周下降5～10g/L或每1～2周需输红细胞，且血小板、白细胞正常、网织红细胞绝对计数＜10000/μl，应怀疑EPO抗体介导的纯红细胞再生障碍性贫血（PRCA）；②确诊必须红细胞生成素抗体阳性，且骨髓象提示红系增生低下；③疑似或确诊即应停止ESAs治疗；④可尝试免疫抑制剂治疗。","key":"疑似即停ESAs，不能等确诊；换用另一种ESA并不可取。","page":234},{"id":931,"chapter":"第25章 血液透析患者的贫血治疗","section":"二、血液透析患者贫血的治疗","roles":["医生"],"level":"进阶","type":"简答","q":"使用ESAs的注意事项和主要不良反应有哪些？","a":"注意事项：①治疗前纠正铁缺乏、感染、微炎症等可逆因素；②权衡利弊（减少输血、纠正贫血症状，但增加卒中、血管通路失功、高血压风险）；③既往恶性肿瘤或脑卒中者，尤其以治愈为目标的活动性肿瘤患者需谨慎。不良反应：高血压、头痛、皮肤瘙痒及皮疹、恶心呕吐、关节痛、发热、血管通路血栓、眩晕及血栓栓塞性疾病等。","key":"血管通路血栓是透析特有的ESA风险，内瘘护理需关注。","page":234},{"id":932,"chapter":"第25章 血液透析患者的贫血治疗","section":"二、血液透析患者贫血的治疗","roles":["医生","护士"],"level":"基础","type":"简答","q":"常用静脉铁剂有哪些？安全性如何排序？血液透析患者补铁途径如何选择？","a":"①种类：蔗糖铁、葡萄糖醛酸铁、右旋糖酐铁；安全性：蔗糖铁最安全，其次葡萄糖醛酸铁、右旋糖酐铁；②途径：优先选择静脉铁剂；缺铁不显著者也可口服铁剂（硫酸亚铁、枸橼酸铁、富马酸亚铁等）。","key":"右旋糖酐铁过敏风险最高，首次使用须严密监测。","page":235},{"id":933,"chapter":"第25章 血液透析患者的贫血治疗","section":"二、血液透析患者贫血的治疗","roles":["医生"],"level":"进阶","type":"简答","q":"静脉铁剂治疗的适应证如何把握？","a":"先权衡利弊。①未接受铁剂或ESAs者，TSAT≤30%且SF≤500μg/L可尝试静脉铁剂；②已用ESAs但未用铁剂者，为提高Hb或减少ESAs剂量，TSAT≤30%且SF≤500μg/L可尝试静脉铁剂；③TSAT＞30%或SF＞500μg/L时不应常规静脉补铁，但高剂量ESAs仍未达标者可尝试。","key":"启动补铁阈值是“TSAT≤30%且SF≤500”，而非维持目标的“TSAT 20%～50%”。","page":235},{"id":934,"chapter":"第25章 血液透析患者的贫血治疗","section":"二、血液透析患者贫血的治疗","roles":["医生"],"level":"进阶","type":"判断","q":"当TSAT＞30%或SF＞500μg/L时，任何情况下均禁止静脉补铁。（对/错？）","a":"错。此时不应“常规”静脉补铁，但对于使用高剂量ESAs Hb仍未达标者，可尝试静脉铁剂治疗。","key":"注意“不应常规”与“禁止”的区别。","page":235},{"id":935,"chapter":"第25章 血液透析患者的贫血治疗","section":"二、血液透析患者贫血的治疗","roles":["医生","护士"],"level":"基础","type":"填空","q":"口服补铁剂量为____mg/d，____个月评估铁状态；周期性静脉铁剂每疗程补充总量为____mg；维持性静脉铁剂为每____周给予____mg。","a":"200；1～3；1000；1～2；100。","key":"口服不达标或不耐受应改静脉补铁。","page":235},{"id":936,"chapter":"第25章 血液透析患者的贫血治疗","section":"二、血液透析患者贫血的治疗","roles":["医生"],"level":"高级","type":"案例分析","q":"男，60岁，HD患者，维持性静脉蔗糖铁治疗中，复查TSAT 55%，SF 860μg/L。应如何处理？何时可恢复补铁，剂量如何调整？","a":"①静脉铁剂治疗后TSAT≥50%和/或SF≥800μg/L（或HRC%＜10%和/或CHr＞33pg/RBC或sTfR＜1000μg/L），应停止铁剂治疗；②3个月后重新评估铁状态；③若TSAT≤50%且SF≤800μg/L、HRC%≥10%或/和CHr≤33pg/RBC或sTfR≥1000μg/L，可考虑恢复铁剂治疗；④恢复时每周剂量较停药前减少1/3～1/2。","key":"停铁阈值是“TSAT≥50%、SF≥800”，与启动阈值“30%/500”不同；恢复需减量1/3～1/2。","page":235},{"id":937,"chapter":"第25章 血液透析患者的贫血治疗","section":"二、血液透析患者贫血的治疗","roles":["护士"],"level":"基础","type":"简答","q":"首次使用静脉铁剂时，护理与安全保障上有哪些要求？还有哪些情况应避免输注静脉铁？","a":"①必须按产品说明书要求操作；②输注后60min严密监测；③配备心肺复苏设备（包括药物）；④人员需培训以评估和处理铁剂不良反应；⑤急性活动性感染时避免输注静脉铁剂；⑥治疗期间监测铁状态，避免铁过载。","key":"首次输注后观察60min是护理考核高频点。","page":235},{"id":938,"chapter":"第25章 血液透析患者的贫血治疗","section":"二、血液透析患者贫血的治疗","roles":["医生"],"level":"高级","type":"案例分析","q":"女，52岁，新入维持性HD，未用过ESAs和铁剂。Hb 88g/L，SF 150μg/L，TSAT 15%，无活动性感染。请制订贫血治疗方案。","a":"①Hb＜100g/L，已降至90g/L以下，应开始ESAs治疗；ESAs治疗前先纠正铁缺乏等可逆因素；②TSAT≤30%且SF≤500μg/L，予静脉铁剂（优先蔗糖铁），周期性疗程每疗程总量1000mg，首次输注后60min严密监测并备复苏设备；③rHuEPO初始每周50～150IU/kg，分1～3次皮下或静脉注射；④Hb增长控制在每月10～20g/L，诱导期至少每月测血常规及铁代谢；⑤目标Hb≥110g/L且≤130g/L，SF 200～500μg/L、TSAT 20%～50%。","key":"常见错误：铁缺乏未纠正即大剂量ESAs，导致“ESAs低反应”。","page":235},{"id":939,"chapter":"第25章 血液透析患者的贫血治疗","section":"二、血液透析患者贫血的治疗","roles":["医生"],"level":"进阶","type":"简答","q":"HIF-PHI治疗肾性贫血的作用机制是什么？","a":"①上调内源性EPO产生和EPO受体表达；②增加肠道铁转运蛋白和骨髓转铁蛋白受体表达，促进肠道铁吸收和骨髓铁利用；③下调铁调素水平，促进单核吞噬细胞系统内铁释放，改善铁利用，从而促进红细胞生成。临床研究显示可减少静脉铁剂使用。","key":"HIF-PHI为小分子口服药，在炎症状态下仍可改善铁利用。","page":236},{"id":940,"chapter":"第25章 血液透析患者的贫血治疗","section":"二、血液透析患者贫血的治疗","roles":["医生"],"level":"基础","type":"填空","q":"罗沙司他透析患者起始剂量：体重45～60kg每次____mg，体重≥60kg每次____mg，每周____次口服；起始阶段每____周监测1次Hb，随后每____周监测1次。","a":"100；120；3；2；4。","key":"建议从小剂量开始，并同时监测SF、TSAT等铁代谢参数。","page":236},{"id":941,"chapter":"第25章 血液透析患者的贫血治疗","section":"二、血液透析患者贫血的治疗","roles":["医生"],"level":"基础","type":"判断","q":"为加速Hb达标，罗沙司他可与ESAs同时使用。（对/错？）","a":"错。原文明确罗沙司他不应与ESAs同时使用。","key":"换用HIF-PHI时需停用ESAs，避免两药叠加。","page":236},{"id":942,"chapter":"第25章 血液透析患者的贫血治疗","section":"二、血液透析患者贫血的治疗","roles":["医生"],"level":"基础","type":"简答","q":"罗沙司他常见不良反应和禁用人群有哪些？","a":"不良反应：高血压、高钾血症、上呼吸道感染、恶心、乏力、转氨酶异常、头晕、低血压、肌肉痉挛等。禁用：妊娠期和哺乳期女性，以及对活性成分或任何辅料过敏者。重度肝功能受损者需权衡利弊使用。","key":"高钾血症是透析患者用罗沙司他需特别关注的不良反应。","page":236},{"id":943,"chapter":"第25章 血液透析患者的贫血治疗","section":"二、血液透析患者贫血的治疗","roles":["医生"],"level":"基础","type":"简答","q":"血液透析患者输血治疗的原则是什么？","a":"①病情允许时尽量避免输注红细胞，以减少输血反应风险；②拟行器官移植者，病情允许时避免输注红细胞，以减少同种致敏风险。","key":"等待肾移植者输血可致致敏，影响配型。","page":237},{"id":944,"chapter":"第25章 血液透析患者的贫血治疗","section":"二、血液透析患者贫血的治疗","roles":["医生"],"level":"进阶","type":"简答","q":"血液透析患者急性贫血和慢性贫血的输血指征分别是什么？","a":"急性：①合并急性出血——难以控制的急性快速失血；预计失血占血容量25%～30%伴低血容量症状；预计失血＞30%～40%伴严重失血症状；②伴急性冠脉综合征或心力衰竭时，根据症状决定。慢性：ESAs使用相对禁忌或ESAs治疗无效的患者出现贫血相关症状和体征时。","key":"慢性贫血输血不以Hb数值为单一指征，而以“ESAs禁忌/无效+症状”为准。","page":237},{"id":945,"chapter":"第25章 血液透析患者的贫血治疗","section":"二、血液透析患者贫血的治疗","roles":["医生"],"level":"进阶","type":"填空","q":"血液透析患者手术前输血指征：Hb＜____g/L；对贫血耐受性差的高危患者（年龄＞____岁，合并心血管或呼吸道疾病）Hb＜____g/L；Hb在____g/L时根据具体情况决定。","a":"70；65；80；70～100。","key":"高危患者阈值上调至80g/L。","page":237},{"id":946,"chapter":"第26章 慢性肾脏病矿物质与骨异常的防治","section":"一、血液透析患者慢性肾脏病矿物质与骨异常的防治总则","roles":["医生"],"level":"基础","type":"简答","q":"CKD-MBD包括哪三方面异常？","a":"①钙、磷、PTH和维生素D等代谢异常；②骨容量、骨转化、骨矿物质化、骨线性增长和强度异常；③血管或其他软组织等异位钙化。","key":"几乎所有透析患者均有不同程度CKD-MBD，是致残和死亡的主要病因。","page":238},{"id":947,"chapter":"第26章 慢性肾脏病矿物质与骨异常的防治","section":"一、血液透析患者慢性肾脏病矿物质与骨异常的防治总则","roles":["医生"],"level":"进阶","type":"简答","q":"对于高钙血症、高磷血症和高iPTH血症三者并存的患者，原文推荐如何治疗？","a":"首先给予拟钙剂治疗，同时控制钙摄入，并使用非含钙的磷结合剂。","key":"三高并存时首选活性维生素D是典型错误，会加重高钙高磷。","page":238},{"id":948,"chapter":"第26章 慢性肾脏病矿物质与骨异常的防治","section":"一、血液透析患者慢性肾脏病矿物质与骨异常的防治总则","roles":["医生"],"level":"高级","type":"简答","q":"经规范药物治疗后，哪些情况应考虑甲状旁腺切除或超声引导下介入治疗？","a":"①血清iPTH＞600pg/ml；②或已形成直径＞1cm的甲状旁腺结节或腺瘤；③或iPTH＜600pg/ml但伴顽固性高钙血症和高磷血症。","key":"手术指征不只看iPTH数值，结节＞1cm或顽固高钙高磷同样是指征。","page":238},{"id":949,"chapter":"第26章 慢性肾脏病矿物质与骨异常的防治","section":"一、血液透析患者慢性肾脏病矿物质与骨异常的防治总则","roles":["医生","护士"],"level":"基础","type":"简答","q":"血液透析患者血钙、血磷和iPTH的常规监测频率如何？接受维生素D治疗时如何调整？","a":"①常规每1～3个月检测血钙、血磷，每3～6个月检测iPTH；②iPTH升高或正在接受治疗者，每3个月至少检测1次iPTH；③接受维生素D及其类似物治疗时，每月检测血钙和血磷，每3个月检测iPTH。","key":"用活性维生素D期间血钙血磷需每月查，常被延长至季度。","page":239},{"id":950,"chapter":"第26章 慢性肾脏病矿物质与骨异常的防治","section":"一、血液透析患者慢性肾脏病矿物质与骨异常的防治总则","roles":["医生"],"level":"进阶","type":"填空","q":"碱性磷酸酶每____个月检测1次；骨密度每____检测1次，治疗方案明显改变时每____个月复查；血管钙化评估每____个月检测1次。","a":"6；年；6；6～12。","key":"iPTH升高时应增加碱性磷酸酶检测频次。","page":239},{"id":951,"chapter":"第26章 慢性肾脏病矿物质与骨异常的防治","section":"一、血液透析患者慢性肾脏病矿物质与骨异常的防治总则","roles":["医生"],"level":"基础","type":"填空","q":"CKD-MBD较理想目标：血钙____mg/dl（____mmol/L）；iPTH____pg/ml；碱性磷酸酶____IU/L；血清25（OH）D≥____nmol/L。","a":"8.4～10.0；2.1～2.5；150～300；80～120；50。","key":"本规程iPTH目标为150～300pg/ml，勿与KDIGO“正常上限2～9倍”混用。","page":239},{"id":952,"chapter":"第26章 慢性肾脏病矿物质与骨异常的防治","section":"二、血液透析患者的血磷管理","roles":["医生"],"level":"进阶","type":"案例分析","q":"男，56岁，维持性HD（每周3次、每次4h），饮食控制后连续两次透前血磷2.1mmol/L，血钙2.6mmol/L，侧位腹平片示腹主动脉钙化。请按原文给出血磷管理方案。","a":"①血磷＞1.78mmol/L：控制饮食磷摄入，口服磷结合剂，增加透析磷清除；②合并高钙血症及血管钙化，应使用非含钙磷结合剂（优选不含钙且不含铝者，如司维拉姆、碳酸镧等），随餐服用，限制含钙磷结合剂；③常规透析难以控制时，可采用每日透析或夜间长时透析增加磷清除（每次4h透析约清除800～1000mg磷，高通量与低通量清除磷无明显差别）；④低磷饮食，磷摄入500～800mg/d，减少无机磷添加剂，选择低磷/蛋白比值食物。","key":"合并高钙/钙化仍用碳酸钙是最常见错误；单纯换高通量透析器不能增加磷清除。","page":239},{"id":953,"chapter":"第26章 慢性肾脏病矿物质与骨异常的防治","section":"二、血液透析患者的血磷管理","roles":["医生","技师"],"level":"基础","type":"判断","q":"高通量透析清除磷的效果明显优于低通量透析。（对/错？）","a":"错。原文：高通量与低通量透析清除磷的效果无明显差别；清除效果取决于透析时间、透析效率（血流量、透析液流量、透析器面积）及透析频次。","key":"增加磷清除靠延长时间/增加频次（每日透析、夜间长时透析），而非单纯换高通量。","page":240},{"id":954,"chapter":"第26章 慢性肾脏病矿物质与骨异常的防治","section":"二、血液透析患者的血磷管理","roles":["医生"],"level":"基础","type":"填空","q":"每次4h的血液透析约清除____mg磷；常规透析难以控制高磷血症时，可采用____或____以增加磷清除；评价透析对磷清除的重要指标是____。","a":"800～1000；每日透析；夜间长时透析；Kt/V。","key":"充分透析是治疗高磷血症的基础。","page":240},{"id":955,"chapter":"第26章 慢性肾脏病矿物质与骨异常的防治","section":"二、血液透析患者的血磷管理","roles":["医生"],"level":"基础","type":"简答","q":"磷结合剂的选择原则是什么？","a":"①优选不含钙且不含铝的磷结合剂，需随餐服用；合并低钙血症者选含钙制剂；根据血磷决定剂量并定期复查；②用含钙磷结合剂前评估血钙及钙化，合并高钙血症、动脉钙化、异位钙化、无动力性骨病或iPTH持续过低者应限制使用，每日元素钙总量不超过1500mg；③含铝磷结合剂使用不超过4周，儿童禁用。","key":"元素钙总量1500mg/d包括药物中的钙；含铝制剂“4周、儿童禁用”是高频考点。","page":240},{"id":956,"chapter":"第26章 慢性肾脏病矿物质与骨异常的防治","section":"二、血液透析患者的血磷管理","roles":["医生","护士"],"level":"基础","type":"判断","q":"为了减少胃肠道反应，磷结合剂应在两餐之间空腹服用。（对/错？）","a":"错。磷结合剂需要随餐服用，才能结合食物中的磷。","key":"患者教育重点：随餐嚼服，漏服时不应在餐后补服大剂量。","page":240},{"id":957,"chapter":"第26章 慢性肾脏病矿物质与骨异常的防治","section":"三、血液透析患者的维生素D及其类似物的选择与应用","roles":["医生"],"level":"进阶","type":"简答","q":"继发性甲状旁腺功能亢进（SHPT）患者如何选择维生素D制剂及给药方式？","a":"①血钙血磷正常基础上，轻度SHPT且iPTH稳定者，选无需肾脏活化的活性维生素D（阿法骨化醇、骨化三醇、帕立骨化醇等）口服；②iPTH进行性上升或持续高于300pg/ml者，建议活性维生素D及其类似物间歇静脉给药，也可先间歇口服冲击，疗效欠佳改静脉；③血钙偏高、有高钙风险或合并血管钙化者，建议选择性维生素D受体激动剂。","key":"有高钙风险时优选帕立骨化醇等选择性VDRA。","page":240},{"id":958,"chapter":"第26章 慢性肾脏病矿物质与骨异常的防治","section":"三、血液透析患者的维生素D及其类似物的选择与应用","roles":["医生"],"level":"高级","type":"填空","q":"间歇口服冲击治疗：骨化三醇____μg/次或阿法骨化醇____μg/次，每周____次；帕立骨化醇____μg/次，每周____次。","a":"1～2；2～4；2；2～4；3。","key":"帕立骨化醇冲击为每周3次，与骨化三醇/阿法骨化醇每周2次不同。","page":241},{"id":959,"chapter":"第26章 慢性肾脏病矿物质与骨异常的防治","section":"三、血液透析患者的维生素D及其类似物的选择与应用","roles":["医生"],"level":"高级","type":"简答","q":"活性维生素D间歇静脉给药的起始剂量如何根据iPTH水平选择？","a":"①iPTH 300～≤1000pg/ml：骨化三醇1μg/次或帕立骨化醇5μg/次，均每周3次；②iPTH 1000～1500pg/ml：骨化三醇2μg/次或帕立骨化醇10μg/次，每周3次；③iPTH＞1500pg/ml：骨化三醇3μg/次或帕立骨化醇15μg/次，每周3次。应密切监测血钙、血磷、iPTH及不良反应。","key":"骨化三醇与帕立骨化醇剂量比约1:5。","page":241},{"id":960,"chapter":"第26章 慢性肾脏病矿物质与骨异常的防治","section":"三、血液透析患者的维生素D及其类似物的选择与应用","roles":["医生"],"level":"进阶","type":"简答","q":"活性维生素D治疗后如何根据iPTH变化调整剂量？","a":"①iPTH不变或上升，或降幅小于基线30%：可增加阿法骨化醇2～6μg/周、骨化三醇1～3μg/周或帕立骨化醇5～15μg/周；②iPTH降至接近目标范围：每1～2周减少阿法骨化醇2μg、骨化三醇1μg或帕立骨化醇5μg，以最小剂量维持iPTH在目标范围。","key":"“降幅＜30%”是加量的判断界值。","page":241},{"id":961,"chapter":"第26章 慢性肾脏病矿物质与骨异常的防治","section":"三、血液透析患者的维生素D及其类似物的选择与应用","roles":["医生"],"level":"高级","type":"案例分析","q":"男，58岁，HD 6年。静脉骨化三醇逐步加量至9μg/周已治疗6个月，复查iPTH 820pg/ml（较基线下降约25%），血钙2.45mmol/L。如何判断与处理？","a":"①静脉骨化三醇每周最大剂量不超过9μg；经6个月加量治疗或剂量已达9μg/周，iPTH仍≥600pg/ml或较基线降低＜70%，考虑骨化三醇抵抗；②建议改用帕立骨化醇等选择性维生素D受体激动剂或拟钙剂（西那卡塞），或联合西那卡塞；③仍无明显疗效，考虑甲状旁腺手术切除；④同时评估甲状旁腺结节（＞1cm亦为手术指征）。","key":"骨化三醇抵抗判定看“≥600pg/ml或降幅＜70%”；帕立骨化醇单次最大不超过15μg，起始治疗6个月iPTH仍≥600pg/ml也应换用或联合西那卡塞。","page":242},{"id":962,"chapter":"第26章 慢性肾脏病矿物质与骨异常的防治","section":"三、血液透析患者的维生素D及其类似物的选择与应用","roles":["医生"],"level":"高级","type":"简答","q":"甲状旁腺切除术后活性维生素D治疗方案是什么？","a":"①术后2～4周内给骨化三醇2～4μg/d口服，纠正骨饥饿所致的低钙和低磷血症；②血钙≥2.1mmol/L可逐渐减量骨化三醇和钙剂；血钙＞2.6mmol/L时，钙剂/骨化三醇减半量或停用；③iPTH＜60pg/ml时，先减量骨化三醇，再减量钙剂。","key":"术后“骨饥饿”低钙可很严重，需每日监测血钙；减药顺序是先骨化三醇后钙剂。","page":242},{"id":963,"chapter":"第26章 慢性肾脏病矿物质与骨异常的防治","section":"三、血液透析患者的维生素D及其类似物的选择与应用","roles":["医生"],"level":"进阶","type":"案例分析","q":"女，50岁，HD患者，口服骨化三醇及碳酸钙治疗，连续两次血钙2.7mmol/L，血磷2.0mmol/L。请给出处理措施。","a":"①启动低钙饮食，停用钙剂及其他补钙措施，钙摄入量＜1000mg/d；②使用1.25mmol/L钙浓度透析液，延长透析时间，提高透析充分性；③停用含钙磷结合剂，血磷升高换用非含钙磷结合剂；④暂停活性维生素D及其类似物，换用西那卡塞；⑤高钙纠正后可考虑换用帕立骨化醇等选择性VDRA；⑥同时低磷饮食，磷摄入500～800mg/d。","key":"高钙时仍用含钙磷结合剂或1.5mmol/L钙透析液是常见错误。","page":242},{"id":964,"chapter":"第26章 慢性肾脏病矿物质与骨异常的防治","section":"三、血液透析患者的维生素D及其类似物的选择与应用","roles":["医生"],"level":"进阶","type":"判断","q":"iPTH水平大幅下降或持续低于目标范围下限时，应继续维持原有活性维生素D剂量以巩固疗效。（对/错？）","a":"错。应减少甚至停止各种降低iPTH的药物，避免或减少低转运骨病甚至无动力骨病的发生。","key":"维生素D主要不良反应包括高钙、高磷及过度抑制iPTH致低转运/无动力骨病。","page":242},{"id":965,"chapter":"第26章 慢性肾脏病矿物质与骨异常的防治","section":"四、血液透析患者拟钙剂应用","roles":["医生"],"level":"基础","type":"简答","q":"西那卡塞的适应证和禁忌证有哪些？","a":"适应证：①同时伴高钙血症、高磷血症和SHPT；②伴高钙血症或合并明显血管钙化；③活性维生素D治疗SHPT效果不佳。禁忌证：对本药成分过敏、严重低钙血症等。","key":"拟钙剂还能抑制血管钙化、减轻钙化防御。","page":243},{"id":966,"chapter":"第26章 慢性肾脏病矿物质与骨异常的防治","section":"四、血液透析患者拟钙剂应用","roles":["医生"],"level":"进阶","type":"填空","q":"西那卡塞通常在血钙＞____mg/dl（____mmol/L）时才开始使用；初始剂量____mg，每日____次，____口服。","a":"9.0；2.2；25；1；随餐或餐后立即。","key":"低钙患者需先补钙和维生素D，待血钙＞2.2mmol/L再用。","page":243},{"id":967,"chapter":"第26章 慢性肾脏病矿物质与骨异常的防治","section":"四、血液透析患者拟钙剂应用","roles":["医生","护士"],"level":"进阶","type":"简答","q":"西那卡塞的服用方法及治疗期间血钙、iPTH监测频率是什么？","a":"服法：整片吞服，不建议切分；每天同一时间段服用，为减轻胃肠道反应推荐下午或夜间服药。监测：给药初期及剂量调整阶段（约3个月）一般每周测1次血钙，每1～4周测1次iPTH；维持期每2周测1次血清钙，每月测1次iPTH；血清白蛋白＜40g/L时用校正血清钙。","key":"白蛋白＜40g/L必须用校正钙判断，否则低估低钙风险。","page":243},{"id":968,"chapter":"第26章 慢性肾脏病矿物质与骨异常的防治","section":"四、血液透析患者拟钙剂应用","roles":["医生"],"level":"高级","type":"案例分析","q":"男，45岁，HD患者，西那卡塞50mg/d治疗中。复查校正血清钙1.85mmol/L，伴口周麻木。如何处理？之后如何恢复用药？","a":"①血清钙＜1.9mmol/L，暂停西那卡塞；②补充钙剂或使用维生素D制剂；③至少每周检测1次血钙直至恢复正常；④恢复正常后可考虑重新使用西那卡塞，剂量从停药前剂量或减少25mg开始；（若血钙仅＜2.1mmol/L，则补钙/维生素D或酌情减量）。","key":"区分两个阈值：＜2.1减量/补钙，＜1.9停药。","page":243},{"id":969,"chapter":"第26章 慢性肾脏病矿物质与骨异常的防治","section":"四、血液透析患者拟钙剂应用","roles":["医生"],"level":"高级","type":"填空","q":"西那卡塞增量：iPTH未控制在150～300pg/ml时逐渐递增至____mg/d，增量间期不少于____周，每次增量____mg；最大剂量____mg/d；最大剂量使用____个月iPTH仍无显著下降考虑治疗无效。","a":"75；3；25；100；2。","key":"若iPTH未明显下降且血磷＜1.78mmol/L、血钙＜2.5mmol/L，可联合活性维生素D。","page":244},{"id":970,"chapter":"第26章 慢性肾脏病矿物质与骨异常的防治","section":"四、血液透析患者拟钙剂应用","roles":["医生"],"level":"进阶","type":"判断","q":"有癫痫既往史的透析患者禁用西那卡塞。（对/错？）","a":"错。具有癫痫发作风险或癫痫既往史、肝功能异常、消化道出血或溃疡既往史者为“谨慎使用”，非禁忌；禁忌为过敏和严重低钙血症。","key":"低钙可诱发癫痫，故此类患者更需严密监测血钙。","page":244},{"id":971,"chapter":"第26章 慢性肾脏病矿物质与骨异常的防治","section":"附一～附三：食物磷/蛋白比值、含磷食物添加剂、常用饮料含磷量","roles":["医生","护士"],"level":"进阶","type":"简答","q":"根据表26-1，哪些食物磷/蛋白比值＜5mg/g？指导患者选择食物的原则是什么？","a":"磷/蛋白＜5mg/g的食物：鸡蛋蛋白（1.4）、猪皮（1.4）、海参（1.7）、罗非鱼（4.5）。原则：在不限制蛋白质摄入前提下限制磷摄入，选择低磷/蛋白比值食物，减少磷酸盐添加剂。","key":"鸡蛋蛋白磷/蛋白比值仅1.4mg/g，而蛋黄很高，可“吃蛋白、少吃蛋黄”。","page":245},{"id":972,"chapter":"第27章 血液透析患者营养不良的评估与治疗","section":"一、血液透析患者营养不良的定义与概述","roles":["医生","护士"],"level":"基础","type":"简答","q":"什么是蛋白质-能量消耗（PEW）？其临床表现有哪些？中国HD患者营养不良患病率是多少？","a":"PEW是多种疾病导致的蛋白代谢异常（特别是肌肉合成和分解异常）及能量储备下降的病理生理状态。临床表现：营养和热量摄入不足、低BMI、低血清白蛋白、微炎症状态及进行性骨骼肌消耗。中国HD患者营养不良患病率30.0%～66.7%。","key":"PEW与炎症互相促进形成恶性循环，加速动脉病变。","page":251},{"id":973,"chapter":"第27章 血液透析患者营养不良的评估与治疗","section":"二、血液透析患者营养不良的常见病因","roles":["医生"],"level":"基础","type":"简答","q":"血液透析患者营养不良的常见病因有哪些？","a":"①摄食减少和厌食；②高分解代谢状态；③炎症和共存疾病；④胰岛素抵抗；⑤代谢性酸中毒；⑥血液透析相关原因：透析不充分、透析中营养物质流失（氨基酸、肽、蛋白质、葡萄糖）；⑦膳食限制；⑧药物。","key":"过度限制饮食（膳食限制）本身就是营养不良病因。","page":252},{"id":974,"chapter":"第27章 血液透析患者营养不良的评估与治疗","section":"三、血液透析患者营养状态评估","roles":["医生","护士"],"level":"基础","type":"简答","q":"血液透析患者营养状况评估包括哪些方面？","a":"①临床调查（病史、体格检查、社会心理因素）；②饮食评估（3d饮食记录法，目前多用nPNA或PCR）；③人体测量（干体重、BMI、肱三头肌皮褶厚度、上臂肌围、人体成分）；④生化指标（白蛋白、透前后尿素氮、前白蛋白、转铁蛋白、血脂，有条件测IGF-1）；⑤主观综合评估（SGA、MIS）；⑥有条件行人体成分分析（BCM、双能X线、CT或MRI）。","key":"单凭白蛋白评估营养不全面，需结合SGA/MIS和透析充分性。","page":252},{"id":975,"chapter":"第27章 血液透析患者营养不良的评估与治疗","section":"三、血液透析患者营养状态评估","roles":["护士"],"level":"进阶","type":"简答","q":"肱三头肌皮褶厚度的测量方法要点是什么？","a":"一般测右侧；受试者自然站立，被测部位充分裸露；标记右臂后面肩峰至尺骨鹰嘴连线中点；左手拇指和示、中指将皮肤和皮下组织夹提起，在提起点下方用皮褶计测量；指针快速回落后立即读数；连续测3次，以mm为单位，精确到0.1mm。","key":"内瘘侧不宜反复操作；读数须在指针回落后“立即”读，延迟会偏小。","page":254},{"id":976,"chapter":"第27章 血液透析患者营养不良的评估与治疗","section":"三、血液透析患者营养状态评估","roles":["医生","护士"],"level":"基础","type":"判断","q":"SGA评分中，B级代表重度营养不良。（对/错？）","a":"错。SGA：A=营养良好（大部分是A或明显改善）；B=轻、中度营养不良；C=重度营养不良（大部分是C，明显躯体症状）。","key":"SGA依据体重改变、进食、胃肠道症状、功能、疾病应激和体检6方面综合判断。","page":254},{"id":977,"chapter":"第27章 血液透析患者营养不良的评估与治疗","section":"三、血液透析患者营养状态评估","roles":["医生"],"level":"进阶","type":"填空","q":"MIS评分计算____个部分总分，正常值____分，最高____分；＜8分为____营养不良，9～18分为____营养不良，＞18分为____营养不良。","a":"10；0；30；轻度；中度；重度。","key":"MIS纳入透析年限、BMI、白蛋白、TIBC等，可同时反映炎症。","page":257},{"id":978,"chapter":"第27章 血液透析患者营养不良的评估与治疗","section":"四、血液透析患者营养不良的治疗方案","roles":["医生"],"level":"进阶","type":"简答","q":"血液透析患者蛋白质和能量的推荐摄入量是多少？","a":"①蛋白质1.0～1.2g/(kg·d)，高生物价蛋白质应占50%以上；必要时补充复方α酮酸0.12g/(kg·d)；②能量通常35kcal/(kg·d)；60岁以上、活动量较小、营养良好（白蛋白＞40g/L、SGA A级）者可减至30～35kcal/(kg·d)。","key":"透析患者不应沿用透析前低蛋白饮食0.6g/(kg·d)。","page":258},{"id":979,"chapter":"第27章 血液透析患者营养不良的评估与治疗","section":"四、血液透析患者营养不良的治疗方案","roles":["医生"],"level":"进阶","type":"简答","q":"血液透析患者脂肪及无机盐（钠、钾、磷、钙）摄入推荐是什么？","a":"①脂肪供能比25%～35%，饱和脂肪酸≤10%，反式脂肪酸≤1%，可适当提高n-3多不饱和及单不饱和脂肪酸；②钠＜2000mg/d（相当于钠盐＜5g/d）；③无尿患者钾＜2000mg/d，尿量＞1500ml/d可适当放宽；④磷一般600～1000mg/d，高磷血症时＜800mg/d；⑤元素钙≤1500mg/d（含药物中元素钙）。","key":"钠2000mg≈盐5g，二者换算易混。","page":258},{"id":980,"chapter":"第27章 血液透析患者营养不良的评估与治疗","section":"四、血液透析患者营养不良的治疗方案","roles":["医生"],"level":"高级","type":"判断","q":"合并高同型半胱氨酸血症的血液透析患者，推荐常规补充叶酸。（对/错？）","a":"错。原文不推荐合并高同型半胱氨酸的HD患者常规补充叶酸。推荐适量补充维生素C、B6及叶酸，维生素C推荐量男性90mg/d、女性75mg/d，过度补充可致高草酸盐血症。","key":"维生素C过量致高草酸盐血症是透析患者特有风险。","page":258},{"id":981,"chapter":"第27章 血液透析患者营养不良的评估与治疗","section":"四、血液透析患者营养不良的治疗方案","roles":["医生"],"level":"进阶","type":"案例分析","q":"男，72岁，HD 3年，体重60kg，近3个月食欲差，血清白蛋白32g/L，SGA B级，饮食指导后摄入仍不足。请制订营养治疗方案。","a":"①先保证充分透析、纠正代谢性酸中毒、改善炎症；②蛋白质1.0～1.2g/(kg·d)即60～72g/d，高生物价蛋白≥50%，必要时复方α酮酸0.12g/(kg·d)；③能量：白蛋白＜40g/L、非SGA A级，不符合减量条件，按35kcal/(kg·d)约2100kcal/d；④单纯饮食指导不达标，在营养师或医师指导下给予口服营养补充剂，推荐低磷、低钾、高能量密度的肾病专用配方；⑤经口受限或仍不足，予管饲或肠外营养；⑥高危患者增加监测频率（至少每月评估）。","key":"老年≠一律减能量；只有营养良好者才可减至30～35kcal/(kg·d)。","page":258},{"id":982,"chapter":"第28章 血液透析患者高尿酸血症的治疗","section":"一、血液透析患者降尿酸药物治疗时机和血尿酸控制适宜水平","roles":["医生"],"level":"基础","type":"填空","q":"高尿酸血症定义：正常嘌呤饮食下，非同日两次空腹血尿酸男性和绝经后女性＞____μmol/L，绝经前女性＞____μmol/L。","a":"420；360。","key":"须“非同日两次空腹”测定。","page":260},{"id":983,"chapter":"第28章 血液透析患者高尿酸血症的治疗","section":"一、血液透析患者降尿酸药物治疗时机和血尿酸控制适宜水平","roles":["医生"],"level":"进阶","type":"案例分析","q":"男，80岁，HD 5年，非糖尿病肾病，营养不良（白蛋白33g/L），无痛风发作史，透前血尿酸520μmol/L。是否需要降尿酸药物？目标如何？若改为合并痛风或严重痛风，目标又是多少？","a":"①非糖尿病肾病、高龄、营养不良的HD患者，透前血尿酸≥540μmol/L时才考虑降尿酸药物，本例520μmol/L暂不需药物，以饮食、透析充分性等非药物措施为主；②此类患者不建议通过药物使透前血尿酸维持在500μmol/L以下；③若合并痛风，目标＜360μmol/L；严重痛风（痛风石、慢性关节病变、每年发作≥2次）目标＜300μmol/L；④合并糖尿病尤其心血管并发症者，透前控制在相应性别和年龄人群正常范围。","key":"透析患者尿酸与死亡呈“逆流行病学”关系，生理浓度尿酸有抗氧化作用，并非都需降尿酸。","page":260},{"id":984,"chapter":"第28章 血液透析患者高尿酸血症的治疗","section":"一、血液透析患者降尿酸药物治疗时机和血尿酸控制适宜水平","roles":["医生"],"level":"基础","type":"判断","q":"单次血液透析后血尿酸可下降60%以上，因此每周3次每次4h的透析即可有效清除体内产生的尿酸。（对/错？）","a":"错。单次透析后血尿酸下降60%以上，存在周期性变化；但原文指出每周3次每次4h透析难以有效清除体内产生的尿酸（每天产生750mg），透析患者常合并高尿酸血症。","key":"判断尿酸应统一采用“透前”血尿酸。","page":260},{"id":985,"chapter":"第28章 血液透析患者高尿酸血症的治疗","section":"二、血液透析患者高尿酸血症的治疗","roles":["医生"],"level":"基础","type":"简答","q":"血液透析患者高尿酸血症的非药物治疗措施有哪些？","a":"①生活方式：避免高嘌呤饮食、严格戒酒；肥胖者低热量平衡膳食、增加运动；控制心血管危险因素；避免升尿酸药物；②提高透析充分性：每周3次透析者spKt/V＞1.4；③纠正代谢性酸中毒：透前CO2CP或HCO3-≥20mmol/L且＜26mmol/L；④保护残肾功能：避免肾毒性药物，控制单次超滤量，及时纠正血容量不足和心力衰竭。","key":"高尿酸者spKt/V目标＞1.4，高于一般最低标准。","page":261},{"id":986,"chapter":"第28章 血液透析患者高尿酸血症的治疗","section":"二、血液透析患者高尿酸血症的治疗","roles":["医生"],"level":"基础","type":"判断","q":"血液透析患者合并高尿酸血症时可选用苯溴马隆促进尿酸排泄。（对/错？）","a":"错。HD患者GFR显著降低或无尿，禁用苯溴马隆、丙磺舒和柳氮磺吡啶等促尿酸排泄药，需选抑制尿酸生成或促进尿酸分解的药物。","key":"促排泄类药物在透析患者无效且有害。","page":261},{"id":987,"chapter":"第28章 血液透析患者高尿酸血症的治疗","section":"二、血液透析患者高尿酸血症的治疗","roles":["医生"],"level":"进阶","type":"简答","q":"血液透析患者使用别嘌醇的方案及注意事项是什么？","a":"方案：每次透析后口服100mg；未达标者每2～4周增加50mg，监测透前血尿酸调整。注意：①用药前查HLA-B*5801，阳性者避免使用，防严重皮疹；②别嘌醇过敏、严重肝功能障碍、粒细胞减少者及孕妇、哺乳期妇女禁用；③与氨苄西林并用增加皮疹，与卡托普利合用偶致阿-斯综合征，与铁剂同服可致铁在组织内过量积蓄；增强双香豆素、硫唑嘌呤、巯嘌呤、环磷酰胺、茶碱、磺酰脲类等作用。","key":"“透析后服药”和HLA-B*5801筛查是考核重点；别嘌醇与铁剂同服的相互作用在透析人群易被忽视。","page":261},{"id":988,"chapter":"第28章 血液透析患者高尿酸血症的治疗","section":"二、血液透析患者高尿酸血症的治疗","roles":["医生"],"level":"进阶","type":"填空","q":"非布司他血浆蛋白结合率约____%，血液透析____清除；HD患者初始剂量____mg每日口服，____周后复查血尿酸，一般最大剂量每日____mg，频繁痛风发作且严格控制饮食和加强透析仍不能控制者可提高至每日____mg。","a":"99.2；不能；10～20；2；40；60～80。","key":"非布司他不被透析清除，无需透后补充。","page":262},{"id":989,"chapter":"第28章 血液透析患者高尿酸血症的治疗","section":"二、血液透析患者高尿酸血症的治疗","roles":["医生"],"level":"高级","type":"案例分析","q":"男，66岁，HD 4年，糖尿病肾病，合并冠心病，痛风石形成，痛风每年发作3次，透前血尿酸560μmol/L，同时因自身免疫病服用硫唑嘌呤。请制订降尿酸方案。","a":"①属严重痛风（痛风石、每年发作≥2次），目标血尿酸＜300μmol/L；②禁用苯溴马隆等促排泄药；③服用硫唑嘌呤者禁用非布司他；别嘌醇亦增强硫唑嘌呤作用，使用时需充分注意；④若用别嘌醇，先查HLA-B*5801，阴性后每次透后100mg，每2～4周增加50mg；⑤非药物：低嘌呤饮食、戒酒，spKt/V＞1.4，透前HCO3-维持20～26mmol/L，保护残肾；⑥尿酸氧化酶在HD患者应用经验不足。","key":"非布司他与硫唑嘌呤/巯嘌呤/氨茶碱联用为禁忌，且有心血管血栓事件风险，合并冠心病更需谨慎。","page":262},{"id":990,"chapter":"第28章 血液透析患者高尿酸血症的治疗","section":"二、血液透析患者高尿酸血症的治疗","roles":["医生"],"level":"进阶","type":"简答","q":"生物合成尿酸氧化酶的作用机制是什么？包括哪些药物？在HD患者中应用现状如何？","a":"催化尿酸分解为尿囊素，快速降低血尿酸。包括：①重组黄曲霉菌尿酸氧化酶（拉布立海）；②聚乙二醇化重组尿酸氧化酶；③培戈洛酶。在HD患者中应用经验不足。","key":"属“促进尿酸分解”类，与抑制生成类（别嘌醇、非布司他）区分。","page":262},{"id":991,"chapter":"附录","section":"一、肾功能计算公式","roles":["医生"],"level":"进阶","type":"简答","q":"KDOQI推荐如何计算血液透析患者残肾功能？写出公式。","a":"以尿素清除率（CLUREA）计算残存肾尿素清除率（Kru）：CLUREA（ml/min）=[尿尿素（mg/dl）×尿量（ml）]/[尿量收集时间（min）×0.9×血清尿素（mg/dl）]。","key":"分母中的0.9系数常被遗漏。","page":265},{"id":992,"chapter":"附录","section":"二、透析充分性评估公式","roles":["医生","护士"],"level":"高级","type":"填空","q":"spKt/V=-ln[透后BUN/透前BUN-____×治疗时间（h）]+[____-____×透后BUN/透前BUN]×（透前体重-透后体重）/____。","a":"0.008；4；3.5；透后体重。","key":"分母是“透后体重”而非干体重；ln内减去0.008×t校正透析中尿素生成。","page":266},{"id":993,"chapter":"附录","section":"二、透析充分性评估公式","roles":["医生","护士"],"level":"进阶","type":"简答","q":"eKt/V如何根据血管通路类型由spKt/V计算？","a":"①动静脉内瘘：eKt/V=spKt/V×[1-0.6/治疗时间（h）]+0.03；②中心静脉置管：eKt/V=spKt/V×[1-0.47/治疗时间（h）]+0.02。","key":"内瘘用0.6和0.03，导管用0.47和0.02，系数易互换。","page":266},{"id":994,"chapter":"附录","section":"三、血液透析（滤过）治疗知情同意书","roles":["医生","护士"],"level":"基础","type":"简答","q":"血液透析（滤过）治疗知情同意书中告知的透析中及治疗间期医疗风险有哪些？","a":"①低血压、心力衰竭、心肌梗死、心律失常及脑血管意外等；②经血传播传染病（病毒性肝炎、梅毒、艾滋病等）及呼吸道感染或传染病；③透析器破膜、漏血，透析器及管路凝血；④空气栓塞；⑤失衡综合征和电解质酸碱紊乱；⑥溶血、发热；⑦消化道出血、脑出血；⑧肝功能异常；⑨过敏反应；⑩其他。","key":"同意书还需告知血管通路阻塞感染、抗凝出血风险及透析仅替代部分肾功能。","page":267},{"id":995,"chapter":"附录","section":"七、血液净化治疗患者传染病报告表单","roles":["医生","护士"],"level":"基础","type":"简答","q":"《血液净化治疗患者传染病报告表单》中列出的传染病类型有哪些？结核感染检查包括哪些项目？","a":"类型：乙型病毒性肝炎、丙型病毒性肝炎、HIV感染、梅毒、结核病、其他。结核检查：TST、IGRA（T-Spot或QFT-G）、痰涂片、痰培养、其他体液检查、组织学检查、影像学检查。","key":"表单还需记录透析器复用情况和输血史，二者是血源性感染溯源关键。","page":272},{"id":996,"chapter":"附录","section":"十一、血液透析中低血压防治标准操作规程","roles":["医生","护士"],"level":"基础","type":"简答","q":"透析中低血压一级防治方案包括哪些措施？","a":"①饮食管理（限盐）；②改善营养状态；③评估调整干体重；④透析中禁食；⑤采用碳酸氢盐透析液；⑥透析室温度＜24℃，透析液温度设定为36.5℃；⑦调整降压药物；⑧评估心功能，必要时强心治疗。","key":"“透析中禁食”和“室温＜24℃”常被忽略。","page":276},{"id":997,"chapter":"附录","section":"十一、血液透析中低血压防治标准操作规程","roles":["医生","护士","技师"],"level":"高级","type":"简答","q":"透析中低血压二级、三级防治方案分别包括哪些措施？","a":"二级（一级不理想）：①个体化血容量监测与反馈；②降低透析效率：血流量＜200ml/min、透析液流量＜350ml/min；③逐渐降低透析液温度，必要时降至34℃；④可调钠透析、序贯透析或血液滤过；⑤延长透析时间和/或增加频率；⑥采用1.5mmol/L或更高钙浓度透析液。三级（一、二级不理想）：①试用盐酸米多君；②试用左旋卡尼丁；③改为腹膜透析。","key":"二级方案的数值（200、350、34℃、1.5mmol/L）为高频填空点。","page":276},{"id":998,"chapter":"附录","section":"十一、血液透析中低血压防治标准操作规程","roles":["护士"],"level":"进阶","type":"案例分析","q":"女，68岁，HD中第3小时，血压由130/75mmHg降至82/50mmHg，伴打哈欠、出冷汗。护士应如何按规程紧急处置？","a":"①特伦德伦伯卧位（头低足高位），但疗效可能有限；②停止超滤；③输注一定量晶体或胶体液：首先用高渗葡萄糖、等渗或高渗盐水，晶体液无效可考虑胶体液；④上述无效的顽固性低血压，必要时多巴胺静脉注射；⑤事后评估干体重，按一、二级方案预防；持续性低血压需查找心包积液、淀粉样变性等原发病。","key":"第一步是停止超滤，不是先加快补液；头低足高位疗效有限不可依赖。","page":276},{"id":999,"chapter":"附录","section":"十三、血液透析技术医疗质量控制指标的计算公式","roles":["护士","技师"],"level":"基础","type":"填空","q":"血液透析治疗室消毒合格标准：空气平均菌落数≤____CFU/（5min·9cm直径平皿），物品表面平均菌落数≤____CFU/cm²；透析用水每月检验细菌菌落数≤____CFU/ml，每____个月检验内毒素≤____EU/ml，并符合____标准。","a":"4；10；100；3；0.25；YY 0572-2015《血液透析和相关治疗用水》。","key":"细菌每月、内毒素每3个月，频率不可颠倒。","page":278},{"id":1000,"chapter":"附录","section":"十三、血液透析技术医疗质量控制指标的计算公式","roles":["医生","护士","技师"],"level":"进阶","type":"简答","q":"附录列出的血液透析技术医疗质量控制指标中，与贫血、CKD-MBD和营养相关的指标有哪些？","a":"①血常规定时检验完成率；②血液生化定时检验完成率；③iPTH定时检验完成率；④血清铁蛋白和转铁蛋白饱和度定时检验完成率；⑤血清前白蛋白定时检测完成率；⑥CRP定时检测完成率；⑦肾性贫血控制率；⑧CKD-MBD指标控制率；⑨血清白蛋白控制率。","key":"质控指标分“检验完成率（过程）”和“控制率（结果）”两类，勿混淆。","page":280}];

function loadState(){
  try{
    const raw=localStorage.getItem(STORE_KEY)||localStorage.getItem('sopqa');
    const o=raw?JSON.parse(raw):{};
    return {m:o.m||{},role:o.role||'全部',f:o.f||{},streak:o.streak||0,lastDay:o.lastDay||'',theme:o.theme||'',totalOk:o.totalOk||0,installDismissed:o.installDismissed||false};
  }catch(e){return {m:{},role:'全部',f:{},streak:0,lastDay:'',theme:'',totalOk:0,installDismissed:false}}
}
function save(){try{localStorage.setItem(STORE_KEY,JSON.stringify(S))}catch(e){toast('存储空间不足')}}
function today(){const d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()}
function updateStreak(){
  const t=today();
  if(S.lastDay===t)return;
  const y=new Date();y.setDate(y.getDate()-1);
  const ys=y.getFullYear()+'-'+(y.getMonth()+1)+'-'+y.getDate();
  S.streak=(S.lastDay===ys)?(S.streak||0)+1:1;
  S.lastDay=t;save();
}
function toast(msg,ms=1800){
  const el=$('toast');el.textContent=msg;el.classList.add('show');

}
