  <div style="flex:1"><b>添加到主屏幕</b><div style="font-size:12px;opacity:.9;margin-top:2px">安装后可像 App 一样打开，支持离线刷题</div></div>
  <button onclick="doInstall()">安装</button>
  <button onclick="dismissInstall()" style="background:rgba(255,255,255,.25);color:#fff;margin-left:4px">×</button>
</div>`:''}
<div class="card">
  <div class="sec">我的岗位 ${offlineTag}</div>
  <div class="roles">${['医生','护士','技师','全部'].map(r=>`<div class="role ${S.role===r?'on':''}" onclick="S.role='${r}';save();goHome()">${r}</div>`).join('')}</div>
</div>
<div class="card">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
    <span class="sec" style="margin:0">学习进度</span>
    ${S.streak?`<span class="streak">🔥 连续${S.streak}天</span>`:''}
  </div>
  <div class="stat">
    <div><b>${P.length}</b><span>本岗题量</span></div>
    <div><b>${done}</b><span>已练习</span></div>
    <div><b>${ok}</b><span>已掌握</span></div>
    <div><b>${wrong}</b><span>错题</span></div>
  </div>
  <div class="bar" style="margin-top:12px"><i style="width:${pct}%"></i></div>
  <div class="tip" style="text-align:center">掌握率 ${pct}%</div>
</div>
<div class="menu">
  <button class="c1" onclick="daily()">📅 每日十题<small>优先错题与未做</small></button>
  <button class="c3" onclick="run(pool().filter(x=>S.m[x.id]===2),'错题本')">❌ 错题本<small>${wrong} 题待攻克</small></button>
  <button class="c2" onclick="showChapters()">📖 章节练习<small>29章系统刷</small></button>
  <button class="c4" onclick="startExam()">📝 模拟考核<small>随机50题计时</small></button>
  <button class="c5" onclick="run(shuf(pool().filter(x=>x.type==='案例分析')),'案例分析')">🩺 案例分析<small>临床情景题</small></button>
  <button class="c6" onclick="run(pool().filter(x=>S.f[x.id]),'我的收藏')">⭐ 我的收藏<small>${favN} 题</small></button>
</div>
<div class="card">
  <div class="sec">按难度练习</div>
  <div class="grid2">
    <div class="big" onclick="run(pool().filter(x=>x.level==='基础'),'基础题')">基础 · ${pool().filter(x=>x.level==='基础').length}</div>
    <div class="big" onclick="run(pool().filter(x=>x.level==='进阶'),'进阶题')">进阶 · ${pool().filter(x=>x.level==='进阶').length}</div>
    <div class="big" onclick="run(pool().filter(x=>x.level==='高级'),'高级题')">高级 · ${pool().filter(x=>x.level==='高级').length}</div>
    <div class="big" onclick="openCustom()">自定义练习</div>
  </div>
</div>
<div class="card">
  <div class="sec">更多</div>
  <div class="grid2">
    <div class="big" onclick="exportData()">导出进度</div>
    <div class="big" onclick="importData()">导入进度</div>
    <div class="big" onclick="if(confirm('确认清空全部练习记录？')){S.m={};S.totalOk=0;save();goHome();toast('已重置')}">重置记录</div>
    <div class="big" onclick="showAbout()">关于 / 安装</div>
  </div>
</div>
<div class="foot">依据：国家卫健委《血液净化标准操作规程（2021版）》<br>进度保存在本机 · 支持离线使用 · PWA 可安装到主屏幕</div>`;
}

function daily(){
  const P=pool();
  const w=shuf(P.filter(x=>S.m[x.id]===2));
  const n=shuf(P.filter(x=>!S.m[x.id]));
  const o=shuf(P.filter(x=>S.m[x.id]===1));
  let list=[...w.slice(0,4),...n.slice(0,5),...o.slice(0,1)];
  list=list.filter((x,i,a)=>a.findIndex(y=>y.id===x.id)===i).slice(0,10);
  if(list.length<10)list=list.concat(shuf(P).filter(x=>!list.find(y=>y.id===x.id))).slice(0,10);
  run(list,'每日十题');
}
function showChapters(){
  setHead('章节练习',true);
  const P=pool();
  app.innerHTML='<div class="card">'+CH.map((c,i)=>{
    const L=P.filter(x=>x.chapter===c);
    if(!L.length)return'';
    const ok=L.filter(x=>S.m[x.id]===1).length;
    const pct=Math.round(ok/L.length*100);
    return`<div class="ch" onclick="run(pool().filter(x=>x.chapter===CH[${i}]),'章节练习')">
      <div><div class="name">${esc(c)}</div><div class="bar"><i style="width:${pct}%"></i></div></div>
      <span style="font-size:12px;color:var(--muted);white-space:nowrap">${ok}/${L.length}</span>
    </div>`;
  }).join('')+'</div>';
}
function openCustom(){
  setHead('自定义练习',true);
  app.innerHTML=`
<div class="card">
  <div class="sec">题型</div>
  <div class="filters" id="ft">${['全部','简答','填空','判断','案例分析'].map((t,i)=>`<button class="${i===0?'on':''}" data-v="${t}" onclick="togFilter(this,'ft')">${t}</button>`).join('')}</div>
  <div class="sec">难度</div>
  <div class="filters" id="fl">${['全部','基础','进阶','高级'].map((t,i)=>`<button class="${i===0?'on':''}" data-v="${t}" onclick="togFilter(this,'fl')">${t}</button>`).join('')}</div>
  <div class="sec">数量</div>
  <input type="number" id="cn" value="20" min="5" max="100" style="margin-bottom:12px">
  <div class="btns"><button class="show" onclick="startCustom()">开始练习</button></div>
</div>`;
}
function togFilter(btn,gid){$(gid).querySelectorAll('button').forEach(b=>b.classList.remove('on'));btn.classList.add('on')}
function startCustom(){
  const type=$('ft').querySelector('.on').dataset.v;
  const level=$('fl').querySelector('.on').dataset.v;
  let n=Math.max(5,Math.min(100,parseInt($('cn').value)||20));
  let list=pool();
  if(type!=='全部')list=list.filter(x=>x.type===type);
  if(level!=='全部')list=list.filter(x=>x.level===level);
  if(!list.length){toast('没有符合条件的题目');return}
  run(shuf(list).slice(0,n),'自定义练习');
}
function startExam(){
  L=shuf(pool()).slice(0,50);k=0;T='模拟考核';
  EX={ok:0,start:Date.now(),wrong:[]};
  timerSec=0;$('timerEl').classList.remove('hid');
  tickTimer();timerId=setInterval(tickTimer,1000);showQ();
}
function tickTimer(){
  timerSec++;
  const m=String(Math.floor(timerSec/60)).padStart(2,'0');
  const s=String(timerSec%60).padStart(2,'0');
  $('timerEl').textContent=m+':'+s;
}
function stopTimer(){clearInterval(timerId);timerId=null;$('timerEl').classList.add('hid')}
function run(list,title){
  if(!list||!list.length){toast('这里还没有题目');return}
  stopTimer();L=list;k=0;T=title;EX=null;showQ();
}
function showQ(revealed){
  const x=L[k];setHead(T,true);
  const lv={基础:'',进阶:'l2',高级:'l3'}[x.level]||'';
  const isFav=!!S.f[x.id];
  app.innerHTML=`
<div class="nav"><span>${k+1} / ${L.length}</span>
<button class="fav" onclick="toggleFav(${x.id})">${isFav?'⭐':'☆'}</button></div>
<div class="card">
  <span class="tag">${esc(x.type)}</span><span class="tag ${lv}">${esc(x.level)}</span>
  ${x.roles.map(r=>`<span class="tag">${r}</span>`).join('')}
  <div class="q">${esc(x.q)}</div>
  ${revealed?`
    <div class="ans">${esc(x.a)}</div>
    ${x.key?`<div class="key">💡 ${esc(x.key)}</div>`:''}
    <div class="src">${esc(x.chapter)} · ${esc(x.section)}${x.page?` · 第${x.page}页`:''}</div>
    <div class="btns"><button class="no" onclick="mark(2)">不会</button><button class="yes" onclick="mark(1)">会了</button></div>
  `:`<div class="btns"><button class="show" onclick="showQ(1)">看答案</button></div>`}
</div>
<div class="btns">
  <button class="gray" onclick="if(k>0){k--;showQ()}">上一题</button>
  <button class="gray" onclick="nextQ()">下一题</button>
</div>`;
}
function toggleFav(id){
  if(S.f[id])delete S.f[id];else S.f[id]=1;save();
  showQ(!!document.querySelector('.ans'));
  toast(S.f[id]?'已收藏':'已取消收藏');
}
function mark(v){
  const id=L[k].id;const prev=S.m[id];S.m[id]=v;
  if(v===1&&prev!==1)S.totalOk=(S.totalOk||0)+1;
  if(EX){if(v===1)EX.ok++;else EX.wrong.push(L[k])}
  save();nextQ();
}
function nextQ(){if(k<L.length-1){k++;showQ()}else finish()}
function finish(){
  stopTimer();setHead(T,true);
  let html='<div class="card done-box"><div style="font-size:40px">🎉</div>';
  if(EX){
    const score=EX.ok*2;const m=Math.round((Date.now()-EX.start)/60000);
    html+=`<div class="score">${score} 分</div><div>答对 ${EX.ok}/50 · 用时约 ${m} 分钟</div>`;
    if(EX.wrong.length)html+=`<div class="btns" style="margin-top:16px"><button class="no" onclick="run(EX.wrong,'考核错题回顾')">回顾错题（${EX.wrong.length}）</button></div>`;
  }else html+=`<div class="q" style="margin-top:10px">本组 ${L.length} 题已完成</div>`;
  html+=`<div class="btns" style="margin-top:14px"><button class="show" onclick="goHome()">返回首页</button></div></div>`;
  app.innerHTML=html;updateStreak();
}
function openSearch(){
  setHead('搜索',true);
  app.innerHTML=`
<input type="search" id="kw" placeholder="关键词：内毒素、肝素、内瘘、Kt/V…" autofocus>
<div class="filters" style="margin-top:10px" id="st">
  <button class="on" data-v="全部" onclick="togFilter(this,'st')">全部</button>
  <button data-v="简答" onclick="togFilter(this,'st')">简答</button>
  <button data-v="填空" onclick="togFilter(this,'st')">填空</button>
  <button data-v="判断" onclick="togFilter(this,'st')">判断</button>
  <button data-v="案例分析" onclick="togFilter(this,'st')">案例</button>
</div>
<div id="res" style="margin-top:10px"></div>`;
  const doSearch=()=>{
    const w=$('kw').value.trim();
    const type=$('st').querySelector('.on').dataset.v;
    if(!w){$('res').innerHTML='';return}
    let R=QA.filter(x=>(x.q+x.a+(x.key||'')+x.section+x.chapter).includes(w));
    if(type!=='全部')R=R.filter(x=>x.type===type);
    R=R.slice(0,50);
    const hl=s=>esc(s).split(esc(w)).join('<mark>'+esc(w)+'</mark>');
    $('res').innerHTML=`<p class="tip">找到 ${R.length} 题${R.length===50?'（显示前50）':''}</p>`+
      R.map(x=>`<div class="card" style="cursor:pointer" onclick="run([QA.find(q=>q.id===${x.id})],'搜索结果')">
        <span class="tag">${esc(x.type)}</span><span class="tag">${esc(x.level)}</span>
        <div class="q" style="font-size:15.5px;margin:6px 0 8px">${hl(x.q)}</div>
        <div class="src">${esc(x.chapter)}${x.page?` · 第${x.page}页`:''}</div>
      </div>`).join('');
  };
  $('kw').oninput=doSearch;
  $('st').onclick=e=>{if(e.target.tagName==='BUTTON')setTimeout(doSearch,0)};
}
function exportData(){
  const data=JSON.stringify(S);
  const blob=new Blob([data],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);a.download='血液净化SOP进度备份.json';a.click();
  if(navigator.clipboard)navigator.clipboard.writeText(data).then(()=>toast('进度已复制到剪贴板')).catch(()=>toast('已触发下载'));
  else toast('已触发下载');
}
function importData(){
  const raw=prompt('请粘贴之前导出的进度JSON：');
  if(!raw)return;
  try{const o=JSON.parse(raw);if(!o.m)throw 0;S={...S,...o};save();goHome();toast('导入成功')}
  catch(e){toast('格式不正确')}
}
function showAbout(){
  setHead('关于 / 安装',true);
  const installed=isStandalone();
  app.innerHTML=`
<div class="card">
  <div class="q" style="font-size:17px">血液净化SOP应知应会1000题</div>
  <p style="font-size:14px;line-height:1.7;color:var(--muted)">
    依据国家卫生健康委《血液净化标准操作规程（2021版）》整理。<br><br>
    支持岗位筛选、章节练习、错题本、每日十题、模拟考核、案例分析、收藏与搜索。<br><br>
    <b>PWA 安装说明</b><br>
    ${installed?'✅ 当前已是安装版（独立窗口运行）':'• Android Chrome：浏览器菜单 → 添加到主屏幕<br>• iOS Safari：分享按钮 → 添加到主屏幕<br>• 安装后可全屏使用，并支持离线刷题'}
    <br><br>
    进度保存在本机，建议定期「导出进度」备份。<br>
    本工具仅供学习参考，请以正式出版的规程原文为准。
  </p>
  ${!installed&&deferredPrompt?`<div class="btns"><button class="show" onclick="doInstall()">立即安装到主屏幕</button></div>`:''}
  <div class="btns" style="margin-top:10px"><button class="gray" onclick="goHome()">返回</button></div>
</div>`;
}

document.addEventListener('keydown',e=>{
  if(!L.length||document.activeElement.tagName==='INPUT')return;
  if(e.key==='ArrowRight'||e.key==='n'){e.preventDefault();nextQ()}
  if(e.key==='ArrowLeft'||e.key==='p'){e.preventDefault();if(k>0){k--;showQ()}}
  if(e.key===' '||e.key==='Enter'){e.preventDefault();if(!document.querySelector('.ans'))showQ(1)}
  if(e.key==='1'&&document.querySelector('.ans'))mark(1);
  if(e.key==='2'&&document.querySelector('.ans'))mark(2);
});
window.addEventListener('online',()=>toast('网络已恢复'));
window.addEventListener('offline',()=>toast('已进入离线模式'));

// Register Service Worker
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('./sw.js').then(()=>console.log('SW ok')).catch(e=>console.warn('SW fail',e));
}

goHome();
</script>
</body>
</html>
