放手术。","key":"Ⅲ级处理的阶梯：阻断供血→球囊堵压→覆膜支架。","page":102},{"id":490,"chapter":"第9章 血管通路的建立与管理","section":"第5节 血管通路的介入治疗 七、并发症与处理","roles":["医生"],"level":"基础","type":"简答","q":"中心静脉腔内介入治疗有哪些特殊并发症？内瘘介入的远期并发症有哪些、如何处理？","a":"①中心静脉介入并发症：血管穿孔引起的血胸、纵隔血肿、心脏压塞等，必要时外科开放手术处理；②远期并发症：血管再狭窄，放置支架者发生支架内再狭窄、支架内再闭塞和支架移位；③依据全身和血管状态评估，可再次腔内介入治疗或重新手术建立动静脉内瘘。","key":"中心静脉介入穿孔后果严重，需具备外科后援。","page":102},{"id":491,"chapter":"第10章 血液净化的抗凝治疗","section":"概述","roles":["医生","护士"],"level":"基础","type":"简答","q":"血液净化抗凝治疗的目的有哪些？","a":"①维持血液在透析管路和透析器中的流动状态，保证血液净化顺利实施；②避免体外循环凝血而引起血液丢失；③预防因体外循环引起血液凝血活化所诱发的血栓栓塞性疾病；④防止体外循环过程中血液活化所诱发的炎症反应，提高血液净化的生物相容性，保障有效性和安全性。","key":"抗凝治疗的前提是“在评估患者凝血状态的基础上个体化选择抗凝剂和剂量，并定期监测、评估和调整”，而非固定剂量。","page":103},{"id":492,"chapter":"第10章 血液净化的抗凝治疗","section":"一、评估治疗前患者的凝血状态","roles":["医生"],"level":"基础","type":"简答","q":"治疗前评估患者出血性疾病发生风险时，应关注哪些情况？","a":"①血友病等遗传性出血性疾病；②长期使用华法林等抗凝血药物或抗血小板药物；③既往存在支气管扩张、消化道溃疡、肝硬化、痔疮等潜在出血风险的疾病；④严重创伤或围手术期。","key":"痔疮、支气管扩张等“潜在出血”疾病常被忽视，问诊须包括长期服用的华法林/抗血小板药。","page":103},{"id":493,"chapter":"第10章 血液净化的抗凝治疗","section":"一、评估治疗前患者的凝血状态","roles":["医生"],"level":"基础","type":"简答","q":"哪些情况提示患者临床上存在血栓栓塞性疾病发生风险？","a":"①糖尿病、系统性红斑狼疮、系统性血管炎等伴血管内皮细胞损伤的基础疾病；②既往静脉血栓、脑血栓、动脉栓塞、心肌梗死等血栓栓塞性疾病；③有效循环血容量不足，低血压；④长期卧床；⑤先天性抗凝血酶缺乏或合并大量蛋白尿导致抗凝血酶从尿中丢失过多；⑥合并严重创伤、外科手术、急性感染。","key":"严重创伤/手术既是出血风险也是血栓风险，需双向评估；大量蛋白尿致抗凝血酶丢失是肝素抵抗的常见原因。","page":104},{"id":494,"chapter":"第10章 血液净化的抗凝治疗","section":"一、评估治疗前患者的凝血状态","roles":["医生","护士"],"level":"基础","type":"填空","q":"外源性凝血系统状态选择性检测____或____；内源性凝血系统状态选择性检测____或____。","a":"PT（凝血酶原时间）或INR（国际标准化比值）；APTT（活化部分凝血活酶时间）或ACT（活化凝血时间）。","key":"外源→PT/INR，内源→APTT/ACT，考核中常互换出错。","page":104},{"id":495,"chapter":"第10章 血液净化的抗凝治疗","section":"一、评估治疗前患者的凝血状态","roles":["医生"],"level":"进阶","type":"判断","q":"PT缩短和INR减少提示外源性凝血系统的凝血因子存在数量或质量的异常，易于出血。（对/错？）","a":"错。PT延长和INR增加才提示外源性凝血因子数量或质量异常或血中存在抗凝物质；PT缩短和INR减少提示外源性凝血系统活化，易于凝血、发生血栓栓塞性疾病。","key":"延长=因子异常/抗凝物质；缩短=活化/高凝，方向不能记反。","page":104},{"id":496,"chapter":"第10章 血液净化的抗凝治疗","section":"一、评估治疗前患者的凝血状态","roles":["医生"],"level":"高级","type":"简答","q":"若患者外源、内源凝血指标均延长，下一步应检测什么？结果如何解读？若各项指标均缩短又提示什么？","a":"①均延长提示凝血共同途径异常或血中存在抗凝物质，应检测纤维蛋白原（FIB）和凝血酶时间（TT）；②TT延长而FIB水平正常，提示血中存在抗凝物质或FIB功能异常；③外源、内源和共同途径各项指标均缩短，提示患者易于发生血栓栓塞性疾病（高危状态）。","key":"“TT延长+FIB正常”指向抗凝物质或FIB功能异常，而非FIB数量不足。","page":104},{"id":497,"chapter":"第10章 血液净化的抗凝治疗","section":"一、评估治疗前患者的凝血状态","roles":["医生"],"level":"进阶","type":"简答","q":"如何初步评估血小板活性状态？血小板进行性降低时推荐做何检查？","a":"①检测全血血小板计数和出血时间（BT）：血小板减少伴BT延长提示止血功能异常、易出血；血小板增多伴BT缩短提示易发生黏附、集聚和释放反应，易产生血小板性血栓；②单位时间内血小板进行性降低者，推荐检测血浆GMP-140（P选择素）或血中GMP-140阳性血小板数量，明确是否存在血小板活化；③不能检测上述2项时，伴血浆D-二聚体升高也提示血小板活化。","key":"血小板进行性下降不一定是消耗不足，需排查血小板活化（GMP-140/D-二聚体）。","page":104},{"id":498,"chapter":"第10章 血液净化的抗凝治疗","section":"二、抗凝剂的使用禁忌","roles":["医生"],"level":"基础","type":"简答","q":"肝素或低分子量肝素的使用禁忌有哪些？","a":"①既往存在肝素或低分子量肝素过敏史；②既往诊断过肝素诱发的血小板减少症（HIT）；③合并明显的出血性疾病；④有条件的单位推荐检测血浆抗凝血酶活性，＜50%者不宜直接选择肝素或低分子量肝素。","key":"既往HIT史同样是低分子量肝素的禁忌，不能以“改用低分子肝素”替代。","page":105},{"id":499,"chapter":"第10章 血液净化的抗凝治疗","section":"二、抗凝剂的使用禁忌","roles":["医生"],"level":"进阶","type":"填空","q":"血浆抗凝血酶活性＜____%的患者不宜直接选择肝素或低分子量肝素，应适当补充____或____，使活性≥____%后再使用。","a":"50；抗凝血酶制剂；新鲜血浆；50。","key":"抗凝血酶活性50%是肝素类药物能否起效的分界线，也是抗凝剂选择的核心阈值。","page":105},{"id":500,"chapter":"第10章 血液净化的抗凝治疗","section":"二、抗凝剂的使用禁忌","roles":["医生"],"level":"基础","type":"简答","q":"枸橼酸钠抗凝的使用禁忌有哪些？","a":"①严重肝功能障碍；②低氧血症（动脉氧分压＜60mmHg）和/或组织灌注不足；③代谢性碱中毒、高钠血症。","key":"枸橼酸需肝脏有氧代谢，低氧和灌注不足同样会致蓄积，不只是肝衰。","page":105},{"id":501,"chapter":"第10章 血液净化的抗凝治疗","section":"二、抗凝剂的使用禁忌","roles":["医生"],"level":"进阶","type":"判断","q":"合并明显肝功能障碍的HIT患者，首选阿加曲班作为血液净化抗凝剂。（对/错？）","a":"错。合并明显肝功能障碍时不宜选择阿加曲班（且严重肝功能障碍也是枸橼酸钠的禁忌），需综合评估，必要时采用无抗凝剂方式。","key":"阿加曲班经肝代谢，HIT合并肝功能障碍是抗凝选择难点。","page":105},{"id":502,"chapter":"第10章 血液净化的抗凝治疗","section":"二、抗凝剂的使用禁忌","roles":["医生"],"level":"进阶","type":"简答","q":"抗血小板药物的使用原则（禁忌与加强指征）是什么？","a":"①存在血小板生成障碍或功能障碍的患者，不宜使用抗血小板药物；②血小板进行性减少、伴血小板活化或凝血功能亢进的患者，则应加强抗血小板治疗。","key":"血小板“进行性减少”伴活化时反而要加强抗血小板，与直觉相反，易考易错。","page":105},{"id":503,"chapter":"第10章 血液净化的抗凝治疗","section":"三、抗凝剂的合理选择","roles":["医生"],"level":"基础","type":"简答","q":"哪类患者推荐选择普通肝素作为抗凝药物？","a":"临床上没有出血性疾病的发生和风险；没有显著的脂代谢和骨代谢异常；血浆抗凝血酶活性在50%以上；血小板计数、APTT、PT、INR、D-二聚体正常或轻度异常的患者。","key":"普通肝素的前提包括“无显著脂代谢和骨代谢异常”，否则倾向低分子量肝素。","page":105},{"id":504,"chapter":"第10章 血液净化的抗凝治疗","section":"三、抗凝剂的合理选择","roles":["医生"],"level":"进阶","type":"简答","q":"哪类患者推荐选择低分子量肝素作为抗凝药物？","a":"临床上没有活动性出血性疾病，血浆抗凝血酶活性在50%以上，血小板数量基本正常；但脂代谢和骨代谢异常程度较重，或APTT、PT延长和INR增加具有潜在出血风险的患者。","key":"低分子量肝素适用于“潜在出血风险”，而“活动性出血/明显出血倾向”应选阿加曲班、枸橼酸钠或无抗凝剂。","page":105},{"id":505,"chapter":"第10章 血液净化的抗凝治疗","section":"三、抗凝剂的合理选择","roles":["医生"],"level":"进阶","type":"判断","q":"实施CRRT的患者无论是否合并出血性疾病均可采用枸橼酸抗凝，因此合并血液高凝状态的CRRT患者也应首选枸橼酸抗凝。（对/错？）","a":"错。CRRT患者无论是否合并出血均可用枸橼酸抗凝，但合并血液高凝状态和/或血栓栓塞性疾病高危因素者，建议采用普通肝素或低分子量肝素。","key":"枸橼酸为局部抗凝，对体内高凝/血栓无预防作用。","page":106},{"id":506,"chapter":"第10章 血液净化的抗凝治疗","section":"三、抗凝剂的合理选择","roles":["医生"],"level":"高级","type":"简答","q":"哪些患者推荐每天给予抗血小板药物或低分子量肝素作为“基础治疗”？","a":"①以糖尿病肾病、高血压性肾损害等为原发病，心血管事件风险较大，而血小板数量正常或升高、功能正常或亢进者，推荐每天给予抗血小板药物；②长期卧床具有血栓栓塞风险，INR较低、血浆D-二聚体水平升高、血浆抗凝血酶活性在50%以上者，推荐每天给予低分子量肝素。","key":"“基础治疗”是透析间期每日用药，区别于透析中的体外循环抗凝。","page":106},{"id":507,"chapter":"第10章 血液净化的抗凝治疗","section":"三、抗凝剂的合理选择","roles":["医生"],"level":"进阶","type":"案例分析","q":"女，45岁，消化道溃疡活动性出血，APTT、PT明显延长，INR显著增加，急需血液透析。抗凝方案如何选择？","a":"①属明确活动性出血且APTT、PT明显延长、INR显著增加，推荐阿加曲班、枸橼酸钠作为抗凝药物，或采用无抗凝剂方式；②有条件实施枸橼酸钠或阿加曲班时应尽可能避免无抗凝剂方案；③若选无抗凝剂，应加强滤器和管路监测，每30～60min用100～200ml生理盐水冲洗。","key":"活动性出血不等于只能无肝素透析，优先局部枸橼酸或阿加曲班。","page":106},{"id":508,"chapter":"第10章 血液净化的抗凝治疗","section":"三、抗凝剂的合理选择","roles":["医生"],"level":"高级","type":"案例分析","q":"男，36岁，肾病综合征大量蛋白尿致急性肾损伤，需血液透析。查血浆抗凝血酶活性40%，无出血。抗凝如何处理？","a":"①抗凝血酶活性＜50%，不宜直接选择普通肝素或低分子量肝素；②可适当补充抗凝血酶制剂或新鲜血浆，使活性≥50%后再用肝素类；③或推荐选择阿加曲班或枸橼酸钠（后天性抗凝血酶活性在50%以下者）；④此类患者也是抗凝不足致透析器和管路凝血的常见原因。","key":"大量蛋白尿致抗凝血酶丢失既增加血栓风险又导致肝素无效，易被误判为“肝素剂量不足”而盲目加量。","page":106},{"id":509,"chapter":"第10章 血液净化的抗凝治疗","section":"四、抗凝剂剂量的选择","roles":["医生","护士"],"level":"基础","type":"填空","q":"血液透析/血液滤过/血液透析滤过使用普通肝素：一般首剂量____U/kg（____mg/kg），追加剂量____U/h（____mg/h），血液透析结束前____min停止追加。","a":"37.5～62.5；0.3～0.5；625～1250；5～10；30～60。","key":"1mg普通肝素=125U，单位换算常错；停追加时间HD为30～60min。","page":106},{"id":510,"chapter":"第10章 血液净化的抗凝治疗","section":"四、抗凝剂剂量的选择","roles":["医生","护士"],"level":"进阶","type":"简答","q":"血液灌流、血浆吸附或血浆置换使用普通肝素的剂量及预冲方法？","a":"①首剂量62.5～125U/kg（0.5～1.0mg/kg）；②追加剂量1250～2500U/h（10～20mg/h），间歇性静注或持续性滤器前静脉输注（常用）；③预期结束前30min停止追加；④实施前给予500U/dl（4mg/dl）肝素生理盐水预冲、保留20min后，再给予生理盐水500ml冲洗，有助于增强抗凝效果；⑤依据凝血状态个体化调整。","key":"灌流/吸附剂量约为HD的2倍，停追加时间为30min（HD为30～60min）。","page":106},{"id":511,"chapter":"第10章 血液净化的抗凝治疗","section":"四、抗凝剂剂量的选择","roles":["医生"],"level":"高级","type":"简答","q":"CRRT采用普通肝素抗凝时，前稀释与后稀释的剂量分别是多少？","a":"①前稀释：首剂量1875～2500U（15～20mg），追加625～1250U/h（5～10mg/h），静注或持续滤器前输注（常用）；②后稀释：首剂量2500～3750U（20～30mg），追加1000～1875U/h（8～15mg/h），静注或持续静脉输注（常用）；③治疗结束前30～60min停止追加；④治疗时间越长，追加剂量应逐渐减少。","key":"后稀释血液浓缩、滤器更易凝血，剂量高于前稀释；CRRT首剂量以固定总量（U）表示而非U/kg。","page":106},{"id":512,"chapter":"第10章 血液净化的抗凝治疗","section":"四、抗凝剂剂量的选择","roles":["医生","护士"],"level":"基础","type":"填空","q":"低分子量肝素一般给予____IU/kg静脉注射；血液透析、灌流、血浆吸附或置换____追加；CRRT患者可每____h给予____IU/kg静脉注射。","a":"60～80；无需；4～6；30～40。","key":"有条件应监测血浆抗Xa活性调整剂量；CRRT治疗越长追加量应逐渐减少。","page":107},{"id":513,"chapter":"第10章 血液净化的抗凝治疗","section":"四、抗凝剂剂量的选择","roles":["医生","护士","技师"],"level":"高级","type":"简答","q":"以4%枸橼酸钠为例，使用无钙透析液/置换液时局部枸橼酸抗凝的方案及控制目标是什么？","a":"①4%枸橼酸钠180ml/h滤器前持续注入，控制滤器后游离钙离子浓度0.25～0.35mmol/L；②静脉端给予氯化钙生理盐水（10%氯化钙80ml加入1000ml生理盐水）40ml/h，或10%葡萄糖酸钙25～30ml/h，控制患者体内游离钙离子1.0～1.35mmol/L；③直至治疗结束；④需考虑患者实际血流量，并依据游离钙检测调整枸橼酸钠和钙剂输入速度。","key":"枸橼酸浓度范围为4%～46.7%，高浓度制剂速率完全不同，严禁照搬180ml/h。","page":107},{"id":514,"chapter":"第10章 血液净化的抗凝治疗","section":"四、抗凝剂剂量的选择","roles":["医生","护士"],"level":"进阶","type":"判断","q":"采用枸橼酸透析液/置换液或含钙透析液/置换液进行局部枸橼酸抗凝时，无需将体外循环游离钙控制在0.25～0.35mmol/L。（对/错？）","a":"错。无论采用何种透析液/置换液，均应控制体外循环游离钙在0.25～0.35mmol/L，否则达不到抗凝作用；体内游离钙1.0～1.35mmol/L，否则增加出血风险。","key":"两个靶值：体外0.25～0.35（抗凝有效），体内1.0～1.35（安全）。","page":107},{"id":515,"chapter":"第10章 血液净化的抗凝治疗","section":"四、抗凝剂剂量的选择","roles":["医生","护士"],"level":"高级","type":"案例分析","q":"CRRT患者采用局部枸橼酸抗凝第2天，从管路动脉端采血测总钙/游离钙（TCa/iCa）为2.8。如何判断与处理？","a":"①TCa/iCa＞2.5提示机体不能及时充分代谢枸橼酸盐（枸橼酸蓄积）；②应减少枸橼酸钠输入剂量或停止治疗；③同时密切监测游离钙，调整枸橼酸钠和钙剂输入速度；④排查肝功能障碍、低氧血症或组织灌注不足等禁忌因素；⑤必要时改变抗凝方式。","key":"TCa/iCa应从管路动脉端或患者静脉采血，而非滤器后；阈值是＞2.5。","page":107},{"id":516,"chapter":"第10章 血液净化的抗凝治疗","section":"四、抗凝剂剂量的选择","roles":["医生"],"level":"高级","type":"简答","q":"为什么单纯血液灌流、单纯血浆吸附或双重血浆置换不宜采用枸橼酸钠抗凝？","a":"使用1mmol枸橼酸盐抗凝，最终体内将增加3mmol钠、1.5mmol钙和3mmol碳酸氢根；上述治疗无透析/置换液清除这些负荷，故不宜采用枸橼酸钠抗凝。","key":"枸橼酸钠适用于HD、HF、HDF或CRRT，单纯吸附/灌流类不宜。","page":107},{"id":517,"chapter":"第10章 血液净化的抗凝治疗","section":"四、抗凝剂剂量的选择","roles":["医生","护士"],"level":"进阶","type":"填空","q":"阿加曲班用于HD/HF/HDF或CRRT：一般首剂量____μg/kg、追加剂量____μg/（kg·min）；CRRT给予____μg/（kg·min）持续滤器前输注；治疗结束前____min停止追加；依据____监测调整。","a":"250；2；1～2；20～30；血浆APTT。","key":"阿加曲班停追加时间20～30min，短于肝素的30～60min。","page":107},{"id":518,"chapter":"第10章 血液净化的抗凝治疗","section":"四、抗凝剂剂量的选择","roles":["护士"],"level":"基础","type":"简答","q":"无抗凝剂血液净化的操作方法是什么？","a":"①无肝素类药物禁忌者：实施前给予500U/dl（4mg/dl）肝素生理盐水预冲、保留20min后，再给予生理盐水500ml冲洗；②存在肝素类药物禁忌者：仅用生理盐水充分冲洗；③治疗过程中每30～60min给予100～200ml生理盐水冲洗管路和滤器；④有条件实施枸橼酸钠或阿加曲班抗凝时，应尽可能避免无抗凝剂方案。","key":"HIT等肝素禁忌者连肝素预冲也不能用，只能生理盐水冲洗。","page":108},{"id":519,"chapter":"第10章 血液净化的抗凝治疗","section":"五、抗凝治疗的监测","roles":["医生","护士"],"level":"进阶","type":"简答","q":"血液净化前和结束后凝血状态监测的目的分别是什么？应从何处采血？","a":"①治疗前：评估基础凝血状态，指导抗凝剂种类和剂量选择；②结束后：了解体内凝血状态是否恢复正常、是否有出血倾向，评估抗凝方案的安全性；③二者均为全身凝血状态监测，需从血液净化管路动脉端或患者外周静脉采血。","key":"结束后监测反映安全性，不应从静脉端采血。","page":108},{"id":520,"chapter":"第10章 血液净化的抗凝治疗","section":"五、抗凝治疗的监测","roles":["医生","护士"],"level":"进阶","type":"判断","q":"血液净化过程中，从管路静脉端采集的血样凝血指标反映患者全身凝血状态，用于评估抗凝方案的安全性。（对/错？）","a":"错。静脉端样本血液刚流过体外循环，反映体外循环凝血状态，评估有效性；动脉端样本血液刚从体内流出，反映全身凝血状态，评估安全性。治疗过程中需同时采集动、静脉端血样，两者结合判断。","key":"口诀：静脉端看“有效”，动脉端看“安全”。","page":108},{"id":521,"chapter":"第10章 血液净化的抗凝治疗","section":"五、抗凝治疗的监测","roles":["医生","护士"],"level":"基础","type":"填空","q":"以肝素作为抗凝剂时，推荐采用____监测，也可采用____；治疗中管路静脉端样本应维持于治疗前的____倍，治疗结束后管路动脉端样本应____。","a":"ACT；APTT；1.5～2.5；基本恢复治疗前水平。","key":"目标倍数1.5～2.5倍适用于肝素、枸橼酸和阿加曲班的静脉端监测。","page":109},{"id":522,"chapter":"第10章 血液净化的抗凝治疗","section":"五、抗凝治疗的监测","roles":["医生"],"level":"进阶","type":"填空","q":"以低分子量肝素抗凝时可监测抗凝血因子Xa活性：无出血倾向者维持在____U/L，伴出血倾向的血液透析患者维持在____U/L。","a":"500～1000；200～400。","key":"抗Xa活性不能即时检测，临床指导作用有限。","page":109},{"id":523,"chapter":"第10章 血液净化的抗凝治疗","section":"五、抗凝治疗的监测","roles":["医生","护士"],"level":"进阶","type":"简答","q":"以枸橼酸钠或阿加曲班作为抗凝剂时，监测指标和目标分别是什么？","a":"①枸橼酸钠：监测滤器后和患者体内游离钙离子浓度；也可监测ACT或APTT，静脉端样本维持于治疗前1.5～2.5倍，治疗中和结束后动脉端样本应与治疗前无明显变化；②阿加曲班：采用APTT监测，静脉端维持于治疗前1.5～2.5倍，动脉端治疗中和结束后应与治疗前无明显变化。","key":"局部抗凝的特征是动脉端（体内）指标与治疗前无明显变化，不同于肝素结束后“基本恢复”。","page":109},{"id":524,"chapter":"第10章 血液净化的抗凝治疗","section":"五、抗凝治疗的监测","roles":["医生","护士"],"level":"基础","type":"简答","q":"抗凝治疗的凝血监测时机如何安排？","a":"①第一次进行血液净化的患者，推荐治疗前、治疗过程中和结束后全面凝血状态监测，以确立合适的抗凝剂种类和剂量；②一旦确定抗凝药物种类和剂量，无需每次监测，仅需定期（1～3个月）评估。","key":"稳定患者定期评估频率为1～3个月。","page":109},{"id":525,"chapter":"第10章 血液净化的抗凝治疗","section":"六、抗凝治疗的并发症与处理","roles":["医生","护士"],"level":"基础","type":"简答","q":"抗凝不足引起的并发症、常见原因及预防处理要点？","a":"并发症：透析器和管路凝血，透析中或结束后血栓栓塞性疾病。原因：①有出血倾向而未用抗凝剂；②抗凝剂剂量不足；③先天性或大量蛋白尿致抗凝血酶不足/缺乏而选用肝素类。预防处理：①出血或高危者有条件尽可能选枸橼酸钠或阿加曲班，无抗凝剂时加强滤器管路监测和生理盐水冲洗；②治疗前充分评估并据治疗中监测确立个体化方案；③有条件治疗前检测抗凝血酶活性；④滤器凝血及时更换滤器，血栓栓塞并发症给予适当抗凝、促纤溶治疗。","key":"抗凝血酶缺乏是“肝素加量也无效”的隐蔽原因。","page":109},{"id":526,"chapter":"第10章 血液净化的抗凝治疗","section":"六、抗凝治疗的并发症与处理","roles":["医生","护士"],"level":"基础","type":"简答","q":"抗凝相关出血的常见原因及预防处理？","a":"原因：①抗凝剂剂量过大；②合并出血性疾病。预防处理：①治疗前评估出血风险；②基于透前和透中凝血检测确立个体化方案；③发生出血者重新评估凝血状态，停止或减少抗凝药剂量，重新选择抗凝药物及剂量；④针对病因处理，并给予相应拮抗剂。","key":"出血后需“重新评估、重新选择”，不仅是减量。","page":110},{"id":527,"chapter":"第10章 血液净化的抗凝治疗","section":"六、抗凝治疗的并发症与处理","roles":["医生","护士"],"level":"基础","type":"填空","q":"抗凝剂过量的拮抗：肝素或低分子量肝素过量可给予适量____；枸橼酸钠过量可补充____；阿加曲班过量可____，严重过量可给予____或____。","a":"鱼精蛋白；钙制剂；短暂观察；凝血酶原制剂；血浆。","key":"阿加曲班无特异拮抗剂，先短暂观察。","page":110},{"id":528,"chapter":"第10章 血液净化的抗凝治疗","section":"六、抗凝治疗的并发症与处理","roles":["医生"],"level":"高级","type":"简答","q":"肝素诱发的血小板减少症（HIT）的病因、诊断标准及治疗原则？","a":"①病因：机体产生抗肝素-血小板4因子复合物抗体（HIT抗体）；②诊断：应用肝素类制剂后5～10d内血小板下降50%以上或降至10万/μl以下，合并血栓、栓塞性疾病（深静脉最常见），以及HIT抗体阳性可临床诊断；停用肝素5～7d后血小板恢复正常更支持诊断；③治疗：停用肝素类制剂，给予抗血小板、抗凝或促纤溶治疗预防血栓；发生HIT后一般禁止再使用肝素类制剂。","key":"HIT以血栓而非出血为主要危害，深静脉血栓最常见。","page":110},{"id":529,"chapter":"第10章 血液净化的抗凝治疗","section":"六、抗凝治疗的并发症与处理","roles":["医生"],"level":"高级","type":"案例分析","q":"男，62岁，新入透析，使用普通肝素抗凝。第8天血小板由210×10⁹/L降至80×10⁹/L，同时出现左下肢肿胀，超声示深静脉血栓。应如何考虑和处理？","a":"①应用肝素类5～10d内血小板下降50%以上并合并深静脉血栓，高度怀疑HIT，应检测HIT抗体；②立即停用一切肝素类制剂（含肝素封管、预冲）；③给予抗血小板、抗凝或促纤溶治疗预防血栓；④后续透析改用阿加曲班或枸橼酸钠抗凝；⑤停肝素5～7d后血小板恢复正常更支持诊断；⑥此后一般禁止再用肝素类，100d内再用可诱发急发性HIT。","key":"不可因血小板减少就输注血小板或停止一切抗凝，HIT本质是高凝。","page":110},{"id":530,"chapter":"第10章 血液净化的抗凝治疗","section":"六、抗凝治疗的并发症与处理","roles":["医生"],"level":"高级","type":"判断","q":"HIT患者血小板恢复正常后，即使在HIT发生后100d内，也可安全地改用低分子量肝素抗凝。（对/错？）","a":"错。发生HIT后一般禁止再使用肝素类制剂；HIT发生后100d内再次应用肝素或低分子量肝素可诱发伴有全身过敏反应的急发性HIT。","key":"低分子量肝素与普通肝素存在交叉反应，“100d”是常考数字。","page":111},{"id":531,"chapter":"第10章 血液净化的抗凝治疗","section":"六、抗凝治疗的并发症与处理","roles":["医生","护士"],"level":"进阶","type":"简答","q":"枸橼酸钠抗凝引起低钙血症、高钠血症和代谢性碱中毒的原因及预防处理？","a":"①原因：枸橼酸钠剂量过大或时间过长，或存在电解质和酸碱失衡，或存在肝脏、肺脏功能异常；②预防处理：采用无碱、低钠的置换液；治疗中密切监测游离钙，调整枸橼酸钠和钙剂输入速度与剂量；发生后应改变抗凝方式，调整透析液和置换液成分，积极纠正。","key":"置换液要“无碱、低钠”，因枸橼酸代谢本身产生钠和碳酸氢根。","page":111},{"id":532,"chapter":"第10章 血液净化的抗凝治疗","section":"附：无隧道无涤纶套/带隧道带涤纶套中心静脉导管的抗凝方案","roles":["医生","护士"],"level":"基础","type":"简答","q":"中心静脉导管封管常用的抗凝方案（枸橼酸钠与肝素）及其适用条件？","a":"①无枸橼酸盐使用禁忌者，无论是否合并活动性出血或高危出血风险，可采用4%枸橼酸钠溶液封管；②无肝素使用禁忌且无严重出血者，可采用1000U/ml浓度的肝素溶液封管。","key":"肝素封管浓度为1000U/ml；出血患者封管首选4%枸橼酸钠。","page":111},{"id":533,"chapter":"第10章 血液净化的抗凝治疗","section":"附：无隧道无涤纶套/带隧道带涤纶套中心静脉导管的抗凝方案","roles":["医生","护士"],"level":"进阶","type":"填空","q":"合并导管内血栓形成，建议每周____次使用____mg rtPA溶液封管；难以应用rtPA时可采用____万单位尿激酶溶液封管或____万单位尿激酶静脉注射。","a":"1；1；10；20～30。","key":"尿激酶封管10万单位，静脉注射20万～30万单位，勿混淆。","page":111},{"id":534,"chapter":"第10章 血液净化的抗凝治疗","section":"附：无隧道无涤纶套/带隧道带涤纶套中心静脉导管的抗凝方案","roles":["医生","护士"],"level":"进阶","type":"案例分析","q":"带隧道带涤纶套导管患者发生导管相关感染，需在导管内使用抗菌药物封管，且有明显高凝倾向。基础抗凝如何选择？","a":"①导管内使用抗菌药物时，推荐以4%枸橼酸钠作为基础抗凝药物；②若使用肝素溶液作为基础抗凝药物，必须注意肝素与抗菌药物之间是否存在配伍禁忌；③血液高凝或血栓栓塞高风险者，除外药物禁忌后，推荐给予抗血小板药物或低分子量肝素作为基础治疗。","key":"抗菌药封管与肝素配伍禁忌是易忽视的风险点。","page":111},{"id":535,"chapter":"第11章 血液透析","section":"一、定义及概述","roles":["医生","护士","技师"],"level":"基础","type":"简答","q":"血液透析的定义及主要应用范围？","a":"血液透析（HD）采用弥散和对流原理清除血液中代谢废物、有害物质和过多水分，是终末期肾脏病患者最常用的肾脏替代治疗方法之一，也可用于治疗药物或毒物中毒等。","key":"原理是“弥散和对流”，不只是弥散。","page":114},{"id":536,"chapter":"第11章 血液透析","section":"二、适应证及禁忌证","roles":["医生"],"level":"基础","type":"判断","q":"患者是否需要血液透析治疗由有资质的肾脏专科医师决定，患者本人没有最终决定权。（对/错？）","a":"错。是否需要血液透析应由有资质的肾脏专科医师决定，但患者具有最终决定权；肾脏专科医师负责患者的筛选、治疗方案的确定等。","key":"患者知情同意并签署知情同意书后才能开始透析。","page":114},{"id":537,"chapter":"第11章 血液透析","section":"二、适应证及禁忌证","roles":["医生"],"level":"进阶","type":"简答","q":"决定终末期肾病患者是否开始透析的原则是什么？","a":"①对患者症状、体征以及代谢异常、容量状态、营养和药物干预效果进行综合评估，决定透析开始时机；②肾脏专科医师应充分告知患者及家属血液透析的必要性及并发症风险；③患者或家属按相关规定签署血液透析知情同意书后，才能开始血液透析治疗。","key":"透析时机是综合评估，不能单凭肌酐/eGFR一个数值。","page":114},{"id":538,"chapter":"第11章 血液透析","section":"二、适应证及禁忌证","roles":["医生"],"level":"基础","type":"简答","q":"终末期肾病建议导入透析治疗的指征是什么？","a":"GFR＜15ml/（min·1.73m²），且出现下列临床表现之一：①不能缓解的乏力、恶心、呕吐、瘙痒等尿毒症症状或营养不良；②难以纠正的高钾血症；③难以控制的进展性代谢性酸中毒；④难以控制的水钠潴留和高血压，合并充血性心力衰竭或急性肺水肿；⑤尿毒症性心包炎；⑥尿毒症性脑病和进展性神经病变；⑦医师认为其他需要血液透析的病因。","key":"GFR＜15需“合并临床表现之一”，并非GFR＜15即必须透析。","page":114},{"id":539,"chapter":"第11章 血液透析","section":"二、适应证及禁忌证","roles":["医生"],"level":"进阶","type":"填空","q":"无论临床症状如何，患者GFR＜____ml/（min·1.73m²）应开始透析治疗；合并____的高风险患者应适当提早开始透析。","a":"6；糖尿病。","key":"“GFR＜6无条件开始”与“GFR＜15+症状”两条阈值常混淆。","page":115},{"id":540,"chapter":"第11章 血液透析","section":"二、适应证及禁忌证","roles":["医生"],"level":"基础","type":"简答","q":"除终末期肾病外，血液透析的其他适应证有哪些？","a":"①急性肾损伤；②药物或毒物中毒；③严重水、电解质和酸碱平衡紊乱；④其他：如严重高热、低体温，以及常规内科治疗无效的严重水肿、心力衰竭、肝功能衰竭等。","key":"严重高热、低体温也是适应证，常被遗漏。","page":115},{"id":541,"chapter":"第11章 血液透析","section":"二、适应证及禁忌证","roles":["医生"],"level":"基础","type":"判断","q":"颅内出血是血液透析的绝对禁忌证。（对/错？）","a":"错。血液透析无绝对禁忌证，但下列情况应慎用：①颅内出血或颅内压增高；②药物难以纠正的严重休克；③严重心肌病变并有难治性心力衰竭；④活动性出血；⑤精神障碍不能配合血液透析治疗。","key":"HD只有“慎用”，没有“绝对禁忌”。","page":115},{"id":542,"chapter":"第11章 血液透析","section":"三、血管通路的建立","roles":["医生","护士"],"level":"基础","type":"判断","q":"预计需较长时间血液透析治疗的患者，可长期使用无隧道无涤纶套中心静脉导管作为血管通路。（对/错？）","a":"错。无隧道无涤纶套中心静脉导管用于临时或短期血液透析；预计需较长时间血液透析的患者应选用长期血管通路（参照第9章）。","key":"临时导管不得作为长期通路使用。","page":115},{"id":543,"chapter":"第11章 血液透析","section":"四、透析处方确定及调整","roles":["医生","护士"],"level":"基础","type":"简答","q":"首次透析（诱导透析期）前应完成哪些传染病学检查？目的是什么？","a":"透析前应进行乙型和丙型肝炎病毒、梅毒和HIV的血清学指标检测，以及肺结核等呼吸道传染病检查，以决定透析治疗分区及血液透析机安排。","key":"除四项血清学外，还要查肺结核等呼吸道传染病。","page":115},{"id":544,"chapter":"第11章 血液透析","section":"四、透析处方确定及调整","roles":["医生"],"level":"进阶","type":"简答","q":"诱导透析期各种抗凝方案分别适用于哪类患者？","a":"①普通肝素：无活动性出血或无出血风险、血液高凝状态者；②低分子量肝素：无活动性出血或具有潜在出血风险者，60～80IU/kg，推荐治疗前20～30min静脉注射，无需追加；③局部枸橼酸抗凝：活动性出血或高危出血风险者；④阿加曲班：活动性出血或高危出血风险、肝素类药物过敏或既往发生HIT者；⑤无抗凝剂：合并活动性出血或高危出血风险者，但不适用于血液高凝状态显著者。","key":"低分子量肝素推荐在治疗前20～30min静注，而非上机即刻推注。","page":115},{"id":545,"chapter":"第11章 血液透析","section":"四、透析处方确定及调整","roles":["医生"],"level":"进阶","type":"判断","q":"无抗凝剂透析适用于合并活动性出血、同时血液高凝状态显著的患者。（对/错？）","a":"错。无抗凝剂适用于合并活动性出血或高危出血风险者，但不适用于合并血液高凝状态显著的患者。","key":"高凝显著者无抗凝剂透析极易发生体外循环凝血。","page":116},{"id":546,"chapter":"第11章 血液透析","section":"四、透析处方确定及调整","roles":["医生","护士"],"level":"基础","type":"填空","q":"建议首次透析时间不超过____h；每周3次者____h/次；残肾功能＞2ml/（min·1.73m²）时可每周2次，____h/次；每周总治疗时间不低于____h。","a":"2～3；4.0～4.5；5.0～5.5；10。","key":"每周总时间≥10h是硬指标。","page":116},{"id":547,"chapter":"第11章 血液透析","section":"四、透析处方确定及调整","roles":["医生","护士"],"level":"基础","type":"简答","q":"首次透析时血流量、透析器、透析液流速和温度应如何设定？","a":"①血流速度宜适当减慢，可设定为150～200ml/min，以后逐渐调高；②选择相对较小膜面积的透析器，以减少透析失衡综合征；③透析液流速可设定为500ml/min，通常不需调整，如发生严重透析失衡可调低；④透析液温度常设定为36.5℃左右，个体化调整。","key":"首次透析的核心是“低效”以防失衡综合征。","page":116},{"id":548,"chapter":"第11章 血液透析","section":"四、透析处方确定及调整","roles":["医生","护士"],"level":"基础","type":"填空","q":"建议每次透析超滤总量不超过体重的____，超滤速度不超过____ml/（kg·min）；诱导期在____个月内逐步使透后体重达到干体重。","a":"5%；0.35；1～3。","key":"严重水肿、急性肺水肿时超滤速度和总量可适当提高。","page":117},{"id":549,"chapter":"第11章 血液透析","section":"四、透析处方确定及调整","roles":["医生","护士"],"level":"基础","type":"简答","q":"什么是干体重？建议多久评估一次？","a":"干体重是透析超滤能够达到最大限度体液减少、且不发生低血压时的体重，即采用血液透析缓慢超滤至出现低血压时的体重；此时体内基本无多余水分潴留也不缺水，是患者感觉舒适的理想体重。因营养状态变化会影响体重，建议每2周评估1次干体重。","key":"干体重评估频率为每2周1次，常误答为每月。","page":117},{"id":550,"chapter":"第11章 血液透析","section":"四、透析处方确定及调整","roles":["医生"],"level":"进阶","type":"简答","q":"干体重的标准有哪些？","a":"①透析过程中无明显的低血压；②透析前血压得到有效控制；③临床无水肿表现；④胸部X线片无肺淤血征象；⑤心胸比值男性＜50%，女性＜53%；⑥有条件者可应用生物电阻抗法等进行机体容量评估。","key":"心胸比男女阈值不同（50%/53%）。","page":117},{"id":551,"chapter":"第11章 血液透析","section":"四、透析处方确定及调整","roles":["医生"],"level":"进阶","type":"简答","q":"维持透析期哪些患者可予每周2次透析？","a":"残肾功能较好[Kru在2ml/（min·1.73m²）以上]、尿量200ml/d以上且透析间期体重增长不超过3%～5%、心功能较好者，可予每周2次透析，但不作为常规透析方案；一般建议每周3次。","key":"每周2次需同时满足多项条件且不作为常规；每次5.0～5.5h。","page":118},{"id":552,"chapter":"第11章 血液透析","section":"四、透析处方确定及调整","roles":["护士"],"level":"基础","type":"填空","q":"维持透析时先予____ml/min血流速度治疗____min左右，如无不适调高至____ml/min；要求每次透析血流速度最低____ml/min。","a":"150；15；200～400；200～250。","key":"高龄、婴幼儿或严重心律失常者可酌情减慢血流速度并密切监测生命体征。","page":118},{"id":553,"chapter":"第11章 血液透析","section":"四、透析处方确定及调整","roles":["护士","技师"],"level":"基础","type":"填空","q":"透析液流速一般设定为____ml/min；如采用高通量透析，可提高至____ml/min。","a":"500；800。","key":"高通量透析才提高至800ml/min；诱导期严重失衡时可调低透析液流速。","page":118},{"id":554,"chapter":"第11章 血液透析","section":"四、透析处方确定及调整","roles":["医生"],"level":"高级","type":"简答","q":"如何设定透析液钠浓度？低钠与序贯钠透析各有何风险？","a":"①常为135～140mmol/L，根据血压控制情况选择；②高血压控制不佳时可个体化：测定3次透前血钠取平均值，乘以95%作为透析液钠浓度；也可用低钠透析液，但注意肌肉抽搐、透析失衡综合征及透析中低血压或高血压风险；③反复透析中低血压可选较高钠浓度或由高到低的序贯钠浓度透析，但易并发口渴、透析间期体重增长过多、顽固性高血压。","key":"个体化钠=3次透前血钠均值×95%。","page":118},{"id":555,"chapter":"第11章 血液透析","section":"四、透析处方确定及调整","roles":["医生"],"level":"高级","type":"案例分析","q":"维持性透析患者高血压控制不佳，连续3次透前血钠分别为138、140、142mmol/L。若采用个体化透析液钠浓度，应设定为多少？需注意什么？","a":"①平均血钠=(138+140+142)/3=140mmol/L；②透析液钠浓度=140×95%=133mmol/L；③需注意低钠可能引起肌肉抽搐、透析失衡综合征及透析中低血压或高血压，加强监测。","key":"乘以95%而非减去5mmol/L。","page":118},{"id":556,"chapter":"第11章 血液透析","section":"四、透析处方确定及调整","roles":["医生"],"level":"进阶","type":"简答","q":"透析液钾浓度如何选择？","a":"①范围0～4.0mmol/L，常设定为2.0mmol/L；②应根据血钾水平、心律失常等合并症或并发症、输血治疗、透析模式等选择；③每日透析或服用地高辛类药物者，可适当选择较高钾浓度透析液；④低钾浓度透析液可引起血钾下降过快，导致心律失常甚至心搏骤停。","key":"服地高辛者要“较高钾”，低血钾会加重洋地黄毒性。","page":118},{"id":557,"chapter":"第11章 血液透析","section":"四、透析处方确定及调整","roles":["医生"],"level":"高级","type":"简答","q":"透析液钙浓度的常用范围、推荐浓度及选用1.25mmol/L的情形？","a":"①常用1.25～1.75mmol/L；钙浓度过高易致高钙血症及严重异位钙化，建议应用1.25～1.5mmol/L；②存在顽固性高血压、高钙血症、难以控制的继发性甲旁亢时选用1.25mmol/L，并建议联合活性维生素D及其类似物、磷结合剂及拟钙剂；③血iPTH水平过低时也应选用1.25mmol/L。","key":"iPTH“过高”和“过低”都选1.25mmol/L，易误认为低iPTH应提高钙浓度。","page":119},{"id":558,"chapter":"第11章 血液透析","section":"四、透析处方确定及调整","roles":["医生"],"level":"高级","type":"案例分析","q":"患者透析中反复出现低钙抽搐、血钙偏低，且因血管反应性差导致反复透析中低血压。透析液钙浓度如何调整？需注意什么？","a":"①可短期选用钙浓度1.75mmol/L透析液；②此时应密切监测血钙、血磷、血iPTH水平；③定期评估组织器官钙化情况，防止严重骨矿物质代谢异常；④反复低血压与血管反应性有关时，也可适当调低透析液温度。","key":"1.75mmol/L只能“短期”使用。","page":119},{"id":559,"chapter":"第11章 血液透析","section":"四、透析处方确定及调整","roles":["护士","技师"],"level":"基础","type":"填空","q":"透析液温度为____℃，常设定为____℃；反复透析低血压且与血管反应性有关时可适当____透析液温度；高热患者也可适当____透析液温度。","a":"35.5～37.5；36.5；调低；调低。","key":"透析中常不调整温度，特殊情况才调低。","page":119},{"id":560,"chapter":"第11章 血液透析","section":"五、血液透析操作","roles":["护士"],"level":"基础","type":"简答","q":"血液透析操作前的环境、人员和物品准备要求？","a":"①检查并保持透析治疗区干净整洁，患者及陪护人员在候诊区等候，操作护士洗手、戴口罩；②物品：血液透析器、血液透析管路、内瘘患者备穿刺针、无菌治疗巾、生理盐水、碘伏和棉签等消毒物品、止血带、一次性使用手套、透析液等。","key":"患者及陪护在候诊区等候，预冲完毕后才有序进入治疗区。","page":119},{"id":561,"chapter":"第11章 血液透析","section":"五、血液透析操作","roles":["护士","技师"],"level":"基础","type":"判断","q":"为节省时间，开机自检时可跳过已多次通过的自检项目。（对/错？）","a":"错。应检查电源线连接、打开电源总开关，按照机器要求完成全部自检程序，严禁简化或跳过自检步骤。","key":"“严禁简化或跳过”是原文硬性要求。","page":119},{"id":562,"chapter":"第11章 血液透析","section":"五、血液透析操作","roles":["护士"],"level":"进阶","type":"简答","q":"普通单人用血液透析机密闭式预冲的步骤？","a":"①启动血泵80～100ml/min，用生理盐水先排净管路和透析器血室（膜内）气体，流向动脉端→透析器→静脉端，不得逆向预冲；②泵速调至200～300ml/min，连接透析液接头与透析器旁路，排净透析液室（膜外）气体；③预冲量严格按透析器说明书；需闭式循环或肝素生理盐水预冲时，应在生理盐水预冲量达到后进行；④预冲液直接流入废液收集袋，袋置于机器液体架上，不得低于操作者腰部以下，不建议流入开放式废液桶；⑤预冲完毕根据医嘱设置治疗参数。","key":"先膜内（80～100）后膜外（200～300），泵速不同。","page":120},{"id":563,"chapter":"第11章 血液透析","section":"五、血液透析操作","roles":["护士","技师"],"level":"进阶","type":"填空","q":"集中供透析液自动透析系统，透析液在线预冲量≥____ml，透析机自动采用____，膜外、膜内、动脉端、静脉端分别预冲。","a":"4000；逆超滤。","key":"在线预冲量下限4000ml。","page":120},{"id":564,"chapter":"第11章 血液透析","section":"五、血液透析操作","roles":["护士"],"level":"基础","type":"简答","q":"动静脉内瘘穿刺的操作要点？","a":"①检查有无红肿、渗血、硬结，穿刺部位清洁度，摸清血管走向和搏动，听诊杂音；②用合规有效消毒剂按说明书消毒；③根据血管粗细和血流量选择穿刺针；④穿刺前戴护目镜/防护面罩、清洁手套，阳性治疗区穿隔离衣；⑤采用阶梯式、扣眼式等方法，先穿刺静脉再穿刺动脉；动脉端穿刺点距吻合口3cm以上，动静脉穿刺点间距5cm以上，固定穿刺针；⑥根据医嘱推注首剂量抗凝剂。","key":"“3cm/5cm”与“先静脉后动脉”是考核高频点。","page":121},{"id":565,"chapter":"第11章 血液透析","section":"五、血液透析操作","roles":["护士"],"level":"进阶","type":"案例分析","q":"护士为颈内静脉导管患者上机，回抽导管封管液时发现回血不畅。正确的做法是什么？连接导管的规范要点有哪些？","a":"①认真查找原因，严禁使用注射器用力推注导管腔；②规范：患者头偏向对侧、戴口罩；检查导管夹处于夹闭状态再取保护帽；消毒接头，避免接触非无菌表面；③回抽量为动、静脉管各2ml左右，推注在纱布上检查有无凝血块（推注时距纱布＞10cm）；④根据医嘱从导管静脉端推注首剂量抗凝剂后连接体外循环；⑤推荐使用无色透明、具直通结构的无针接头，接头有裂痕或无法去除的血液残留应立即更换。","key":"用力推注可能把血栓推入体内，是严重违规操作。","page":121},{"id":566,"chapter":"第11章 血液透析","section":"五、血液透析操作","roles":["护士"],"level":"高级","type":"简答","q":"移植物血管内瘘穿刺与自体内瘘相比有哪些特殊要求？","a":"①上机前清洗穿刺侧手臂，保持清洁干燥；②判断血流方向；③用碘伏、酒精、氯己定纱布等揉搓摩擦式消毒U型袢皮肤，面积不少于手臂2/3；④以穿刺点为中心由内至外螺旋式消毒至10cm直径，消毒2遍；⑤戴无菌手套，铺无菌治疗巾；⑥戴护目镜/面罩，阳性区穿隔离衣；⑦穿刺点距吻合口3cm以上、间距5cm以上，避免在袢转角处穿刺；⑧采用象限交叉阶梯式穿刺，交替更换部位，严禁扣眼式及同一穿刺点多次反复穿刺。","key":"移植物内瘘戴“无菌手套”，自体内瘘为“清洁手套”。","page":122},{"id":567,"chapter":"第11章 血液透析","section":"五、血液透析操作","roles":["护士"],"level":"进阶","type":"判断","q":"移植物血管内瘘推荐采用扣眼式穿刺，以减少穿刺疼痛。（对/错？）","a":"错。移植物血管内瘘应采用象限交叉阶梯式穿刺，交替更换穿刺部位，严禁扣眼式穿刺方法及同一穿刺点多次反复穿刺。","key":"扣眼式仅可用于自体内瘘。","page":122},{"id":568,"chapter":"第11章 血液透析","section":"五、血液透析操作","roles":["护士"],"level":"基础","type":"简答","q":"体外循环建立后及透析过程中护士应做哪些监测与查对？","a":"①体外循环建立后立即测量血压、脉搏，询问有无不适，详细记录；②二次自我查对：按血流方向依次查对管路各连接处和开口处（未用开口用保护帽并夹闭管夹）、根据医嘱查对治疗参数、治疗开始后消毒擦拭控制面板和按键等高频接触部位；③双人查对：其他护士再次查对并签字；④治疗中至少每小时询问不适，观察神志、机器压力监测及参数、穿刺针及管路固定，测量生命体征并记录；⑤生命体征异常随时监测，必要时心电监护。","key":"“至少每小时”一次巡视与生命体征记录。","page":122},{"id":569,"chapter":"第11章 血液透析","section":"五、血液透析操作","roles":["护士"],"level":"基础","type":"简答","q":"密闭式回血（内瘘患者）的操作步骤？","a":"①调整血流量至50～100ml/min；②打开动脉端预冲侧管，用生理盐水将动脉侧管内血液回输20～30s；③关闭血泵，靠重力将动脉端近心侧管路血液回输体内；④夹闭动脉管路夹子和动脉穿刺针处夹子；⑤打开血泵，用生理盐水全程回血，可双手左右转动滤器，但不得用手挤压静脉端管路；生理盐水回输至静脉壶、安全夹自动关闭后停止回血，禁止从安全夹中强制取出管路；⑥夹闭静脉管路夹子和静脉穿刺针夹子；⑦先拔动脉针再拔静脉针，放入锐器盒，压迫2～3min，弹力绷带或胶布加压包扎。","key":"严禁空气回血、挤压静脉端管路及强取安全夹。","page":123},{"id":570,"chapter":"第11章 血液透析","section":"五、血液透析操作","roles":["护士"],"level":"进阶","type":"判断","q":"密闭式回血时，若安全夹已自动关闭但管路内仍有少量血液，可将管路从安全夹中取出继续回血。（对/错？）","a":"错。生理盐水回输至静脉壶、安全夹自动关闭后应停止继续回血，回血过程中禁止管路从安全夹中强制取出。","key":"防空气栓塞的关键动作。","page":123},{"id":571,"chapter":"第11章 血液透析","section":"五、血液透析操作","roles":["护士"],"level":"进阶","type":"简答","q":"采用中心静脉导管时，下机回血与封管的要点？","a":"①颈部置管患者头偏向对侧、戴口罩；②准备冲管生理盐水或预充式导管冲洗装置；③辅助人员消毒导管、导管夹和管路接头；④操作者戴无菌手套，断开导管动脉端，辅助人员脉冲式推注生理盐水，弹丸式推注封管液，关闭导管夹、连接保护帽；⑤回血完毕停泵，关闭静脉端导管夹，断开静脉端，同法注射封管液；⑥无菌敷料包扎，再次消毒导管皮肤入口周围并更换敷料，注明更换时间；推荐使用预充式导管冲洗装置。","key":"冲管“脉冲式”、封管“弹丸式”，顺序先动脉端后静脉端。","page":123},{"id":572,"chapter":"第11章 血液透析","section":"五、血液透析操作","roles":["护士"],"level":"基础","type":"填空","q":"回血下机后嘱患者平卧____min，检查穿刺部位无出血或渗血后松开包扎带，测量生命体征，听诊内瘘杂音；拔针后压迫穿刺部位____min。","a":"10～20；2～3。","key":"离开前需测体重并交代注意事项。","page":124},{"id":573,"chapter":"第11章 血液透析","section":"五、血液透析操作","roles":["护士"],"level":"进阶","type":"简答","q":"特殊回血法适用于哪些情况？其关键步骤与密闭式回血有何不同？","a":"①适用于少部分内瘘压力过高、凝血异常、进行无抗凝剂透析等情况；②步骤：消毒回血用生理盐水瓶塞瓶口，插入无菌大针头置机器顶部；血流量调至50～100ml/min后关闭血泵；夹闭动脉针夹子、先拔动脉针并按压包扎；将动脉管路与生理盐水上的无菌大针头连接并悬挂于输液架；打开血泵用生理盐水全程回血；夹闭静脉夹子、拔静脉针、压迫2～3min包扎。不同点：先拔动脉针，动脉侧血液不回输。","key":"特殊回血法动脉端近心侧血液不再回输，避免内瘘高压或凝血块回输。","page":124},{"id":574,"chapter":"第11章 血液透析","section":"五、血液透析操作","roles":["护士","技师"],"level":"基础","type":"简答","q":"透析结束后透析机的消毒要求？","a":"①每班次结束后机器表面用500mg/L含氯消毒剂或中高效消毒剂擦拭；②表面有肉眼可见污染时，立即用可吸附材料清除污染物，再用500mg/L含氯消毒剂或中高效消毒剂擦拭，遵循WS/T 512-2016先清洁再消毒原则；③每班次结束后应按说明书进行机器内部消毒。","key":"可见污染必须“先清洁再消毒”。","page":125},{"id":575,"chapter":"第11章 血液透析","section":"五、血液透析操作","roles":["护士","技师"],"level":"进阶","type":"案例分析","q":"透析中发现静脉压力传感器保护罩被血液污染，检查发现保护罩已破损。应如何处理？","a":"①发生传感器保护罩被血迹或液体污染时，立即更换透析器和传感器保护罩（若伴透析器破膜同样立即更换透析器）；②保护罩破损时立即更换传感器保护罩；③待此次治疗结束后请工程专业人员处理（检查机器内部是否污染）；④机器表面按先清洁再消毒原则擦拭。","key":"保护罩破损意味着血液可能进入机器内部，须工程人员处理。","page":125},{"id":576,"chapter":"第11章 血液透析","section":"六、透析患者的管理及监测","roles":["护士"],"level":"基础","type":"简答","q":"透析间期患者饮食控制与自我管理要点？","a":"①戒烟、戒酒、规律生活；②控制水和钠盐摄入，透析间期体重增长不超过5%或每日不超过1kg；③控制磷摄入，少食高磷食物；控制钾摄入以避免高钾血症；④每日蛋白质摄入1.0～1.2g/kg，并保证足够碳水化合物；⑤记录每日尿量和体重，保证大便通畅，有条件每日测血压并记录；⑥内瘘者每日触诊震颤、听诊杂音；导管者每日观察出血、分泌物、管体脱出和不适，异常及时就诊。","key":"蛋白质1.0～1.2g/kg，透析患者不应低蛋白饮食。","page":125},{"id":577,"chapter":"第11章 血液透析","section":"六、透析患者的管理及监测","roles":["医生"],"level":"进阶","type":"填空","q":"表11-1：血常规、肝肾功能、电解质每____个月1次；铁状态、iPTH、营养及炎症、Kt/V和URR每____个月1次；心血管结构和功能每____个月1次；胸部正侧位X线片每____个月1次。","a":"1～3；3～6；6～12；3～6。","key":"贫血治疗开始、方案调整及病情不稳定时应加强检测。","page":126},{"id":578,"chapter":"第11章 血液透析","section":"六、透析患者的管理及监测","roles":["医生","护士"],"level":"进阶","type":"判断","q":"维持性透析患者的乙肝、丙肝、HIV和梅毒血清学指标每12个月检测1次即可。（对/错？）","a":"错。传染病学指标必须检查：透析导入时必检，且3个月内复检；维持性透析患者每6个月检测1次。","key":"导入后“3个月内复检”用于发现窗口期感染。","page":127},{"id":579,"chapter":"第11章 血液透析","section":"六、透析患者的管理及监测","roles":["医生"],"level":"进阶","type":"填空","q":"血清铁蛋白低于____ng/ml或转铁蛋白饱和度低于____%时，需补铁治疗，首选____补铁。","a":"200；20；静脉。","key":"两项指标“或”的关系，任一低于阈值即需补铁。","page":127},{"id":580,"chapter":"第11章 血液透析","section":"六、透析患者的管理及监测","roles":["医生"],"level":"高级","type":"填空","q":"维持性透析患者矿物质代谢目标：血清校正钙维持在正常低限约____mmol/L；血磷____mmol/L；血iPTH维持在正常检测上限的____倍（较理想水平为____pg/ml）。","a":"2.1～2.5；1.13～1.78；2～9；150～300。","key":"注意与透析前准备期（磷0.81～1.45、iPTH 70～110）目标不同。","page":127},{"id":581,"chapter":"第11章 血液透析","section":"七、血液透析并发症及处理","roles":["医生","护士"],"level":"基础","type":"简答","q":"透析中肌肉痉挛的常见原因、治疗和预防？","a":"原因：透析中低血压、低血容量、超滤速度过快及低钠透析液致肌肉血流灌注降低最常见；低镁、低钙、低钾等电解质紊乱和酸碱失衡也可引起。治疗：快速输注生理盐水（0.9%氯化钠100ml，可重复）、50%葡萄糖或20%甘露醇，外力挤压按摩。预防：透析间期体重增长不超过干体重5%，超滤速度尽量不超过0.35ml/（kg·min）；适当提高透析液钠浓度（高钠或序贯钠）但避免高钠血症；纠正低镁、低钙、低钾；鼓励肌肉锻炼。","key":"寻找诱因是处理关键，多发生于透析中后期。","page":127},{"id":582,"chapter":"第11章 血液透析","section":"七、血液透析并发症及处理","roles":["护士"],"level":"进阶","type":"案例分析","q":"患者透析3h时突发双小腿肌肉痉挛、疼痛，血压由透前140/80mmHg降至95/60mmHg，本次超滤量约为体重的6%。如何处理？","a":"①考虑低血压、超滤过快致肌肉灌注降低引起的痉挛；②快速输注0.9%氯化钠溶液100ml，可酌情重复，或50%葡萄糖、20%甘露醇；③对痉挛肌肉外力挤压按摩；④按透析中低血压处理（降低/暂停超滤等）；⑤以后控制透析间期体重增长不超过干体重5%，超滤速度不超过0.35ml/（kg·min），评估干体重，必要时高钠或序贯钠透析。","key":"超滤总量超过体重5%是本例根源，应同时复核干体重。","page":127},{"id":583,"chapter":"第11章 血液透析","section":"七、血液透析并发症及处理","roles":["医生","护士"],"level":"基础","type":"简答","q":"透析中头痛的常见原因及处理？","a":"①原因：透析失衡综合征、严重高血压和脑血管意外等；长期饮用咖啡者因透析中血咖啡浓度降低也可出现头痛；②治疗：明确病因针对性干预；无脑血管意外等颅内器质性病变时可用对乙酰氨基酚等止痛；③预防：低钠透析、避免透析中高血压、规律透析。","key":"止痛前必须先排除脑血管意外。","page":128},{"id":584,"chapter":"第11章 血液透析","section":"七、血液透析并发症及处理","roles":["医生","护士"],"level":"基础","type":"简答","q":"透析患者皮肤瘙痒的原因、治疗和预防？","a":"①与尿毒症本身、透析治疗及钙磷代谢紊乱等有关；透析过程中发生的瘙痒需考虑透析器反应等变态反应；药物或肝病也可诱发；②治疗：保证充分透析基础上应用抗组胺药、外用含镇痛剂的皮肤润滑油，也可联用血液灌流；③预防：控制钙、磷和iPTH于适当水平，避免致痒药物，用生物相容性好的透析器和管路，避免刺激性清洁剂，用保湿护肤品，衣服尽量选全棉制品。","key":"“透析中”出现的瘙痒先想到透析器反应。","page":129},{"id":585,"chapter":"第11章 血液透析","section":"七、血液透析并发症及处理","roles":["医生"],"level":"高级","type":"案例分析","q":"男，50岁，首次血液透析，透前BUN 45mmol/L，使用大面积透析器、血流量250ml/min。透析2.5h时出现剧烈头痛、呕吐，继而抽搐、意识障碍。分析诊断及处理，并说明预防措施。","a":"①诊断考虑透析失衡综合征（溶质快速清除→血浆渗透压下降→水向脑组织转移→颅内压增高、颅内pH改变）；高危因素：首次透析、BUN高、高效透析；②重者（抽搐、意识障碍、昏迷）立即终止透析，鉴别诊断排除脑卒中，同时输注20%甘露醇，再根据反应处理；昏迷一般于24h内好转；③轻者可减慢血流速度，伴肌肉痉挛可输注4%碳酸氢钠、10%氯化钠或50%葡萄糖，无缓解则提前终止；④预防：首次透析BUN下降控制在30%～40%以内，减慢血流速度、每次透析控制在2～3h内、应用膜面积小的透析器；维持期可用钠浓度曲线序贯透析、规律充分透析、增加频率缩短时间。","key":"重症必须先排除脑卒中，不能直接归因于失衡。","page":129},{"id":586,"chapter":"第11章 血液透析","section":"七、血液透析并发症及处理","roles":["医生"],"level":"高级","type":"简答","q":"A型透析器反应的发病特点及紧急处理？","a":"①机制为快速变态反应，常于透析开始后5min内发生，少数迟至30min；发生率＜5次/10000透析例次；表现皮肤瘙痒、荨麻疹、咳嗽、喷嚏、流清涕、腹痛、腹泻，甚至呼吸困难、休克、死亡；②紧急处理：立即停止透析，夹闭血路管，丢弃管路和透析器中血液；予抗组胺药、激素或肾上腺素；出现呼吸循环障碍立即心脏呼吸支持。","key":"A型反应“丢弃血液、不回血”，与常规下机相反。","page":130},{"id":587,"chapter":"第11章 血液透析","section":"七、血液透析并发症及处理","roles":["医生","护士"],"level":"高级","type":"案例分析","q":"女，66岁，长期服用ACEI类降压药，使用新的环氧乙烷消毒透析器。上机3min出现全身荨麻疹、喷嚏、呼吸困难，血压下降。如何处理与预防？","a":"①考虑A型透析器反应（过敏反应型），高危因素：ACEI应用、环氧乙烷消毒；②立即停止透析，夹闭血路管，丢弃管路和透析器中血液；③予抗组胺药、激素或肾上腺素；呼吸循环障碍立即心肺支持；④预防：透析前充分冲洗透析器和管路；选用蒸汽或γ射线消毒的透析器和管路；复用透析器；高危人群透前应用抗组胺药并停用ACEI；换用其他类型透析器。","key":"ACEI使用者是A型反应高危人群，需停用。","page":130},{"id":588,"chapter":"第11章 血液透析","section":"七、血液透析并发症及处理","roles":["医生","护士"],"level":"进阶","type":"判断","q":"B型透析器反应一旦发生应立即终止透析，夹闭血路管并丢弃体外循环血液。（对/错？）","a":"错。B型透析器反应多较轻，常于透析开始后20～60min出现，表现胸痛和背痛；需先排除心绞痛、心包炎等器质性疾病，予鼻导管吸氧及对症处理即可，常无须终止透析，常于30～60min后缓解。","key":"立即终止、丢弃血液是A型反应的处理。","page":131},{"id":589,"chapter":"第11章 血液透析","section":"七、血液透析并发症及处理","roles":["医生","护士"],"level":"进阶","type":"填空","q":"A型透析器反应发生率＜____次/10000透析例次，多于透析开始后____min内发生；B型透析器反应发生率为____次/100透析例次，多于透析开始后____min出现，可能与____激活有关。","a":"5；5；3～5；20～60；补体。","key":"B型预防：复用透析器、选择生物相容性好的（合成膜）透析器。","page":131},{"id":590,"chapter":"第11章 血液透析","section":"七、血液透析并发症及处理","roles":["医生","护士","技师"],"level":"进阶","type":"简答","q":"透析中溶血的表现、原因、处理和预防？","a":"表现：胸痛、胸部压迫感、呼吸急促、腹痛、发热、畏寒等。原因：①管路狭窄或梗阻致红细胞机械性损伤；②透析液钠浓度过低、温度过高，或受消毒剂、氯胺、漂白粉、铜、锌、甲醛、氟化物、过氧化氢、硝酸盐等污染；③透析中错误输血。处理：重者终止透析，夹闭血路管，丢弃管路中血液；纠正贫血，必要时输新鲜全血；严密监测血钾，避免高钾血症。预防：监测管路压力；避免过低钠浓度及高温透析；严格监测透析用水和透析液，严格消毒。","key":"溶血时管路血液须丢弃，回输会加重高钾。","page":132},{"id":591,"chapter":"第11章 血液透析","section":"七、血液透析并发症及处理","roles":["护士"],"level":"高级","type":"案例分析","q":"透析中患者动脉穿刺针与管路连接处脱开，随即出现呼吸困难、发绀、胸闷，怀疑空气栓塞。如何紧急抢救？如何预防？","a":"①立即夹闭静脉管路，停止血泵；②采取左侧卧位，并头和胸部低、脚高位；③心肺支持，吸纯氧，面罩或气管插管；④空气量较多时，有条件者可予右心房或右心室穿刺抽气；⑤预防：上机前严格检查管路和透析器有无破损；做好穿刺针或导管固定及各连接；透析中密切观察有无松动脱落；透析结束时严禁空气回血；维护透析机空气报警装置。","key":"体位为“左侧卧位、头胸低脚高”；空气栓塞死亡率极高。","page":132},{"id":592,"chapter":"第11章 血液透析","section":"七、血液透析并发症及处理","roles":["医生","护士"],"level":"进阶","type":"案例分析","q":"某中心使用复用透析器的患者，透析开始1h后出现寒战、高热39℃。如何分析原因与处理？如何预防？","a":"①透析相关发热多由致热原进入血液引起（透析器复用不规范、预冲不规范、透析液受污染等），也可因无菌操作不严致病原体入血或原有感染扩散，少见原因有急性溶血、高温透析；②处理：物理降温、口服退热药，适当调低透析液温度；考虑细菌感染时做血培养并予抗生素；致热原引起者通常24h内好转，无好转应考虑感染，继续寻找病原体证据；非感染引起者可用小剂量糖皮质激素；③预防：规范操作和复用，建议使用一次性透析器，透析前充分冲洗，加强透析用水及透析液监测。","key":"24h内是否好转是区分致热原反应与感染的关键。","page":133},{"id":593,"chapter":"第11章 血液透析","section":"七、血液透析并发症及处理","roles":["护士","技师"],"level":"进阶","type":"案例分析","q":"透析中漏血报警，检查发现透析液侧有血液，确认透析器破膜。如何紧急处理？可能原因及预防？","a":"①立即夹闭透析管路动脉端和静脉端，丢弃体外循环中血液；②更换新的透析器和透析管路进行透析；③严密监测生命体征，出现发热、溶血等表现相应处理；④原因：透析器质量问题；储存不当（如冬天温度过低）；凝血或大量超滤致跨膜压过高；复用处理和储存不当、复用次数过多；⑤预防：透析前仔细检查透析器；监测跨膜压避免过高；定期检测漏血报警等装置；复用时严格进行破膜试验。","key":"破膜后体外血液可能被透析液污染，应丢弃不回输。","page":133},{"id":594,"chapter":"第11章 血液透析","section":"七、血液透析并发症及处理","roles":["护士"],"level":"进阶","type":"案例分析","q":"透析2h，静脉压快速升高，管路和透析器血液颜色变暗，静脉壶内出现小凝血块。分析原因并说明处理原则。","a":"①常见原因：不用抗凝剂或抗凝剂用量不足；促发因素有血流速度过慢、Hb过高、超滤率过高、透析中输注血液/血制品/脂肪乳、通路再循环过大、动静脉壶气泡增多及液面过高；②轻度凝血可追加抗凝剂、调高血流速度，并严密监测，加重时立即回血，更换透析器和管路；③重度凝血常需立即回血；凝血重而不能回血时直接丢弃体外循环管路和透析器，不主张强行回血，以免凝血块入体致栓塞；④预防：透前评估凝血状态、合理用抗凝剂；监测压力和颜色变化；避免透析中输血制品和脂肪乳（尤其凝血因子）；监测通路血流量；需长时间调低血流速度时加大抗凝剂用量。","key":"凝血征象包括动静脉压快速升高或静脉压快速降低。","page":134},{"id":595,"chapter":"第11章 血液透析","section":"八、远期并发症防治和管理","roles":["医生"],"level":"进阶","type":"简答","q":"心脑血管并发症的危险因素及定期评估要求？","a":"①是透析患者死亡的首要因素，包括左室肥厚、缺血性心脏病、心力衰竭、外周血管病变、脑卒中；②危险因素：传统（高血压、吸烟、肥胖、高脂血症）及尿毒症特有（贫血、容量过负荷、高同型半胱氨酸血症、骨矿物质代谢紊乱、氧化应激、慢性炎症、营养不良）；③防治关键：充分透析、管理透析间期体重增长和血压、纠正贫血和高磷血症；④评估：至少每2～4周评估干体重、容量和血压控制；每1～3个月评估Hb、钙磷、白蛋白、血脂和同型半胱氨酸；每3～6个月评估iPTH、hsCRP和Kt/V或URR；每6～12个月行心脏和重要血管影像学评估。","key":"心血管病是第一死因，感染是第二死因。","page":135},{"id":596,"chapter":"第11章 血液透析","section":"八、远期并发症防治和管理","roles":["医生","护士"],"level":"基础","type":"判断","q":"感染是血液透析患者的第二位死因。（对/错？）","a":"对。心脑血管并发症是首要死因，感染是第二位死因；易感因素包括免疫功能低下、营养不良、合并糖尿病、使用临时血管通路、复用透析器、透析液或供液管路污染等。","key":"细菌感染治疗关键是有效抗生素，营养补充及支持治疗同样重要。","page":136},{"id":597,"chapter":"第11章 血液透析","section":"八、远期并发症防治和管理","roles":["医生","护士"],"level":"进阶","type":"简答","q":"血液透析患者肝炎病毒感染的相关因素、治疗目标与预防？","a":"①相关因素：免疫功能低下、透析操作不当、消毒不严格（尤其复用透析器时）、输血；②多数无明显症状，少数纳差、恶心、黄疸；③治疗目标：抑制病毒复制，延缓肝病进展，防止肝硬化和肝癌，可用干扰素或抗病毒药物；④预防是关键：严格执行透析隔离制度和消毒制度、严格透析器复用程序、避免输血、注射乙肝疫苗。","key":"复用透析器时消毒不严格是院内传播的重要环节，预防重于治疗。","page":136},{"id":598,"chapter":"第11章 血液透析","section":"八、远期并发症防治和管理","roles":["医生","护士"],"level":"基础","type":"简答","q":"透析患者营养不良的干预措施？","a":"①相关因素：营养摄入不足、丢失过多、蛋白质分解代谢增加；②一旦发生或有风险即干预：饮食指导、加强营养支持，严重者鼻饲、透析中胃肠外营养甚至全静脉营养；③补充左旋肉碱、维生素B、叶酸、维生素C、活性维生素D、维生素E及硒、锌等；④充分透析，特别是高通量透析有益；⑤定期评估：透析前白蛋白、SGA、nPNA、前白蛋白每3～6个月，透析后体重增减百分比每月1次，透前钾磷、肌酐、尿素氮、血脂每1～3个月。","key":"透析后体重增减百分比为每月评估，频率最高。","page":136},{"id":599,"chapter":"第11章 血液透析","section":"九、血液透析充分性评估","roles":["医生"],"level":"基础","type":"简答","q":"满足哪些要求可认为血液透析患者得到充分透析？","a":"①自我感觉良好；②透析并发症较少、程度较轻；③血压和容量控制较好：透析间期体重增长不超过干体重5%，透前血压＜160/90mmHg且＞120/70mmHg；④电解质和酸碱平衡指标基本正常；⑤营养状况良好；⑥溶质清除较好：单次URR达到65%，spKt/V达到1.2；目标值URR 70%，spKt/V 1.4。","key":"透前血压有下限＞120/70mmHg，并非越低越好。","page":137},{"id":600,"chapter":"第11章 血液透析","section":"九、血液透析充分性评估","roles":["医生"],"level":"基础","type":"填空","q":"小分子溶质清除最低要求：单次URR达到____%，spKt/V达到____；目标值URR____%，spKt/V____。","a":"65；1.2；70；1.4。","key":"最低值与目标值不可混用。","page":138},{"id":601,"chapter":"第11章 血液透析","section":"九、血液透析充分性评估","roles":["医生"],"level":"高级","type":"案例分析","q":"内瘘患者透析4h，透前BUN 30mmol/L，透后BUN 9mmol/L，透前体重62kg，透后60kg。请计算spKt/V、URR和eKt/V并评价。","a":"①R=9/30=0.3；spKt/V=-ln(0.3-0.008×4)+(4-3.5×0.3)×(62-60)/60=-ln(0.268)+2.95×0.0333≈1.317+0.098≈1.42；②URR=(30-9)/30=70%；③内瘘eKt/V=spKt/V×[1-0.6/4]+0.03≈1.42×0.85+0.03≈1.23；④评价：达到spKt/V目标1.4、URR目标70%、eKt/V目标1.2，透析充分。（中心静脉置管者eKt/V=spKt/V×[1-0.47/t]+0.02）","key":"eKt/V公式按通路不同：内瘘0.6/+0.03，导管0.47/+0.02；时间单位为h。","page":138},{"id":602,"chapter":"第11章 血液透析","section":"九、血液透析充分性评估","roles":["医生"],"level":"高级","type":"填空","q":"表11-4 spKt/V最低要求：Kru＜2ml/（min·1.73m²）时，每周3次____、4次____、6次____；Kru≥2时，每周2次____（仅Kru＞3时考虑）、3次____、4次____、6次____。","a":"1.2；0.8；0.5；2.0；0.9；0.6；0.4。","key":"Kru＜2时不推荐每周2次透析。","page":139},{"id":603,"chapter":"第11章 血液透析","section":"九、血液透析充分性评估","roles":["医生"],"level":"高级","type":"判断","q":"当Kru≥2ml/（min·1.73m²）时，spKt/V最低要求可略有降低，其目标值应比最低要求高15%。（对/错？）","a":"对。且无残肾功能、每周3次透析者每次透析时间不能小于3h，每周透析时间需10h以上；Kru＜2时每周3次最低spKt/V 1.2（或eKt/V 1.0），相当于stdKt/V 2.0，目标spKt/V 1.4（eKt/V 1.2）。","key":"每次透析时间短于5h，需同时达到URR 65%。","page":139},{"id":604,"chapter":"第11章 血液透析","section":"九、血液透析充分性评估","roles":["护士"],"level":"进阶","type":"简答","q":"测定Kt/V时透前血标本如何留取？","a":"①动静脉内瘘者：透析开始前从静脉端内瘘穿刺针处直接抽血；②中心静脉置管者：透前先抽取10ml血液并丢弃后再抽血样送检，避免被肝素封管液等稀释。","key":"导管患者不弃血会导致BUN被稀释、Kt/V假性偏高。","page":139},{"id":605,"chapter":"第11章 血液透析","section":"九、血液透析充分性评估","roles":["护士"],"level":"高级","type":"简答","q":"Kt/V透后血标本的规范抽血方法有哪些？","a":"方法1：设定超滤速度为0，血流速度减至50ml/min维持10s，停止血泵，于20s内从动脉端抽血；或超滤为0，血流减至100ml/min，15～30s后从动脉端抽血。方法2：超滤为0，透析液设置为旁路，血流仍以正常速度运转3～5min后，从血路管任何部位抽血。血标本抽取后应即刻分离血清和血细胞。","key":"目的是排除通路再循环和尿素反弹影响，第一步都是“超滤设为0”。","page":140},{"id":606,"chapter":"第11章 血液透析","section":"九、血液透析充分性评估","roles":["护士"],"level":"进阶","type":"判断","q":"Kt/V透后血标本可在室温放置数小时后再统一离心分离。（对/错？）","a":"错。为避免尿素、钾离子等从细胞内释放至血浆影响结果，应在血标本抽取后即刻分离血清和血细胞；抽取的血样应尽快送检。","key":"细胞内尿素、钾释放会使透后BUN假性升高、Kt/V被低估。","page":140},{"id":607,"chapter":"第11章 血液透析","section":"九、血液透析充分性评估","roles":["医生","护士"],"level":"高级","type":"案例分析","q":"某患者连续两次spKt/V仅1.0，处方为每周3次、每次4h。请按原文列出Kt/V不达标的原因分析要点及方案调整流程。","a":"原因分析：①治疗时间：并发症提前停止或暂停、晚到或穿刺困难、报警致实际时间缩短、提前终止；②血流速度：实际减慢或通路问题致再循环（无效血流）；③血标本采集：透前是否开始前采血、导管是否弃去封管液，透后是否停超滤、调低或停泵、旁路、稳定后抽血，抽血部位是否正确；④透析器：凝血、选择不当（小面积或KoA小）、高估性能；⑤血液检测问题，样本未尽快送检；⑥其他：透析液流速设置错误、错误关闭透析液（旁路透析）、心功能异常致尿素分布异常。调整流程：保证并必要时延长透析时间；保证血流速度；规范采血；至少每3个月评估通路血流量及再循环；合理选用透析器；治疗中严密监测凝血、压力和参数。","key":"先找原因再调整，采血不规范是最常见的“假不达标”。","page":140},{"id":608,"chapter":"第11章 血液透析","section":"附：患者血液透析治疗前准备","roles":["医生"],"level":"基础","type":"简答","q":"慢性肾脏病患者透析前专科随访及并发症处理要求？","a":"①CKD 4期[eGFR＜30ml/（min·1.73m²）]均应转诊肾脏专科随访；②建议每1～3个月评估1次eGFR；③贫血：Hb＜100g/L开始促红细胞生成素治疗；④骨病和矿物质代谢：降磷药、钙剂和/或活性维生素D等；⑤血压控制于130/80mmHg以下；⑥纠正脂代谢、糖代谢异常和高尿酸血症。","key":"CKD 4期即应转诊肾脏专科；透前Hb＜100g/L即开始促红细胞生成素治疗。","page":141},{"id":609,"chapter":"第11章 血液透析","section":"附：患者血液透析治疗前准备","roles":["医生"],"level":"进阶","type":"填空","q":"透析前准备阶段，建议维持血钙____mmol/L、血磷____mmol/L、iPTH____pg/ml。","a":"2.1～2.5；0.81～1.45；70～110。","key":"与维持透析期目标（磷1.13～1.78、iPTH正常上限2～9倍）不同，常混淆。","page":141},{"id":610,"chapter":"第11章 血液透析","section":"附：患者血液透析治疗前准备","roles":["医生","护士"],"level":"基础","type":"简答","q":"透析前患者教育、血管保护及密切随访的eGFR节点分别是什么？","a":"①eGFR＜30ml/（min·1.73m²）：进行上肢血管保护教育，为以后建立血管通路创造条件；②eGFR＜20ml/（min·1.73m²）或预计6个月内需透析：进行透析知识宣教，做好思想准备；③eGFR＜15ml/（min·1.73m²）：建议每2～4周全面评估一次（症状、体征、肾功能、电解质、酸碱指标、血红蛋白等），开始透析前检测乙肝、丙肝、HIV和梅毒血清学指标，并评估凝血功能为抗凝方案作准备。","key":"三个节点：30保血管、20宣教、15密切随访（每2～4周）。","page":142},{"id":611,"chapter":"第12章 血液滤过","section":"四、治疗模式和处方","roles":["医生","护士"],"level":"基础","type":"简答","q":"血液滤过有哪几种置换液输入方式？各自置换液在何处输入？","a":"①前稀释置换法：置换液在血滤器之前输入；②后稀释置换法：置换液在血滤器之后输入；③混合稀释法：置换液在血滤器前及后同时输入。","key":"“前/后”以血滤器为参照，而非以血泵为参照。","page":144},{"id":612,"chapter":"第12章 血液滤过","section":"四、治疗模式和处方","roles":["医生"],"level":"基础","type":"填空","q":"血液滤过通常每次治疗____h，建议血流量____ml/min。","a":"4；＞250","key":"血流量是“大于250”，不是“250左右”。","page":144},{"id":613,"chapter":"第12章 血液滤过","section":"四、治疗模式和处方","roles":["医生","护士"],"level":"基础","type":"简答","q":"简述血液滤过前稀释置换法的优缺点。","a":"优点：血流阻力小，滤过率稳定，残余血量少，不易形成滤过膜上的蛋白覆盖层，滤器不易凝血。缺点：清除率低，所需置换液量较大。","key":"前稀释“抗凝友好但清除率低、耗液多”，是选择模式的核心权衡。","page":144},{"id":614,"chapter":"第12章 血液滤过","section":"四、治疗模式和处方","roles":["医生","护士"],"level":"基础","type":"填空","q":"血液滤过前稀释置换液量为血流量的____，建议HF治疗4h前稀释置换量____L。","a":"50%～60%；30～50","key":"前稀释与后稀释的比例和总量易混淆：前稀释50%～60%/30～50L。","page":144},{"id":615,"chapter":"第12章 血液滤过","section":"四、治疗模式和处方","roles":["医生"],"level":"基础","type":"判断","q":"患者需做无抗凝剂血液滤过时，建议选择后稀释置换法。（对/错？）","a":"错。当患者需做无抗凝剂血液滤过时，建议选择前稀释置换法，因其血流阻力小、滤器不易凝血。","key":"无抗凝=前稀释；后稀释易致滤器凝血。","page":144},{"id":616,"chapter":"第12章 血液滤过","section":"四、治疗模式和处方","roles":["医生","护士"],"level":"基础","type":"填空","q":"血液滤过后稀释置换液量为血流量的____，建议HF治疗4h后稀释置换量____L。","a":"25%～30%；18～25","key":"后稀释受滤过分数限制，比例远低于前稀释。","page":144},{"id":617,"chapter":"第12章 血液滤过","section":"四、治疗模式和处方","roles":["医生"],"level":"基础","type":"判断","q":"后稀释置换法一般患者均可选择，但有高凝倾向的患者不宜选择本模式。（对/错？）","a":"对。后稀释置换液用量少、清除效率高，但容易导致高凝状态患者滤器凝血。","key":"高凝患者首选前稀释或混合稀释。","page":144},{"id":618,"chapter":"第12章 血液滤过","section":"四、治疗模式和处方","roles":["医生"],"level":"高级","type":"案例分析","q":"维持性透析患者，血细胞比容偏高，既往后稀释HF时滤器反复凝血，但又希望保持较高清除效率。应如何选择稀释方式？如何设定比例？","a":"①选择混合稀释法：清除效率较高且滤器不易堵塞，对血细胞比容高者较实用；②前稀释率要小于后稀释率，前:后=1:2；③置换量可参考前稀释法（血流量的50%～60%，4h约30～50L）；④有高凝倾向者不宜单纯后稀释。","key":"混合稀释兼顾清除与防凝，但前稀释比例不能大于后稀释。","page":144},{"id":619,"chapter":"第12章 血液滤过","section":"六、抗凝方法","roles":["医生","护士"],"level":"基础","type":"填空","q":"血液滤过普通肝素抗凝：一般首剂量____U/kg（0.3～0.5mg/kg），追加剂量____U/h（5～10mg/h），血液滤过结束前____min停止追加。","a":"37.5～62.5；625～1250；30～60","key":"HF普通肝素按体重给首剂，与CRRT按固定量给首剂不同。","page":145},{"id":620,"chapter":"第12章 血液滤过","section":"六、抗凝方法","roles":["医生"],"level":"基础","type":"简答","q":"血液滤过使用低分子量肝素抗凝的适用人群、剂量及给药时机？","a":"适用于无活动性出血或无潜在出血风险的患者；一般选择60～80IU/kg，推荐在治疗前20～30min静脉注射，无需追加剂量。","key":"LMWH需提前20～30min给药，且HF中无需追加。","page":145},{"id":621,"chapter":"第12章 血液滤过","section":"六、抗凝方法","roles":["医生","护士"],"level":"高级","type":"简答","q":"血液滤过采用非含钙置换液时，局部枸橼酸抗凝如何实施与监测？","a":"①4%枸橼酸钠泵速（ml/h）＝（1.2～1.5）×血流速度（ml/min），滤器前持续注入；②控制滤器后游离钙0.25～0.35mmol/L；③静脉端给予氯化钙生理盐水（10%氯化钙80ml加入1000ml生理盐水）40ml/h或10%葡萄糖酸钙25～30ml/h，控制体内游离钙1.0～1.35mmol/L；④抗凝效果佳，但需定期抽血气分析评估内环境，调整补钙速度。","key":"两个钙目标值必须分清：滤器后0.25～0.35、体内1.0～1.35mmol/L。","page":145},{"id":622,"chapter":"第12章 血液滤过","section":"六、抗凝方法","roles":["医生","护士"],"level":"进阶","type":"填空","q":"含钙置换液后稀释血液滤过时，滤器前4%枸橼酸钠泵速（ml/h）＝（____）×血流速度（ml/min）；静脉壶同时注入时泵速＝（____）×血流速度。","a":"0.9～1.13；0.3～0.37","key":"非含钙方案系数1.2～1.5，含钙方案0.9～1.13，静脉壶0.3～0.37，三组系数易混。","page":145},{"id":623,"chapter":"第12章 血液滤过","section":"六、抗凝方法","roles":["医生"],"level":"进阶","type":"判断","q":"含钙置换液时，推荐枸橼酸钠用于前稀释置换法血液滤过。（对/错？）","a":"错。枸橼酸钠用于前稀释时受置换液中钙影响抗凝效果较差，因此推荐用于含钙置换液后稀释置换法血液滤过。","key":"含钙置换液+前稀释=钙中和枸橼酸，抗凝差。","page":145},{"id":624,"chapter":"第12章 血液滤过","section":"六、抗凝方法","roles":["医生"],"level":"高级","type":"简答","q":"含钙置换液后稀释枸橼酸抗凝方案存在哪些局限和风险？","a":"①管路静脉端采血点在补充置换液后，难以评估滤器是否得到充分抗凝；②静脉壶直接补充枸橼酸盐及总体增加枸橼酸输注量，长时间治疗可导致低钙血症、代谢性碱中毒和高钠血症发生风险增加；③需依据滤器后和管路动脉端（体内）游离钙浓度调整枸橼酸及钙剂速度。","key":"枸橼酸总量增加带来的三大风险：低钙、代碱、高钠。","page":145},{"id":625,"chapter":"第12章 血液滤过","section":"六、抗凝方法","roles":["医生"],"level":"进阶","type":"简答","q":"血液滤过中阿加曲班的适用人群和用法？","a":"适用于活动性出血或高危出血风险、肝素类药物过敏或既往发生HIT的患者；一般首剂量250μg/kg，追加1～2μg/（kg·min）持续滤器前给药；治疗结束前20～30min停止追加；依据血浆APTT监测调整剂量。","key":"阿加曲班停药提前量（20～30min）短于肝素（30～60min）。","page":145},{"id":626,"chapter":"第12章 血液滤过","section":"六、抗凝方法","roles":["护士"],"level":"进阶","type":"简答","q":"血液滤过无抗凝剂治疗时，管路如何预冲和冲洗？","a":"①既往无肝素类药物过敏和HIT者：治疗前用500U/dl（4mg/dl）肝素生理盐水预冲、闭式循环20min，再用生理盐水500ml冲洗；治疗中每30～60min给予100～200ml生理盐水冲洗管路和滤器；②存在肝素类药物过敏和HIT者：只使用生理盐水冲洗透析器及管路。","key":"HIT患者连预冲也不能用肝素盐水。","page":145},{"id":627,"chapter":"第12章 血液滤过","section":"六、抗凝方法","roles":["医生","护士"],"level":"高级","type":"案例分析","q":"患者既往发生HIT，现消化道活动性出血，需行血液滤过。若选择无抗凝剂方式，应如何选择稀释模式及处理管路？","a":"①稀释模式：无抗凝剂血液滤过建议选择前稀释置换法；②预冲：因存在HIT，禁用肝素生理盐水预冲，只使用生理盐水冲洗透析器及管路；③治疗中每30～60min给予100～200ml生理盐水冲洗管路和滤器；④也可考虑阿加曲班（适用于活动性出血、HIT患者，首剂250μg/kg，追加1～2μg/（kg·min），按APTT调整）。","key":"HIT+无抗凝：前稀释+纯生理盐水，绝不能用肝素盐水预冲。","page":145},{"id":628,"chapter":"第12章 血液滤过","section":"七、血滤器选择","roles":["医生","技师"],"level":"基础","type":"简答","q":"血液滤过如何选择滤器？","a":"首选血滤器，也可使用具有高水分通透性和高溶质滤过率的高通量透析器；根据患者体表面积选择血滤器的膜面积。","key":"膜面积依据体表面积选择。","page":146},{"id":629,"chapter":"第12章 血液滤过","section":"八、置换液","roles":["技师"],"level":"基础","type":"填空","q":"血液滤过置换液须无菌、无致热原：内毒素____EU/ml，细菌数____CFU/ml。","a":"＜0.03；＜1×10⁻⁶","key":"置换液标准远严于透析液，单位与数量级是考核热点。","page":146},{"id":630,"chapter":"第12章 血液滤过","section":"八、置换液","roles":["医生","技师"],"level":"进阶","type":"简答","q":"血液滤过常用置换液配方各离子浓度是多少？","a":"钠135～145mmol/L、钾2.0～3.0mmol/L、钙1.25～1.75mmol/L、镁0.5～0.75mmol/L、氯103～110mmol/L、碳酸氢盐30～34mmol/L；成分应与细胞外液一致，钾、钠、钙浓度可调。","key":"HF置换液钾2.0～3.0，与CRRT置换液钾0～6的调节范围不同。","page":146},{"id":631,"chapter":"第12章 血液滤过","section":"八、置换液","roles":["技师"],"level":"基础","type":"简答","q":"血液滤过置换液有哪两种制备方式？目前主要方式是什么？","a":"①联机法（on-line）：为目前主要方式，反渗水与浓缩液按比例稀释制备成置换液，再经过滤后输入体内；②商品化置换液或用静脉输液制剂配制：可个体化调整成分，但价格昂贵，常规血液滤过基本不使用。","key":"常规HF以on-line为主，商品化置换液是CRRT首选，二者勿混。","page":146},{"id":632,"chapter":"第12章 血液滤过","section":"九、操作程序及监测","roles":["护士","技师"],"level":"基础","type":"简答","q":"血液滤过密闭式预冲的操作要点有哪些？","a":"①启动血泵80～100ml/min，用生理盐水先排净管路和血液滤过器血室（膜内）气体，流向动脉端→透析器→静脉端，不得逆向预冲；②在线预冲通过置换液连接管，用机器在线产生的置换液按体外循环血流方向密闭冲洗；③生理盐水预冲量严格按说明书；需闭式循环或肝素生理盐水预冲应在生理盐水预冲量达到后再进行；④预冲液直接流入废液收集袋，袋放于机器液体架上，不得低于操作者腰部以下；⑤冲洗完毕后根据医嘱设置治疗参数。","key":"禁止逆向预冲；闭式循环/肝素预冲须在生理盐水量足够后。","page":147},{"id":633,"chapter":"第12章 血液滤过","section":"九、操作程序及监测","roles":["护士","技师"],"level":"基础","type":"简答","q":"血液滤过开机自检及管路安装有哪些要求？","a":"开机：检查电源线连接、打开电源总开关、按机器要求完成全部自检程序，严禁简化或跳过自检。安装：检查滤器及管路有无破损、外包装完好，查看有效日期和型号，无菌操作；管路按体外循环血流方向依次安装，置换液连接管按置换液流向顺序安装。","key":"HF比HD多一条：置换液连接管按置换液流向安装。","page":147},{"id":634,"chapter":"第12章 血液滤过","section":"九、操作程序及监测","roles":["护士"],"level":"基础","type":"判断","q":"为方便操作，血液滤过预冲生理盐水可直接流入开放式废液桶中。（对/错？）","a":"错。预冲生理盐水应直接流入废液收集袋中，废液收集袋放于机器液体架上，不得低于操作者腰部以下；不建议直接流入开放式废液桶。","key":"感控要点：密闭+废液袋高度不低于腰部。","page":148},{"id":635,"chapter":"第12章 血液滤过","section":"十、并发症及处理","roles":["医生","护士","技师"],"level":"进阶","type":"简答","q":"血液滤过致热原反应和败血症的原因及防治措施？","a":"原因：需输入大量置换液，若被污染可发生发热和败血症。防治：①定期检测反渗水、透析液及置换液的细菌和内毒素；②定期更换内毒素过滤器；③置换液配制过程无菌操作；④使用前严格检查置换液、血滤器及管路包装与有效期，检查置换液颜色与透明度；⑤出现发热者同时做血液和置换液细菌培养及置换液内毒素检测；⑥抗生素治疗。","key":"发热时必须“血+置换液”双培养，并测置换液内毒素。","page":148},{"id":636,"chapter":"第12章 血液滤过","section":"十、并发症及处理","roles":["医生","护士","技师"],"level":"进阶","type":"案例分析","q":"on-line血液滤过治疗1h后患者寒战、高热，同日同机房另一患者也出现类似表现。应如何处理与排查？","a":"①考虑置换液污染所致致热原反应/败血症；②同时做血液和置换液细菌培养及置换液内毒素检测；③抗生素治疗；④排查：定期检测反渗水、透析液及置换液的细菌和内毒素，检查内毒素过滤器是否按期更换，核查置换液配制是否无菌操作；⑤使用前严格检查置换液、血滤器及管路包装与有效期、置换液颜色与透明度。","key":"群发性发热首先追溯水处理和内毒素过滤器。","page":148},{"id":637,"chapter":"第12章 血液滤过","section":"十、并发症及处理","roles":["医生"],"level":"基础","type":"简答","q":"血液滤过氨基酸与蛋白质丢失的原因及处理？","a":"原因：随大量置换液滤出；治疗：建议增加饮食中的蛋白质摄入量。","key":"对流治疗营养丢失是长期HF患者营养不良的原因之一。","page":148},{"id":638,"chapter":"第12章 血液滤过","section":"十、并发症及处理","roles":["医生"],"level":"进阶","type":"案例分析","q":"规律HF患者每周3次，近期乏力、食欲不佳，单次URR约45%。原因是什么？如何调整？","a":"①原因：置换量相对不足，单次血液滤过URR 40%～50%，透析不充分；②处理：增加置换量或血液滤过次数，每周治疗4～5次，也可考虑改做血液透析滤过。","key":"HF单次URR仅40%～50%，每周3次常不足，需4～5次。","page":149},{"id":639,"chapter":"第13章 血液透析滤过","section":"一、定义及概述","roles":["医生"],"level":"基础","type":"简答","q":"什么是血液透析滤过（HDF）？其清除溶质的机制和优势是什么？","a":"HDF是血液透析和血液滤过的结合，具有两种治疗模式的优点，通过弥散和对流两种机制清除溶质，在单位时间内比单独的血液透析或血液滤过清除更多的中小分子物质。","key":"HDF=弥散+对流。","page":150},{"id":640,"chapter":"第13章 血液透析滤过","section":"二、适应证及禁忌证","roles":["医生"],"level":"基础","type":"简答","q":"HDF适应证同血液滤过，哪些情况下HDF更具优势？","a":"①透析不充分；②透析相关的淀粉样变；③心血管功能不稳定；④神经系统并发症。","key":"四类优势人群常考：不充分、淀粉样变、心血管不稳、神经系统并发症。","page":150},{"id":641,"chapter":"第13章 血液透析滤过","section":"二、适应证及禁忌证","roles":["医生"],"level":"基础","type":"判断","q":"血液透析滤过的禁忌证同血液滤过。（对/错？）","a":"对。原文规定HDF禁忌证同血液滤过，参照第12章。","key":"原文要点逐字掌握，数值与条件勿混淆。","page":150},{"id":642,"chapter":"第13章 血液透析滤过","section":"四、治疗模式和处方","roles":["医生","护士"],"level":"基础","type":"填空","q":"HDF建议血流速度____ml/min，透析液流速____ml/min，以清除适量的溶质。","a":"＞250；500～800","key":"HDF透析液流速500～800，高于普通HD常规。","page":150},{"id":643,"chapter":"第13章 血液透析滤过","section":"七、血液透析滤过器选择","roles":["医生","技师"],"level":"基础","type":"判断","q":"血液透析滤过只能使用血滤器，不能使用高通量透析器。（对/错？）","a":"错。血液透析滤过可使用血滤器或高通量透析器（同血液滤过）。","key":"原文要点逐字掌握，数值与条件勿混淆。","page":151},{"id":644,"chapter":"第13章 血液透析滤过","section":"九、操作程序及监测","roles":["护士","技师"],"level":"进阶","type":"填空","q":"HDF密闭式预冲：先以血泵____ml/min排净膜内气体；再将泵速调至____ml/min，连接透析液接头与滤器旁路，排净透析液室（膜外）气体。","a":"80～100；200～300","key":"HDF比HF多一步膜外排气，泵速提至200～300。","page":152},{"id":645,"chapter":"第13章 血液透析滤过","section":"十、并发症及处理","roles":["医生","护士"],"level":"进阶","type":"简答","q":"HDF反超滤的原因是什么？严重可导致什么后果？","a":"低静脉压、低超滤率或采用高超滤系数的透析器时，在透析器出口血液侧压力可能低于透析液侧，从而出现反超滤，严重可致患者肺水肿。","key":"反超滤三诱因：低静脉压、低超滤率、高超滤系数。","page":153},{"id":646,"chapter":"第13章 血液透析滤过","section":"十、并发症及处理","roles":["医生","护士"],"level":"基础","type":"填空","q":"预防HDF反超滤应调整适当TMP为____mmHg，血流量____ml/min。","a":"100～400；＞250","key":"原文要点逐字掌握，数值与条件勿混淆。","page":153},{"id":647,"chapter":"第13章 血液透析滤过","section":"十、并发症及处理","roles":["医生"],"level":"高级","type":"案例分析","q":"HDF治疗中使用高超滤系数透析器，设定超滤率很低，静脉压偏低，患者逐渐出现气促、肺部湿啰音。请分析原因并给出预防措施。","a":"①考虑反超滤：低静脉压、低超滤率、高超滤系数透析器时，透析器出口血液侧压力可能低于透析液侧，透析液反向进入血液，严重可致肺水肿；②预防：调整适当TMP（100～400mmHg），血流量＞250ml/min；③同时按肺水肿处理。","key":"反超滤还带来透析液污染物入血风险，水质也要关注。","page":153},{"id":648,"chapter":"第13章 血液透析滤过","section":"十、并发症及处理","roles":["医生","护士"],"level":"进阶","type":"判断","q":"HDF治疗中白蛋白丢失增多，尤以前稀释置换法为甚。（对/错？）","a":"错。白蛋白丢失增多尤其见于后稀释置换法；高通量透析还增加可溶性维生素、微量元素和小分子多肽等丢失，应及时补充营养（耗损综合征）。","key":"后稀释白蛋白丢失更多。","page":153},{"id":649,"chapter":"第14章 连续性肾脏替代治疗","section":"一、定义及概述","roles":["医生"],"level":"基础","type":"简答","q":"CRRT的定义是什么？传统治疗时间要求？","a":"CRRT是指一组体外血液净化的治疗技术，是所有连续、缓慢清除水分和溶质治疗方式的总称。传统CRRT应持续治疗24h以上，但临床上可根据患者治疗需求灵活调整治疗时间。治疗目的已扩展到常见危重疾病的急救。","key":"“24h以上”是传统要求，临床可灵活调整。","page":154},{"id":650,"chapter":"第14章 连续性肾脏替代治疗","section":"一、定义及概述","roles":["医生","护士"],"level":"基础","type":"简答","q":"目前CRRT主要包括哪些技术？","a":"①缓慢连续超滤（SCUF）；②连续性静脉-静脉血液滤过（CVVH）；③连续性静脉-静脉血液透析滤过（CVVHDF）；④连续性静脉-静脉血液透析（CVVHD）；⑤连续性高通量透析（CHFD）；⑥连续性高容量血液滤过（HVHF）；⑦连续性血浆滤过吸附（CPFA）。","key":"共7种，英文缩写要对应准确。","page":154},{"id":651,"chapter":"第14章 连续性肾脏替代治疗","section":"二、适应证及禁忌证","roles":["医生"],"level":"基础","type":"简答","q":"CRRT在肾脏疾病中的适应证有哪些？","a":"①重症急性肾损伤：伴血流动力学不稳定和需要持续清除过多水或毒性物质，如AKI合并严重电解质紊乱、酸碱代谢失衡、心力衰竭、肺水肿、脑水肿、ARDS、外科术后、严重感染等；②慢性肾脏病并发症：合并急性肺水肿、尿毒症脑病、心力衰竭、血流动力学不稳定等。","key":"原文要点逐字掌握，数值与条件勿混淆。","page":154},{"id":652,"chapter":"第14章 连续性肾脏替代治疗","section":"二、适应证及禁忌证","roles":["医生"],"level":"进阶","type":"简答","q":"CRRT的非肾脏疾病适应证有哪些？","a":"多器官功能障碍综合征、脓毒血症或感染性休克、ARDS、挤压综合征、乳酸酸中毒、急性重症胰腺炎、心肺体外循环手术、慢性心力衰竭、肝性脑病、药物或毒物中毒、严重容量负荷、严重的电解质和酸碱代谢紊乱、肿瘤溶解综合征、热射病等。","key":"热射病、肿瘤溶解综合征是近年新增常考点。","page":155},{"id":653,"chapter":"第14章 连续性肾脏替代治疗","section":"二、适应证及禁忌证","roles":["医生"],"level":"基础","type":"判断","q":"CRRT存在绝对禁忌证，难以纠正的低血压患者禁止行CRRT。（对/错？）","a":"错。CRRT无绝对禁忌证，但存在以下情况时应慎用：①无法建立合适的血管通路；②难以纠正的低血压；③恶病质，如恶性肿瘤伴全身转移。","key":"是“慎用”而非“禁用”。","page":155},{"id":654,"chapter":"第14章 连续性肾脏替代治疗","section":"三、治疗前患者评估","roles":["医生"],"level":"进阶","type":"简答","q":"CRRT治疗前评估由谁负责？治疗的最终决定权属于谁？","a":"评估适应证和禁忌证以保证有效性和安全性；是否需要CRRT应由有资质的肾脏专科或ICU医师决定，但最终决定权为患者或其家属；肾脏专科和/或ICU医师负责患者筛选、治疗方案确定等。","key":"医师“决定是否需要”，患者/家属拥有“最终决定权”。","page":155},{"id":655,"chapter":"第14章 连续性肾脏替代治疗","section":"四、治疗时机","roles":["医生"],"level":"进阶","type":"简答","q":"CRRT的治疗时机如何把握？","a":"①出现危及生命的容量负荷过多（如急性肺水肿）、电解质紊乱或酸碱失衡时应立即进行；②治疗所需代谢及容量需求超过肾脏能力时考虑；③重症AKI按2012年KDIGO分期，进入2期时可考虑CRRT干预；④心脏术后合并容量负荷的AKI可考虑早期干预。","key":"KDIGO 2期“可考虑”，危及生命情况“立即”。","page":155},{"id":656,"chapter":"第14章 连续性肾脏替代治疗","section":"四、治疗时机","roles":["医生"],"level":"高级","type":"案例分析","q":"患者体外循环心脏术后第1天，少尿，体重较术前增加明显，双肺湿啰音，血钾5.2mmol/L，按KDIGO为AKI 1期。是否可考虑CRRT？依据是什么？","a":"可考虑。依据：①对于心脏术后合并容量负荷的AKI患者，可考虑CRRT早期干预；②若出现危及生命的容量负荷过多（如急性肺水肿）、电解质紊乱或酸碱失衡，应立即进行；③一般重症AKI进入KDIGO 2期时可考虑干预，但心脏术后容量负荷属于早期干预的特殊情形；④当代谢及容量需求超过肾脏能力时亦考虑CRRT。","key":"不能机械等到KDIGO 2期，心脏术后容量负荷可早期干预。","page":155},{"id":657,"chapter":"第14章 连续性肾脏替代治疗","section":"五、治疗模式和处方","roles":["医生"],"level":"基础","type":"简答","q":"CRRT最常用的治疗方式是哪几种？各有何特点？SCUF主要用于什么？","a":"①CVVHD、CVVHDF及CVVH是最常用方式；CVVHDF和CVVH具有清除中大分子毒素、炎症因子和代谢产物的优势；三种均可作为重症AKI治疗方式；②SCUF主要用于清除过多液体，溶质清除能力极弱，常用于充血性心力衰竭患者的脱水治疗。","key":"需清除炎症因子时优选含对流的CVVH/CVVHDF。","page":156},{"id":658,"chapter":"第14章 连续性肾脏替代治疗","section":"五、治疗模式和处方","roles":["医生","护士"],"level":"基础","type":"填空","q":"表14-1：SCUF血流量为____ml/min；CVVH、CVVHD、CVVHDF血流量均为____ml/min。","a":"50～100；50～200","key":"SCUF血流量低于其他模式。","page":156},{"id":659,"chapter":"第14章 连续性肾脏替代治疗","section":"五、治疗模式和处方","roles":["医生","护士"],"level":"进阶","type":"填空","q":"表14-1：CVVHD透析液____ml/min；CVVHDF透析液____ml/min、置换液____ml/（kg·h）；CVVH置换液____ml/（kg·h）。","a":"20～30；10～20；10～20；20～30","key":"注意单位：透析液为ml/min，置换液为ml/（kg·h）。","page":156},{"id":660,"chapter":"第14章 连续性肾脏替代治疗","section":"五、治疗模式和处方","roles":["医生"],"level":"进阶","type":"判断","q":"CVVHD对中分子的清除能力与CVVH相当，均为“+++”。（对/错？）","a":"错。CVVHD以弥散为主，中分子清除能力仅为“+”；CVVH（对流）和CVVHDF（对流+弥散）中分子清除能力为“+++”；三者小分子清除均为“+++”；SCUF极弱。","key":"弥散清小分子、对流清中分子。","page":156},{"id":661,"chapter":"第14章 连续性肾脏替代治疗","section":"五、治疗模式和处方","roles":["医生"],"level":"基础","type":"填空","q":"CRRT推荐以体重标化的流出液容积作为剂量单位，治疗剂量建议为____ml/（kg·h），前稀释时治疗剂量可增加____。","a":"20～25；5%～10%","key":"前稀释需上调剂量以抵消稀释效应。","page":156},{"id":662,"chapter":"第14章 连续性肾脏替代治疗","section":"五、治疗模式和处方","roles":["医生"],"level":"进阶","type":"简答","q":"CRRT处方剂量与达成剂量如何评估？预计治疗时间不足24h时怎么办？","a":"至少每24h对CRRT处方剂量和达成剂量进行评估，要求达成剂量至少大于处方剂量的80%；当预计治疗时间不足24h时，需通过增加治疗剂量达到治疗目的。","key":"停机、换管、外出检查都会使达成剂量下降，需每日核算。","page":156},{"id":663,"chapter":"第14章 连续性肾脏替代治疗","section":"五、治疗模式和处方","roles":["医生"],"level":"高级","type":"案例分析","q":"体重70kg的AKI患者行前稀释CVVH，请计算推荐治疗剂量（流出液）范围；若昨日因滤器凝血、外出CT等实际达成剂量仅为处方的70%，应如何处理？","a":"①基础剂量20～25ml/（kg·h）×70kg＝1400～1750ml/h；②前稀释可增加5%～10%，约1470～1925ml/h；③达成剂量要求至少大于处方剂量的80%，70%不达标，需分析中断原因（凝血、外出等）并调整处方/抗凝，必要时增加治疗剂量；④至少每24h评估一次。","key":"剂量按“流出液”计算，前稀释需上浮。","page":156},{"id":664,"chapter":"第14章 连续性肾脏替代治疗","section":"五、治疗模式和处方","roles":["医生","护士"],"level":"进阶","type":"简答","q":"什么是滤过分数（FF）？一般控制在多少？前稀释与后稀释对FF的影响？","a":"FF是超滤量与经过滤器血浆流量的比值，一般控制在25%～30%以内。前稀释有利于降低滤过分数从而延长滤器寿命，后稀释则具有更高的溶质清除效率。","key":"FF过高是后稀释滤器凝血的主要原因。","page":156},{"id":665,"chapter":"第14章 连续性肾脏替代治疗","section":"五、治疗模式和处方","roles":["医生"],"level":"基础","type":"判断","q":"CRRT中前稀释的溶质清除效率高于后稀释。（对/错？）","a":"错。前稀释有利于降低滤过分数、延长滤器寿命；后稀释具有更高的溶质清除效率。","key":"原文要点逐字掌握，数值与条件勿混淆。","page":156},{"id":666,"chapter":"第14章 连续性肾脏替代治疗","section":"六、血管通路","roles":["医生","护士"],"level":"基础","type":"填空","q":"CRRT无隧道无涤纶套中心静脉导管留置长度：股静脉____cm，右侧颈内静脉____cm，左侧颈内静脉____cm。","a":"20～25；12～15；15～20","key":"左颈内比右颈内长，股静脉最长。","page":157},{"id":667,"chapter":"第14章 连续性肾脏替代治疗","section":"六、血管通路","roles":["医生"],"level":"基础","type":"简答","q":"CRRT无隧道无涤纶套导管首选哪些部位？置管有何要求？","a":"常用颈内、股静脉及锁骨下静脉，右侧颈内静脉及股静脉插管均可作为首选；置管时严格无菌操作；提倡在超声引导下置管，可提高成功率和安全性。","key":"原文要点逐字掌握，数值与条件勿混淆。","page":157},{"id":668,"chapter":"第14章 连续性肾脏替代治疗","section":"六、血管通路","roles":["医生"],"level":"基础","type":"判断","q":"预计CRRT治疗时间超过3周，可使用带隧道带涤纶套中心静脉导管，置管首选右侧颈内静脉；动静脉内瘘也推荐作为CRRT通路。（对/错？）","a":"错。前半句正确：带隧道带涤纶套导管并不推荐常规使用，预计超过3周可使用，首选右侧颈内静脉；但不推荐采用动静脉内瘘或人工血管作为CRRT的血管通路。","key":"CRRT禁止常规用内瘘/人工血管，长时间穿刺易损伤。","page":157},{"id":669,"chapter":"第14章 连续性肾脏替代治疗","section":"七、抗凝方法","roles":["医生"],"level":"高级","type":"简答","q":"CRRT抗凝方式选择的总体原则是什么？","a":"①常用抗凝剂包括肝素、低分子量肝素、枸橼酸、阿加曲班，均有禁忌时可无抗凝剂；②不合并血栓栓塞疾病及其风险者，推荐局部枸橼酸抗凝作为首选（滤器管路寿命长、出血风险低）；③合并血栓栓塞疾病及其风险者，首选肝素类全身抗凝剂；④目前尚无适合所有人群的抗凝方式，应个体化选择。","key":"有血栓风险需全身抗凝，RCA只抗凝体外循环。","page":157},{"id":670,"chapter":"第14章 连续性肾脏替代治疗","section":"七、抗凝方法","roles":["医生"],"level":"高级","type":"简答","q":"CRRT患者合并出血风险且未接受抗凝药物治疗时，如何选择抗凝？枸橼酸的禁忌情况有哪些？","a":"①无枸橼酸禁忌时建议用枸橼酸抗凝，而不是无抗凝剂方式；②存在枸橼酸禁忌（动脉氧分压＜60mmHg和/或组织灌注不足、代谢性碱中毒、高钠血症）且无严重肝功能衰竭者，建议使用阿加曲班；③不建议使用局部肝素化（鱼精蛋白中和）方式。（无出血风险者：无枸橼酸禁忌用枸橼酸，有禁忌用普通肝素或LMWH。）","key":"出血风险患者“枸橼酸优于无抗凝”；阿加曲班需排除严重肝衰。","page":157},{"id":671,"chapter":"第14章 连续性肾脏替代治疗","section":"七、抗凝方法","roles":["医生"],"level":"进阶","type":"判断","q":"CRRT患者合并出血风险时，可使用局部肝素化（鱼精蛋白中和）的方式抗凝。（对/错？）","a":"错。规程明确不建议使用局部肝素化（鱼精蛋白中和）的方式抗凝。","key":"原文要点逐字掌握，数值与条件勿混淆。","page":157},{"id":672,"chapter":"第14章 连续性肾脏替代治疗","section":"七、抗凝方法","roles":["医生"],"level":"高级","type":"案例分析","q":"ICU患者使用肝素后血小板由210×10⁹/L降至80×10⁹/L，确诊HIT，同时合并AKI需CRRT，肝功能基本正常、乳酸1.8mmol/L。如何选择抗凝？","a":"①推荐停用所有肝素类药物（包括LMWH、肝素盐水预冲/封管）；②推荐使用阿加曲班或枸橼酸制剂，而不是其他抗凝药物或无抗凝剂方式；③该患者无枸橼酸禁忌，可选局部枸橼酸抗凝；或阿加曲班1～2μg/（kg·min）滤器前持续给药，可给首剂约250μg/kg，按APTT调整；④封管避免肝素，可用4%枸橼酸钠。","key":"HIT时LMWH同样禁用，封管液也要换。","page":157},{"id":673,"chapter":"第14章 连续性肾脏替代治疗","section":"七、抗凝方法","roles":["医生","护士"],"level":"进阶","type":"简答","q":"CRRT局部枸橼酸抗凝的常用处方和监测目标？","a":"①4%枸橼酸钠溶液及含3%枸橼酸的ACD-A均可用，以4%枸橼酸钠最常用；②4%枸橼酸钠（ml/h）常为血流速度（ml/min）的1.3倍；③维持体外循环枸橼酸浓度3～4mmol/L；④滤器后游离钙0.25～0.35mmol/L；⑤静脉血游离钙1.0～1.35mmol/L，需根据治疗前基础游离钙水平调整；⑥为避免滤过分数过高，推荐CVVHDF及CVVHD模式，若用CVVH应尽量保证FF控制在30%以内。","key":"CRRT 1.3倍与HF非含钙方案1.2～1.5倍可对照记忆。","page":158},{"id":674,"chapter":"第14章 连续性肾脏替代治疗","section":"七、抗凝方法","roles":["医生","护士"],"level":"进阶","type":"案例分析","q":"CVVHDF局部枸橼酸抗凝，血流量设定150ml/min，4%枸橼酸钠初始速度应设多少？治疗2h后滤器后游离钙0.48mmol/L，体内游离钙1.12mmol/L，如何解读？","a":"①初始速度≈1.3×150＝195ml/h；②滤器后游离钙目标0.25～0.35mmol/L，0.48偏高，提示体外抗凝不足，应适当上调枸橼酸速度并复测；③体内游离钙1.12在1.0～1.35mmol/L目标内，补钙速度暂可维持；④体外循环枸橼酸浓度目标3～4mmol/L。","key":"滤器后钙调枸橼酸，体内钙调补钙，两条线不要交叉调。","page":158},{"id":675,"chapter":"第14章 连续性肾脏替代治疗","section":"七、抗凝方法","roles":["医生","护士"],"level":"进阶","type":"简答","q":"CRRT局部枸橼酸抗凝时，置换液和钙剂如何选择与补充？","a":"①常采用无钙置换液，需在静脉端持续泵入钙剂（10%葡萄糖酸钙或10%氯化钙），主要根据置换液使用量调整补钙速度，维持体内钙平衡；②为提高易操作性，也可采用含钙置换液（1.5mmol/L）进行简化枸橼酸抗凝，一般不需常规静脉端补钙。","key":"钙剂必须从静脉端补，不能从动脉端补。","page":158},{"id":676,"chapter":"第14章 连续性肾脏替代治疗","section":"七、抗凝方法","roles":["医生"],"level":"高级","type":"判断","q":"感染性休克患者乳酸5.2mmol/L、肝功能正常、无出血，CRRT可首选局部枸橼酸抗凝。（对/错？）","a":"错。组织灌注差（乳酸大于4mmol/L）的患者应禁用局部枸橼酸抗凝，此时枸橼酸代谢障碍易蓄积中毒。","key":"RCA四禁：肝功能障碍、严重低氧血症、乳酸＞4、高钠血症。","page":158},{"id":677,"chapter":"第14章 连续性肾脏替代治疗","section":"七、抗凝方法","roles":["医生"],"level":"基础","type":"填空","q":"对于存在____、严重低氧血症、组织灌注差（乳酸大于____mmol/L）及____的患者，应禁用局部枸橼酸抗凝。","a":"肝功能障碍；4；高钠血症","key":"原文要点逐字掌握，数值与条件勿混淆。","page":158},{"id":678,"chapter":"第14章 连续性肾脏替代治疗","section":"七、抗凝方法","roles":["医生","护士"],"level":"进阶","type":"填空","q":"CRRT普通肝素：前稀释首剂量____U（15～20mg），追加____U/h；后稀释首剂量____U（20～30mg），追加____U/h；治疗结束前30～60min停止追加。","a":"1875～2500；625～1250；2500～3750；1000～1875","key":"后稀释肝素用量高于前稀释；治疗时间越长追加剂量应逐渐减少。","page":158},{"id":679,"chapter":"第14章 连续性肾脏替代治疗","section":"七、抗凝方法","roles":["医生","护士"],"level":"高级","type":"简答","q":"CRRT普通肝素抗凝如何监测ACT和APTT？各自采血部位？","a":"①从静脉端管路采血检测ACT评估抗凝有效性，控制ACT为正常值的1.5～2倍；②从管路动脉端或患者静脉采血检测APTT，若APTT大于正常值的1.5～2倍，提示抗凝剂使用过量、患者存在出血风险，需适当减少追加剂量。","key":"ACT看体外（静脉端），APTT看体内（动脉端/外周）。","page":158},{"id":680,"chapter":"第14章 连续性肾脏替代治疗","section":"七、抗凝方法","roles":["医生","护士"],"level":"高级","type":"案例分析","q":"CRRT后稀释普通肝素抗凝第2天，患者气管切开处渗血增多，管路动脉端采血APTT为正常值的2.3倍。应如何判断和处理？","a":"①APTT大于正常值1.5～2倍提示抗凝剂过量、存在出血风险，需适当减少普通肝素追加剂量；②治疗时间越长，追加剂量应逐渐减少；③评估是否改用局部枸橼酸抗凝（合并出血风险且无枸橼酸禁忌时建议用枸橼酸）；④必要时参照抗凝并发症处理。","key":"长时程CRRT肝素蓄积，追加量应随时间递减。","page":158},{"id":681,"chapter":"第14章 连续性肾脏替代治疗","section":"七、抗凝方法","roles":["医生"],"level":"进阶","type":"简答","q":"CRRT使用低分子量肝素的用法与监测？","a":"①不同LMWH品牌分子量构成、半衰期及生物活性差异大，抗凝效果存在差异；②检测抗Ⅹa水平反映疗效，一般控制0.25～0.35IU/ml；③一般给予60～80IU/kg静脉注射，每4～6h给予30～40IU/kg静脉注射；治疗时间越长，追加剂量应逐渐减少。","key":"CRRT中LMWH需每4～6h追加，与间歇治疗“无需追加”不同。","page":158},{"id":682,"chapter":"第14章 连续性肾脏替代治疗","section":"七、抗凝方法","roles":["医生"],"level":"基础","type":"简答","q":"CRRT阿加曲班如何给药？","a":"一般1～2μg/（kg·min）持续滤器前给药，也可给予一定首剂量（250μg/kg左右），依据凝血状态和血浆APTT监测调整剂量。","key":"严重肝衰竭者不建议用阿加曲班。","page":158},{"id":683,"chapter":"第14章 连续性肾脏替代治疗","section":"七、抗凝方法","roles":["护士"],"level":"高级","type":"判断","q":"无抗凝剂CRRT的生理盐水冲洗频度和量与无抗凝剂血液滤过相同，均为每30～60min冲洗100～200ml。（对/错？）","a":"错。无抗凝剂血液滤过为每30～60min给予100～200ml生理盐水冲洗；CRRT治疗过程可每60～120min给予200ml生理盐水冲洗管路和滤器。预冲均为500U/dl肝素盐水预冲保留20min后再500ml生理盐水冲洗（肝素禁忌者仅用生理盐水）。","key":"两章冲洗参数不同，考核常混淆。","page":159},{"id":684,"chapter":"第14章 连续性肾脏替代治疗","section":"九、置换液","roles":["医生","技师"],"level":"基础","type":"简答","q":"CRRT置换液的质量标准是什么？国内主要有哪几种？首选哪种？","a":"质量标准一般参照静脉输液标准：内毒素＜0.03EU/ml、细菌数＜1×10⁻⁶CFU/ml。主要包括商品化置换液、血液透析滤过机在线生产的online置换液及手工配制置换液。推荐商品化置换液作为首选。手工配制及向置换液中添加药物时必须在相对无菌环境下无菌操作。","key":"原文要点逐字掌握，数值与条件勿混淆。","page":159},{"id":685,"chapter":"第14章 连续性肾脏替代治疗","section":"九、置换液","roles":["技师","护士"],"level":"进阶","type":"简答","q":"比较商品化、Online和手工配制三种CRRT置换液的细菌污染风险和保存时间。","a":"①商品化：生产线统一加工并无菌消毒，无细菌污染，保存12～24个月，溶质稳定性优，酸碱电解质调节方便，个体化较易；②Online：机器在线生产并装袋，存在污染风险，24h内，稳定性优，不易调节，个体化较难；③手工配制：配制在3L袋中，污染风险较大，24h内，稳定性影响因素较多，调节方便，个体化容易。","key":"Online和手工配制均须24h内使用。","page":159},{"id":686,"chapter":"第14章 连续性肾脏替代治疗","section":"九、置换液","roles":["医生","护士"],"level":"进阶","type":"案例分析","q":"CRRT持续第3天，患者无明显诱因突然寒战、高热，伴抽搐。当日使用的是护士手工配制并添加了药物的置换液。如何处理？","a":"①在排除其他原因后需考虑置换液污染的可能；②应立即更换置换液；③对疑似污染的置换液进行细菌学检测；④强调手工配制及添加药物须在相对无菌环境下无菌操作；⑤优先采用商品化置换液。","key":"不要只做血培养而继续用可疑置换液。","page":159},{"id":687,"chapter":"第14章 连续性肾脏替代治疗","section":"九、置换液","roles":["医生","技师"],"level":"基础","type":"填空","q":"CRRT置换液：钠一般____mmol/L，钾一般控制在____mmol/L，氯____mmol/L，镁____mmol/L，葡萄糖____mmol/L。","a":"135～145；0～6；100～115；0.5～0.75；5～12","key":"使用较高或较低钾浓度置换液时须严密监测血钾，尽快恢复生理范围。","page":160},{"id":688,"chapter":"第14章 连续性肾脏替代治疗","section":"九、置换液","roles":["医生"],"level":"高级","type":"简答","q":"CRRT置换液碱基如何选择？为什么？","a":"推荐采用碳酸氢盐为基础碱基成分。因乳酸盐在肝功能衰竭、循环衰竭及严重低氧血症时代谢不充分，会带来治疗风险。采用枸橼酸抗凝时，枸橼酸成为置换液的主要碱基成分，在体内可代谢为碳酸氢盐。","key":"RCA时要把枸橼酸的碱负荷算进去，防代碱。","page":160},{"id":689,"chapter":"第14章 连续性肾脏替代治疗","section":"九、置换液","roles":["医生"],"level":"高级","type":"简答","q":"为什么CRRT中要重视磷的补充？推荐置换液磷浓度是多少？","a":"①国内置换液均不含磷，CRRT过程中低磷血症越来越受重视，研究发现低磷血症与预后呈负相关；②血清磷1.0～1.5mmol/L，但部分磷与血浆蛋白结合，可滤过的离子状态磷实际为0.9～1.0mmol/L；③因此推荐置换液磷浓度0.7～1.0mmol/L；常用配方未含磷，长时间治疗需从外周补充。","key":"低磷影响撤机和呼吸肌，需每日监测。","page":160},{"id":690,"chapter":"第14章 连续性肾脏替代治疗","section":"九、置换液","roles":["医生","护士"],"level":"进阶","type":"简答","q":"CRRT置换液的钙浓度如何？枸橼酸抗凝时如何处理？对高/低钠血症患者置换液钠如何调整？","a":"①国内商品化置换液钙1.5mmol/L，手工配置置换液钙波动在1.25～1.75mmol/L；②枸橼酸抗凝时可使用不含钙置换液，钙由单独通道补充；③合并严重高钠或低钠血症时，应根据血钠水平调整置换液钠浓度，避免血钠快速波动对机体造成损害。","key":"严重低钠血症纠正过快可致渗透性脱髓鞘。","page":160},{"id":691,"chapter":"第14章 连续性肾脏替代治疗","section":"九、置换液","roles":["技师","护士"],"level":"高级","type":"简答","q":"国内常用商品化CRRT置换液（4000ml A液+250ml B液）配制后的终浓度是多少？","a":"总量4250ml；终浓度：pH 7.40，Na⁺ 141mmol/L，Cl⁻ 110mmol/L，Ca²⁺ 1.5mmol/L，Mg²⁺ 0.75mmol/L，葡萄糖10mmol/L，HCO₃⁻ 35.0mmol/L。A液根据需要加入10%KCl，B液为NaHCO₃。","key":"A液本身Na⁺仅113mmol/L，必须配B液使用。","page":160},{"id":692,"chapter":"第14章 连续性肾脏替代治疗","section":"九、置换液","roles":["技师","护士"],"level":"高级","type":"填空","q":"改良Port配方：A液为0.9%NaCl____ml＋5%葡萄糖____ml＋注射用水820ml＋10%CaCl₂ ____ml＋50%MgSO₄ 1.6ml；B液为5%NaHCO₃ ____ml。","a":"3000；170；6.4；250","key":"Port配方终浓度Na⁺143、Ca²⁺1.4、Mg²⁺1.56、葡萄糖11.8、HCO₃⁻34.9mmol/L；不含磷。","page":161},{"id":693,"chapter":"第14章 连续性肾脏替代治疗","section":"十、停机时机","roles":["医生"],"level":"进阶","type":"简答","q":"接受CRRT的AKI患者何时可以停机？停机后如何衔接？","a":"①生命体征稳定、血流动力学正常、肾外重要器官功能恢复正常、水电解质酸碱紊乱及容量负荷纠正，可停止CRRT；②满足上述条件但肾功能未恢复者可改用间断性肾脏替代治疗（IRRT）；③尿量可满足营养治疗等容量负荷且肾功能逐渐恢复者可暂停RRT；④肾功能持续不恢复者可继续血液透析或腹膜透析，直到肾功能恢复或长期维持。","key":"停CRRT≠停肾替代，肾功能未恢复应转IRRT。","page":161},{"id":694,"chapter":"第14章 连续性肾脏替代治疗","section":"十一、封管液","roles":["医生","护士"],"level":"基础","type":"填空","q":"CRRT封管：无活动性出血或出血风险者建议用____U/ml肝素盐水封管；有活动性出血者建议用____封管，每____h 1次。","a":"1000；4%枸橼酸钠液；12～24","key":"活动性出血者禁用高浓度肝素封管。","page":161},{"id":695,"chapter":"第14章 连续性肾脏替代治疗","section":"十二、操作程序及监测","roles":["护士"],"level":"基础","type":"简答","q":"CRRT（CVVHDF、局部枸橼酸抗凝）治疗前准备有哪些要点？","a":"①着工作服或隔离衣，洗手、戴帽子口罩；②备血液滤过器、管路、置换液、生理盐水、透析液、4%枸橼酸钠、10%氯化钙或10%葡萄糖酸钙及消毒物品等；③连接电源完成全部自检，严禁简化或跳过；④检查滤器和管路包装、有效期、型号；⑤按屏幕提示安装滤器和管路，安放置换液袋，连接置换液、预冲液及废液袋，打开各管路夹；⑥完成自动预冲及自检，未通过应通知技术人员检修；⑦自检通过后检查显示，关闭动脉夹和静脉夹；⑧连接4%枸橼酸钠及钙剂。","key":"自检未通过不得上机，须通知技术人员。","page":162},{"id":696,"chapter":"第14章 连续性肾脏替代治疗","section":"十二、操作程序及监测","roles":["护士"],"level":"基础","type":"判断","q":"CRRT治疗开始时，按医嘱设置参数，此时血流量设置在100ml/min以下为宜，连接后再逐步调整至目标治疗量。（对/错？）","a":"对。治疗开始时血流量设置在100ml/min以下为宜，连接体外循环后逐步调整血流量等参数至目标治疗量，并查看各监测系统处于监测状态。","key":"危重患者引血过快易致低血压。","page":163},{"id":697,"chapter":"第14章 连续性肾脏替代治疗","section":"十二、操作程序及监测","roles":["护士"],"level":"进阶","type":"简答","q":"CRRT连接中心静脉导管时，回抽封管液有何具体要求？回血不畅如何处理？","a":"用注射器回抽导管内封管液，推注在纱布上检查是否有凝血块（推注时距纱布距离＞10cm），回抽量为动、静脉管各2ml左右。导管回血不畅时认真查找原因，严禁使用注射器用力推注导管腔。","key":"用力推注可致血栓脱落栓塞。","page":163},{"id":698,"chapter":"第14章 连续性肾脏替代治疗","section":"十二、操作程序及监测","roles":["护士"],"level":"基础","type":"简答","q":"CRRT治疗过程中护士的监护与查对要求有哪些？","a":"①开始治疗后立即测血压、脉搏，询问不适，详细记录；②二次自我查对：按血流方向检查各连接处和开口，未使用开口用保护帽并夹闭；根据医嘱查对参数；对控制面板、按键等高频接触部位消毒擦拭；③双人查对：由其他护士查对并签字；④专人床旁监测生命体征、管路凝血及机器状态，每小时记录1次治疗参数及治疗量，核实是否与医嘱一致；⑤及时更换置换液、透析液，倒空废液袋，必要时更换管路及透析器。","key":"每小时记录并核对医嘱，是达成剂量的保障。","page":164},{"id":699,"chapter":"第14章 连续性肾脏替代治疗","section":"十二、操作程序及监测","roles":["护士","技师"],"level":"进阶","type":"案例分析","q":"CRRT运行中机器反复报警，按提示处理后报警无法解除且血泵停止运转。护士应如何处理？","a":"①发生报警时迅速根据机器提示操作解除报警；②如报警无法解除且血泵停止运转，则立即停止治疗，手动回血；③速请维修人员到场处理。","key":"血泵停转时间过长体外循环会凝血，须及时手动回血。","page":164},{"id":700,"chapter":"第14章 连续性肾脏替代治疗","section":"十二、操作程序及监测","roles":["护士"],"level":"进阶","type":"简答","q":"CRRT治疗结束回血下机的关键步骤有哪些？","a":"①关闭4%枸橼酸钠及钙剂液体泵开关；②按结束键，密闭式回血；③颈静脉置管者头偏向对侧、戴口罩；④断开导管动脉端，脉冲式推注生理盐水或预充式冲洗液，弹丸式推注封管液，关闭导管夹接保护帽（推荐预充式导管冲洗装置）；⑤管路动脉端接生理盐水，血流速减至100ml/min以下开启血泵回血；⑥回血完毕停泵，关闭管路及导管静脉端夹，断开静脉端注射封管液；⑦无菌敷料包扎并注明更换时间；⑧卸下耗材，擦净机器待用。","key":"先关枸橼酸和钙泵，再回血。","page":164},{"id":701,"chapter":"第14章 连续性肾脏替代治疗","section":"十三、并发症及处理","roles":["医生","护士"],"level":"进阶","type":"简答","q":"CRRT并发症有何特点？常见并发症有哪些？","a":"因治疗对象为危重患者、血流动力学常不稳定且治疗时间长，部分并发症发生率较高、程度较重、处理更困难，如低血压、低钾血症、低钙血症、低磷血症、酸碱失衡、感染及机械因素相关并发症；全身抗凝剂总量过大易出血；血流量较低、血细胞比容较高或抗凝剂量不足易凝血；治疗时间长可致维生素、微量元素和氨基酸丢失，应适当补充。","key":"低磷、低钾是长时程CRRT最易忽视的并发症。","page":165},{"id":702,"chapter":"第15章 单纯超滤","section":"一、定义及概述","roles":["医生","护士"],"level":"基础","type":"简答","q":"什么是单纯超滤（SUF）？为什么患者血流动力学较稳定？","a":"SUF是通过对流转运机制，采用容量控制或压力控制，经透析器/滤器半透膜等渗地从全血中除去水分的治疗方法，不需要使用透析液和置换液。过程中血浆渗透压改变较小，甚至因血液浓缩略有提高，加快组织间隙向血管内补充容量，故血流动力学较稳定。","key":"SUF不需要透析液和置换液。","page":166},{"id":703,"chapter":"第15章 单纯超滤","section":"二、适应证及禁忌证","roles":["医生"],"level":"基础","type":"简答","q":"单纯超滤的适应证有哪些？哪些情况应慎用？","a":"适应证：①严重水肿，药物治疗效果不佳；②难治性心力衰竭；③急、慢性肺水肿。无绝对禁忌证，下列慎用：①严重低血压；②恶性心律失常；③存在血栓栓塞疾病高度风险的患者。","key":"原文要点逐字掌握，数值与条件勿混淆。","page":166},{"id":704,"chapter":"第15章 单纯超滤","section":"三、治疗前患者评估","roles":["医生","护士"],"level":"进阶","type":"简答","q":"单纯超滤治疗前血容量状态评估包括哪些内容？","a":"全面了解容量负荷状态，如水肿程度、体位（能否平卧）、心脏舒张期奔马律、双肺底部湿性啰音及胸腔积液、腹水情况等；如条件允许，可测定CVP和/或PCWP客观评估血容量。另需评估生命体征、出凝血功能、血液生化（肾功能、白蛋白、电解质、酸碱）。","key":"原文要点逐字掌握，数值与条件勿混淆。","page":166},{"id":705,"chapter":"第15章 单纯超滤","section":"四、设备选择","roles":["技师","护士"],"level":"进阶","type":"简答","q":"单纯超滤可选择哪些设备？治疗中设备处于何种状态？","a":"可依据医院实际选择普通血液透析机、单纯超滤机或CRRT设备。单纯超滤过程中血液透析机处于旁路状态，CRRT设备中置换液、透析液泵处于停止状态，通过跨膜压驱动完成超滤。","key":"透析机须处于旁路状态。","page":167},{"id":706,"chapter":"第15章 单纯超滤","section":"七、治疗方式和处方","roles":["医生"],"level":"进阶","type":"简答","q":"单纯超滤与SCUF如何选择？SCUF有何特点？","a":"应从病情及设备条件权衡利弊确定。SCUF利用对流原理清除溶质和水分，用于顽固性容量过负荷，伴或不伴肾功能障碍；与SUF比较超滤率较低，持续时间可视病情延长，对血流动力学影响较小，更易耐受，适用于血流动力学不稳定而又需超滤脱水的患者。","key":"血流动力学不稳定→SCUF。","page":167},{"id":707,"chapter":"第15章 单纯超滤","section":"七、治疗方式和处方","roles":["医生"],"level":"基础","type":"填空","q":"单纯超滤每次超滤量以不超过体重的____为宜；SCUF超滤率一般设定为____ml/min，一次SCUF总超滤量不宜超过____L。","a":"4%～5%；2～5；4","key":"原文要点逐字掌握，数值与条件勿混淆。","page":167},{"id":708,"chapter":"第15章 单纯超滤","section":"八、抗凝方法","roles":["医生"],"level":"进阶","type":"填空","q":"单纯超滤普通肝素：首剂量____U/kg（0.3～1.0mg/kg），追加剂量____U/（kg·h），治疗结束前30～60min停止追加。","a":"37.5～125；12.5～62.5","key":"SUF肝素按体重/小时追加，适用于含血液高凝状态患者。","page":168},{"id":709,"chapter":"第15章 单纯超滤","section":"九、操作程序及监测","roles":["护士","技师"],"level":"进阶","type":"简答","q":"单纯超滤密闭式预冲有哪些具体要求（含肝素盐水浸泡）？","a":"①血泵80～100ml/min，生理盐水排净管路和透析器血室气体，确保充满液体，动静脉壶液面调至2/3处，动脉端→透析器→静脉端，不得逆向；②预冲量按说明书，如无特殊要求不应少于800ml；闭式循环或肝素预冲在预冲量达到后进行；③高凝倾向且无肝素禁忌者推荐肝素生理盐水浸泡管路和滤器30min（生理盐水500ml加普通肝素2500U/20mg），上机前给予不少于500ml生理盐水冲洗；④预冲液流入废液袋，不得低于操作者腰部。","key":"肝素浸泡后上机前须至少500ml生理盐水冲洗。","page":169},{"id":710,"chapter":"第15章 单纯超滤","section":"九、操作程序及监测","roles":["医生","护士"],"level":"基础","type":"填空","q":"单纯超滤通常超滤率设定为____L/h，首次超滤量原则上不超过____L。","a":"1～2；3","key":"原文要点逐字掌握，数值与条件勿混淆。","page":169},{"id":711,"chapter":"第15章 单纯超滤","section":"九、操作程序及监测","roles":["护士"],"level":"进阶","type":"填空","q":"单纯超滤血流量由____ml/min开始，缓慢提升至____ml/min；血流量与超滤率一般为____。","a":"50；150～200；4:1","key":"血流量过低不能满足超滤率要求时机器会报警。","page":170},{"id":712,"chapter":"第15章 单纯超滤","section":"九、操作程序及监测","roles":["医生","护士"],"level":"进阶","type":"简答","q":"单纯超滤过程中应监测哪些内容？","a":"①监测心率、血压等循环状态，有条件推荐监测有效循环血量，依据变化调整超滤率；②监测动脉压、静脉压、跨膜压及滤器凝血情况；有条件推荐监测凝血参数，动态调整抗凝药物，必要时用生理盐水100ml冲洗滤器。","key":"原文要点逐字掌握，数值与条件勿混淆。","page":171},{"id":713,"chapter":"第15章 单纯超滤","section":"十、并发症及处理","roles":["护士","技师"],"level":"基础","type":"简答","q":"单纯超滤中透析器/滤器破膜漏血的原因及处理？","a":"原因：透析器/滤器质量问题，或运输及存放损坏，或跨膜压过高导致破膜，血液进入超滤液内；处理：必须立即更换透析器/滤器。","key":"原文要点逐字掌握，数值与条件勿混淆。","page":171},{"id":714,"chapter":"第15章 单纯超滤","section":"十、并发症及处理","roles":["医生","护士"],"level":"高级","type":"案例分析","q":"单纯超滤中使用普通肝素，静脉压、跨膜压短时间内突然升高，管路和滤器颜色加深。急查抗凝血酶活性为42%。应如何处理？","a":"①静脉压、TMP短时间突然升高、管路滤器颜色加深，应立即回血，避免凝血；②平时凝血应立即增加抗凝药物（肝素或LMWH）剂量；③抗凝血酶活性低于50%，应改用阿加曲班；④若下机时回血阻力突然升高，怀疑凝血，应立即停止回血，以免血栓进入体内；⑤原因排查：高凝状态、抗凝剂量不足、静脉回血不畅、血流缓慢或血压降低。","key":"AT＜50%时肝素无效，须改阿加曲班；回血阻力大时禁止强行回血。","page":171},{"id":715,"chapter":"第15章 单纯超滤","section":"十、并发症及处理","roles":["医生","护士"],"level":"进阶","type":"简答","q":"单纯超滤中出血如何处理？","a":"抗凝药物剂量过大可引起出血：使用普通肝素或LMWH者应暂时停用并给予适量鱼精蛋白拮抗；使用阿加曲班者应暂时停用20～30min，然后减量应用。","key":"阿加曲班无特异拮抗剂。","page":171},{"id":716,"chapter":"第15章 单纯超滤","section":"十、并发症及处理","roles":["医生","护士"],"level":"进阶","type":"案例分析","q":"心衰患者单纯超滤，血清白蛋白25g/L，超滤后程出现打哈欠、背部酸胀、肌肉痉挛、便意，继而恶心、出汗、面色苍白、血压下降。如何处理？","a":"①考虑超滤率过大所致低血压，常发生于后程或结束前，低白蛋白或低血红蛋白者更易发生；②立即降低超滤率；③必要时补充生理盐水或人血白蛋白等胶体制剂；④处理后血压仍不恢复者应停止单纯超滤并积极救治。","key":"打哈欠、背酸、便意是低血压早期信号，要早识别。","page":172},{"id":717,"chapter":"第15章 单纯超滤","section":"十、并发症及处理","roles":["医生"],"level":"高级","type":"简答","q":"单纯超滤中出现恶性心律失常甚至猝死风险的患者应如何处理？原则上推荐何种模式？","a":"心血管状态不稳定者可出现恶性心律失常甚至猝死，出现时应立即停止单纯超滤并积极抢救；对于这样的患者原则上推荐采用缓慢连续性超滤（SCUF）模式。","key":"原文要点逐字掌握，数值与条件勿混淆。","page":172},{"id":718,"chapter":"第15章 单纯超滤","section":"十一、注意事项","roles":["医生","护士"],"level":"进阶","type":"判断","q":"血细胞比容较高的患者单纯超滤时，应增加超滤率以缩短治疗时间。（对/错？）","a":"错。血细胞比容越高，越容易因血液浓缩、黏度上升而使血流阻力增加，应减少超滤率或适当增加抗凝药物剂量。另外温度过低也会增加血液黏度，应注意保温。","key":"高Hct：降超滤率或加抗凝。","page":172},{"id":719,"chapter":"第15章 单纯超滤","section":"十一、注意事项","roles":["医生"],"level":"高级","type":"判断","q":"单纯超滤结束后，因电解质随水分等比例清除，患者血清钾通常降低。（对/错？）","a":"错。超滤结束后体内电解质总量（尤其钠）降低；但有效循环血容量下降刺激交感神经兴奋，促使钾从细胞内移向细胞外，因此超滤结束后血清钾可能升高。","key":"SUF后警惕高钾，而非低钾。","page":172},{"id":720,"chapter":"第15章 单纯超滤","section":"十一、注意事项","roles":["医生"],"level":"高级","type":"简答","q":"血清白蛋白水平对单纯超滤有何影响？选择高通量透析器/滤器有何利弊？","a":"①白蛋白越高，血清蛋白越易黏附于滤器膜影响超滤效果；白蛋白过低则胶体渗透压下降，组织间隙水分回流入血减少、血管再充盈不足，易发生低血压而难完成超滤目标，是否补充白蛋白等胶体应依据临床判断；②高通量透析器/滤器有助于完成目标超滤量，但氨基酸等营养物质丢失增多。","key":"原文要点逐字掌握，数值与条件勿混淆。","page":172},{"id":721,"chapter":"第16章 血浆置换","section":"二、适应证及禁忌证","roles":["医生"],"level":"进阶","type":"简答","q":"血浆置换适应证中“血液系统疾病”包括哪些？（至少列举6种）","a":"血栓性微血管病（TMA）、冷球蛋白血症、高黏度单克隆丙球蛋白病、多发性骨髓瘤（伴高黏滞综合征）、自身免疫性溶血性贫血（AHA）、溶血尿毒症综合征、新生儿溶血性疾病、输血后紫癜、肝素诱发的血小板减少症（HIT）、难治性免疫性血小板减少症、血友病、纯红细胞再生障碍性贫血、噬血细胞综合征、巨噬细胞活化综合征等。","key":"多发性骨髓瘤须“伴高黏滞综合征”才列入；HIT本身也是血浆置换适应证，常被忽略。","page":174},{"id":722,"chapter":"第16章 血浆置换","section":"二、适应证及禁忌证","roles":["医生"],"level":"基础","type":"简答","q":"血浆置换适应证中的“消化系统疾病”有哪些？","a":"急性肝衰竭、重症肝炎、肝性脑病、胆汁淤积性肝病、高胆红素血症等。","key":"肝衰竭相关的高胆红素血症、肝性脑病是临床最常见的血浆置换指征之一。","page":174},{"id":723,"chapter":"第16章 血浆置换","section":"二、适应证及禁忌证","roles":["医生"],"level":"进阶","type":"判断","q":"在器官移植领域，血浆置换仅用于治疗移植后排斥反应。（对/错？）","a":"错。规程列出的器官移植适应证包括：①器官移植前去除抗体（ABO血型不相容移植、免疫高致敏受者移植等）；②器官移植后排斥反应等。","key":"移植前脱敏（去除抗体）是血浆置换的重要用途，不能只记移植后排斥。","page":174},{"id":724,"chapter":"第16章 血浆置换","section":"二、适应证及禁忌证","roles":["医生"],"level":"基础","type":"简答","q":"血浆置换的禁忌证有哪些？","a":"无绝对禁忌证，相对禁忌证包括：①对血浆、人血白蛋白、肝素、血浆分离器、透析管路等有严重过敏史；②药物难以纠正的全身循环衰竭；③非稳定期的心肌梗死或缺血性脑卒中；④颅内出血或重度脑水肿伴有脑疝；⑤存在精神障碍而不能很好配合治疗者。","key":"血浆置换“无绝对禁忌证”，以上均为相对禁忌证，需权衡利弊。","page":175},{"id":725,"chapter":"第16章 血浆置换","section":"二、适应证及禁忌证","roles":["医生"],"level":"基础","type":"判断","q":"颅内出血或重度脑水肿伴有脑疝是血浆置换的绝对禁忌证。（对/错？）","a":"错。血浆置换无绝对禁忌证，颅内出血或重度脑水肿伴有脑疝属于相对禁忌证。","key":"考核常设“绝对/相对”陷阱，规程明确写“无绝对禁忌证”。","page":175},{"id":726,"chapter":"第16章 血浆置换","section":"三、操作程序","roles":["医生"],"level":"基础","type":"填空","q":"建议血浆置换应在____以上综合性医院或____专科医院进行。","a":"二级；肾脏病。","key":"医院资质要求在血浆置换、血浆吸附两章中一致。","page":175},{"id":727,"chapter":"第16章 血浆置换","section":"三、操作程序","roles":["医生","护士"],"level":"基础","type":"简答","q":"血浆置换治疗前需完成哪些检验？","a":"常规检查血常规、出凝血指标；血清白蛋白、血清球蛋白、血电解质（钠、钾、氯、钙、磷）、肝功能、肾功能；免疫指标、免疫功能（淋巴细胞亚群）及与原发病相关的指标等。","key":"血清球蛋白与淋巴细胞亚群是血浆置换前特有的评估项目，易漏查。","page":175},{"id":728,"chapter":"第16章 血浆置换","section":"三、操作程序","roles":["医生"],"level":"进阶","type":"简答","q":"血浆置换频度取决于哪些因素？一般频度和疗程如何？","a":"①取决于原发病、病情严重程度、治疗效果及所清除致病因子的分子量、半衰期、体内分布及血浆中的浓度，应个体化制订方案；②一般每天或间隔1～2d；③一般5～7次为1个疗程，或直到致病抗体转阴。","key":"疗程终点除了次数，还可以“致病抗体转阴”为标准。","page":175},{"id":729,"chapter":"第16章 血浆置换","section":"三、操作程序","roles":["医生"],"level":"基础","type":"填空","q":"单次单重血浆置换剂量以患者血浆容量的____倍为宜，不建议超过____倍。","a":"1～1.5；2。","key":"与血浆吸附（2～3倍血浆容量）区分，切勿混淆。","page":176},{"id":730,"chapter":"第16章 血浆置换","section":"三、操作程序","roles":["医生"],"level":"进阶","type":"简答","q":"写出规程中计算和估计血浆容量的两个公式，并注明b、c取值。","a":"①血浆容量（ml）=（1-血细胞比容）×[b+（c×体重kg）]；b值：男性1530，女性864；c值：男性41，女性47.2。②估计公式：血浆容量=0.065×体重（kg）×（1-血细胞比容）（结果单位为L）。","key":"b、c值男女易记反：男b大c小（1530/41），女b小c大（864/47.2）。","page":176},{"id":731,"chapter":"第16章 血浆置换","section":"三、操作程序","roles":["医生"],"level":"高级","type":"案例分析","q":"男性患者，体重70kg，血细胞比容0.40，拟行单重血浆置换。请用两种公式计算其血浆容量，并给出单次置换量范围。","a":"①精确公式：（1-0.40）×[1530+（41×70）]=0.6×4400=2640ml；②估计公式：0.065×70×0.6≈2.73L（约2730ml）；③单次置换量为血浆容量的1～1.5倍，约2640～3960ml（以2640ml计），不建议超过2倍（约5280ml）。","key":"计算时先算方括号再乘（1-Hct），且男性取b=1530、c=41。","page":176},{"id":732,"chapter":"第16章 血浆置换","section":"三、操作程序","roles":["医生"],"level":"进阶","type":"简答","q":"血浆置换采用普通肝素抗凝的适用人群和方案是什么？","a":"适用于无活动性出血或出血风险、血液高凝状态的患者。首剂量62.5～125U/kg（0.5～1.0mg/kg），追加剂量1250～2500U/h（10～20mg/h），间歇性静脉注射或持续性静脉输注（常用）；预期结束前30min停止追加。剂量应依据凝血状态个体化调整。","key":"“预期结束前30min停止追加”是常考点；单位U与mg换算（125U≈1mg）要熟练。","page":176},{"id":733,"chapter":"第16章 血浆置换","section":"三、操作程序","roles":["护士","技师"],"level":"进阶","type":"填空","q":"血浆置换实施前给予____mg/L的肝素生理盐水预冲、保留灌注____min后，再给予生理盐水____ml冲洗，有助于增强抗凝效果。","a":"40；20；500。","key":"注意与血液灌流的肝素盐水浸泡（2500U/500ml、浸泡30min）区分。","page":176},{"id":734,"chapter":"第16章 血浆置换","section":"三、操作程序","roles":["医生"],"level":"基础","type":"填空","q":"血浆置换使用低分子量肝素抗凝，一般选择____IU/kg，推荐在治疗前____min静脉注射，____追加剂量。","a":"60～80；20～30；无需。","key":"低分子量肝素适用于无活动性出血或具有潜在出血风险者。","page":176},{"id":735,"chapter":"第16章 血浆置换","section":"三、操作程序","roles":["医生"],"level":"基础","type":"填空","q":"血浆置换的晶体液补充一般为丢失血浆的____，为____ml。","a":"1/3～1/2；500～1000。","key":"晶体液包括生理盐水、葡萄糖生理盐水、林格液，用于补充电解质丢失。","page":176},{"id":736,"chapter":"第16章 血浆置换","section":"三、操作程序","roles":["医生"],"level":"进阶","type":"简答","q":"新鲜血浆作为置换液的优点、适用对象与缺点分别是什么？","a":"优先选择新鲜冰冻血浆。优点：含大部分凝血因子、补体、白蛋白、免疫球蛋白及其他生物活性成分，是最符合生理的置换液；适用于凝血因子缺乏或其他血浆蛋白（免疫球蛋白、补体）缺乏的患者；缺点：可导致病毒感染和变态反应，需血型匹配才能使用。","key":"使用新鲜血浆必须核对血型，溶血并发症常源于血型问题。","page":177},{"id":737,"chapter":"第16章 血浆置换","section":"三、操作程序","roles":["医生","护士"],"level":"基础","type":"填空","q":"人白蛋白注射液作为置换液常用浓度为____；因其中____、____、____浓度均较低，应注意调整，以免引起低钾和/或低钙血症。","a":"4%～5%；钾；钙；镁。","key":"白蛋白置换易致低钙血症，需静脉补钙。","page":177},{"id":738,"chapter":"第16章 血浆置换","section":"三、操作程序","roles":["医生"],"level":"高级","type":"判断","q":"低分子右旋糖酐等合成胶体可降低费用，宜在置换后期使用，总量不超过总置换量的30%。（对/错？）","a":"错。合成胶体半衰期只有数小时，只能暂时维持胶体渗透压，总量不能超过总置换量的20%，并应在治疗起始阶段使用，尤其适用于高黏滞综合征。","key":"三个陷阱：20%而非30%、起始阶段而非后期、尤适用于高黏滞综合征。","page":177},{"id":739,"chapter":"第16章 血浆置换","section":"三、操作程序","roles":["护士"],"level":"基础","type":"简答","q":"血浆置换治疗前应常规准备哪些急救监护设备和药品？","a":"常规准备心电监护、血氧监测、地塞米松、肾上腺素等急救药品和器材；血制品或置换液按医嘱准备并双人核查签字。","key":"大量输入异体血浆易致过敏性休克，肾上腺素必须床旁备用。","page":177},{"id":740,"chapter":"第16章 血浆置换","section":"三、操作程序","roles":["护士"],"level":"进阶","type":"简答","q":"血浆置换置换液为何需要加温？应采用何种加温方式？","a":"因治疗中患者输入大量液体，如未经加温输入易致畏寒、寒战，故血浆等置换液需经加温后输入，应采用干式加温。","key":"不得用水浴等湿式加温，规程明确要求“干式加温”。","page":178},{"id":741,"chapter":"第16章 血浆置换","section":"三、操作程序","roles":["护士"],"level":"进阶","type":"简答","q":"经中心静脉导管连接体外循环时，回抽封管液的操作要求有哪些？","a":"用注射器回抽导管内封管液，推注在纱布上检查是否有凝血块，推注时距纱布距离＞10cm，回抽量为动、静脉管各2ml左右；导管回血不畅时应认真查找原因，严禁使用注射器用力推注导管腔。","key":"回血不畅时用力推注可致血栓脱落，是严重违规操作。","page":178},{"id":742,"chapter":"第16章 血浆置换","section":"三、操作程序","roles":["护士"],"level":"基础","type":"简答","q":"血浆置换上机后的“二次自我查对”和“双人查对”包括什么内容？","a":"二次自我查对：①按体外循环血流方向依次检查管路各连接处和开口处，未使用的开口应使用保护帽并夹闭管夹；②根据医嘱查对机器治疗参数；③治疗开始后对机器控制面板和按键等高频接触部位消毒擦拭。双人查对：由其他护士查对上述内容，并在治疗记录单上签字。","key":"高频接触部位消毒是感控要点，常被遗漏。","page":178},{"id":743,"chapter":"第16章 血浆置换","section":"三、操作程序","roles":["护士"],"level":"基础","type":"填空","q":"血浆置换开始时，先全血自循环____min，观察正常后再进入血浆分离程序；全血液速度宜慢，观察____min无反应后再以正常速度运行；单重血浆置换血浆分离器血流速度通常为____ml/min。","a":"5～10；2～5；80～150。","key":"单重80～150ml/min，双重血浆分离器80～100ml/min，注意区分。","page":178},{"id":744,"chapter":"第16章 血浆置换","section":"三、操作程序","roles":["护士"],"level":"进阶","type":"简答","q":"血浆置换经中心静脉导管回血下机的关键操作要点有哪些？","a":"①停血泵，采用密闭式回血法；②颈静脉导管患者头偏向对侧、戴口罩；③断开动脉端后脉冲式推注生理盐水或预充式导管冲洗液、弹丸式推注封管液，推荐使用预充式导管冲洗装置；分隔膜接头需螺旋断开并规范消毒后冲封管；④管路动脉端接生理盐水，血流速减至100ml/min以下开启血泵回血；⑤回血完毕停泵，静脉端封管、戴保护帽；⑥无菌敷料包扎，再次消毒入口皮肤并更换敷料，注明更换时间。","key":"冲管“脉冲式”、封管“弹丸式”，回血血流速＜100ml/min。","page":179},{"id":745,"chapter":"第16章 血浆置换","section":"三、操作程序","roles":["护士"],"level":"进阶","type":"判断","q":"血浆置换回血下机时，为缩短时间可维持治疗时的血流速开启血泵回血。（对/错？）","a":"错。应将血流速减至100ml/min以下再开启血泵回血，并采用密闭式回血法。","key":"回血速度过快易致容量负荷骤增及管路压力异常。","page":179},{"id":746,"chapter":"第16章 血浆置换","section":"三、操作程序","roles":["护士","技师"],"level":"进阶","type":"填空","q":"双重血浆置换通常血浆分离器的血流速度为____ml/min，血浆成分分离器的速度为____ml/min。","a":"80～100；25～30。","key":"双重血浆置换血流速上限（100）低于单重（150）。","page":180},{"id":747,"chapter":"第16章 血浆置换","section":"三、操作程序","roles":["护士","技师"],"level":"进阶","type":"简答","q":"双重血浆置换需设置哪些治疗参数？与单重相比，预冲对象有何不同？","a":"参数：血浆置换目标量、各个泵的流速或血浆分离流量与血流量比率、弃浆量和分离血浆比率等。预冲：需自动预冲管路、血浆分离器及血浆成分分离器（单重仅管路和血浆分离器）。","key":"“弃浆量”和“分离血浆比率”是双重特有参数。","page":180},{"id":748,"chapter":"第16章 血浆置换","section":"三、操作程序","roles":["护士","技师"],"level":"进阶","type":"判断","q":"双重血浆置换的机器监测指标与单重完全相同，即全血流速、血浆流速、动脉压、静脉压和跨膜压。（对/错？）","a":"错。双重血浆置换还需观察分离血浆流速和膜内压变化。","key":"膜内压升高提示血浆成分分离器堵塞，是双重特有监测点。","page":180},{"id":749,"chapter":"第16章 血浆置换","section":"四、并发症及处理","roles":["医生","护士"],"level":"基础","type":"简答","q":"血浆置换中过敏和变态反应的原因、表现、预防及处理？","a":"原因：大量输入异体血浆或白蛋白。表现：皮疹、皮肤瘙痒、畏寒、寒战、发热，严重者过敏性休克。预防：输入前适量预防应用肾上腺糖皮质激素和/或抗组胺药物。处理：减慢或停止血泵，停止输入可疑血浆或白蛋白，抗过敏治疗；过敏性休克按休克处理。","key":"第一步是停输可疑血浆/白蛋白并减慢或停止血泵。","page":180},{"id":750,"chapter":"第16章 血浆置换","section":"四、并发症及处理","roles":["医生","护士"],"level":"基础","type":"案例分析","q":"患者以新鲜冰冻血浆行单重血浆置换，输入约800ml后出现全身皮疹、瘙痒、寒战、发热，血压尚稳定。应如何处理？","a":"①考虑过敏/变态反应；②减慢或停止血泵；③停止输入可疑血浆；④予抗过敏治疗（糖皮质激素和/或抗组胺药物）；⑤密切监测血压，如出现过敏性休克按休克处理；⑥后续治疗可在输注血浆前预防性应用糖皮质激素和/或抗组胺药物。","key":"勿在未停可疑血浆的情况下单纯给药；肾上腺素需随时备用。","page":180},{"id":751,"chapter":"第16章 血浆置换","section":"四、并发症及处理","roles":["医生"],"level":"进阶","type":"简答","q":"血浆置换低血压的原因及对应处理？","a":"原因：与原发病、血管活性药物清除或过敏反应等有关。处理：①严重低蛋白血症者酌情增加人血白蛋白或血浆剂量，提高胶体渗透压、增加有效血容量，并在开始时减慢血泵速度，阶梯式增加至目标血流量；②血管活性药物清除所致者，必要时适量使用血管活性药物；③过敏反应引起者按过敏性休克处理。","key":"需先辨别原因再处理，不可一律补液。","page":180},{"id":752,"chapter":"第16章 血浆置换","section":"四、并发症及处理","roles":["医生"],"level":"高级","type":"案例分析","q":"重症狼疮患者，血清白蛋白18g/L，拟行血浆置换。上机后10min血压由110/70mmHg降至80/50mmHg，无皮疹。如何分析与处理？下次治疗如何预防？","a":"①最可能为严重低蛋白血症致有效血容量不足（无过敏表现）；②处理：减慢血泵速度，酌情增加人血白蛋白或血浆用量以提高胶体渗透压、增加有效血容量；若考虑血管活性药物被清除，必要时适量使用血管活性药物；③预防：治疗开始时减慢血泵速度，阶梯式增加，逐渐至目标血流量，并酌情增加白蛋白或血浆剂量。","key":"低蛋白患者“起始慢泵+阶梯加速”是规程明确要求。","page":181},{"id":753,"chapter":"第16章 血浆置换","section":"四、并发症及处理","roles":["医生"],"level":"基础","type":"简答","q":"血浆置换中发生溶血应如何处理？","a":"查明原因并予以纠正，特别注意所输注血浆的血型，停止输注可疑血浆；同时严密监测血钾，避免发生高血钾等。","key":"溶血后最危险的是高钾血症，必须查血钾。","page":181},{"id":754,"chapter":"第16章 血浆置换","section":"四、并发症及处理","roles":["医生"],"level":"进阶","type":"简答","q":"血浆置换出血倾向的主要原因与处理？","a":"原因：大量使用白蛋白溶液导致凝血因子缺乏、抗凝药物过量等。处理：凝血因子缺乏者适量补充新鲜冰冻血浆；抗凝药物过量者减少抗凝剂量，肝素过量可用鱼精蛋白对抗，并适当应用止血药物。","key":"全白蛋白置换后应补充FFP以恢复凝血因子。","page":181},{"id":755,"chapter":"第16章 血浆置换","section":"四、并发症及处理","roles":["医生","护士"],"level":"进阶","type":"案例分析","q":"患者以5%白蛋白为置换液行血浆置换，治疗1h后诉口周及手指麻木，随后出现手足抽搐。最可能的诊断和处理？","a":"①最可能为低钙血症（白蛋白中钙浓度低，以白蛋白为置换液者易发生）；②处理：静脉输注钙剂，必要时减慢置换速度并监测血钙；③预防：以白蛋白为置换液时可在治疗中静脉输注钙剂防治低钙血症，并注意补钾。","key":"白蛋白置换液中钾、钙、镁均低，易出现低钙和低钾。","page":181},{"id":756,"chapter":"第16章 血浆置换","section":"四、并发症及处理","roles":["医生"],"level":"高级","type":"填空","q":"新鲜冰冻血浆的胶体渗透压为____mmHg，低于体内血浆胶体渗透压（____mmHg），血浆置换后水钠潴留可导致____。","a":"20；25～30；脑水肿。","key":"脑水肿处理核心是提高血浆胶体渗透压。","page":181},{"id":757,"chapter":"第16章 血浆置换","section":"四、并发症及处理","roles":["医生"],"level":"基础","type":"判断","q":"血浆置换中血源性传染病感染主要与输入白蛋白有关。（对/错？）","a":"错。主要与输入血浆有关，患者有感染肝炎病毒和人类免疫缺陷病毒等的潜在危险；白蛋白的优点恰是不易导致病毒感染。","key":"血浆—病毒风险高；白蛋白—病毒风险低但缺凝血因子。","page":181},{"id":758,"chapter":"第17章 血浆吸附","section":"一、定义及概述","roles":["医生","护士","技师"],"level":"基础","type":"简答","q":"什么是血浆吸附（PA）？","a":"血液引出后先进入血浆分离器，应用膜式分离技术将血液的有形成分（血细胞、血小板）和血浆分开，血浆再进入吸附柱进行吸附、清除血浆中特定物质，吸附后血浆与分离的有形成分再回输至体内。","key":"先“膜式分离”再“吸附”，与血液灌流全血直接过柱不同。","page":182},{"id":759,"chapter":"第17章 血浆吸附","section":"一、定义及概述","roles":["医生","技师"],"level":"进阶","type":"简答","q":"血浆吸附按吸附剂特性分哪两大类？各自原理和材料是什么？","a":"①分子筛吸附：利用吸附剂携带的电荷和孔隙，非特异性地吸附电荷和分子大小与之相对应的物质，材料包括活性炭、树脂、碳化树脂和阳离子型吸附剂等；②免疫吸附：将高度特异性的抗原、抗体或具特定物理化学亲和力的物质（配基）结合在载体上制成吸附柱，选择性清除血液中内源性中大分子致病物质（配体）。","key":"分子筛吸附为“非特异性”，免疫吸附为“选择性/特异性”。","page":182},{"id":760,"chapter":"第17章 血浆吸附","section":"一、定义及概述","roles":["医生"],"level":"基础","type":"判断","q":"免疫吸附与血浆置换一样需要补充置换液。（对/错？）","a":"错。免疫吸附通过吸附作用直接清除致病性抗体、循环免疫复合物和炎症因子等中大分子致病物质，并可改善机体免疫状态，与血浆置换比较，无需补充置换液。","key":"无需置换液是免疫吸附相对血浆置换的核心优势（无血制品风险）。","page":182},{"id":761,"chapter":"第17章 血浆吸附","section":"二、适应证及禁忌证","roles":["医生"],"level":"基础","type":"简答","q":"血浆吸附适应证中的神经系统疾病有哪些？","a":"重症肌无力、急性炎症性脱髓鞘性多发性神经病（吉兰-巴雷综合征）、慢性炎症性脱髓鞘性多发性神经病、神经系统副肿瘤综合征、多发性硬化症、视神经脊髓炎、自身免疫性脑炎、突发性感觉神经性听力损失等。","key":"重症肌无力、GBS是免疫吸附最经典的神经科指征。","page":182},{"id":762,"chapter":"第17章 血浆吸附","section":"二、适应证及禁忌证","roles":["医生"],"level":"基础","type":"简答","q":"血浆吸附的相对禁忌证有哪些？","a":"无绝对禁忌证，相对禁忌证包括：①对血浆分离器、吸附柱的膜或管路有过敏史；②严重活动性出血或DIC，药物难以纠正的全身循环衰竭；③非稳定期的心肌梗死、缺血性脑卒中、颅内出血或重度脑水肿伴有脑疝等；④存在精神障碍而不能配合治疗者。","key":"与血浆置换相比，明确列入“严重
