<style>
:root{
  --bg:#f0f4f8;--card:#ffffff;--text:#1a2332;--muted:#5a6a7a;--primary:#0b6e8a;
  --ok:#1a9c6e;--bad:#e05a3c;--warn:#d4920a;--line:#e2eaf0;--tag:#eef4f8;
  --shadow:0 2px 12px rgba(15,40,60,.08);--radius:14px;
  --safe-b:env(safe-area-inset-bottom,0px);--safe-t:env(safe-area-inset-top,0px);
}
[data-theme=dark]{
  --bg:#0f1419;--card:#1a222c;--text:#e8eef4;--muted:#8a9aaa;--primary:#3db4d4;
  --ok:#2ec98a;--bad:#f07158;--warn:#e0b040;--line:#2a3440;--tag:#24303c;
  --shadow:0 2px 16px rgba(0,0,0,.4);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{height:100%;overscroll-behavior:none}
body{font-family:-apple-system,"PingFang SC","Helvetica Neue","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);font-size:16px;line-height:1.55}
header{position:sticky;top:0;z-index:20;background:var(--primary);color:#fff;padding:11px 12px;padding-top:calc(11px + var(--safe-t));display:flex;align-items:center;gap:8px;box-shadow:0 2px 10px rgba(0,0,0,.18)}
header h1{font-size:16px;font-weight:600;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header button{background:rgba(255,255,255,.22);border:0;color:#fff;border-radius:8px;padding:7px 10px;font-size:14px;min-width:38px;cursor:pointer}
main{max-width:980px;margin:0 auto;padding:12px 12px calc(28px + var(--safe-b))}
.card{background:var(--card);border-radius:var(--radius);padding:15px;margin-bottom:11px;box-shadow:var(--shadow)}
.roles{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.role{border:1.5px solid var(--line);background:var(--card);border-radius:11px;padding:11px 2px;text-align:center;font-size:14.5px;font-weight:600;cursor:pointer;transition:.12s}
.role.on{border-color:var(--primary);background:color-mix(in srgb,var(--primary) 13%,var(--card));color:var(--primary)}
.stat{display:grid;grid-template-columns:repeat(4,1fr);text-align:center;gap:2px}
.stat b{display:block;font-size:21px;color:var(--primary);font-weight:700}
.stat span{font-size:11.5px;color:var(--muted)}
.menu{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.menu button{border:0;border-radius:13px;padding:14px 11px;font-size:15.5px;font-weight:600;color:#fff;text-align:left;cursor:pointer;line-height:1.35}
.menu small{display:block;font-weight:400;font-size:11.5px;opacity:.9;margin-top:3px}
.c1{background:linear-gradient(135deg,#0b6e8a,#1494b8)}.c2{background:linear-gradient(135deg,#1a9c6e,#2ec98a)}
.c3{background:linear-gradient(135deg,#e05a3c,#f07158)}.c4{background:linear-gradient(135deg,#5b4cdb,#7b6cf0)}
.c5{background:linear-gradient(135deg,#d4920a,#e0b040)}.c6{background:linear-gradient(135deg,#3d6b8a,#5a8aaa)}
.bar{height:6px;background:var(--line);border-radius:4px;overflow:hidden;margin-top:5px}
.bar i{display:block;height:100%;background:var(--ok);border-radius:4px}
.ch{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line);cursor:pointer}
.ch:last-child{border:0}.ch>div{flex:1;min-width:0}
.ch .name{font-size:13.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tag{display:inline-block;font-size:11px;padding:2px 7px;border-radius:20px;background:var(--tag);color:var(--muted);margin:0 3px 4px 0}
.tag.l2{background:#fff3dc;color:#a8710b}[data-theme=dark] .tag.l2{background:#3d3218;color:#e0b040}
.tag.l3{background:#fde8e1;color:#c2502f}[data-theme=dark] .tag.l3{background:#3d2218;color:#f07158}
.q{font-size:17.5px;font-weight:600;margin:8px 0 13px;line-height:1.55}
.ans{background:color-mix(in srgb,var(--ok) 11%,var(--card));border-left:4px solid var(--ok);padding:12px 13px;border-radius:8px;white-space:pre-wrap;font-size:15px;line-height:1.6}
.key{background:color-mix(in srgb,var(--warn) 13%,var(--card));border-left:4px solid var(--warn);padding:10px 12px;border-radius:8px;margin-top:9px;font-size:13.5px;line-height:1.55}
.src{font-size:12px;color:var(--muted);margin-top:9px}
.btns{display:flex;gap:9px;margin-top:13px}
.btns button{flex:1;border:0;border-radius:11px;padding:13px 6px;font-size:15.5px;font-weight:600;cursor:pointer;color:#fff}
.show{background:var(--primary)}.yes{background:var(--ok)}.no{background:var(--bad)}.gray{background:var(--line);color:var(--text)!important}
.nav{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--muted);margin-bottom:4px}
.fav{background:none;border:0;font-size:22px;cursor:pointer;padding:2px 6px;line-height:1;color:var(--text)}
input[type=search],select,input[type=number]{width:100%;padding:11px 12px;border:1.5px solid var(--line);border-radius:10px;font-size:15px;background:var(--card);color:var(--text);outline:none}
input:focus,select:focus{border-color:var(--primary)}
.hid{display:none!important}
.foot{text-align:center;font-size:11px;color:var(--muted);margin:16px 0 6px;line-height:1.65}
.streak{display:inline-flex;align-items:center;gap:3px;background:color-mix(in srgb,var(--warn) 16%,var(--card));color:var(--warn);padding:3px 9px;border-radius:20px;font-size:12px;font-weight:600}
.filters{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.filters button{border:1.5px solid var(--line);background:var(--card);color:var(--text);border-radius:20px;padding:5px 11px;font-size:12.5px;cursor:pointer}
.filters button.on{border-color:var(--primary);background:color-mix(in srgb,var(--primary) 14%,var(--card));color:var(--primary);font-weight:600}
.toast{position:fixed;left:50%;bottom:calc(70px + var(--safe-b));transform:translateX(-50%);background:rgba(20,30,40,.93);color:#fff;padding:10px 18px;border-radius:22px;font-size:13.5px;z-index:100;opacity:0;transition:.22s;pointer-events:none;max-width:88%;text-align:center}
.toast.show{opacity:1}
.timer{font-variant-numeric:tabular-nums;font-weight:600;color:#fff;background:rgba(0,0,0,.22);padding:3px 9px;border-radius:7px;font-size:13px}
.sec{font-size:12.5px;color:var(--muted);margin-bottom:7px;font-weight:500}
.grid2{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.big{border:1.5px solid var(--line);background:var(--card);border-radius:11px;padding:11px 2px;text-align:center;font-size:13.5px;font-weight:600;cursor:pointer;white-space:nowrap;min-width:0;overflow:hidden;text-overflow:ellipsis}
.big.empty{border-style:dashed;color:var(--muted,#8a97a0);font-weight:500;cursor:default;background:transparent}
.big:active{opacity:.85}
mark{background:#ffe08a;color:#1a2332;border-radius:2px;padding:0 1px}
.done-box{text-align:center;padding:20px 10px}
.done-box .score{font-size:36px;font-weight:700;color:var(--primary);margin:8px 0}
.tip{font-size:12.5px;color:var(--muted);margin-top:6px;line-height:1.5}
.install-banner{background:linear-gradient(135deg,#0b6e8a,#1494b8);color:#fff;border-radius:var(--radius);padding:14px 16px;margin-bottom:11px;display:flex;align-items:center;gap:12px;box-shadow:var(--shadow)}
.install-banner button{background:#fff;color:#0b6e8a;border:0;border-radius:8px;padding:8px 14px;font-weight:600;font-size:14px;white-space:nowrap;cursor:pointer}
.offline-badge{display:inline-block;background:var(--ok);color:#fff;font-size:11px;padding:2px 8px;border-radius:10px;margin-left:6px;vertical-align:middle}
@media(min-width:560px){.menu{grid-template-columns:1fr 1fr 1fr}}
</style>
</head>

<script>
var DM_ITEMS=["透析液细菌＜100 CFU/mL，内毒素＜0.5 EU/mL","透析用水细菌每月查，内毒素每3个月查，频率别颠倒","上机前双人查对，参数与医嘱一致","自检未通过不上机，先通知技术人员","手卫生是感控的第一道防线","HDF＝弥散＋对流，清除中分子更强","低血压第一步：先停超滤","封管先回抽，看纱布上有没有血块","导管回血不畅，严禁强行推注","枸橼酸抗凝，别忘了算碱负荷","干体重靠评估，不靠猜","错题本里的题，才是最该刷的题","每日十题，贵在坚持","依据国家卫健委《血液净化标准操作规程（2021版）》","应知应会1000题，刷完就是底气","加油，今天也要稳稳上机","新入患者四项必查：乙肝、丙肝、梅毒、艾滋","新入患者传染病标志物，即时查、3个月内复检","维持性患者传染病标志物，每6个月复检","血常规每3个月，生化每3个月","透析间期体重增长，控制在干体重的5%以内","软水器出水硬度，推荐＜1 GPG","复用透析器，下机后15～30分钟内处理","中心供液热消毒：末端≥85℃，持续≥20分钟","消毒后残余：过氧乙酸＜1 mg/L，次氯酸钠＜0.1 mg/L","内瘘吻合首选：静脉端—动脉端侧吻合","内瘘狭窄＞50%、内径＜1.8 mm，考虑干预","回血下机后平卧10～20分钟，再测生命体征","透析液温度常设36.5℃","spKt/V≥1.2、URR≥65%，充分性最低线","CRRT治疗剂量：20～25 mL/(kg·h)","乳酸＞4、肝功能障碍：枸橼酸抗凝禁用","HDF血流量建议＞250 mL/min","单纯超滤，血流量从50 mL/min起步","单次血浆置换剂量：血浆容量的1～1.5倍","罗沙司他不与ESA同时使用","西那卡塞：血钙＞2.2 mmol/L才启用，随餐服","低钾低钙透析液，警惕心源性猝死","静脉管路气泡＞0.05 mL，监测器应报警","治疗室空气菌落≤4 CFU，物表≤10 CFU/cm²","污物密闭存放，不超过24小时","血液滤过普通肝素首剂：37.5～62.5 U/kg","内瘘术后72小时，可开始握拳锻炼","内瘘成熟需8～12周，成熟后再穿刺","内瘘侧肢体：不测血压、不输液、不采血","内瘘超声，常规每3个月查一次","部分脱出的导管，严禁消毒后重新插入","透析床/椅间距不小于1米","打开的医疗物品注明开包时间，4小时内用","配制好的药品，2小时内使用","药品配制前后，双人查对并签名","透析用水细菌≤100 CFU/mL，超50要干预","透析用水内毒素≤0.25 EU/mL","透析用水总氯≤0.1 mg/L","复用消毒过氧乙酸浓度0.3%～0.5%","复用室反渗水管路必须循环，不能盲端","备用机停用超48小时，用前先水路消毒","电导率偏差超±0.3 mS/cm，要核对送检","实际脱水与设定差＞±0.2 kg，需核查","B液配制桶每周至少消毒1次","碳酸氢盐浓缩液：细菌≤100，大肠不得检出","中心供液设备避免阳光直射","抗凝血酶活性＜50%，不宜直接用肝素","低分子肝素常规60～80 IU/kg，无需追加","肝素抗凝看ACT，维持治疗前1.5～2.5倍","阿加曲班首剂250 μg/kg","GFR＜6 ml/min，应开始透析治疗","首次透析时间不超过2～3小时","透析液流速一般500，高通量可到800","起始血流速150，耐受后调至200～400","每次超滤总量不超过体重的5%","血液滤过每次约4小时，血流量＞250","前稀释置换量为血流量的50%～60%","后稀释置换量为血流量的25%～30%","HDF预冲：先80～100排气，再200～300冲膜外","HDF防反超滤：TMP保持100～400 mmHg","SCUF血流量50～100 mL/min","CRRT股静脉导管留置20～25 cm","CRRT不建议局部肝素化＋鱼精蛋白中和","SCUF一次总超滤量不宜超过4 L","血浆置换宜在二级以上医院进行","血浆吸附单次2～3倍血浆容量，约2～3小时","灌流器静态肝素化：12500 U，静置20～30分钟","中毒抢救，也不能跳过机器自检","灌流启动血流速50～100，渐升至100～200","居家血压≥135/85，非透析日要留意","透前血压靶目标：60岁以下＜140/90","个体化透析液钠：3次透前血钠均值×95%","低血压二级方案：血流＜200、透析液流＜350","低血压补液：50%葡萄糖40～100 mL静注","容量超负荷心衰：超滤≤15 mL/min，靠延长透析","高钾合并酸中毒：纠酸降钾别过快","每日钠盐＜5 g，最好＜3 g","无残肾功能者，每周透析时间≥12小时","急性左心衰、血压稳：先单纯超滤脱水","急性脑出血：收缩压＞180 mmHg才启动降压","贫血靶目标：Hb维持110～130 g/L","铁状态靶：铁蛋白200～500，TSAT 20%～50%","磷结合剂随餐服用，空腹结合不了磷","一次4小时透析，约清除磷800～1000 mg"];

function dmSpawn(){var l=document.getElementById("dmLayer");if(!l||l.style.display==="none"||l.childElementCount>=3)return;var sp=document.createElement("span");sp.className="dmspan";sp.textContent=DM_ITEMS[dmIdx%DM_ITEMS.length];dmIdx++;sp.style.top=DM_LANES[dmIdx%DM_LANES.length]+"px";sp.style.animationPlayState="paused";l.appendChild(sp);var wdt=sp.offsetWidth||200;sp.style.animationDuration=((window.innerWidth+wdt)/85)+"s";sp.style.animationPlayState="running";sp.addEventListener("animationend",function(){sp.remove()})}
function save(){try{localStorage.setItem(STORE_KEY,JSON.stringify(S))}catch(e){toast('存储空间不足')}}
function today(){const d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()}
function updateStreak(){
  const t=today();
  if(S.lastDay===t)return;
  const y=new Date();y.setDate(y.getDate()-1);
  const ys=y.getFullYear()+'-'+(y.getMonth()+1)+'-'+y.getDate();

  const el=$('toast');el.textContent=msg;el.classList.add('show');

  updateStreak();

  app.innerHTML=`

function daily(){
  const P=pool();
  const w=shuf(P.filter(x=>S.m[x.id]===2));
  const n=shuf(P.filter(x=>!S.m[x.id]));
  const o=shuf(P.filter(x=>S.m[x.id]===1));
  let list=[...w.slice(0,4),...n.slice(0,5),...o.slice(0,1)];
  list=list.filter((x,i,a)=>a.findIndex(y=>y.id===x.id)===i).slice(0,10);
  if(list.length<10)list=list.concat(shuf(P).filter(x=>!list.find(y=>y.id===x.id))).slice(0,10);
  run(list,'每日十题');
}

      <span style="font-size:12px;color:var(--muted);white-space:nowrap">${ok}/${L.length}</span>

}

function toggleFav(id){

function mark(v){
  const id=L[k].id;const prev=S.m[id];S.m[id]=v;

  if(EX){if(v===1)EX.ok++;else EX.wrong.push(L[k])}
  save();nextQ();
}

}

<style>
.cin{width:100%;padding:10px;border:1.5px solid var(--line);border-radius:9px;font-size:16px;background:var(--card);color:var(--text);box-sizing:border-box}
.crow{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}
.clab{font-size:12.5px;color:var(--muted,#8a97a0);display:block;margin-bottom:4px}
.cbtn{width:100%;padding:11px;border:0;border-radius:10px;background:var(--primary,#0b6e8a);color:#fff;font-size:15px;font-weight:600;cursor:pointer}
.cres{margin-top:10px;font-size:14.5px;line-height:1.9;display:none}
.chip{display:inline-block;padding:1px 9px;border-radius:20px;font-size:12.5px;font-weight:600;color:#fff;margin-left:6px}
</style>
<script>
function gv(id){var v=parseFloat(document.getElementById(id).value);return isNaN(v)?null:v}
function chip(lv,txt){var c=lv===0?"#1a9c6e":lv===1?"#d4920a":"#e05a3c";return '<span class="chip" style="background:'+c+'">'+txt+'</span>'}
function showRes(id,html){var e=document.getElementById(id);e.style.display="block";e.innerHTML=html}
function fUF(pre,dry,h,inn){var ml=(pre-dry)*1000+inn;return{ml:ml,ufr:ml/h/dry,pct:(pre-dry)/pre*100}}
function fKtV(pre,post,t,uf,w){var R=post/pre;return{urr:(1-R)*100,sp:-Math.log(R-0.008*t)+(4-3.5*R)*uf/w}}
function fCa(ca,alb,p){var corr=ca+0.02*(40-alb);return{corr:corr,prod:corr*4.0*(p*3.1)}}
function fCit(qb,target,conc){return qb*60*target/conc}
function fld(id,lab,ph,val){return '<div><label class="clab">'+lab+'</label><input class="cin" id="'+id+'" type="number" inputmode="decimal" step="any" placeholder="'+ph+'"'+(val?' value="'+val+'"':'')+'></div>'}
function calcCard(title,fields,btn,fn,resid){return '<div class="card"><div class="sec">'+title+'</div><div class="crow">'+fields+'</div><button class="cbtn" onclick="'+fn+'()">'+btn+'</button><div class="cres" id="'+resid+'"></div></div>'}
function showCalc(){
  setHead('透析计算器',true);
  var h='';
  h+=calcCard('① 超滤量与超滤率', fld('uf_pre','透前体重 (kg)','如 68.5')+fld('uf_dry','干体重 (kg)','如 65')+fld('uf_h','透析时长 (h)','如 4')+fld('uf_in','额外进量 (mL)','冲管/饮水/输液，可空'), '计算超滤','cUF','r_uf');
  h+=calcCard('② 透析充分性 Kt/V · URR', fld('kt_pre','透前尿素 (mmol/L)','')+fld('kt_post','透后尿素 (mmol/L)','')+fld('kt_t','透析时长 (h)','如 4')+fld('kt_uf','超滤量 (L)','如 2')+fld('kt_w','透后体重 (kg)','如 60'), '计算 Kt/V','cKtV','r_kt');
  h+=calcCard('③ 校正钙 · 钙磷乘积', fld('ca_ca','血钙 (mmol/L)','')+fld('ca_alb','白蛋白 (g/L)','')+fld('ca_p','血磷 (mmol/L)',''), '计算校正钙','cCa','r_ca');
  h+=calcCard('④ 转铁蛋白饱和度 TSAT', fld('ts_fe','血清铁 (µmol/L)','')+fld('ts_tibc','总铁结合力 (µmol/L)',''), '计算 TSAT','cTSAT','r_ts');
  h+=calcCard('⑤ 消毒液稀释配制', fld('dl_c1','原液浓度 (%)','如 5')+fld('dl_c2','目标浓度 (%)','如 0.5')+fld('dl_v2','要配总量 (mL)','如 10000'), '计算配比','cDil','r_dl');
  h+=calcCard('⑥ CRRT 剂量 · 枸橼酸配速', fld('cr_wt','体重 (kg)','')+fld('cr_dose','目标剂量 (mL/kg/h)','','25')+fld('cr_rep','置换液 (mL/h)','可空')+fld('cr_dial','透析液 (mL/h)','可空')+fld('cr_qb','血流量 (mL/min)','算枸橼酸时填')+fld('cr_cc','枸橼酸溶液浓度 (mmol/L)','4%枸橼酸钠≈136','136'), '计算 CRRT','cCRRT','r_cr');
  h+='<div class="foot">计算结果仅供临床参考，处方与治疗参数请结合医嘱复核。</div>';
  app.innerHTML=h;
}
function cUF(){var pre=gv('uf_pre'),dry=gv('uf_dry'),h=gv('uf_h'),inn=gv('uf_in')||0;if(pre===null||dry===null||h===null||h<=0||dry<=0){toast('请把体重和时长填完整');return}var r=fUF(pre,dry,h,inn);if(r.ml<0){showRes('r_uf','透前体重低于干体重，请核对数字。');return}var lv=r.ufr>13?2:r.ufr>10?1:0;var tx=r.ufr>13?'过快：与不良预后相关，建议延长透析时间或分次脱水':r.ufr>10?'偏快：注意血压与耐受':'平稳';showRes('r_uf','计划脱水：<b>'+(r.ml/1000).toFixed(2)+' L</b>（'+Math.round(r.ml)+' mL）<br>超滤率：<b>'+r.ufr.toFixed(1)+' mL/kg/h</b>'+chip(lv,tx)+'<br>脱水占透前体重：'+r.pct.toFixed(1)+'%')}
function cKtV(){var pre=gv('kt_pre'),post=gv('kt_post'),t=gv('kt_t'),uf=gv('kt_uf'),w=gv('kt_w');if(pre===null||post===null||t===null||uf===null||w===null||w<=0){toast('请把五项都填完整');return}if(post/pre-0.008*t<=0){showRes('r_kt','数值异常：透后/透前比值过低，请核对尿素单位与数字。');return}var r=fKtV(pre,post,t,uf,w);var lv=r.sp>=1.4?0:r.sp>=1.2?1:2;var tx=r.sp>=1.4?'达目标值':r.sp>=1.2?'达最低交付剂量，未达目标':'不达标';var lv2=r.urr>=70?0:r.urr>=65?1:2;var tx2=r.urr>=70?'达标':r.urr>=65?'达最低线':'不达标';showRes('r_kt','spKt/V：<b>'+r.sp.toFixed(2)+'</b>'+chip(lv,tx)+'<br>URR：<b>'+r.urr.toFixed(0)+'%</b>'+chip(lv2,tx2)+'<br><small>参考：spKt/V 最低 1.2、目标 1.4；URR 最低 65%、目标 70%。</small>')}
function cCa(){var ca=gv('ca_ca'),alb=gv('ca_alb'),p=gv('ca_p');if(ca===null||alb===null||p===null){toast('请把三项都填完整');return}var r=fCa(ca,alb,p);var lv=r.prod<55?0:r.prod<=70?1:2;var tx=r.prod<55?'达标（＜55）':r.prod<=70?'偏高':'过高';var lv2=(r.corr>=2.10&&r.corr<=2.37)?0:1;showRes('r_ca','校正钙：<b>'+r.corr.toFixed(2)+' mmol/L</b>'+chip(lv2,lv2===0?'常用目标 2.10–2.37':'不在 2.10–2.37 区间')+'<br>钙磷乘积：<b>'+r.prod.toFixed(0)+' mg²/dL²</b>'+chip(lv,tx))}
function cTSAT(){var fe=gv('ts_fe'),tibc=gv('ts_tibc');if(fe===null||tibc===null||tibc<=0){toast('请把两项填完整');return}var v=fe/tibc*100;var lv=v<20?1:v<=50?0:1;var tx=v<20?'偏低：提示铁缺乏':v<=50?'常用目标区间':'偏高：注意铁负荷';showRes('r_ts','TSAT：<b>'+v.toFixed(0)+'%</b>'+chip(lv,tx))}
function cDil(){var c1=gv('dl_c1'),c2=gv('dl_c2'),v2=gv('dl_v2');if(c1===null||c2===null||v2===null||c1<=0){toast('请把三项填完整');return}if(c2>=c1){showRes('r_dl','目标浓度不低于原液浓度，无法用水稀释得到，请核对。');return}var stock=c2*v2/c1;showRes('r_dl','取原液：<b>'+Math.round(stock)+' mL</b><br>加水：<b>'+Math.round(v2-stock)+' mL</b><br><small>合计 '+(Math.round(stock)+Math.round(v2-stock))+' mL ≈ 目标 '+v2+' mL。</small>')}
function cCRRT(){var wt=gv('cr_wt'),dose=gv('cr_dose');if(wt===null||dose===null||wt<=0){toast('请先填体重和目标剂量');return}var tot=wt*dose;var out='总废液流量（剂量换算）：<b>'+Math.round(tot)+' mL/h</b>';var rep=gv('cr_rep'),dial=gv('cr_dial');if(rep!==null||dial!==null){var net=tot-(rep||0)-(dial||0);out+='<br>净超滤（总 − 置换 − 透析液）：<b>'+Math.round(net)+' mL/h</b>'}var qb=gv('cr_qb'),cc=gv('cr_cc');if(qb!==null&&cc!==null&&cc>0){out+='<br>枸橼酸流量（目标血浓度 3 mmol/L）：<b>'+Math.round(fCit(qb,3,cc))+' mL/h</b>'}showRes('r_cr',out)}
</script>
